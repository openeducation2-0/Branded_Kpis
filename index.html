/* Comparativo YoY por País — same shape as slideDaily() (hero + country rows for LatAm,
   infographic card grid for Brazil, same 14-metric column filter), but "b" is last year's
   actual for the same period (DATA.yoyByCountry[yoyView.dateMode]) instead of a budget file.
   Never pacing here either — both years have complete daily data through the same cutoff, so
   every column is always a fair direct variance, exactly like Daily Tracker. */
function yoyDailyDataRange(periodKey){
  const rows = yoyDailyRowsForDeck(periodKey);
  if(!rows.length) return null;
  let min = rows[0].date, max = rows[0].date;
  for(const r of rows){ if(r.date<min) min=r.date; if(r.date>max) max=r.date; }
  return {start:min, end:max};
}
function fmtDatePoint(iso){
  const [y,m,d] = iso.split('-').map(Number);
  return {es:`${d} ${MONTHS_ES[m-1]} ${y}`, en:`${MONTHS_EN[m-1]} ${d}, ${y}`};
}
/* Bug found 2026-08-14 (user report): the original version only ever read the DAY component of
   range.end, reusing range.start's month/year for both sides — silent garbage the moment a range
   crosses a month or year boundary (e.g. a shifted-weekday YOY compare for "1-31 jul 2026" lands on
   "2 jul - 1 ago 2025", which the old code rendered as the nonsensical "2-1 julio 2025"). Now
   branches on whether start/end share a month and year.
   Format fixed 2026-08-17 (explicit ask): month ALWAYS comes first, abbreviated (mmm), in BOTH
   languages — "no primero los días y luego el mes", and Spanish must match English's own shape,
   not spell the month out. Was `1-13 agosto 2026` (ES, days-first) vs `August 1-13, 2026` (EN,
   month-first) — inconsistent with each other, and neither used the mmm abbreviation this now
   uses for both: `Ago 1-13, 2026` / `Aug 1-13, 2026`. */
function fmtYoyRange(range){
  const [sy,sm,sd] = range.start.split('-').map(Number);
  const [ey,em,ed] = range.end.split('-').map(Number);
  const sMEs = MONTHS_ABBR_ES[sm-1], sMEn = MONTHS_ABBR_EN[sm-1];
  const eMEs = MONTHS_ABBR_ES[em-1], eMEn = MONTHS_ABBR_EN[em-1];
  // Single-day range (e.g. Daily Tracker's "Ayer" quick button, added 2026-08-18): "Aug 17, 2026",
  // never the redundant-looking "Aug 17-17, 2026" the multi-day branch below would otherwise emit.
  if(range.start===range.end) return {es:`${sMEs} ${sd}, ${sy}`, en:`${sMEn} ${sd}, ${sy}`};
  if(sy===ey && sm===em) return {es:`${sMEs} ${sd}-${ed}, ${sy}`, en:`${sMEn} ${sd}-${ed}, ${sy}`};
  if(sy===ey) return {es:`${sMEs} ${sd} – ${eMEs} ${ed}, ${sy}`, en:`${sMEn} ${sd} – ${eMEn} ${ed}, ${sy}`};
  return {es:`${sMEs} ${sd}, ${sy} – ${eMEs} ${ed}, ${ey}`, en:`${sMEn} ${sd}, ${sy} – ${eMEn} ${ed}, ${ey}`};
}
function slideYoy(){
  const isBrazil = currentDeck().region === 'Brazil';
  /* "Agregar Brasil" (OE-LATAM only) — same idea as slideDaily(): Brazil joins as one more
     country row, sourced from DATA_BY_DECK['OE-BR'] directly (its own branded actual total, its
     own yoyByCountry.Brazil for the comparison side). Independent of yoyMktOrgFilter — that
     filter only ever applies to Junior decks (gated on DATA.actualsByCountryMktOrg, which Adult
     decks never have), so yoyActualsTotal()/yoyActualsByCountry() already just return the plain
     unfiltered data here regardless. */
  const showMergedBrazil = !isBrazil && DECK_ID==='OE-LATAM' && includeBrazil;
  const countries = isBrazil ? ['Brazil'] : (showMergedBrazil ? [...DAILY_TRACKER_ROW_ORDER, 'Brazil'] : DAILY_TRACKER_ROW_ORDER);
  const emptyActual = {Spend:0,Leads:0,Sales:0,NewCash:0,FullCM:0,ProjRevShort:0,TotalEnrollments:0};
  const emptyYoy = {Spend:0,Leads:0,Sales:0,NewCash:0,FullCM:0,ProjRevShort:0,TotalEnrollments:0};
  /* Custom date-range picker, when enabled, replaces BOTH sides' data source wholesale (see the
     long comment on yoyCustomRange above) — computed ONCE per render, not once per country, to
     avoid re-aggregating the whole 5-month dataset per row (this project already hit, and fixed,
     exactly this kind of per-item-redundant-recompute performance bug once this same session). */
  const customRangeActive = yoyCustomRange.enabled && yoyMktOrgShowsTotal();
  const customActuals = customRangeActive ? yoyCustomActualsByCountry() : null;
  const customCompare = customRangeActive ? yoyCustomComparisonByCountry() : null;
  const actualFor = c => {
    if(customActuals) return (isBrazil ? customActuals.Brazil : customActuals[c]) || emptyActual;
    if(isBrazil) return yoyActualsTotal();
    if(c==='Brazil') return DATA_BY_DECK['OE-BR'].actuals.branded.total;
    return yoyActualsByCountry()[c] || emptyActual;
  };
  const yoyByMode = yoyComparisonByMode(yoyView.dateMode);
  const yoyFor = c => {
    if(customCompare) return (isBrazil ? customCompare.Brazil : customCompare[c]) || emptyYoy;
    if(c==='Brazil' && !isBrazil) return (DATA_BY_DECK['OE-BR'].yoyByCountry[yoyView.dateMode]||{}).Brazil || emptyYoy;
    return yoyByMode[c] || emptyYoy;
  };

  const heroActual = isBrazil ? actualFor('Brazil') : sumDailyTrackerFields(countries.map(actualFor), DAILY_TRACKER_FIELDS);
  const heroYoy = isBrazil ? yoyFor('Brazil') : sumDailyTrackerFields(countries.map(yoyFor), DAILY_TRACKER_FIELDS);

  // Brazil has no per-country table below the hero (single aggregated row, see .single-hero) --
  // its hero IS the only display surface, so Media Spend/Media CPL/Paid Social+Organic (normally
  // table-only, see YOY_COL_DEFS's own comment) must be reachable there too, or toggling them on
  // silently does nothing for OE-BR/JR-BR (real bug reported 2026-08-18: "por que selecciono Media
  // Spend y no aparece esa columna en algunas regiones y marcas" -- Brazil was the "algunas
  // regiones", not a data or rendering bug). Still excludes the 3 Share metrics (%Leads/%Sales/
  // %Spend) for the same reason HERO_COL_DEFS itself excludes them -- a share of Brazil's own
  // single total is meaningless.
  const heroColsYoy = (isBrazil ? YOY_COL_DEFS.filter(c=> c.key!=='LeadsShare' && c.key!=='SalesShare' && c.key!=='SpendShare') : HERO_COL_DEFS).filter(c=> yoyView.cols[c.key]);
  const yCols = YOY_COL_DEFS.filter(c=> yoyView.cols[c.key]);
  const yGridTemplate = `1.25fr ${yCols.map(c=>c.weight+'fr').join(' ')}`;

  function yoyCellHtml(key, a, b, country){
    switch(key){
      case 'Spend': return yoyMetricCell(a.Spend, b.Spend, fmtUSD, true, false, null, true);
      // Media Spend/CPL/Paid+Organic spend: YoY-exclusive, see YOY_COL_DEFS's own comment for why.
      case 'MediaSpend': return yoyMetricCell(a.MediaSpend, b.MediaSpend, fmtUSD, true, false, null, true);
      case 'SpendShare': { const s = heroActual.Spend ? a.Spend/heroActual.Spend : null; return `<div class="metric-cell muted"><div class="mc-actual">${fmtPct(s)}</div></div>`; }
      case 'Leads': return yoyMetricCell(a.Leads, b.Leads, fmtNum, false, false);
      case 'Sales': return yoyMetricCell(a.Sales, b.Sales, fmtNum, false, false);
      case 'LeadsShare': { const s = heroActual.Leads ? a.Leads/heroActual.Leads : null; return `<div class="metric-cell muted"><div class="mc-actual">${fmtPct(s)}</div></div>`; }
      case 'SalesShare': { const s = heroActual.Sales ? a.Sales/heroActual.Sales : null; return `<div class="metric-cell muted"><div class="mc-actual">${fmtPct(s)}</div></div>`; }
      case 'CPL': return yoyMetricCell(cpl(a), cpl(b), fmtUSD, true, false);
      case 'MediaCPL': return yoyMetricCell(mediaCpl(a), mediaCpl(b), fmtUSD, true, false);
      case 'Conversion': return yoyMetricCell(conversionRate(a), conversionRate(b), fmtPctConversion, false, true);
      case 'CMPS': return yoyMetricCell(cmps(a), cmps(b), fmtUSD, true, false);
      case 'AvgPrice': return yoyMetricCell(avgPrice(a), avgPrice(b), fmtUSD, false, false);
      case 'MarginPct': return yoyMetricCell(mncc(a), mncc(b), fmtPct, false, true);
      case 'NewCash': return yoyMetricCell(a.NewCash, b.NewCash, fmtUSD, false, false);
      // Same Costa Rica gray override as Daily Tracker's dailyCellHtml — see its comment (widened
      // 2026-08-17 to every deck/brand, not just OE Adult).
      case 'NewCashSemaphore': return netImpactTemperatureCell(netImpactValue(a,b), country==='Costa Rica');
      // Net Impact reverted to the standard 2-value (actual/año anterior) + delta format here,
      // explicit ask 2026-08-11: "no veo ambos valores como se ve en Spend" — YoY-only revert (see
      // netImpactValue's own comment for why this lámina, unlike Lámina A/Daily Tracker,
      // has no pacing-fairness question blocking it: the comparison side is always already
      // period-matched). The delta this produces is numerically IDENTICAL to the old single-value
      // impact(a,b) (algebraically (a.NewCash-a.Spend)-(b.NewCash-b.Spend) === (a.NewCash-b.NewCash)
      // -(a.Spend-b.Spend)) — only the PRESENTATION changed, not the underlying number.
      // Single-value, sign-colored -- see mktOrgMetricCell's own 'Impact' case for the full
      // explanation of why yoyMetricCell() was wrong here (real bug, 2026-08-18).
      case 'Impact': { const v = (a.NewCash-b.NewCash)-(a.Spend-b.Spend); return `<div class="metric-cell muted"><div class="mc-actual ${mcPctSignClass(v)}">${fmtUSD(v)}</div></div>`; }
      case 'LtvShort': return yoyMetricCell(ltvShort(a), ltvShort(b), fmtUSD, false, false);
      case 'FullUnitCmShort': return yoyMetricCell(fullUnitCmShort(a), fullUnitCmShort(b), fmtUSD, false, false);
      case 'FullCmPctShort': return yoyMetricCell(fullCmPct(a), fullCmPct(b), fmtPct, false, true, mcPctSignClass(fullCmPct(a)));
      case 'PaidOrganicSpend': return yoyMetricCell(a.PaidOrganicSpend, b.PaidOrganicSpend, fmtUSD, false, false, null, true);
    }
  }
  function heroCellYoy(key){
    switch(key){
      case 'Spend': return {icon:'wallet', label:'Spend', av:heroActual.Spend, bv:heroYoy.Spend, fmt:fmtUSD, invert:true, pp:false};
      // Media Spend/CPL/Paid+Organic: only reachable here for Brazil (see heroColsYoy's own
      // comment) -- same formulas as yoyCellHtml's table cases, just fed by heroActual/heroYoy.
      case 'MediaSpend': return {icon:'wallet', label:'Media Spend', av:heroActual.MediaSpend, bv:heroYoy.MediaSpend, fmt:fmtUSD, invert:true, pp:false};
      case 'PaidOrganicSpend': return {icon:'wallet', label:L('Paid Social + Organic','Paid Social + Organic'), av:heroActual.PaidOrganicSpend, bv:heroYoy.PaidOrganicSpend, fmt:fmtUSD, invert:false, pp:false};
      case 'Leads': return {icon:'gauge', label:'Leads', av:heroActual.Leads, bv:heroYoy.Leads, fmt:fmtNum, invert:false, pp:false};
      case 'Sales': return {icon:'tag', label:L('Ventas','Sales'), av:heroActual.Sales, bv:heroYoy.Sales, fmt:fmtNum, invert:false, pp:false};
      case 'CPL': return {icon:'gauge', label:'CPL', av:cpl(heroActual), bv:cpl(heroYoy), fmt:fmtUSD, invert:true, pp:false};
      case 'MediaCPL': return {icon:'gauge', label:'Media CPL', av:mediaCpl(heroActual), bv:mediaCpl(heroYoy), fmt:fmtUSD, invert:true, pp:false};
      case 'Conversion': return {icon:'trend', label:L('Conversión','Conversion'), av:conversionRate(heroActual), bv:conversionRate(heroYoy), fmt:fmtPctConversion, invert:false, pp:true};
      case 'CMPS': return {icon:'tag', label:'CMPS', av:cmps(heroActual), bv:cmps(heroYoy), fmt:fmtUSD, invert:true, pp:false};
      case 'AvgPrice': return {icon:'tag', label:L('Precio Prom.','Avg Price'), av:avgPrice(heroActual), bv:avgPrice(heroYoy), fmt:fmtUSD, invert:false, pp:false};
      case 'MarginPct': return {icon:'trend', label:'% MNCC', av:mncc(heroActual), bv:mncc(heroYoy), fmt:fmtPct, invert:false, pp:true};
      case 'NewCash': return {icon:'wallet', label:'New Cash Core', av:heroActual.NewCash, bv:heroYoy.NewCash, fmt:fmtUSD, invert:false, pp:false, highlight:true};
      // Real bug fixed 2026-08-18: this case was missing muted:true (unlike Lámina A's/Daily
      // Tracker's own heroCell*() 'Impact' case, both correct) -- without it, the render logic a
      // few lines below falls through to yoyMetricCell(), the normal actual/prior/%-change
      // comparison format, exactly what Net Impact must never show (it's already a single
      // difference, see yoyCellHtml's 'Impact' case / netImpactValue()'s own comment). Invisible
      // on LatAm decks, which show Net Impact correctly via the country TABLE instead and rarely
      // surface this specific hero tile's own bug -- Brazil decks have no table (single-hero
      // layout), so this was the ONLY place they showed Net Impact, making the bug fully visible
      // there. Same `netImpactValue()` the semaphore case right below already uses correctly.
      case 'Impact': return {icon:'spark', label:'Net Impact', av:netImpactValue(heroActual,heroYoy), fmt:fmtUSD, muted:true, highlight:true};
      case 'LtvShort': return {icon:'tag', label:'LTV Short', av:ltvShort(heroActual), bv:ltvShort(heroYoy), fmt:fmtUSD, invert:false, pp:false};
      case 'FullUnitCmShort': return {icon:'tag', label:'Unit CM Short', av:fullUnitCmShort(heroActual), bv:fullUnitCmShort(heroYoy), fmt:fmtUSD, invert:false, pp:false, highlight:true};
      case 'FullCmPctShort': return {icon:'trend', label:'CM % Short', av:fullCmPct(heroActual), bv:fullCmPct(heroYoy), fmt:fmtPct, invert:false, pp:true, highlight:true};
      case 'NewCashSemaphore': return {icon:'trend', label:L('Net Impact Temperature','Net Impact Temperature'), av:netImpactValue(heroActual,heroYoy), semaphore:true};
    }
  }
  const bhKpisYoy = heroColsYoy.map(c=>{
    const h = heroCellYoy(c.key);
    // 'Impact'/Net Impact is the only YOY hero metric with NO real second side to compare against
    // (it's already a diff-of-diffs, see impact()'s comment) — muted single-value, same as
    // Lámina A's/Daily Tracker's own heroCell*() 'Impact' case, unlike LtvShort/FullUnitCmShort
    // which DO get a real prior-year comparison here since YOY actually has that data.
    const signCls = c.key==='FullCmPctShort' ? mcPctSignClass(h.av) : '';
    const cell = h.semaphore
      ? netImpactTemperatureCell(h.av)
      : h.muted
        ? `<div class="metric-cell muted"><div class="mc-actual ${mcPctSignClass(h.av)}">${h.fmt(h.av)}</div></div>`
        : yoyMetricCell(h.av,h.bv,h.fmt,h.invert,h.pp,signCls,isSpendNeutralMetric(c.key));
    return `<div class="bh-kpi${h.highlight?' highlight':''}${h.semaphore||h.muted?' muted':''}" data-metric="${c.key}"><div><div class="label">${h.label}</div>${cell}</div></div>`;
  }).join('');
  /* Item 7's trigger (explicit ask, 2nd pass, 2026-08-14): click the COUNTRY NAME, not a metric —
     see mktOrgGridModalHtml's own comment for what opens. Junior-only (gated on
     DATA.yoyDailyByMktOrg existing); the subtotal row passes its whole country list as the scope. */
  function countryRowYoy(c){
    const isSubtotal = c === REST_LATAM_SUBTOTAL_KEY;
    const a = isSubtotal ? sumDailyTrackerFields(REST_LATAM_SUBTOTAL_COUNTRIES.map(actualFor), DAILY_TRACKER_FIELDS) : actualFor(c);
    const b = isSubtotal ? sumDailyTrackerFields(REST_LATAM_SUBTOTAL_COUNTRIES.map(yoyFor), DAILY_TRACKER_FIELDS) : yoyFor(c);
    const cells = yCols.map((col,i)=> `<div class="metric-col${col.highlight?' highlight':''}${colDividerCls(yCols,i)}" data-metric="${col.key}">${yoyCellHtml(col.key,a,b,c)}</div>`).join('');
    // Abbreviated ONLY in this lamina (explicit ask, 2026-08) — Daily Tracker's own countryRow()
    // keeps the full "LATAM (excl. México y Argentina)" label, deliberately not touched.
    const label = isSubtotal ? 'LT Excl. MX & AR' : (LANG==='es' ? COUNTRY_LABEL_ES[c] : COUNTRY_LABEL_EN[c]);
    const deemphasized = c === 'Costa Rica';
    const isMergedBrazil = c === 'Brazil' && showMergedBrazil;
    const mktOrgClickable = !!DATA.yoyDailyByMktOrg;
    const nameAttrs = mktOrgClickable ? ` data-modal="yoy-mktorg" data-country="${isSubtotal?'__SUBTOTAL__':c}" data-country-label="${label}"` : '';
    const nameHtml = isSubtotal
      ? `<div class="ch-name${mktOrgClickable?' mktorg-clickable':''}"${nameAttrs}>${iconChip('globe','var(--brand-accent)')}<div class="ch-text"><h4>${label}</h4></div></div>`
      : `<div class="ch-name${mktOrgClickable?' mktorg-clickable':''}"${nameAttrs}>${flagIcon(c)}<div class="ch-text"><h4>${label}</h4></div></div>`;
    return `<div class="ch-row no-click${deemphasized?' deemphasized':''}${isSubtotal?' subtotal-row':''}${isMergedBrazil?' merged-brazil-row':''}" style="grid-template-columns:${yGridTemplate}">
      ${nameHtml}
      ${cells}
    </div>`;
  }

  /* Brazil used to get its own card-flow layout here (brazilFlowHtml) — explicit ask to match
     LatAm's table format instead (same fix Daily Tracker already got), single row.
     countryRowYoy('Brazil') already works unmodified: actualFor('Brazil')/yoyFor('Brazil') both
     already resolve correctly for a single-country deck. */
  const displayRowsYoy = showMergedBrazil ? [...DAILY_TRACKER_ROW_ORDER_DISPLAY, 'Brazil'] : DAILY_TRACKER_ROW_ORDER_DISPLAY;
  const rowsHtmlYoy = isBrazil ? countryRowYoy('Brazil') : displayRowsYoy.map(countryRowYoy).join('');
  const headerCellsYoy = yCols.map((c,i)=>`<div class="metric-col${colDividerCls(yCols,i)}">${colLabelYoy(c.key)}</div>`).join('');
  const rangeLabel = fmtYoyRange(customRangeActive ? yoyActiveCompareRange() : DATA.yoyByCountry[yoyView.dateMode+'Range']);
  const heroLabelYoy = L('Brand TV Channels','Brand TV Channels');
  const heroSubYoy = isBrazil
    ? `${flagIcon('Brazil')} ${L(`Brasil · vs ${rangeLabel.es}`,`Brazil · vs ${rangeLabel.en}`)}`
    : L(`Consolidado ${regionLabel()} · vs ${rangeLabel.es}`,`Consolidated ${regionLabel()} · vs ${rangeLabel.en}`);
  const deckLabelYoy = `${currentDeck().brand} · ${regionLabel()}`;
  const yday = DATA.meta.asOfDay;
  /* Dynamic title + subtitle (items 4 and 6, explicit ask): the lámina used to hardcode "YOY" and
     a generic "vs mismo período año anterior" line no matter what the custom-range panel actually
     had active — wrong the moment QOQ/MOM/WOW/a weekday filter/a shifted-vs-exact choice came into
     play. Falls back to the original MTD-vs-last-year framing whenever the custom range itself is
     off (customRangeActive false), so a visitor who's never touched the panel sees exactly the
     same title/subtitle as before this change. */
  const activeYoyCategory = customRangeActive ? (yoyCustomRange.category || 'YOY') : 'YOY';
  const yoyCatShort = activeYoyCategory==='CUSTOM' ? L('Personalizado','Custom') : activeYoyCategory;
  const yoySubActualRange = customRangeActive ? yoyActiveActualRange() : {start:`${DATA.meta.month}-01`, end:`${DATA.meta.month}-${String(yday).padStart(2,'0')}`};
  const yoySubCompareRange = customRangeActive ? yoyActiveCompareRange() : DATA.yoyByCountry[yoyView.dateMode+'Range'];
  // Weekday filtering has ZERO effect on the numbers outside custom-range mode (yoyWeekdaySet() is
  // only ever read by the custom-range aggregation path, see aggregateYoyDaily's call sites) — a
  // weekday-scope prefix would describe a filter that isn't actually filtering anything there, so
  // it's simply absent (explicit ask, 2026-08-17: same underlying issue as the >7-day case below —
  // the label must match what's REALLY being counted, not show a cosmetic default). May still be
  // null even when active — see weekdayRangeLabel's own comment for when it omits itself.
  const yoySubWeekday = customRangeActive ? weekdayRangeLabel(yoySubActualRange.start, yoySubActualRange.end) : null;
  const yoySubWeekdayPrefixEs = yoySubWeekday ? `${yoySubWeekday.es}: ` : '';
  const yoySubWeekdayPrefixEn = yoySubWeekday ? `${yoySubWeekday.en}: ` : '';
  const yoySubAlignment = CATS_WITH_ALIGNMENT.has(activeYoyCategory)
    ? (yoyCustomRange.compareMode==='exact' ? L('mismas fechas','same dates') : L('mismos días de semana','same weekdays'))
    : '';
  /* Compact format, rewritten 2026-08-14 per the user's own exact example ("Mon-Fri: OE Junior
     LatAm · Aug 10-13, 2026 vs Aug 3-6, 2026 · WOW") — weekday scope FIRST as a lead-in, then the
     deck, then the bare ranges (no "Actual"/"Comparación" label words), then the category's short
     code, with the alignment choice (only for YOY/QOQ/MOM, see CATS_WITH_ALIGNMENT) tacked on as
     an optional final segment. Generalizes to any brand/region/category — nothing here is
     WOW-specific, that was just the example given. The weekday prefix itself is OPTIONAL (see
     yoySubWeekday above) — when absent, the subtitle just starts directly at the deck label. */
  const yoySubtitleEs = `${yoySubWeekdayPrefixEs}${deckLabelYoy} · ${fmtYoyRange(yoySubActualRange).es} vs ${fmtYoyRange(yoySubCompareRange).es} · ${yoyCatShort}${yoySubAlignment?` · ${yoySubAlignment}`:''}`;
  const yoySubtitleEn = `${yoySubWeekdayPrefixEn}${deckLabelYoy} · ${fmtYoyRange(yoySubActualRange).en} vs ${fmtYoyRange(yoySubCompareRange).en} · ${yoyCatShort}${yoySubAlignment?` · ${yoySubAlignment}`:''}`;
  /* dateModeToggle footer buttons ("Mismas fechas"/"Mismos días de semana") removed 2026-08-14,
     explicit ask: redundant with the equivalent "Comparar contra" buttons already inside the
     custom date range panel (yoyCustomRangePanelHtml's compareMode buttons), now that custom
     range is enabled by default. yoyView.dateMode itself is untouched — still the fallback path
     read by yoyComparisonByMode()/fmtYoyRange() whenever yoyCustomRange.enabled is false — this
     only removes the now-redundant footer UI, not the underlying state. */
  /* Junior-only investment filter, footer-center. Redesigned 2026-08-14 (explicit ask — the old
     3-button radio "Total Junior"/"Solo Inversión Junior"/"Solo Inversión Adulto" wasn't clear
     about what it meant) into 2 independently-togglable buttons naming the org directly; "both
     on" (the default) is what used to be the separate "Total Junior" button — see yoyMktOrgKey()
     for exactly how the 2-way {oe,junior} state maps back onto the 3 data-slice keys every
     existing consumer (DATA.actualsByCountryMktOrg/yoyByCountryMktOrg) still expects. Gated on
     DATA.actualsByCountryMktOrg existing — Adult decks never have it. */
  const mktOrgToggleYoy = DATA.actualsByCountryMktOrg ? `
    <div class="yoymktorg-toggle-wrap">
      <span class="yoymktorg-label">${L('Resultados de Junior según inversión de:','Junior results by investment from:')}</span>
      <div class="footer-toggle yoymktorg-toggle">
        <button class="${yoyMktOrgFilter.oe?'on':''}" data-yoymktorg="oe">OE Adult</button>
        <button class="${yoyMktOrgFilter.junior?'on':''}" data-yoymktorg="junior">OE Junior</button>
      </div>
    </div>` : '';
  /* Same redundancy fix as slideDaily(): Brazil's own "country row" is a single row that just
     repeats the hero's own totals — no comparison value once there's only 1 country — so the
     table is dropped entirely for Brazil here too, hero-only. LatAm keeps its real per-country
     table untouched. */
  // Hero's own click target for item 7 — covers Brazil (which has no per-country table at all,
  // "Brazil" IS the hero's scope) and LatAm's all-countries total (there's no single "country name"
  // for the consolidated view, so the hero label itself serves that role, same click model as a
  // country row below).
  const heroMktOrgClickable = !!DATA.yoyDailyByMktOrg;
  const heroCountries = isBrazil ? 'Brazil' : null;
  const heroScopeLabel = isBrazil ? regionLabel() : L(`Consolidado ${regionLabel()}`,`Consolidated ${regionLabel()}`);
  const heroNameAttrs = heroMktOrgClickable ? ` data-modal="yoy-mktorg" data-country="${heroCountries||'__ALL__'}" data-country-label="${heroScopeLabel}"` : '';
  const heroBlockHtmlYoy = `
      <div class="blended-hero daily-hero no-click">
        <div class="bh-head${heroMktOrgClickable?' mktorg-clickable':''}"${heroNameAttrs}><span class="bh-badge">${heroLabelYoy}</span><span class="bh-sub">${heroSubYoy}</span></div>
        <div class="bh-kpis" style="grid-template-columns:${heroColsYoy.map(c=>`minmax(0,${c.weight}fr)`).join(' ')}">${bhKpisYoy}</div>
      </div>`;
  const bodyHtmlYoy = isBrazil ? heroBlockHtmlYoy : `${heroBlockHtmlYoy}
      <div class="detail-label daily-detail-label">${L('Detalle por país','Detail by country')}</div>
      <div class="channel-table daily-table">
        <div class="ch-header-row" style="grid-template-columns:${yGridTemplate}"><div></div>${headerCellsYoy}</div>
        ${rowsHtmlYoy}
      </div>`;
  return `<section class="slide slide-yoy${isBrazil?' slide-daily-br':''}${yoyValueVis.hideActual?' hide-actual-value':''}${yoyValueVis.hideBudget?' hide-budget-value':''}" style="--slide-zoom:${getZoom('yoy')}"><div class="slide-inner">
    ${headerBlock('s-yoy', `${yoyCatShort} Branded Channels KPIs`, `${yoyCatShort} Branded Channels KPIs`, yoySubtitleEs, yoySubtitleEn)}
    <div class="slide-body centered-stack${isBrazil?' single-hero':''}">${bodyHtmlYoy}
    </div>
  </div>${footerBar(false, {legend:yoyView.cols.NewCashSemaphore, legendYoy:true, centerExtra: mktOrgToggleYoy})}</section>`;
}

/* ================= "SEMANA WOW" LÁMINAS (Plantilla PPT Laminas.xlsx, Fase 1, 2026-08-24) =======
   Each row of WEEK_LAMINA_ROWS gets its own independent view state (own visible columns, own
   weekday filter) — same "each lámina owns its state" pattern as dailyTrackerCols/yoyView.cols,
   deliberately NOT sharing yoyView/yoyCustomRange (mixing this filter with the real YoY lámina's
   own would be a real bug: filtering one would silently filter the other too). */
const LS_WEEK_LAMINA_STATE = 'brandedkpis_weeklamina_state_v1';
let weekLaminaState = {};
WEEK_LAMINA_ROWS.forEach(r => {
  // hideBudget:true (comparison hidden by default) -- explicit ask 2026-08-24: this lámina's

/* Weekday label for a FIXED range + an explicit weekday Set — same logic as weekdayRangeLabel(),
   forked because that one reads the global yoyCustomRange.weekdays directly (right for the real
   YoY lámina, wrong here — these láminas must never react to YoY's own filter). */
function weekLaminaWeekdayLabel(periodStart, periodEnd, weekdaySet){
  const periodDays = periodWeekdaysIfShort(periodStart, periodEnd);
  let days = periodDays
    ? [...periodDays].filter(d => !weekdaySet || weekdaySet.has(d))
    : (weekdaySet ? [...weekdaySet] : [0,1,2,3,4,5,6]);
  days.sort((a,b)=>a-b);
  if(!days.length) return null;
  if(!periodDays && days.length===7) return null;
  if(days.length===7) return {es:'Lun-Dom', en:'Mon-Sun'};
  const mondayFirst = days.map(d => d===0?7:d).sort((a,b)=>a-b);
  const isContiguous = days.length>1 && mondayFirst.every((d,i)=> i===0 || d===mondayFirst[i-1]+1);
  if(isContiguous){
    const first = mondayFirst[0]===7?0:mondayFirst[0], last = mondayFirst[mondayFirst.length-1]===7?0:mondayFirst[mondayFirst.length-1];
    return {es:`${WD_ABBR_ES[first]}-${WD_ABBR_ES[last]}`, en:`${WD_ABBR_EN[first]}-${WD_ABBR_EN[last]}`};
  }
  return {es: days.map(d=>WD_ABBR_ES[d]).join(', '), en: days.map(d=>WD_ABBR_EN[d]).join(', ')};
}

function weekLaminaWeekdaySelectorHtml(laminaId){
  const labels = {0:L('Dom','Sun'),1:L('Lun','Mon'),2:L('Mar','Tue'),3:L('Mié','Wed'),4:L('Jue','Thu'),5:L('Vie','Fri'),6:L('Sáb','Sat')};

  // Default selection is "every day the period can actually contain", not blindly all 7 --
  // explicit ask 2026-08-24: a Mon-Wed-only period must show ONLY Mon/Tue/Wed pre-selected, the

  const selected = new Set(state.weekdays || (enabledSet ? [...enabledSet] : [0,1,2,3,4,5,6]));

function wireWeekLaminaWeekdaySelector(container, laminaId, onChange){
  const buttons = () => Array.from(container.querySelectorAll('.wd-btn'));
  const row = WEEK_LAMINA_ROWS.find(r=>r.laminaId===laminaId);
  const state = weekLaminaState[laminaId];
  const enabledSet = periodWeekdaysIfShort(row.actualRange.start, row.actualRange.end);
  // Same enabledSet-aware default as weekLaminaWeekdaySelectorHtml() -- see its own comment.
  const currentSet = () => new Set(state.weekdays || (enabledSet ? [...enabledSet] : [0,1,2,3,4,5,6]));
  const applySelection = (set) => {
    if(enabledSet) set = new Set([...set].filter(d=>enabledSet.has(d)));
    const fullyOpen = enabledSet ? set.size===enabledSet.size : set.size===7;
    state.weekdays = (fullyOpen || set.size===0) ? null : Array.from(set).sort();
    buttons().forEach(b => b.classList.toggle('on', set.has(Number(b.dataset.wd))));
    onChange();
  };
  buttons().forEach(btn=>{
    if(btn.disabled) return;
    const day = Number(btn.dataset.wd);
    const vidx = Number(btn.dataset.vidx);
    btn.addEventListener('mousedown', e=>{
      e.preventDefault();
      if(e.ctrlKey || e.metaKey){
        const set = currentSet();
        if(set.has(day)) set.delete(day); else set.add(day);
        weekLaminaDragState = {mode:'toggle', touched:new Set([day])};
        applySelection(set);
      } else {
        weekLaminaDragState = {mode:'range', startVidx:vidx};
        applySelection(new Set([day]));
      }
    });
    btn.addEventListener('mouseenter', ()=>{
      if(!weekLaminaDragState) return;
      if(weekLaminaDragState.mode==='toggle'){
        if(weekLaminaDragState.touched.has(day)) return;
        weekLaminaDragState.touched.add(day);
        const set = currentSet();
        if(set.has(day)) set.delete(day); else set.add(day);
        applySelection(set);
      } else {
        const lo = Math.min(weekLaminaDragState.startVidx, vidx), hi = Math.max(weekLaminaDragState.startVidx, vidx);
        const set = new Set(WD_VISUAL_ORDER.slice(lo, hi+1));
        applySelection(set);
      }
    });
  });
}

/* "Detalle por marketing type" (botón 2, Plantilla PPT Laminas.xlsx, 2026-08-24) — Spend por
   marketing type dentro de "Brand TV Channels", por país, solo para los types que de verdad
   generan leads. Lee directo del MISMO raw cache que viewBuilder.js ya usa para Media Spend
   (`_rawByDeckCache[deckId].brandedTypeRows` — el `leads` de cada fila se agregó a la exportación
   este mismo día específicamente para esto; `spend`/`marketing_organization` ya existían). Nunca
   pasa por `buildDeckData()` — esto es una agregación ad-hoc bajo demanda, mismo patrón que
   `dailyTrackerRangeActuals()` ya usa para su propio rango de fechas libre. */
// weekdaySet added 2026-08-24 -- real bug reported: filtering by weekday in the marketing-type
// view never changed the table/hero at all, because this function (unlike aggregateYoyDaily(),
// which the NORMAL country table reads through) never accepted or applied one.
function weekLaminaTypeBreakdown(deckId, startDate, endDate, isBrazilDeck, weekdaySet){
  const rows = _rawByDeckCache[deckId].brandedTypeRows;
  const out = {}; // country -> type -> {leads, sales}
  for(const r of rows){
    if(r.date<startDate || r.date>endDate) continue;
    if(weekdaySet && !weekdaySet.has(parseISODate(r.date).getDay())) continue;
    const c = bucketCountry(r.country, isBrazilDeck);
    if(c===null) continue;
    const byType = out[c] || (out[c] = {});
    const t = byType[r.type] || (byType[r.type] = {leads:0, sales:0});
    t.leads += r.leads||0; t.sales += r.sales||0;
  }
  return out;
}
/* Same "Brazil joins as one more country" merge every other reader of this deck's data already
   does (yoyDailyRowsForDeck, actualFor/yoyFor above) — OE-BR's own rows, bucketed under 'Brazil',
   folded into OE-LATAM's own map when "Agregar Brasil" is on. */
function weekLaminaTypeBreakdownForDeck(deckId, startDate, endDate, includeBrazilMerge, weekdaySet){
  const isBrazilDeck = DECKS[deckId].region === 'Brazil';
  const out = weekLaminaTypeBreakdown(deckId, startDate, endDate, isBrazilDeck, weekdaySet);
  if(includeBrazilMerge && deckId==='OE-LATAM'){
    Object.assign(out, weekLaminaTypeBreakdown('OE-BR', startDate, endDate, true, weekdaySet));
  }
  return out;
}
function weekWowSlide(row){

  // `compareLabelEs` const declared later below) so it's available before this is first needed.

  function weekMetricCell(av, bv, fmtFn, invert, isPP, extraActualClass, forceGray){

  // merge logic needed here (see that function's own comment).
  const actualByCountry = aggregateYoyDaily(yoyDailyRowsForDeck('current'), row.actualRange.start, row.actualRange.end, weekdaySet);
  const compareByCountry = aggregateYoyDaily(yoyDailyRowsForDeck('prior'), row.compareRange.start, row.compareRange.end, weekdaySet);
  const actualFor = c => (isBrazil ? actualByCountry['Brazil'] : actualByCountry[c]) || emptyRow;
  const yoyFor = c => (isBrazil ? compareByCountry['Brazil'] : compareByCountry[c]) || emptyRow;

  const heroActual = isBrazil ? actualFor('Brazil') : sumDailyTrackerFields(countries.map(actualFor), DAILY_TRACKER_FIELDS);
  const heroYoy = isBrazil ? yoyFor('Brazil') : sumDailyTrackerFields(countries.map(yoyFor), DAILY_TRACKER_FIELDS);

  const yCols = YOY_COL_DEFS.filter(c=> state.cols[c.key]);

  // (typeModeBodyHtml's, see its own comment): a bare `Xfr` track's minimum width defaults to its
  // CONTENT's size, not 0, so a grid can resolve a column WIDER than its fair share whenever its
  // content needs more room -- two grids sharing the identical template STRING can still end up
  // with different actual column widths if their content sizes differ (exactly what was
  // happening here: the hero's larger font forced its columns wider than the table's same columns
  // at a smaller font). minmax(0,Xfr) forces every track to its exact fair share regardless of
  // content, guaranteeing the hero and table below resolve to the SAME pixel boundaries.
  const yGridTemplate = `1.25fr ${yCols.map(c=>`minmax(0,${c.weight}fr)`).join(' ')}`;

      : `<div class="ch-name">${flagIcon(c)}<div class="ch-text"><h4>${label}</h4></div></div>`;

      ${nameHtml}
      ${cells}
    </div>`;
  }
  // A row with BOTH highlightCountries + benchmarkCountries is a single-country deep-dive (e.g.
  // "México exclusivamente") -- explicit ask 2026-08-24: the table shows ONLY 2 rows then, the
  // highlighted country and the benchmark group, never the other individual countries or the
  // standard "LT Excl. MX & AR" subtotal (those belong to the consolidated-LatAm view, not a
  // country-specific one). Otherwise, the normal full country breakdown (hideCountries still
  // applies there if present, e.g. row 9's "ocultar México").
  let displayRowsWeek;
  if(row.benchmarkCountries && row.highlightCountries){
    displayRowsWeek = [...row.highlightCountries, BENCHMARK_KEY];
  } else {
    displayRowsWeek = showMergedBrazil ? [...DAILY_TRACKER_ROW_ORDER_DISPLAY, 'Brazil'] : DAILY_TRACKER_ROW_ORDER_DISPLAY;
    if(row.hideCountries) displayRowsWeek = displayRowsWeek.filter(c=>!row.hideCountries.includes(c));
  }
  const rowsHtmlWeek = isBrazil ? countryRowWeek('Brazil') : displayRowsWeek.map(countryRowWeek).join('');
  const headerCellsWeek = yCols.map((c,i)=>`<div class="metric-col${colDividerCls(yCols,i)}">${colLabelYoy(c.key)}</div>`).join('');

  /* "Detalle por marketing type" (botón 2) — reemplaza SOLO la tabla de detalle (el hero de
     arriba no cambia), mismas filas de país que la tabla normal (incl. el recorte a 2 filas de
     México/benchmark cuando aplica), columnas = marketing types con leads en el rango analizado.
     Spend actual vs comparación, mismo formato de celda que el resto de la lámina. */
  /* Detalle por marketing type — rediseñado 2026-08-24 tras feedback directo: la métrica de cada
     celda es Leads (elegibles — mismo campo que el resto de la app llama "Leads", ver
     addDailyRowInto) o Ventas, elegido por el usuario (selección única, ver renderGroupMenuWeekWow),
     NUNCA spend. El hero de arriba también cambia en este modo: una tarjeta POR marketing type,
     alineada a la misma cuadrícula que sus columnas en la tabla de abajo (mismo grid-template en
     ambas), con el TOTAL de esa métrica para los países actualmente mostrados — no el hero normal
     de KPIs, que no tiene ninguna relación columna-por-columna con esta tabla. */
  function typeModeBodyHtml(){
    const metric = state.marketingTypeMetric; // 'leads' | 'sales'
    const fmtField = metric==='sales' ? 'sales' : 'leads'; // 'share' also reads leads (see cellValue)
    const metricLabel = metric==='sales' ? L('Ventas','Sales') : metric==='share' ? L('% Share','% Share') : L('Leads','Leads');
    const actualTypes = weekLaminaTypeBreakdownForDeck(row.deckId, row.actualRange.start, row.actualRange.end, showMergedBrazil, weekdaySet);
    const compareTypes = weekLaminaTypeBreakdownForDeck(row.deckId, row.compareRange.start, row.compareRange.end, showMergedBrazil, weekdaySet);
    const emptyTB = {leads:0, sales:0};
    const forCountries = (byCountry, countries) => {
      const merged = {};
      countries.forEach(c => Object.entries(byCountry[c]||{}).forEach(([t,v]) => {
        const m = merged[t] || (merged[t] = {leads:0, sales:0});
        m.leads += v.leads; m.sales += v.sales;
      }));
      return merged;
    };
    const typeFor = (byCountry, c) => {
      if(c===BENCHMARK_KEY) return forCountries(byCountry, row.benchmarkCountries);
      if(c===REST_LATAM_SUBTOTAL_KEY) return forCountries(byCountry, REST_LATAM_SUBTOTAL_COUNTRIES);
      return byCountry[c] || {};
    };
    // Nunca sumar el pseudo-key de subtotal aquí -- displayRowsWeek lo lista JUNTO a los países que
    // resume (Colombia/Chile/Ecuador/Perú/Costa Rica/Otros), así que sumarlo también duplicaría
    // esos 6 países (bug real encontrado 2026-08-24: el hero daba más que la suma real de países).
    // El benchmark de una lámina de país específico (BENCHMARK_KEY) SÍ se suma -- su lista de
    // países nunca se solapa con highlightCountries.
    const scopeCountries = isBrazil ? ['Brazil'] : displayRowsWeek.filter(c=>c!==REST_LATAM_SUBTOTAL_KEY);
    // Un marketing type califica si tuvo leads en CUALQUIERA de los 2 períodos -- corregido
    // 2026-08-24: el criterio anterior solo miraba el período ACTUAL, así que un type con leads la
    // semana pasada pero 0 esta semana (una caída real a 0, información válida) desaparecía de la
    // tabla en vez de mostrarse como "0 vs N". Ahora se recorren AMBOS mapas de types (un type solo
    // presente en uno de los 2 nunca aparece como key en el otro) y se exige >0 en al menos uno.
    const totalLeadsByType = {}, compareLeadsByType = {};
    scopeCountries.forEach(c => {
      Object.entries(typeFor(actualTypes, c)).forEach(([t,v]) => { totalLeadsByType[t] = (totalLeadsByType[t]||0) + v.leads; });
      Object.entries(typeFor(compareTypes, c)).forEach(([t,v]) => { compareLeadsByType[t] = (compareLeadsByType[t]||0) + v.leads; });
    });
    const qualifyingTypes = new Set([...Object.keys(totalLeadsByType), ...Object.keys(compareLeadsByType)]
      .filter(t => (totalLeadsByType[t]||0)>0 || (compareLeadsByType[t]||0)>0));
    const types = [...qualifyingTypes].sort((a,b)=>(totalLeadsByType[b]||0)-(totalLeadsByType[a]||0));
    if(!types.length){
      return `${heroBlockHtmlWeek}
        <div class="detail-label daily-detail-label">${L('Marketing type por país','Marketing type by country')}</div>
        <div class="empty-note">${L('Ningún marketing type generó leads en ninguno de los 2 períodos.','No marketing type generated leads in either period.')}</div>`;
    }
    // "Total" -- pedido explícito 2026-08-24: última columna, suma de los types reales (o, en modo
    // Share, 100% por definición -- ver cellValue). Pseudo-key igual que BENCHMARK_KEY/
    // REST_LATAM_SUBTOTAL_KEY, nunca choca con un nombre de type real.
    const TOTAL_KEY = '__WeekTypeTotal__';
    const typeCols = [...types, TOTAL_KEY];
    const typeGridTemplate = `1.25fr ${typeCols.map(()=>'1fr').join(' ')}`;
    const fmtFn = metric==='share' ? fmtPct : fmtNum;
    const isPPMode = metric==='share'; // metric ya es un %, el delta debe ir en pp, no "% de un %"
    // Valor de una celda país×columna en UN período -- Total suma los types reales; Share divide
    // por la suma REAL de leads de ESE país en ESE período (nunca por el valor ya convertido a
    // Ventas) -- "Share" en esta vista siempre es sobre Leads, mismo criterio que decide qué types
    // entran a la tabla.
    function cellValue(byCountry, c, col){
      const typesObj = typeFor(byCountry, c);
      if(metric==='share'){
        const rowTotal = types.reduce((s,t)=>s+((typesObj[t]||emptyTB).leads), 0);
        if(!rowTotal) return null;
        const num = col===TOTAL_KEY ? rowTotal : (typesObj[col]||emptyTB).leads;
        return num/rowTotal;
      }
      if(col===TOTAL_KEY) return types.reduce((s,t)=>s+((typesObj[t]||emptyTB)[fmtField]), 0);
      return (typesObj[col]||emptyTB)[fmtField];
    }
    // Hero: SUMAR países para Leads/Ventas (aditivo, correcto); para Share, sumar numerador y
    // denominador POR SEPARADO y dividir al final -- promediar los % de cada país directamente
    // sería matemáticamente incorrecto (un país chico y uno grande no pesan igual).
    function heroValue(byCountry, col){
      if(metric!=='share') return scopeCountries.reduce((s,c)=>s+cellValue(byCountry,c,col), 0);
      let num=0, denom=0;
      scopeCountries.forEach(c=>{
        const typesObj = typeFor(byCountry, c);
        const rowTotal = types.reduce((s,t)=>s+((typesObj[t]||emptyTB).leads), 0);
        denom += rowTotal;
        num += col===TOTAL_KEY ? rowTotal : (typesObj[col]||emptyTB).leads;
      });
      return denom ? num/denom : null;
    }
    // Hero alineado — una tarjeta por columna (types + Total), en la MISMA columna que le
    // corresponde en la tabla. Bug real encontrado y corregido 2026-08-24 (2ª vuelta): el grid del
    // hero quitaba la franja "1.25fr" en vez de reservarla vacía como hace el header de la tabla
    // (línea de abajo, con su `<div></div>` inicial) -- eso corría cada tarjeta una columna hacia
    // la izquierda respecto a la tabla. Corrección adicional (3ª vuelta, real): tener el MISMO
    // grid-template-columns no bastaba -- `.daily-hero` trae su propio padding horizontal (24px) y
    // `.bh-kpis` su propio gap entre columnas (16px), ninguno de los 2 igual al de la tabla (20px
    // de padding en `.ch-row`/`.ch-header-row`, 12px de `column-gap`) -- ambos grids formando
    // "1.25fr + N×1fr" pero dentro de anchos disponibles distintos, así que las columnas seguían
    // sin coincidir en píxeles aunque las proporciones fueran idénticas. `week-aligned-hero` (ver CSS)
    // fuerza el padding/gap de este hero específico a igualar los de la tabla, sin tocar
    // `.daily-hero`/`.bh-kpis` compartidos por el resto de la app.
    const heroCellsByType = typeCols.map(col=>{
      const totalsA = heroValue(actualTypes, col);
      const totalsB = heroValue(compareTypes, col);
      const label = col===TOTAL_KEY ? L('Total','Total') : col;
      return `<div class="bh-kpi${col===TOTAL_KEY?' total-col':''}" data-metric="${col}"><div><div class="label">${label}</div>${weekMetricCell(totalsA, totalsB, fmtFn, false, isPPMode)}</div></div>`;
    }).join('');
    const heroBlockTypeAligned = `
      <div class="blended-hero daily-hero no-click week-aligned-hero">
        <div class="bh-head"><span class="bh-badge">${metricLabel}</span><span class="bh-sub">${L('por marketing type','by marketing type')}</span></div>
        <div class="bh-kpis" style="grid-template-columns:${typeGridTemplate}"><div></div>${heroCellsByType}</div>
      </div>`;
    const typeHeaderCells = typeCols.map(col=>`<div class="metric-col${col===TOTAL_KEY?' total-col col-divider':''}">${col===TOTAL_KEY?L('Total','Total'):col}</div>`).join('');
    function typeRowHtml(c){
      const isBenchOrSub = c===BENCHMARK_KEY || c===REST_LATAM_SUBTOTAL_KEY;
      const label = c===BENCHMARK_KEY ? L(row.benchmarkLabelEs, row.benchmarkLabelEn) : c===REST_LATAM_SUBTOTAL_KEY ? 'LT Excl. MX & AR' : (LANG==='es' ? COUNTRY_LABEL_ES[c] : COUNTRY_LABEL_EN[c]);
      const isHighlighted = !!(row.highlightCountries && row.highlightCountries.includes(c));
      const nameHtml = isBenchOrSub
        ? `<div class="ch-name">${iconChip('globe','var(--brand-accent)')}<div class="ch-text"><h4>${label}</h4></div></div>`
        : `<div class="ch-name">${flagIcon(c)}<div class="ch-text"><h4>${label}</h4></div></div>`;
      const cells = typeCols.map(col => {
        const av = cellValue(actualTypes, c, col), bv = cellValue(compareTypes, c, col);
        return `<div class="metric-col${col===TOTAL_KEY?' total-col col-divider':''}" data-metric="${col}">${weekMetricCell(av, bv, fmtFn, false, isPPMode)}</div>`;
      }).join('');
      return `<div class="ch-row no-click${isBenchOrSub?' subtotal-row':''}${isHighlighted?' week-lamina-highlight':''}" style="grid-template-columns:${typeGridTemplate}">
        ${nameHtml}
        ${cells}
      </div>`;
    }
    // Brasil: SOLO el hero -- pedido explícito 2026-08-24 ("ya habíamos hablado de este tema"),
    // mismo criterio que el modo normal (heroBlockHtmlWeek) ya aplica: Brasil es un solo país, así
    // que una tabla de 1 fila repetiría exactamente los mismos números que el hero de arriba.
    if(isBrazil) return heroBlockTypeAligned;
    const bodyRows = displayRowsWeek.map(typeRowHtml).join('');
    return `${heroBlockTypeAligned}
      <div class="detail-label daily-detail-label">${L('Marketing type por país','Marketing type by country')}</div>
      <div class="channel-table daily-table">
        <div class="ch-header-row" style="grid-template-columns:${typeGridTemplate}"><div></div>${typeHeaderCells}</div>
        ${bodyRows}
      </div>`;
  }

  const actualRangeLabel = fmtYoyRange(row.actualRange);
  const compareRangeLabel = fmtYoyRange(row.compareRange);
  const heroSubWeek = isBrazil
    ? `${flagIcon('Brazil')} ${L(`Brasil · vs ${compareRangeLabel.es}`,`Brazil · vs ${compareRangeLabel.en}`)}`
    : L(`Consolidado ${regionLabel()} · vs ${compareRangeLabel.es}`,`Consolidated ${regionLabel()} · vs ${compareRangeLabel.en}`);
  const deckLabelWeek = `${currentDeck().brand} · ${regionLabel()}`;
  const weekdayLabel = weekLaminaWeekdayLabel(row.actualRange.start, row.actualRange.end, weekdaySet);
  const weekdayPrefixEs = weekdayLabel ? `${weekdayLabel.es}: ` : '';
  const weekdayPrefixEn = weekdayLabel ? `${weekdayLabel.en}: ` : '';
  const compareLabelEs = row.compareLabelEs || 'WOW', compareLabelEn = row.compareLabelEn || 'WOW';
  const subtitleEs = `${weekdayPrefixEs}${deckLabelWeek} · ${actualRangeLabel.es} vs ${compareRangeLabel.es} · ${compareLabelEs}`;
  const subtitleEn = `${weekdayPrefixEn}${deckLabelWeek} · ${actualRangeLabel.en} vs ${compareRangeLabel.en} · ${compareLabelEn}`;

  // Brazil: no table below (single-hero layout) -- its own simple one-row grid, unchanged.
  // Non-Brazil: same grid (`yGridTemplate`, already 1.25fr + minmax(0,Xfr) per column) and the
  // same leading empty spacer as the table's header row, so every tile lines up with its column.
  const heroBlockHtmlWeek = isBrazil
    ? `
      <div class="blended-hero daily-hero no-click">
        <div class="bh-head"><span class="bh-badge">${L('Brand TV Channels','Brand TV Channels')}</span><span class="bh-sub">${heroSubWeek}</span></div>
        <div class="bh-kpis" style="grid-template-columns:${heroColsWeek.map(c=>`minmax(0,${c.weight}fr)`).join(' ')}">${bhKpisWeek}</div>
      </div>`
    : `
      <div class="blended-hero daily-hero no-click week-aligned-hero">
        <div class="bh-head"><span class="bh-badge">${L('Brand TV Channels','Brand TV Channels')}</span><span class="bh-sub">${heroSubWeek}</span></div>
        <div class="bh-kpis" style="grid-template-columns:${yGridTemplate}"><div></div>${bhKpisWeek}</div>
      </div>`;
  // "Detalle por marketing type" (botón 2) reemplaza la tabla de país normal por completo mientras
  // esté activo -- el hero de arriba nunca cambia. Botón vive en el footer (footerBar's rightExtra,
  // al lado del logo — mismo slot que ya usan otras láminas para controles extra).
  const bodyHtmlWeek = state.marketingTypeMode
    ? typeModeBodyHtml()
    : (isBrazil ? heroBlockHtmlWeek : `${heroBlockHtmlWeek}
      <div class="detail-label daily-detail-label">${L('Detalle por país','Detail by country')}</div>
      <div class="channel-table daily-table">
        <div class="ch-header-row" style="grid-template-columns:${yGridTemplate}"><div></div>${headerCellsWeek}</div>
        ${rowsHtmlWeek}
      </div>`);
  const marketingTypeBtn = `<button type="button" class="week-lamina-detail-btn${state.marketingTypeMode?' on':''}" data-week-marketingtype-toggle="${row.laminaId}">${state.marketingTypeMode ? L('Ver KPIs','View KPIs') : L('Marketing type por país','Marketing type by country')}</button>`;
  // Segundo detalle, provisional -- 2026-08-24: la ingesta real de Rotacion 2025/2026.xlsx (Fase
  // 2) no alcanza a construirse ya mismo, así que este botón sustituye por ahora el detalle de
  // creativos rotando por el comentario crudo de la Plantilla PPT Laminas.xlsx para esta fila (ver
  // weekSeparationNoteModalHtml) -- un modal simple, no un modo de la lámina como el de arriba.
  // Corrección explícita 2026-08-24: SOLO columna K, nunca otra columna a modo de respaldo -- el
  // botón se muestra siempre (para que las 7 láminas se vean consistentes) pero queda bloqueado
  // (`disabled`) cuando la fila no tiene nada en columna K, en vez de inventar contenido.
  const separationNoteBtn = `<button type="button" class="week-lamina-detail-btn" data-week-note-toggle="${row.laminaId}"${row.separationNote?'':' disabled'}>${L('Comentario Excel','Excel comment')}</button>`;
  return `<section class="slide slide-weekwow${isBrazil?' slide-daily-br':''}${state.hideActual?' hide-actual-value':''}${state.hideBudget?' hide-budget-value':''}" style="--slide-zoom:${getZoom(row.laminaId)}"><div class="slide-inner">
    ${headerBlock('s-'+row.laminaId, row.laminaTitleEs, row.laminaTitleEn, subtitleEs, subtitleEn)}
    <div class="slide-body centered-stack${isBrazil?' single-hero':''}">${bodyHtmlWeek}
    </div>
  </div>${footerBar(false, {legend: state.cols.NewCashSemaphore, legendYoy:true, rightExtra:marketingTypeBtn+separationNoteBtn})}</section>`;
}
function refreshSlideWeekWow(laminaId){
  const idx = SLIDES.findIndex(s=>s.id===laminaId);
  if(idx<0) return;
  const row = WEEK_LAMINA_ROWS.find(r=>r.laminaId===laminaId);
  document.querySelectorAll('.slide')[idx].outerHTML = weekWowSlide(row);
  wireWeekLaminaDetailButtons();
  fitHeroDeltas(laminaId);
  if(!autoFitBusy) applyAutoFit(laminaId);
}
/* Delegated wiring for every "Semana WOW" lámina's own footer detail-button (outerHTML swaps in
   refreshSlideWeekWow()/renderDeck() destroy the old button + its listener each time, same as
   every other per-slide control in this file — this just re-finds and re-binds all of them). */
function wireWeekLaminaDetailButtons(){
  document.querySelectorAll('[data-week-marketingtype-toggle]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const laminaId = btn.dataset.weekMarketingtypeToggle;
      const state = weekLaminaState[laminaId];
      state.marketingTypeMode = !state.marketingTypeMode;
      refreshSlideWeekWow(laminaId);
      if(currentWeekLaminaId===laminaId) renderGroupMenuWeekWow();
    });
  });
  document.querySelectorAll('[data-week-note-toggle]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const row = WEEK_LAMINA_ROWS.find(r=>r.laminaId===btn.dataset.weekNoteToggle);
      if(row) openModal(null, weekSeparationNoteModalHtml(row));
    });
  });
}
/* Modal del botón "Comentario Excel" -- provisional (pedido explícito 2026-08-24: la Fase 2 real
   -- ingesta de Rotacion 2025/2026.xlsx + % de rotación por creativo -- no alcanza a construirse
   ahora). Muestra tal cual (sin traducir -- es una cita textual, no copy de producto) el
   comentario EXACTO de la columna K ("Motivo de Separación") de Plantilla PPT Laminas.xlsx para
   esa fila. Corrección explícita 2026-08-24: SOLO columna K -- nunca otra columna a modo de
   respaldo (el botón que llama a esto ya viene `disabled` cuando `row.separationNote` no existe,
   así que este modal solo se abre cuando sí hay algo real que mostrar). Nota de "provisional" en
   una sola línea, deliberadamente discreta -- pedido explícito ("debe ser más sutil"). */
function weekSeparationNoteModalHtml(row){
  const noteHtml = row.separationNote.split('\n').map(line=>`<p>${line}</p>`).join('');
  return `<div class="modal-head"><h3>${L(row.laminaTitleEs, row.laminaTitleEn)}</h3></div>
    <div class="week-note-body">${noteHtml}</div>
    <div class="week-note-provisional">${L('Comentario original de la columna K de Plantilla PPT Laminas.xlsx -- detalle provisional.','Original comment from column K of Plantilla PPT Laminas.xlsx -- provisional detail.')}</div>`;
}
/* Single shared #groupMenuWeekWow slot (see its own div/CSS comments) — figures out which of the
   N week-láminas is currently on screen from SLIDES itself (mirrors how updateOnLaminaA() detects
   "are we on lamina yoy/a/daily"), same "one menu, current-state-dependent content" idea as
   renderGroupMenuYoy(), just resolved fresh each render instead of being the only lámina of its
   kind. No rango-personalizado panel here on purpose (explicit ask) — only Vistas/Columnas
   (identical to YoY's own) + the weekday multi-select (see weekLaminaWeekdaySelectorHtml()). */
function renderGroupMenuWeekWow(){
  const menu = document.getElementById('groupMenuWeekWow');
  // Real bug fixed 2026-08-24: this used to be SLIDES.findIndex(s=>WEEK_LAMINA_IDS.has(s.id)),
  // which always resolved to the FIRST week-lámina in the deck's own slide array, no matter which
  // one was actually on screen (all of a deck's slides coexist in the DOM at once, see
  // renderDeck()'s own comment — only scroll position says which one the viewer is looking at).
  // Same scroll-position read currentSlideId()/updateOnLaminaA() already use.
  const scrollIdx = Math.round(document.getElementById('scroller').scrollTop / window.innerHeight);
  const currentId = SLIDES[scrollIdx] && SLIDES[scrollIdx].id;
  if(!currentId || !WEEK_LAMINA_IDS.has(currentId)){ menu.innerHTML=''; currentWeekLaminaId=null; return; }
  const laminaId = currentId;
  currentWeekLaminaId = laminaId;
  const state = weekLaminaState[laminaId];
  // Mientras el detalle de marketing type está activo, Columnas deja de ser la lista normal de
  // KPIs (checkboxes, multi-selección) y pasa a ser Leads/Ventas de selección ÚNICA (radio) --
  // pedido explícito 2026-08-24: "debería tener desbloqueado leads... y sales... pero solo
  // selección única, a diferencia de cuando estoy en la visual de KPIs que sí puedo seleccionar
  // varios". Vista y día de semana no cambian en absoluto.
  const inTypeMode = state.marketingTypeMode;
  const columnasSectionHtml = inTypeMode
    ? `<div class="side-menu-header">${L('Columnas','Columns')} <span class="menu-locked-note">${L('(selección única)','(single select)')}</span></div>
       <label><input type="radio" name="weekTypeMetric" data-week-type-metric="leads" ${state.marketingTypeMetric==='leads'?'checked':''}> ${L('Leads','Leads')}</label>
       <label><input type="radio" name="weekTypeMetric" data-week-type-metric="sales" ${state.marketingTypeMetric==='sales'?'checked':''}> ${L('Ventas','Sales')}</label>
       <label><input type="radio" name="weekTypeMetric" data-week-type-metric="share" ${state.marketingTypeMetric==='share'?'checked':''}> ${L('% Share','% Share')}</label>`
    : `<div class="side-menu-header">${L('Columnas','Columns')}</div>
       ${YOY_COL_DEFS.map(c=>`<label><input type="checkbox" data-week-col="${c.key}" ${state.cols[c.key]?'checked':''}> ${colLabelYoy(c.key)}</label>`).join('')}`;
  menu.innerHTML = `
    <button type="button" class="menu-reset-btn" id="weekWowResetBtn">↺ ${L('Restablecer filtros','Reset filters')}</button>
    <div class="group-menu-col">
      <div class="side-menu-header">${L('Vista','View')}</div>
      <label><input type="checkbox" data-week-hide="hideActual" ${state.hideActual?'checked':''}> ${L('Ocultar Valor Actual','Hide Actual value')}</label>
      <label><input type="checkbox" data-week-hide="hideBudget" ${state.hideBudget?'checked':''}> ${L('Ocultar Valor del período anterior','Hide prior-period value')}</label>
      ${otherViewsHtml('includeBrazilToggleWeekWow')}
    </div>
    <div class="group-menu-col">
      ${columnasSectionHtml}
    </div>
    <div class="group-menu-col">
      <div class="side-menu-header">${L('Filtrar por día de semana','Filter by weekday')}</div>
      ${weekLaminaWeekdaySelectorHtml(laminaId)}
    </div>`;
  document.getElementById('weekWowResetBtn')?.addEventListener('click', ()=>resetWeekLaminaFilters(laminaId));
  menu.querySelectorAll('input[data-week-col]').forEach(inp=>{
    inp.addEventListener('change', e=>{
      state.cols[e.target.dataset.weekCol] = e.target.checked;
      saveWeekLaminaState();
      refreshSlideWeekWow(laminaId);
    });
  });
  menu.querySelectorAll('input[data-week-type-metric]').forEach(inp=>{
    inp.addEventListener('change', e=>{
      if(!e.target.checked) return;
      state.marketingTypeMetric = e.target.dataset.weekTypeMetric;
      saveWeekLaminaState();
      refreshSlideWeekWow(laminaId);
    });
  });
  menu.querySelectorAll('input[data-week-hide]').forEach(inp=>{
    inp.addEventListener('change', e=>{
      state[e.target.dataset.weekHide] = e.target.checked;
      saveWeekLaminaState();
      refreshSlideWeekWow(laminaId);
    });
  });
  document.getElementById('includeBrazilToggleWeekWow')?.addEventListener('change', e=>{

/* ================= DAILY TRACKER CUSTOM DATE RANGE ================= */
/* REDESIGNED 2026-08-18 (2nd pass, explicit ask after the 1st version shipped): the 1st version
   was a single [start,end] range behind an "activate" checkbox, hidden by default -- confusing
   ("no entiendo lo del rango del rango") and missing what was actually asked for: a WEEK per
   button, MULTI-selectable (pick week 1 AND week 3), each clipped to the current month (week 1 of
   August might calendar-wise start in late July, but only its August days count here), PLUS a
   Monday-Sunday weekday filter that narrows WHATEVER weeks are picked (e.g. weeks 1+3, Mondays
   only). No enable checkbox anymore -- the panel is always live; with nothing touched it's
   exactly month-to-date (identical to before this feature existed), so there's no "off" state
   distinct from the everyday default. No new backend/export work needed -- reaggregates the same
   per-day raw rows already sitting in _rawByDeckCache, exactly like aggregateYoyDaily() does for
   YoY's own custom range, just Branded-only (the only channel Daily Tracker shows) and pulling
   budget too (YoY compares against last year's actual instead of a budget). */
const LS_DAILY_CUSTOM_RANGE = 'brandedkpis_daily_customrange_v2';
let dailyCustomRange = { days: null, weekdays: null }; // days: null=month-to-date default, else an explicit array of ISO dates. weekdays: null=every day, else an array of 0-6 (Sun-Sat) narrowing whatever `days` resolves to.
(function loadDailyCustomRange(){
  try{
    const saved = JSON.parse(localStorage.getItem(LS_DAILY_CUSTOM_RANGE)||'null');
    if(saved) Object.assign(dailyCustomRange, saved);
  }catch(e){}
})();
function saveDailyCustomRange(){ localStorage.setItem(LS_DAILY_CUSTOM_RANGE, JSON.stringify(dailyCustomRange)); }
function dailyCustomRangeActive(){ return !!(dailyCustomRange.days || dailyCustomRange.weekdays); }
function dailyCutoffISO(){ return `${DATA.meta.month}-${String(DATA.meta.asOfDay).padStart(2,'0')}`; }
function fmtMMDD(iso){ const [,m,d] = iso.split('-'); return `${m}/${d}`; }
/* The month's calendar weeks (Monday-first), each clipped to [month start, cutoff] -- explicit
   ask + worked example, 2026-08-18: "la primera semana era del 27 de julio al 2 de agosto, pero
   claramente se pondría solo del uno de agosto al dos de agosto... la cuarta sería diecisiete
   solo". Traced against that exact example (cutoff=2026-08-17, a Monday) and it reproduces all 4
   weeks verbatim: [Aug1-2, Aug3-9, Aug10-16, Aug17]. A still-open final week naturally clips to
   cutoff, same reasoning as dailyThisWeekRange() before this rewrite / yoyDefaultActualRange()'s
   WOW branch. */
function dailyMonthWeeks(){
  const monthStart = DATA.meta.month+'-01';
  const cutoff = dailyCutoffISO();
  const weeks = [];
  let cur = monthStart;
  while(cur<=cutoff){
    const dow = parseISODate(cur).getDay();
    const sinceMonday = (dow+6)%7;
    const rawStart = addDaysISO(cur,-sinceMonday);
    const rawEnd = addDaysISO(rawStart,6);
    const start = rawStart<monthStart ? monthStart : rawStart;
    const end = rawEnd>cutoff ? cutoff : rawEnd;
    weeks.push({start,end});
    cur = addDaysISO(end,1);
  }
  return weeks;
}
function dailyDaysInRange(startISO,endISO){
  const out=[]; let d=startISO; while(d<=endISO){ out.push(d); d=addDaysISO(d,1); } return out;
}
/* Materializes `dailyCustomRange.days` into a Set -- when it's still null (nothing touched yet),
   that means "every day from month start through cutoff", the same month-to-date window this
   lámina always showed before this feature existed. */
function dailyEffectiveDaySet(){
  if(dailyCustomRange.days) return new Set(dailyCustomRange.days);
  return new Set(dailyDaysInRange(DATA.meta.month+'-01', dailyCutoffISO()));
}
/* The actual dates to aggregate: dailyEffectiveDaySet() narrowed by the weekday filter, if any. */
function dailyIncludedDateSet(){
  const base = dailyEffectiveDaySet();
  if(!dailyCustomRange.weekdays) return base;
  const wd = new Set(dailyCustomRange.weekdays);
  return new Set([...base].filter(d=>wd.has(parseISODate(d).getDay())));
}
function dailyToggleWeek(idx){
  const w = dailyMonthWeeks()[idx]; if(!w) return;
  const days = dailyDaysInRange(w.start,w.end);
  // Start from the EXPLICIT selection only (never dailyEffectiveDaySet()'s materialized "whole
  // month" default) -- otherwise the very first click reads as "this week's days are already in
  // (since everything is, by default), so turn them OFF", which inverts the intended additive
  // multi-select: it silently selects the whole month MINUS one week instead of just that week.
  // Real bug, found 2026-08-18 via a hero-total mismatch ($81,010 rendered vs $70,040 expected).
  const current = new Set(dailyCustomRange.days || []);
  const allIn = days.length>0 && days.every(d=>current.has(d));
  days.forEach(d=> allIn ? current.delete(d) : current.add(d));
  dailyCustomRange.days = current.size ? [...current] : null;
  saveDailyCustomRange();
  renderGroupMenuDaily();
  refreshSlideDaily();
}
function dailyToggleDay(iso){
  const current = new Set(dailyCustomRange.days || []);
  if(current.has(iso)) current.delete(iso); else current.add(iso);
  dailyCustomRange.days = current.size ? [...current] : null;
  saveDailyCustomRange();
  renderGroupMenuDaily();
  refreshSlideDaily();
}
function dailyToggleWeekday(d){
  // Same additive-from-empty model as dailyToggleWeek -- build an INCLUSIVE filter starting from
  // nothing, not an exclusive one starting from "all 7 days".
  const current = new Set(dailyCustomRange.weekdays || []);
  current.has(d) ? current.delete(d) : current.add(d);
  // Full 7-day selection is the same as "no filter" -- store null so a returning visit doesn't
  // show 7 pills lit up for what's really just "no weekday filter applied".
  dailyCustomRange.weekdays = (current.size && current.size<7) ? [...current] : null;
  saveDailyCustomRange();
  renderGroupMenuDaily();
  refreshSlideDaily();
}
/* Branded-only, arbitrary date Set, per country — reuses the exact same field names/helpers
   buildActuals() in viewBuilder.js already uses (addDailyRowInto/addKpiRowInto/bucketCountry/
   emptyTotals — all top-level in that file, loaded before this script runs), so this can never
   silently drift from how the "real" MTD numbers get computed. */
function dailyTrackerRangeActuals(deckId, dateSet){
  const cache = _rawByDeckCache[deckId];
  const isBrazilDeck = DECKS[deckId].region === 'Brazil';
  const byCountry = {};
  const addRows = (rows, adder) => {
    for(const r of rows){
      if(!dateSet.has(r.date)) continue;
      if(r.channel_grouping !== 'Brand TV Channels') continue;
      const country = bucketCountry(r.country, isBrazilDeck);
      if(country===null) continue;
      const b = byCountry[country] || (byCountry[country] = emptyTotals());
      adder(b, r);
    }
  };
  addRows(cache.dailyRows, addDailyRowInto);
  addRows(cache.channelKpiRows, addKpiRowInto);
  return byCountry;
}
function dailyTrackerRangeBudget(deckId, dateSet){
  const byCountry = {};
  for(const r of _rawByDeckCache[deckId].dailyTrackerBudgetRows){
    if(!dateSet.has(r.date)) continue;
    const b = byCountry[r.country] || (byCountry[r.country] = {Spend:0,Leads:0,Sales:0,NewCash:0});
    b.Spend += r.spend||0; b.Leads += r.leads||0; b.Sales += r.sales||0; b.NewCash += r.newCashCore||0;
  }
  return byCountry;
}
function dailyWeekdaySelectorHtml(){
  const labels = {0:L('Dom','Sun'),1:L('Lun','Mon'),2:L('Mar','Tue'),3:L('Mié','Wed'),4:L('Jue','Thu'),5:L('Vie','Fri'),6:L('Sáb','Sat')};
  // Empty (not all-7) when nothing's explicitly chosen -- matches the additive-from-empty model:
  // no pill is "on" until the user actually picks one, since a click ADDS to an inclusive filter.
  const selected = new Set(dailyCustomRange.weekdays || []);
  return `<div class="weekday-selector" id="dailyWeekdaySelector">
    ${WD_VISUAL_ORDER.map(d=>`<button type="button" class="wd-btn${selected.has(d)?' on':''}" data-dwd="${d}">${labels[d]}</button>`).join('')}
  </div>`;

function dailyCustomRangePanelHtml(){
  const weeks = dailyMonthWeeks();
  // Explicit selection only (not dailyEffectiveDaySet()'s materialized whole-month default) --
  // no week/day pill should show "on" until the user actually clicks one.
  const explicitDays = dailyCustomRange.days ? new Set(dailyCustomRange.days) : null;
  const cutoff = dailyCutoffISO();
  const weekBtns = weeks.map((w,i)=>{
    const days = dailyDaysInRange(w.start,w.end);
    const on = !!explicitDays && days.every(d=>explicitDays.has(d));
    const label = w.start===w.end ? fmtMMDD(w.start) : `${fmtMMDD(w.start)}-${fmtMMDD(w.end)}`;
    return `<button type="button" class="dtr-week-btn${on?' on':''}" data-week-idx="${i}">${L('Sem.','Wk')} ${i+1} (${label})</button>`;
  }).join('');
  const yesterdayOn = !!explicitDays && explicitDays.has(cutoff);
  return `<div class="side-menu-header">${L('Rango de fechas','Date range')}</div>
    <div class="dtr-week-row">
      ${weekBtns}
      <button type="button" class="dtr-week-btn dtr-yesterday-btn${yesterdayOn?' on':''}" data-day="${cutoff}">${L('Ayer','Yesterday')}</button>
    </div>
    <div class="side-menu-header" style="margin-top:8px">${L('Filtrar por día de semana','Filter by weekday')}</div>

}

      // Real bug found verifying this feature originally: refreshSlideYoy() only re-renders the
      // SLIDE (table/hero) — the custom-range panel lives in the separate #groupMenuYoy element,
      // which only renderGroupMenuYoy() touches. Without this, yoyCustomRangePanelHtml()'s own
      // !yoyMktOrgShowsTotal() guard (it's not wired for the MarketingOrg split — see that
      // function's comment) would go stale: the panel would keep showing/accepting input after
      // switching away from "both orgs", even though slideYoy() already correctly ignores it in
      // that state (customRangeActive there re-checks yoyMktOrgShowsTotal() fresh every render) —
      // so the NUMBERS were never wrong, only the panel's own visibility was misleadingly stale.
      renderGroupMenuYoy();
    });
  });
}

function buildTOC(){
  document.getElementById('tocTitle').textContent = L('Índice','Index');
  const list = document.getElementById('tocList');
  list.innerHTML = SLIDES.map((s,i)=>`<button data-idx="${i}">${i+1}. ${L(s.es,s.en)}</button>`).join('');
  list.querySelectorAll('button[data-idx]').forEach(b=>{
    b.addEventListener('click', ()=>{
      document.querySelectorAll('.slide')[+b.dataset.idx].scrollIntoView({behavior:'smooth'});
    });
  });
}
/* Quick brand/region switch, top-left hover menu — jumps to the SAME lámina (by slide id, e.g.
   'yoy') in whichever of the other 3 deck the user picks. The target index is looked up fresh
   at CLICK time (via currentSlideId(), not baked into the button at render time) since which
   slide is "current" changes on every scroll without a re-render — no need to rebuild this list
   on scroll, only on deck-enter, because the lookup itself is what's dynamic, not the 3 buttons'
   labels. Falls back to that deck's cover (index 0) when the current lámina doesn't exist there
   (e.g. leaving Daily Tracker for a Junior deck, which has no 'daily' slide at all). */
function buildDeckSwitcher(){
  document.getElementById('switcherTitle').textContent = L('Cambiar a','Switch to');
  const list = document.getElementById('deckSwitcherList');
  const others = Object.keys(DECKS).filter(id=>id!==DECK_ID);
  list.innerHTML = others.map(id=>{
    const d = DECKS[id];
    return `<button data-deck="${id}">${d.brand} · ${d.region}</button>`;
  }).join('');
  list.querySelectorAll('button[data-deck]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const targetId = b.dataset.deck;
      const idx = DECKS[targetId].slides.indexOf(currentSlideId());
      enterDeck(targetId, idx<0?0:idx);
    });
  });
}

function wireCardClicks(){

/* Item 7's modal trigger — re-wired both on a full deck rebuild (renderDeck) AND on every
   refreshSlideYoy() (category/date/weekday-filter changes replace the whole slide's outerHTML,
   including these hero tiles, so a listener attached before that point is gone). */
function wireYoyMktOrgModalClicks(){
  document.querySelectorAll('[data-modal="yoy-mktorg"]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const raw = el.dataset.country;
      const countries = raw==='__SUBTOTAL__' ? REST_LATAM_SUBTOTAL_COUNTRIES : (raw==='__ALL__' ? null : raw);
      openModal('xl', mktOrgGridModalHtml(countries, el.dataset.countryLabel || raw));
    });
