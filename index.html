/* Per-slide content zoom — explicitly NOT the browser's own zoom (rejected by the user: it must
   work the same regardless of the viewer's browser zoom setting, and must never rely on it).
   Keyed by deck+slide (not just slide type) since e.g. OE-LATAM's Daily Tracker and Brazil's
   Daily Tracker are structurally very different content densities and shouldn't share a level.
   Cover is intentionally excluded — it's a brand splash, never data-dense enough to need this. */
const LS_SLIDE_ZOOM = 'brandedkpis_slide_zoom';
const ZOOM_MIN = 0.8, ZOOM_MAX = 1.5, ZOOM_STEP = 0.1;
let slideZoom = {};
(function loadSlideZoom(){
  try{
    const saved = JSON.parse(localStorage.getItem(LS_SLIDE_ZOOM)||'null');
    if(saved) slideZoom = saved;
  }catch(e){}
})();
function saveSlideZoom(){ localStorage.setItem(LS_SLIDE_ZOOM, JSON.stringify(slideZoom)); }
function zoomStorageKey(slideId){ return DECK_ID+':'+slideId; }
/* autoFitScale is the OTHER half of the effective zoom — never persisted (it must always reflect
   the CURRENT window, not a past one), recomputed by applyAutoFit() below. Multiplying it into
   getZoom() means every existing caller (the slide's own inline style, updateZoomUi's %, the
   manual zoom-in/out math) automatically accounts for it with zero other changes — the manual
   zoom becomes "how much bigger than the auto-fit baseline," not an absolute size. */
let autoFitScale = {};
function getZoom(slideId){ return (slideZoom[zoomStorageKey(slideId)] || 1) * (autoFitScale[slideId] || 1); }
const ZOOMABLE_SLIDES = {a: refreshSlideA, daily: refreshSlideDaily, yoy: refreshSlideYoy};
function currentSlideId(){
  const scroller = document.getElementById('scroller');
  const idx = Math.round(scroller.scrollTop / window.innerHeight);
  return SLIDES[idx] ? SLIDES[idx].id : null;
}
/* `.slide-body{flex:1}`'s OWN box is sized by the flex algorithm — it stays the exact same size
   whether its content zoomed content is 100% or 150%, so comparing .slide-body's/any single
   descendant's own getBoundingClientRect() against the footer is unreliable in general (it would
   need to know which specific descendant is the "last" one for every current and future slide
   layout — a table row here, a card grid in Brazil's flow layout, etc.). Instead, use .slide
   itself: it has a fixed height AND overflow:hidden, so if the (now-zoomed) content inside
   genuinely needs more room than that fixed height allows, `scrollHeight` (the content's true,
   unclipped extent) exceeds `clientHeight` (the visible, clipped extent) by exactly the clipped
   amount — a simple, correct, structure-agnostic overflow signal confirmed empirically while
   building this (0px diff at levels that visibly fit, 100+px diff at levels that visibly don't). */
/* Lámina A's .channel-table has its OWN overflow-y:auto safety net (see its CSS comment) — it
   contains its own overflow so the SLIDE never breaks, but that containment means slide.scrollHeight
   stops seeing it entirely (a scrollable descendant's internal overflow never inflates its
   ancestor's own scrollHeight). Auto-fit must still shrink for this case — leaving the reader with
   an internal scrollbar on the default view is exactly the "tengo que escrolear" complaint this
   feature exists to prevent — so this checks BOTH: the slide itself (the general case) AND
   .channel-table specifically wherever it's present, since that's currently the only
   internally-scrollable descendant in this deck. */
function slideOverflows(slideId){
  const idx = SLIDES.findIndex(s=>s.id===slideId);
  if(idx<0) return false;
  const slide = document.querySelectorAll('.slide')[idx];
  if(!slide) return false;
  if(slide.scrollHeight > slide.clientHeight) return true;
  const table = slide.querySelector('.channel-table');
  if(table && table.scrollHeight > table.clientHeight) return true;
  /* Horizontal check, hero tiles only: .bh-kpis' tracks are minmax(0,1fr) (see that rule's
     comment) so a wide tile can no longer force the whole grid wider than its container — but a
     nowrap .mc-delta can still be wider than ITS OWN now-constrained tile, spilling visually into
     the next one. scrollWidth on the tile itself (not the delta) catches this regardless of which
     child is the wide one. */
  const heroTiles = slide.querySelectorAll('.bh-kpi');
  for(const t of heroTiles){ if(t.scrollWidth > t.clientWidth + 0.5) return true; }
  return false;
}
/* Zoom-in can request a level that doesn't fit (content has less slack than the step size) — this
   self-corrects by rendering the requested level, measuring, and stepping back down until it fits,
   all inside one requestAnimationFrame so the browser never actually paints the overflowing
   intermediate state. Zoom-out never needs this: shrinking never overflows more than the current
   (already-fitting) level. */
function adjustZoom(delta){
  const id = currentSlideId();
  const refresh = ZOOMABLE_SLIDES[id];
  if(!refresh) return;
  const key = zoomStorageKey(id);
  const current = slideZoom[key] || 1;
  if(delta < 0){
    /* Shrinking never overflows more than the current (already-fitting) level — no fit-search
       needed, just clamp to the floor. */
    const next = Math.round(Math.max(ZOOM_MIN, current + delta) * 100) / 100;
    if(next === current){ updateZoomUi(); return; }
    slideZoom[key] = next;
    refresh();
    saveSlideZoom();
    updateZoomUi();
    return;
  }
  /* Zoom-IN can't just try +ZOOM_STEP and reject it wholesale on overflow — this deck's slides
     are already tightly optimized (see feedback-branformance-technical-gotchas memory), so their
     available slack is usually tens of px against several-hundred-px content, i.e. much less than
     one full 10% step. A binary search finds the LARGEST value up to current+ZOOM_STEP that still
     fits, so a click always makes whatever progress the available whitespace actually allows,
     rather than an all-or-nothing jump that silently does nothing almost everywhere.
     Deliberately synchronous, no requestAnimationFrame: a plain synchronous function never yields
     back to the browser's render step until it returns, so every trySet()/refresh() in this
     search is invisible mid-search on its own — rAF isn't needed to avoid a flash, and depending
     on it here would be actively wrong, since rAF callbacks are fully suspended in a
     hidden/non-composited document (confirmed while building this), which would leave a zoom
     click permanently "stuck" pending until the tab regains visibility. */
  const ceiling = Math.min(ZOOM_MAX, current + ZOOM_STEP);
  if(ceiling <= current + 1e-9){ updateZoomUi(); flashZoomCapped(); return; }
  const trySet = (z) => { slideZoom[key] = z; refresh(); };
  trySet(ceiling);
  if(!slideOverflows(id)){
    slideZoom[key] = Math.round(ceiling * 100) / 100;
    refresh();
  } else {
    let lo = current, hi = ceiling;
    for(let i = 0; i < 7; i++){
      const mid = (lo + hi) / 2;
      trySet(mid);
      if(slideOverflows(id)) hi = mid; else lo = mid;
    }
    slideZoom[key] = Math.max(current, Math.floor(lo * 100) / 100); // round DOWN — never land one px over
    refresh();
  }
  finishZoomIn(current, key, id);
}
function finishZoomIn(previousLevel, key, id){
  // The search can land fractionally above where it started if content fits exactly at current —
  // re-verify once more after rounding, since Math.floor()'s rounding is a final sanity check, not
  // a guarantee, against the actual rendered box. Floored at previousLevel, never lower: if a
  // slide is ALREADY overflowing before this click even ran (a pre-existing layout bug, not
  // something this click caused), the correction below must never make a "+" click into a
  // de-facto zoom-OUT below where the user started — it should just refuse to zoom in further.
  if(slideOverflows(id) && slideZoom[key] > previousLevel + 1e-9){
    slideZoom[key] = Math.max(previousLevel, Math.round((slideZoom[key] - 0.01) * 100) / 100);
    ZOOMABLE_SLIDES[id]();
  }
  saveSlideZoom();
  updateZoomUi();
  if(slideZoom[key] <= previousLevel + 1e-9) flashZoomCapped();
}
function flashZoomCapped(){
  const group = document.getElementById('zoomGroup');
  group.classList.remove('zoom-capped');

  group.classList.add('zoom-capped');
}
function updateZoomUi(){
  const id = currentSlideId();
  const group = document.getElementById('zoomGroup');
  if(!ZOOMABLE_SLIDES[id]){ group.style.display = 'none'; return; }
  group.style.display = 'flex';
  const z = getZoom(id);

}
/* Double-click the % to type an exact value (explicit ask, 2026-08-14) — swaps the <span> for a
   number <input> in place, same MIN/MAX clamp as the +/- buttons so a typed value can't exceed
   what this deck's auto-fit system is designed to handle. Sets slideZoom (the MANUAL half of
   getZoom()'s product, see that function's comment) to whatever value makes the COMBINED zoom
   equal the typed percentage, dividing out the current autoFitScale so typing "120" means "120%
   of actual size," not "120% on top of whatever auto-fit already applied." */
function startZoomEdit(){
  const id = currentSlideId();
  if(!ZOOMABLE_SLIDES[id]) return;
  const pctEl = document.getElementById('zoomPct');
  const currentPct = Math.round(getZoom(id) * 100);
  const input = document.createElement('input');
  input.type = 'number';
  input.className = 'zoom-pct-input';
  input.value = currentPct;
  pctEl.replaceWith(input);
  input.focus();
  input.select();
  let done = false;
  const restore = () => { if(document.body.contains(input)) input.replaceWith(pctEl); };
  const commit = () => {
    if(done) return; done = true;
    const requested = Math.round(Number(input.value));
    const clamped = Number.isFinite(requested) ? Math.max(ZOOM_MIN*100, Math.min(ZOOM_MAX*100, requested)) : currentPct;
    const key = zoomStorageKey(id);
    // Clamp the MANUAL component too (not just the requested %), same invariant adjustZoom's own
    // +/- math keeps slideZoom[key] under — otherwise a low autoFitScale at edit time (heavy
    // vertical shrink already in effect) could divide out to a manual value past ZOOM_MAX, which
    // would then persist to localStorage and outlive whatever caused that shrink.
    const rawManual = (clamped/100) / (autoFitScale[id]||1);
    slideZoom[key] = Math.round(Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, rawManual)) * 100) / 100;
    saveSlideZoom();
    ZOOMABLE_SLIDES[id]();
    restore();
    updateZoomUi();
    if(Number.isFinite(requested) && clamped !== requested) flashZoomCapped();
  };
  const cancel = () => { if(done) return; done = true; restore(); };
  input.addEventListener('keydown', e => {
    if(e.key==='Enter'){ e.preventDefault(); commit(); }
    else if(e.key==='Escape'){ e.preventDefault(); cancel(); }
  });
  input.addEventListener('blur', commit);
}
document.getElementById('zoomPct').addEventListener('dblclick', startZoomEdit);

/* Shrinks delta font-size (never anything else — actual/budget/labels stay put) only when some
   nowrap cell's content still doesn't fit its own box at full size — a DIFFERENT problem from
   viewport fit (see the long comment on .bh-kpi's rule for why zoom can't touch this one). Must
   run BEFORE applyAutoFit in each refreshSlideX: fix cells' own internal proportions first, then
   fit the (now-correct) whole slide to the viewport. TWO independent scales, computed and applied
   separately, because the two contexts are different enough that sharing one would either starve
   the table (barely-overflowing, needs a light touch) or under-shrink the hero (badly-overflowing
   at 10 tiles, needs a heavy one) — see each CSS rule using these vars for exactly which contexts
   read which var:
   - --hero-delta-scale: summary cards (.bh-kpi grid hero OR .daily-br-card/.daily-br-spend
     Brazil's card flow — whichever a given deck/region renders; set on the SLIDE root, not
     .bh-kpis, so one mechanism covers both without duplicating this function).
   - --table-delta-scale: row-table cells (.metric-col, Lámina A/Daily Tracker/YoY's per-channel
     or per-country rows) — found missing via a full 4-deck×4-slide sweep (a few px of overflow
     on specific rows, invisible in the single-deck spot-checks that had looked clean; scoped
     separately from the hero's because the table's overflow here is consistently much smaller).
   Both step down in small increments rather than binary-searching — this only ever needs a few %
   in practice (long $ amounts, not wildly oversized), and re-rendering the whole slide per step
   is not free. */
/* Card scrollWidth is NOT a reliable overflow signal here — a flex-column card with
   align-items:center (e.g. .daily-br-spend) reports a phantom scrollWidth > clientWidth
   (constant regardless of content/scale, confirmed empirically) purely from the centering,
   with zero descendants actually outside its box. Checking every descendant's own rendered
   rect against the card's OWN BORDER-BOX edges avoids that false positive while still catching
   the real case (e.g. a long .dbc-label that won't wrap pushing past the card on its own).
   **Deliberately border-box, not padding-box**: an earlier version subtracted
   getComputedStyle(card).paddingLeft/Right from rect.left/right to get the padding edge — but
   getComputedStyle padding is the UNZOOMED logical CSS value (same quirk as fontSize), while
   `rect` is the real zoomed render, so at this deck's routine fractional `zoom` levels
   (0.44-0.9x) that subtraction was systematically wrong by `padding*(1-zoom)` — confirmed by a
   card where EVERY descendant, regardless of content, reported the exact same ~2.5px "overflow"
   (14px padding * (1-0.82 zoom) ≈ 2.5) with nothing visually wrong. Comparing straight against
   the card's own rect sidesteps the mismatch entirely (both sides of the comparison come from
   getBoundingClientRect, so they share the same zoom scaling) and is also the more honest check
   anyway: a few px eaten out of reserved padding isn't a visible defect, content actually
   crossing the card's outer edge is. Real bugs this exists to catch have all measured 6px+. */
function cardContentOverflows(card){
  const rect = card.getBoundingClientRect();
  const TOL = 1.5;
  return [...card.querySelectorAll('*')].some(el=>{
    const r = el.getBoundingClientRect();
    return r.width>0 && (r.right > rect.right+TOL || r.left < rect.left-TOL);
  });

function fitHeroDeltas(slideId){
  const idx = SLIDES.findIndex(s=>s.id===slideId);
  const slide = document.querySelectorAll('.slide')[idx];
  if(!slide) return;
  const cardSelector = '.bh-kpi, .daily-br-card, .daily-br-spend';
  if(slide.querySelector(cardSelector)){
    slide.style.removeProperty('--hero-delta-scale');
    let scale = 1;
    for(let i=0;i<14;i++){
      const cards = [...slide.querySelectorAll(cardSelector)];
      if(!cards.some(cardContentOverflows)) break;
      scale = Math.round((scale-0.04)*100)/100;
      slide.style.setProperty('--hero-delta-scale', scale);
    }
  }
  if(slide.querySelector('.metric-col')){
    slide.style.removeProperty('--table-delta-scale');
    let tScale = 1;
    for(let i=0;i<14;i++){
      const cells = [...slide.querySelectorAll('.metric-col')];
      /* `.metric-col .metric-cell{text-align:right}` — overflowing content spills LEFTWARD,
         into the previous column, and `scrollWidth > clientWidth` does not reliably detect
         leftward overflow (confirmed empirically: a real, visible column-invasion case measured
         scrollWidth===clientWidth on every affected cell). cardContentOverflows() catches this
         because it compares actual rendered rects, direction-agnostic. */
      if(!cells.some(cardContentOverflows)) break;
      tScale = Math.round((tScale-0.04)*100)/100;
      slide.style.setProperty('--table-delta-scale', tScale);
    }

/* Auto-fit — every lamina must fit whatever window the viewer ACTUALLY has open, never assume
   the ~1400×900 size this project tests at. Reuses slideOverflows()'s exact
   scrollHeight-vs-clientHeight check and the same binary-search-for-largest-that-fits shape as
   manual zoom-in above, but searching for a SHRINK factor (never above 1 — this is a safety net
   against overflow, not a way to blow content up on a huge monitor) and re-run on every render,
   not just once, since `.slide{height:100vh}` means "fits" is a live property of the current
   window, not a fixed fact computed once at load. `autoFitBusy` guards against the obvious
   recursion (this calls the slide's own refresh() to re-measure at each candidate scale, and
   refresh() calls this again at its own end — see where it's invoked from each refreshSlideX).
   PERF FIX (2026-08, real bug reported by the user — "trabado", ~2.3s per checkbox click measured
   with every row/column visible): the search used to call `refresh()` — a FULL slideX() outerHTML
   rebuild PLUS a nested fitHeroDeltas() pass (up to 28 measure-iterations of its own) — on every
   one of its ~11 probe attempts (1 initial + up to 9 binary-search steps + 1 final). Only
   `--slide-zoom`'s VALUE differs between probes; the row/column content never changes mid-search,
   so rebuilding the entire DOM from an HTML string 11 times to test 11 numbers was pure waste.
   Probes now mutate `--slide-zoom` directly on the already-rendered slide element (cheap: one
   style write, forces a layout recalc only on the next read, same technique `fitHeroDeltas`
   itself already uses for its own scale vars) — `fitHeroDeltas()` runs exactly ONCE at the end,
   at the final chosen zoom, instead of once per probe. CSS `zoom` scales content and its
   container proportionally, so a delta/cell's overflow-vs-its-box relationship (what
   fitHeroDeltas' own search resolves) doesn't change across different `--slide-zoom` values —
   re-running it mid-search was measuring the same answer repeatedly. Confirmed same final visual
   result, ~2.3s -> ~0.1-0.2s on the same all-columns-visible worst case. */
let autoFitBusy = false;
function applyAutoFit(slideId){
  // no refresh()/outerHTML rebuild anywhere below — see PERF FIX comment above.
  if(!ZOOMABLE_SLIDES[slideId] || autoFitBusy) return;
  autoFitBusy = true;
  const idx = SLIDES.findIndex(s=>s.id===slideId);
  const slide = document.querySelectorAll('.slide')[idx];
  const probe = (scale) => {
    autoFitScale[slideId] = scale;
    if(slide) slide.style.setProperty('--slide-zoom', getZoom(slideId));
  };
  probe(1);
  if(slide && slideOverflows(slideId)){
    let lo = 0.55, hi = 1;
    for(let i=0;i<9;i++){
      const mid = (lo+hi)/2;
      probe(mid);
      if(slideOverflows(slideId)) hi = mid; else lo = mid;
    }
    probe(Math.floor(lo*1000)/1000); // round DOWN — never land one px over
  }
  fitHeroDeltas(slideId); // settle delta-scale once, at the final zoom, not once per probe above
  autoFitBusy = false;
}
/* Debounced, not on every resize event (which can fire dozens of times per drag) — 120ms is
   short enough to feel immediate once the user stops dragging, long enough to not thrash the
   binary search (18 renders worst-case) on every intermediate frame of a live window-resize. */
let resizeFitTimer = null;
window.addEventListener('resize', ()=>{
  clearTimeout(resizeFitTimer);
  resizeFitTimer = setTimeout(()=>{
    const id = currentSlideId();
    if(ZOOMABLE_SLIDES[id]) applyAutoFit(id);

/* keep the URL hash in sync with the visible slide, so a refresh returns to the same lámina */
document.getElementById('scroller').addEventListener('scroll', ()=>{

/* Spotlight-style coachmark tour, shown once automatically right after the first finishBootstrap()
   post-login, and replayable anytime via the ❓ button in #topControls. Each step's target()
   returns the element (or [elements] to spotlight the union of several, e.g. the ☰ icon + the
   panel it opens) to highlight -- null means a centered, untargeted card. onEnter runs BEFORE
   measuring/positioning (drives real navigation: enterDeck, slide scroll, force-showing a
   hover-reveal panel via .hover-visible) so layout reflects the step before we read it. The
   underlying page is intentionally inert during the tour (full-page transparent blocker under the
   spotlight) -- this is a guided walkthrough, not hands-on practice; real interaction resumes the
   moment the tour closes. */
let tutSteps = [];
let tutIdx = 0;
let tutActive = false;

function tutHideAllPanels(){

   localStorage last had it set to, so the tour can reliably explain it -- mirrors exactly what

function tutUnionRect(elements){
  const rects = elements.filter(Boolean).map(el=>el.getBoundingClientRect());
  if(!rects.length) return null;
  const left = Math.min(...rects.map(r=>r.left)), top = Math.min(...rects.map(r=>r.top));
  const right = Math.max(...rects.map(r=>r.right)), bottom = Math.max(...rects.map(r=>r.bottom));
  return {left, top, right, bottom, width:right-left, height:bottom-top};
}
function tutTargetRect(step){
  const t = step.target ? step.target() : null;
  if(!t) return null;
  return Array.isArray(t) ? tutUnionRect(t) : t.getBoundingClientRect();
}
function tutPositionSpotlight(rect){
  const sp = document.getElementById('tutorialSpotlight');
  const pad = 8;
  if(!rect || (rect.width===0 && rect.height===0)){
    sp.style.borderRadius = '50%';
    sp.style.left = (window.innerWidth/2)+'px';
    sp.style.top = (window.innerHeight/2)+'px';
    sp.style.width = '0px'; sp.style.height = '0px';
    return;
  }
  sp.style.borderRadius = '14px';
  sp.style.left = (rect.left-pad)+'px';
  sp.style.top = (rect.top-pad)+'px';
  sp.style.width = (rect.width+pad*2)+'px';
  sp.style.height = (rect.height+pad*2)+'px';
}
function tutPositionCard(rect, card){
  const margin = 16;
  const vw = window.innerWidth, vh = window.innerHeight;
  if(!rect || (rect.width===0 && rect.height===0)){
    card.classList.add('centered');
    card.style.left = ''; card.style.top = '';
    return;
  }
  card.classList.remove('centered');
  const cw = card.offsetWidth, ch = card.offsetHeight;
  const spaceBelow = vh - rect.bottom, spaceAbove = rect.top;
  let top = (spaceBelow >= ch+margin || spaceBelow >= spaceAbove) ? rect.bottom + margin : rect.top - ch - margin;
  top = Math.max(margin, Math.min(top, vh - ch - margin));
  let left = Math.max(margin, Math.min(rect.left, vw - cw - margin));
  card.style.top = top+'px';
  card.style.left = left+'px';
}
function tutRenderText(step){
  const titleEl = document.getElementById('tutorialTitle');

  bodyEl.textContent = LANG==='es' ? step.body.es : step.body.en;

  const backBtn = document.getElementById('tutorialBackBtn');

  backBtn.dataset.es = 'Atrás'; backBtn.dataset.en = 'Back';
  backBtn.textContent = L('Atrás','Back');

  const isLast = tutIdx === tutSteps.length-1;

    tutRenderText(step);
    tutPositionCard(rect, document.getElementById('tutorialCard'));
  }));
}

/* body.on-lamina-a gates the hzCenter zone + #groupMenu (see CSS) so the row/column menu only
   exists while Lámina A is actually the visible slide — the slides are all stacked in the DOM
   at once (scroll-snap), so without this the hover zone would show over every slide. */
/* Tracks the last slide auto-fit actually ran for, so scrolling within the SAME slide (scroll-
   snap fires this on every tick while it settles) doesn't re-trigger the binary search on every
   frame — only an actual slide CHANGE does. Reset to null on every enterDeck() (not just left as
   a bare slide id) since the same id ('a') means a different deck's Lámina A the next time a deck
   is entered, and that's genuinely different content needing its own fresh fit. */
let lastAutoFitId = null;
function updateOnLaminaA(){
  const scroller = document.getElementById('scroller');
  const idx = Math.round(scroller.scrollTop / window.innerHeight);
  document.body.classList.toggle('on-lamina-a', SLIDES[idx] && SLIDES[idx].id==='a');
  document.body.classList.toggle('on-lamina-daily', SLIDES[idx] && SLIDES[idx].id==='daily');
  document.body.classList.toggle('on-lamina-yoy', SLIDES[idx] && SLIDES[idx].id==='yoy');
  // "Semana WOW" láminas (Plantilla PPT Laminas.xlsx, Fase 1, 2026-08-24) — same top-center menu
  // slot pattern as a/daily/yoy, just N lámina instances instead of 1; renderGroupMenuWeekWow()
  // itself figures out WHICH instance from SLIDES[idx].id.
  document.body.classList.toggle('on-lamina-weekwow', SLIDES[idx] && WEEK_LAMINA_IDS.has(SLIDES[idx].id));
  updateZoomUi();
  const id = SLIDES[idx] && SLIDES[idx].id;
  if(id !== lastAutoFitId){
    lastAutoFitId = id;
    // Real bug fixed 2026-08-24: renderGroupMenuWeekWow() used to only run once from renderDeck()
    // (before enterDeck() even finishes scrolling to the target slide — scroller.scrollTop is
    // still whatever it was before the rebuild at that point, almost always 0/"cover"), so the
    // menu permanently showed the FIRST week-lámina of the deck no matter which one was actually
    // on screen. Re-render it here too, gated the same "only when the active slide id actually
    // changed" way autofit already is — this fires on every real slide change (including the
    // scroll enterDeck() itself triggers), not on every raw scroll pixel.
    renderGroupMenuWeekWow();
    if(ZOOMABLE_SLIDES[id]){
      /* Explicit, not left to applyAutoFit's own internal refresh() call to trigger this
         transitively — that indirect path turned out to not reliably fire fitHeroDeltas for
         every deck when switching decks in quick succession (found via a full-deck sweep, not
         the single-deck spot-checks that had looked clean). Direct call removes the ambiguity. */
      fitHeroDeltas(id);
      applyAutoFit(id);
    }
  }
}

/* ---------------- KEYBOARD NAV ---------------- */
document.addEventListener('keydown', (e)=>{
  const scroller = document.getElementById('scroller');
  if(!document.getElementById('deck').classList.contains('show')) return;
  const slides = [...document.querySelectorAll('.slide')];
  const idx = Math.round(scroller.scrollTop / window.innerHeight);
  if(e.key==='ArrowDown'||e.key==='PageDown'){ e.preventDefault(); slides[Math.min(idx+1,slides.length-1)]?.scrollIntoView({behavior:'smooth'}); }
  if(e.key==='ArrowUp'||e.key==='PageUp'){ e.preventDefault(); slides[Math.max(idx-1,0)]?.scrollIntoView({behavior:'smooth'}); }
  /* Escape only closes an open modal (native <dialog> behavior already does this
     and fires 'close', which openModal() cleans up) — it must never navigate home. */
});

/* ---------------- MODAL ---------------- */
function openModal(sizeClass, html, afterMount){
  const tpl = document.getElementById('modalTpl').content.cloneNode(true);
  const dlg = tpl.querySelector('dialog');
  if(sizeClass) dlg.classList.add(sizeClass);
  dlg.querySelector('.modal-body').innerHTML = html;
  dlg.querySelector('.modal-close').addEventListener('click', ()=>{ dlg.close(); dlg.remove(); });
  dlg.addEventListener('click', (e)=>{ if(e.target===dlg){ dlg.close(); dlg.remove(); } });
  dlg.addEventListener('close', ()=> dlg.remove()); // native Escape-close on <dialog> fires this — clean it up
  document.body.appendChild(dlg);
  dlg.showModal();
  if(afterMount) afterMount(dlg);
}
/* Shared channel-grouping metadata for Lámina A — one source of truth for the
   slide cards and their modals. MCP ChannelGrouping name -> Excel budget name:
   "Brand TV Channels"="Branded Channels", "Paid social ASC only"="ASC",
   "Paid social without ASC"="Paid Social", "Social Organic"/"Google Channels"/
   "Others" match verbatim. */
function budgetFor(key){
  return {
    branded: DATA.budget.branded.total, paidSocialASC: DATA.budget.asc,
    paidSocialNoASC: DATA.budget.paidSocial, paidSocialPlusOrganic: DATA.budget.paidSocialPlusOrganic,
    google: DATA.budget.google, others: DATA.budget.others, blended: DATA.budget.blended,
  }[key];
}
/* Tabbed channel modal: one tab per metric (Spend/Leads/Sales/NewCash/CPL/CMPS/MNCC),
   each showing one big Actual-vs-Budget trend chart Jan→current month. Tab switching is
   wired by wireModalTabs() after the dialog mounts (see openModal's afterMount param). */
function channelDetailModal(key, label, iconName, accent){
  const coreTabs = METRIC_TABS.map(t=>`<button class="mtab" data-tab="${t.key}"${t.group?` data-group="${t.group}"`:''}>${t.label}</button>`);
  /* Brand TV Channels ONLY: an extra tab (right after Spend) breaking that channel's spend into
     SEM-Brand vs. Media (Offline/TV) — the two always sum to 100%, and the point is to watch
     whether that mix shifts month to month (more bidding pressure on SEM-Brand, etc.). This
     only makes sense for Branded (that's the only channel with a real SEM-Brand/Offline split
     in the budget), so it's inserted conditionally, not part of the shared METRIC_TABS list. */
  if(key==='branded') coreTabs.splice(1, 0, `<button class="mtab" data-tab="SpendMix" data-group="money">${L('Distribución Spend','Spend Distribution')}</button>`);

/* Branded-only tab: what % of Brand TV Channels spend is SEM-Brand vs. Media (Offline/TV),
   month by month — reuses bigChart() by treating SEM-Brand% as the "actual" line and
   Offline% as the "budget" (dashed) line purely for the two-line visual, even though neither
   is really a budget here; legend/sidebar labels are relabeled accordingly. sidebarHtml-style
   split (spendMixSidebarHtml + renderSpendMixTab) so click-to-pin can refresh just the sidebar
   for a clicked month, same as every other tab — it didn't before (onSelect was never wired),
   which is why the cards always showed July regardless of which month you clicked. */
function spendMixSidebarHtml(idx){
  const series = DATA.spendMixBranded;
  const m = series[idx];
  const isCurrent = idx === series.length-1;
  const mediaWord = L('Media (Offline/TV)','Media (Offline/TV)');
  const semLabel = isCurrent ? 'SEM-Brand' : `SEM-Brand — ${m.label}`;
  const mediaLabel = isCurrent ? mediaWord : `${mediaWord} — ${m.label}`;
  const totalLabel = isCurrent ? L('Spend total del mes','Total spend that month') : `${L('Spend total','Total spend')} — ${m.label}`;
  return `<div class="mtc-stat">${iconChip('search','var(--brand-accent)', false, true)}<div><div class="label">${semLabel}</div><div class="value">${fmtPct(m.SemBrandPct)}</div></div></div>

    <div class="mtc-stat">${iconChip('wallet','var(--text-secondary)', false, true)}<div><div class="label">${totalLabel}</div><div class="value" style="font-size:var(--text-lg)">${fmtUSD(m.SemBrand+m.Offline)}</div></div></div>`;
}
function renderSpendMixTab(label){
  const series = DATA.spendMixBranded;
  const semWithV = series.map(m=>({...m, __v:m.SemBrandPct}));
  const offWithV = series.map(m=>({...m, __v:m.OfflinePct}));
  return `<div class="mtc-chart-col">
      <div class="mtc-chart-title">
        <div class="ct-main">${label} — ${L('Distribución de Spend: SEM-Brand vs. Media','Spend Distribution: SEM-Brand vs. Media')}</div>
        <div class="ct-sub">${chartContextLine()}</div>
      </div>
      <div class="big-chart-wrap">${bigChart(semWithV, offWithV, fmtPct, 'var(--brand-accent)')}<div class="chart-tooltip"></div></div>
      <div class="chart-legend-lg">
        <span class="lg-actual"><i style="border-color:var(--brand-accent)"></i>SEM-Brand</span>
        <span class="lg-budget"><i style="border-color:var(--chart-budget-line)"></i>${L('Media (Offline/TV)','Media (Offline/TV)')}</span>
      </div>

}

/* Semaphore legend, footer-center — small/subtle by explicit ask, reminds the reader what the

   the meta/logo 1fr columns on either side.
   SIMPLIFIED 2026-08 along with mnccTemperatureCell() itself: only 2 states now (no yellow
   tier) — green when actual %MNCC is at or above the comparison %MNCC, red when below. */
function semaphoreLegendHtml(isYoy){
  // Label/unit simplified 2026-08-18 along with netImpactTemperatureCell() itself — the YoY

/* Builds the <option> list for the cover's month selector, bounded by whatever history the
   loaded raw rows actually cover (getAvailableDateRange(), from viewBuilder.js) rather than a
   hardcoded "since Jan 2025" -- so this keeps working unmodified as the daily refresh (Phase 3)
   extends the real history further back or forward. Newest month first (matches a typical
   dropdown-of-recent-periods UX). */
function monthOptionsHtml(selectedMonth){
  const { min, max } = getAvailableDateRange();
  const [minY, minM] = min.split('-').map(Number);
  const [maxY, maxM] = max.split('-').map(Number);
  const opts = [];
  let y = maxY, m = maxM;
  while (y > minY || (y === minY && m >= minM)) {
    const val = `${y}-${String(m).padStart(2,'0')}`;
    opts.push(`<option value="${val}"${val===selectedMonth?' selected':''}>${L(MONTHS_ES[m-1],MONTHS_EN[m-1])} ${y}</option>`);
    m--; if (m === 0) { m = 12; y--; }
  }
  return opts.join('');
}

/* Fired when the cover's month selector changes: rebuilds DATA_BY_DECK for every deck at the new
   cutoff (reusing the already-fetched raw rows -- no re-fetch, see rebuildDataByDeck() in
   viewBuilder.js) and re-renders. Mirrors enterDeck()'s own filter-reset sequence so switching
   month doesn't leave a stale Marketing-Org/Brazil-merge filter applied from the PREVIOUS month's
   view. If the picked month is the currently-open (not yet finished) month, the cutoff is clamped
   to the latest date any data actually covers, instead of that month's calendar-end date. */
function onMonthChange(value){
  const [y, m] = value.split('-').map(Number);
  const { max } = getAvailableDateRange();
  const lastDay = new Date(y, m, 0).getDate();
  let cutoff = `${y}-${String(m).padStart(2,'0')}-${String(lastDay).padStart(2,'0')}`;
  if (cutoff > max) cutoff = max;
  DATA_BY_DECK = rebuildDataByDeck(cutoff);
  DATA = DATA_BY_DECK[DECK_ID];
  marketingOrgFilter = 'total'; applyMarketingOrgFilter();
  yoyMktOrgFilter = {oe:true, junior:true};
  includeBrazil = true; applyBrazilMerge();
  buildDeck();
}

function wireMonthSelector(){
  document.getElementById('monthSelect')?.addEventListener('change', e => onMonthChange(e.target.value));
}

/* Section-divider ("tapa") slide for the "Semana WOW" láminas — Plantilla PPT Laminas.xlsx, Fase 1

/* Column definitions for the channel-table (name column is always first, implicit) — EVERY
   column here is independently toggleable via the groupMenu "Columnas" list, driven by
   laminaAView.cols[key]. `group` drives the divider hairlines: a column gets a divider when
   its group differs from the previous VISIBLE column's group — computed fresh each render so
   hiding a column never leaves an orphaned divider or a missing one. */
const COL_DEFS = [
  {key:'Spend', group:'spend', weight:.8},
  {key:'SpendShare', group:'spend', weight:.7},
  {key:'Leads', group:'leads', weight:.6},
  {key:'LeadsShare', group:'leads', weight:.7},
  {key:'CPL', group:'leads', weight:.7},
  /* Conversion's weight was .7 (same as the other "leads" columns) but its hero tile stacks a
     3-line comparison (actual / prior-period / ±pp delta) that doesn't reliably fit at that
     share — found by tracing WHY YoY's auto-fit shrinks the whole slide more than Daily
     Tracker's some months: both slides' Conversion hero tile were already overflowing at
     zoom=1 (a pre-existing, universal tightness, not a YoY-only defect), just needing slightly
     more `fitHeroDeltas()` text-shrink to hide it in Daily Tracker's specific numbers that
     month. Verified across all 4 decks × Lámina A/Daily Tracker/YoY before landing on .8 (not
     .9, which measured better for 3 decks but regressed JR-LATAM's YoY auto-fit). */
  {key:'Conversion', group:'leads', weight:.8},
  {key:'Sales', group:'sales', weight:.6},
  {key:'SalesShare', group:'sales', weight:.7},
  {key:'CMPS', group:'sales', weight:.7},
  {key:'AvgPrice', group:'sales', weight:.75},
  {key:'NewCash', group:'cash', weight:.95, highlight:true},
  {key:'MarginPct', group:'cash', weight:.8},
  {key:'LtvShort', group:'cash', weight:.8},
  {key:'FullUnitCmShort', group:'cash', weight:.85, highlight:true},
  {key:'FullCmPctShort', group:'cash', weight:.85, highlight:true},
  /* Impact + NewCashSemaphore are the last 2 columns, in that order, everywhere they appear
     (Daily Tracker, YoY, Lámina A) — explicit ask 2026-08-18, corrected same day: "Net Impact
     Temperature es a la derecha de Net Impact" (Net Impact Temperature — the semaphore — reads as
     the color-coded interpretation of the Net Impact number right before it, not the other way
     around; an earlier reading of the same request had these swapped). Own `group` (not 'cash')
     so this pair also gets its own divider line, visually setting it apart as "the number + its
     semaphore", not just one more cash-family metric. */
  {key:'Impact', group:'semaphore', weight:.85, highlight:true},
  {key:'NewCashSemaphore', group:'semaphore', weight:.9},
];
/* Hero only ever shows the subset of COL_DEFS that make sense at company-total level (no
   %Leads/%Sales — those are a per-channel SHARE of the blended total, meaningless for Blended
   itself) — still driven by the same laminaAView.cols flags, so hiding CMPS hides it in both
   places at once. */
const HERO_COL_DEFS = COL_DEFS.filter(c=> c.key!=='LeadsShare' && c.key!=='SalesShare' && c.key!=='SpendShare');
/* YoY-exclusive extra metrics (Media Spend, Media CPL, Paid Social+Organic spend) — explicit
   ask, 2026-08. Deliberately NOT added to the shared COL_DEFS: that array also feeds Lámina A's
   and Daily Tracker's own Vista menus (renderGroupMenu()/renderGroupMenuDaily() both do the same
   COL_DEFS.map() pattern renderGroupMenuYoy() does below) — those laminas have no YoY comparison
   basis to compute any of these three from, so they must never appear as togglable there.
   Table-only (never added to HERO_COL_DEFS/heroColsYoy) — the user asked for these as columns,
   never mentioned the hero tiles, and hero is a blended/company-total view where "per-country"
   metrics like these read oddly anyway. Built by splicing into a COPY of COL_DEFS at the exact
   requested positions (Media Spend right after Spend, Media CPL right after CPL/before
   Conversion, Paid+Organic spend at the very end) rather than hand-duplicating the whole array,
   so a future edit to COL_DEFS's own entries/order doesn't need a second copy kept in sync by
   hand. */
const YOY_COL_DEFS = (function(){
  const list = COL_DEFS.slice();
  const insertAfter = (key, entry) => list.splice(list.findIndex(c=>c.key===key)+1, 0, entry);
  insertAfter('Spend', {key:'MediaSpend', group:'spend', weight:.8});
  insertAfter('CPL', {key:'MediaCPL', group:'leads', weight:.7});
  list.push({key:'PaidOrganicSpend', group:'spend', weight:.8});
  return list;
})();
/* Row definitions for the channel-table — every row independently toggleable via the groupMenu
   "Filas" list, driven by laminaAView.rows[key]. "Grouped" (the default) is simply
   paidSocialASC/paidSocialNoASC both off, showing only the combined "Paid Social + Organic"
   row; unchecking either reveals that breakdown row on its own, same as any other row. */
const ROW_DEFS = [
  {key:'branded', icon:'broadcast', esLabel:'Brand TV Channels', enLabel:'Brand TV Channels', accent:'var(--brand-accent)', featured:true},
  {key:'paidSocialPlusOrganic', icon:'social', esLabel:'Paid Social + Organic', enLabel:'Paid Social + Organic', accent:'var(--color-oe-aqua)'},
  {key:'paidSocialASC', icon:'social', esLabel:'Paid Social — con ASC', enLabel:'Paid Social — with ASC', accent:'var(--color-oe-aqua)', indent:true},
  {key:'paidSocialNoASC', icon:'social', esLabel:'Paid Social — sin ASC', enLabel:'Paid Social — no-ASC', accent:'var(--color-oe-aqua)', indent:true},
  {key:'google', icon:'search', esLabel:'Google Channels', enLabel:'Google Channels', accent:'var(--color-sunny-orange)'},
  {key:'others', icon:'grid', esLabel:'Others', enLabel:'Others', accent:'var(--color-happy-pink)'},
];
function colLabel(key){
  return {
    Spend:'Spend', SpendShare:'% Spend', Leads:'Leads', LeadsShare:L('% Leads','Leads %'),
    Sales:L('Ventas','Sales'), SalesShare:L('% Ventas','Sales %'), CPL:'CPL', Conversion:L('Conversión','Conversion'), CMPS:'CMPS',
    AvgPrice:L('Precio Prom.','Avg Price'),
    MarginPct:'% MNCC', NewCash:'New Cash Core', NewCashSemaphore:'% MNCC Temperature', Impact:'Net Impact',
    LtvShort:'LTV Short', FullUnitCmShort:'Unit CM Short', FullCmPctShort:'CM % Short',
  }[key];
}
/* YoY-only label override — same "thin wrapper, not a colLabel() param" pattern as
   yoyMetricCell(): "Impact"/"Impacto" reads as "Net Impact" ONLY in the YoY table header,
   explicit ask, 2026-08 ("ajústale el nombre a Net Impact") — Lámina A/Daily Tracker keep the
   original label, colLabel() itself is untouched. */
function colLabelYoy(key){
  // 'Impact' special-case removed 2026-08 — colLabel() itself now says 'Net Impact' everywhere.
  const yoyOnly = {MediaSpend:'Media Spend', MediaCPL:'Media CPL', PaidOrganicSpend:L('Paid Social + Organic','Paid Social + Organic'),
    NewCashSemaphore:L('Net Impact Temperature','Net Impact Temperature')};
  return yoyOnly[key] || colLabel(key);
}
function visibleCols(defs){ return defs.filter(c=> laminaAView.cols[c.key]); }
function colDividerCls(list, i){ return (i>0 && list[i].group!==list[i-1].group) ? ' col-divider' : ''; }

function slideA(){
  const bl = DATA.actuals.blended.total, blB = DATA.budget.blended;
  const branded = DATA.actuals.branded.total, brandedB = DATA.budget.branded.total;
  const psPlusOrg = DATA.actuals.paidSocialPlusOrganic.total, psPlusOrgB = DATA.budget.paidSocialPlusOrganic;
  const asc = DATA.actuals.paidSocialASC.total, ascB = DATA.budget.asc;
  const noAsc = DATA.actuals.paidSocialNoASC.total, noAscB = DATA.budget.paidSocial;
  const google = DATA.actuals.google.total, googleB = DATA.budget.google;
  const others = DATA.actuals.others.total, othersB = DATA.budget.others;
  const totalSales = bl.Sales;

  const heroCols = visibleCols(HERO_COL_DEFS);
  const chCols = visibleCols(COL_DEFS);
  const chGridTemplate = `1.25fr ${chCols.map(c=>c.weight+'fr').join(' ')}`;

  function heroCell(key){
    switch(key){
      case 'Spend': return {icon:'wallet', label:'Spend', av:bl.Spend, bv:blB.Spend, fmt:fmtUSD, invert:true, pp:false};
      case 'Leads': return {icon:'gauge', label:'Leads', av:bl.Leads, bv:blB.Leads, fmt:fmtNum, invert:false, pp:false};
      case 'Sales': return {icon:'tag', label:L('Ventas','Sales'), av:bl.Sales, bv:blB.Sales, fmt:fmtNum, invert:false, pp:false};
      case 'CPL': return {icon:'gauge', label:'CPL', av:cpl(bl), bv:cpl(blB), fmt:fmtUSD, invert:true, pp:false};
      case 'Conversion': return {icon:'trend', label:L('Conversión','Conversion'), av:conversionRate(bl), bv:conversionRate(blB), fmt:fmtPctConversion, invert:false, pp:true};
      case 'CMPS': return {icon:'tag', label:'CMPS', av:cmps(bl), bv:cmps(blB), fmt:fmtUSD, invert:true, pp:false};
      case 'AvgPrice': return {icon:'tag', label:L('Precio Prom.','Avg Price'), av:avgPrice(bl), bv:avgPrice(blB), fmt:fmtUSD, invert:false, pp:false};
      case 'MarginPct': return {icon:'trend', label:'% MNCC', av:mncc(bl), bv:mncc(blB), fmt:fmtPct, invert:false, pp:true};
      case 'NewCash': return {icon:'wallet', label:'New Cash Core', av:bl.NewCash, bv:blB.NewCash, fmt:fmtUSD, invert:false, pp:false, highlight:true};
      case 'Impact': return {icon:'spark', label:'Net Impact', av:impact(bl,blB), fmt:fmtUSD, muted:true, highlight:true};
      case 'LtvShort': return {icon:'tag', label:'LTV Short', av:ltvShort(bl), fmt:fmtUSD, muted:true};
      case 'FullUnitCmShort': return {icon:'tag', label:'Unit CM Short', av:fullUnitCmShort(bl), fmt:fmtUSD, muted:true, highlight:true};
      case 'FullCmPctShort': return {icon:'trend', label:'CM % Short', av:fullCmPct(bl), fmt:fmtPct, muted:true, highlight:true};
      case 'NewCashSemaphore': return {icon:'trend', label:L('% MNCC Temperature','% MNCC Temperature'), av:mncc(bl), bv:mncc(blB), semaphore:true};
    }
  }
  const monthComplete = monthIsComplete();
  /* Centralizes the ONE number every pacing cell repeated ("vs XX% del mes") — day/days is the
     same fraction for every pacing metric, so it's shown once here instead of on every cell (see
     pacingCell()'s own comment for why it was dropped there). Only meaningful while the month is
     still open; once it closes there's no pacing anywhere so the chip just doesn't render. */
  const targetPacingChip = monthComplete ? '' : (function(){
    const day = DATA.meta.asOfDay, days = DATA.meta.daysInMonth;
    const pct = Math.round(day/days*100);
    return `<span class="target-pacing-chip"><span>${L('Pacing objetivo','Target pacing')}</span><b>${pct}%</b><span>${L(`día ${day} de ${days}`,`day ${day} of ${days}`)}</span></span>`;
  })();
  const bhKpis = heroCols.map(c=>{
    const h = heroCell(c.key);
    // 'Impact'/Net Impact joins FullCmPctShort in getting sign-based (pos/neg) coloring — its own
    // 0-pivot genuinely means something (see impact()'s new formula), unlike LtvShort/UnitCmShort.
    const cell = h.semaphore
      ? mnccTemperatureCell(h.av, h.bv)
      : h.muted
        ? `<div class="metric-cell muted"><div class="mc-actual${(c.key==='FullCmPctShort'||c.key==='Impact')?' '+mcPctSignClass(h.av):''}">${h.fmt(h.av)}</div></div>`
        : (!monthComplete && isPacingMetric(c.key))
          ? pacingCell(h.av, h.bv, h.fmt, c.key!=='Spend', isSpendNeutralMetric(c.key))
          // Month complete + a pacing metric: pacing itself no longer means anything (100% is a
          // given at month-end) -- explicit ask, 2026-08-14: plain % diff, same single-line
          // format YoY uses (metricCell with no splitDelta), not Lámina A's own usual 2-line
          // split (laminaAMetricCell) which every OTHER metric here keeps unconditionally.
          : monthComplete && isPacingMetric(c.key)
            ? metricCell(h.av, h.bv, h.fmt, h.invert, h.pp, null, null, false, isSpendNeutralMetric(c.key))
            : laminaAMetricCell(h.av,h.bv,h.fmt,h.invert,h.pp);
    return `<div class="bh-kpi${h.highlight?' highlight':''}${h.muted||h.semaphore?' muted':''}" data-metric="${c.key}"><div><div class="label">${h.label}</div>${cell}</div></div>`;
  }).join('');

  function chCellHtml(key, a, b){
    switch(key){
      case 'Spend': return monthComplete ? metricCell(a.Spend, b.Spend, fmtUSD, true, false, null, null, false, true) : pacingCell(a.Spend, b.Spend, fmtUSD, false, true);
      case 'SpendShare': { const s = bl.Spend ? a.Spend/bl.Spend : null; return `<div class="metric-cell muted"><div class="mc-actual">${fmtPct(s)}</div></div>`; }
      case 'Leads': return monthComplete ? metricCell(a.Leads, b.Leads, fmtNum, false, false) : pacingCell(a.Leads, b.Leads, fmtNum, true);
      case 'Sales': return monthComplete ? metricCell(a.Sales, b.Sales, fmtNum, false, false) : pacingCell(a.Sales, b.Sales, fmtNum, true);
      case 'LeadsShare': { const s = bl.Leads ? a.Leads/bl.Leads : null; return `<div class="metric-cell muted"><div class="mc-actual">${fmtPct(s)}</div></div>`; }
      case 'SalesShare': { const s = totalSales ? a.Sales/totalSales : null; return `<div class="metric-cell muted"><div class="mc-actual">${fmtPct(s)}</div></div>`; }
      case 'CPL': return laminaAMetricCell(cpl(a), cpl(b), fmtUSD, true, false);
      case 'Conversion': return laminaAMetricCell(conversionRate(a), conversionRate(b), fmtPctConversion, false, true);
      case 'CMPS': return laminaAMetricCell(cmps(a), cmps(b), fmtUSD, true, false);
      case 'AvgPrice': return laminaAMetricCell(avgPrice(a), avgPrice(b), fmtUSD, false, false);
      case 'MarginPct': return laminaAMetricCell(mncc(a), mncc(b), fmtPct, false, true);
      case 'NewCash': return monthComplete ? metricCell(a.NewCash, b.NewCash, fmtUSD, false, false) : pacingCell(a.NewCash, b.NewCash, fmtUSD, true);
      case 'NewCashSemaphore': return mnccTemperatureCell(mncc(a), mncc(b));
      case 'Impact': { const v = impact(a,b); return `<div class="metric-cell muted"><div class="mc-actual ${mcPctSignClass(v)}">${fmtUSD(v)}</div></div>`; }
      case 'LtvShort': return `<div class="metric-cell muted"><div class="mc-actual">${fmtUSD(ltvShort(a))}</div></div>`;
      case 'FullUnitCmShort': return `<div class="metric-cell muted"><div class="mc-actual">${fmtUSD(fullUnitCmShort(a))}</div></div>`;
      case 'FullCmPctShort': { const v = fullCmPct(a); return `<div class="metric-cell muted"><div class="mc-actual ${mcPctSignClass(v)}">${fmtPct(v)}</div></div>`; }
    }

  /* One row shape for every channel grouping — Brand TV Channels only differs via
     the .featured modifier, never a different structure, so the visible columns stay

     Others must each sum to ~100%). Net Impact = diff of New Cash Core minus diff of Spend,

     hardcoded here, so grouping/hiding a column can't drift out of sync with the header. */
  function chRow(key, iconName, label, a, b, accent, opts){

      `<div class="metric-col${c.highlight?' highlight':''}${colDividerCls(chCols,i)}" data-metric="${c.key}">${chCellHtml(c.key,a,b)}</div>`

  const rows = ROW_DEFS.filter(r=> laminaAView.rows[r.key]).map(r=>{

  const deckLabel = `${currentDeck().brand} · ${regionLabel()}`;

  return `<section class="slide slide-a${laminaAValueVis.hideActual?' hide-actual-value':''}${laminaAValueVis.hideBudget?' hide-budget-value':''}" style="--slide-zoom:${getZoom('a')}"><div class="slide-inner">
    ${headerBlock('s-a', reportTitle(), reportTitle(),
      `${deckLabel} · Blended y Channel Groupings · ${dr.es}`,

      <div class="channel-table">

/* Daily Tracker por País — OE Adult only (Brand TV Channels), OE-LATAM (8 country rows: TOP8,
   the same bucketing as actuals.branded.byCountry) and OE-BR (Brazil, hero-only — a single row
   would just repeat the hero's own numbers, so no detail table is rendered for Brazil at all).
   Every column is a DIRECT variance (metricCell, never pacingCell) because the budget side is
   already summed only through the same cutoff day as the actual (see add_daily_tracker_by_country
   in build_data_all.py) — unlike Lámina A's full-month budget, there's no unfairness to correct
   for here. Reuses Lámina A's exact COL_DEFS/HERO_COL_DEFS/colLabel/cpl/cmps/mncc/ltvShort/
   fullUnitCmShort/fullCmPct/impact/metricCell/iconChip/flagIcon — only the column VISIBILITY
   state (dailyTrackerCols) and the row dimension (country, not channel grouping) are new. Rows
   aren't clickable into a modal — there's no Jan-Jul per-country trend data to show one. */
// MediaSpend/PaidOrganicSpend included so the YoY lamina's "LATAM excl MX&AR" subtotal row (the
// only place that sums per-country objects via this list, besides the hero which never renders
// these 2 columns) adds them up correctly instead of silently dropping them to 0/undefined.
const DAILY_TRACKER_FIELDS = ['Spend','Leads','Sales','NewCash','FullCM','ProjRevShort','TotalEnrollments','MediaSpend','PaidOrganicSpend'];
function sumDailyTrackerFields(objs, fields){
  const out = {};
  for(const f of fields) out[f] = objs.reduce((s,o)=> s + (o[f]||0), 0);
  return out;
}
/* México/Argentina lead (the two largest LatAm markets), then the rest, with Costa Rica always
   last and visually de-emphasized (see .ch-row.deemphasized) — it has $0 Daily Tracker budget
   every day this month (a real, confirmed data characteristic, not a bug: see build_data_all.py's
   add_daily_tracker_by_country), so its "variance" isn't a meaningful comparison the way the
   other countries' is. A DIFFERENT order from TOP8 (which stays alphabetical-ish for Lámina B/
   byCountry bucketing) — deliberately scoped to just this lámina. */
const DAILY_TRACKER_ROW_ORDER = ["Mexico","Argentina","Colombia","Chile","Ecuador","Peru","Costa Rica","Other"];
/* México and Argentina are the 2 largest LatAm markets by a wide margin — the other 6 countries
   are each individually small, so a "LATAM excl. México y Argentina" subtotal row (summing
   exactly those 6) is inserted between Argentina and Colombia, letting the reader see "the rest
   of the region" as one number before drilling into its own 6-country breakdown below (visually
   separated by a thin rule, see .ch-row.subtotal-row). Only affects the ROW table's rendering
   order — hero/YoY-hero totals keep summing DAILY_TRACKER_ROW_ORDER's real 8 countries directly,
   never this pseudo-key, so nothing here risks double-counting the total. */
const REST_LATAM_SUBTOTAL_KEY = '__RestLatamExclMxAr__';
const REST_LATAM_SUBTOTAL_COUNTRIES = ["Colombia","Chile","Ecuador","Peru","Costa Rica","Other"];
const DAILY_TRACKER_ROW_ORDER_DISPLAY = ["Mexico","Argentina",REST_LATAM_SUBTOTAL_KEY,...REST_LATAM_SUBTOTAL_COUNTRIES];
function slideDaily(){
  const isBrazil = currentDeck().region === 'Brazil';
  /* "Agregar Brasil" (OE-LATAM only, see applyBrazilMerge()) — Brazil joins as one more country
     row, sourced straight from DATA_BY_DECK['OE-BR'] (its own branded total for actual, its own
     dailyTrackerBudget.Brazil for budget — same fields this lamina already reads for every real
     LatAm country, just from the other deck's copy of them, since 'Brazil' is never a real key
     in DATA.actuals.branded.byCountry/dailyTrackerBudget for the LatAm deck itself). */
  const showMergedBrazil = !isBrazil && DECK_ID==='OE-LATAM' && includeBrazil;
  const countries = isBrazil ? ['Brazil'] : (showMergedBrazil ? [...DAILY_TRACKER_ROW_ORDER, 'Brazil'] : DAILY_TRACKER_ROW_ORDER);
  const emptyActual = {Spend:0,Leads:0,Sales:0,NewCash:0,FullCM:0,ProjRevShort:0,TotalEnrollments:0};
  const emptyBudget = {Spend:0,Leads:0,Sales:0,NewCash:0};
  // Custom date range (explicit ask 2026-08-18, redesigned same day) — re-aggregates the SAME raw
  // per-day rows the MTD numbers above already come from, just over whatever date Set is active
  // instead of the fixed month-to-date window. See dailyTrackerRangeActuals/Budget's own comment
  // for why no new backend/export work was needed for this.
  const rangeActive = dailyCustomRangeActive();
  const activeDateSet = rangeActive ? dailyIncludedDateSet() : null;
  const rangeActuals = rangeActive ? dailyTrackerRangeActuals(DECK_ID, activeDateSet) : null;
  const rangeBudget = rangeActive ? dailyTrackerRangeBudget(DECK_ID, activeDateSet) : null;
  const rangeActualsBR = (rangeActive && showMergedBrazil) ? dailyTrackerRangeActuals('OE-BR', activeDateSet) : null;
  const rangeBudgetBR = (rangeActive && showMergedBrazil) ? dailyTrackerRangeBudget('OE-BR', activeDateSet) : null;
  const actualFor = c => {
    if(isBrazil) return rangeActive ? (rangeActuals['Brazil']||emptyActual) : DATA.actuals.branded.total;
    if(c==='Brazil') return rangeActive ? (rangeActualsBR['Brazil']||emptyActual) : DATA_BY_DECK['OE-BR'].actuals.branded.total;
    if(rangeActive) return rangeActuals[c] || emptyActual;
    return DATA.actuals.branded.byCountry[c] || emptyActual;
  };
  const budgetFor = c => {
    if(c==='Brazil' && !isBrazil) return rangeActive ? (rangeBudgetBR['Brazil']||emptyBudget) : (DATA_BY_DECK['OE-BR'].dailyTrackerBudget.Brazil || emptyBudget);
    if(rangeActive) return rangeBudget[c] || emptyBudget;
    return DATA.dailyTrackerBudget[c] || emptyBudget;
  };

  const heroActual = isBrazil ? actualFor('Brazil') : sumDailyTrackerFields(countries.map(actualFor), DAILY_TRACKER_FIELDS);
  const heroBudget = isBrazil ? budgetFor('Brazil') : sumDailyTrackerFields(countries.map(budgetFor), ['Spend','Leads','Sales','NewCash']);

  const heroColsDaily = HERO_COL_DEFS.filter(c=> dailyTrackerCols[c.key]);
  const dCols = COL_DEFS.filter(c=> dailyTrackerCols[c.key]);
  const dGridTemplate = `1.25fr ${dCols.map(c=>c.weight+'fr').join(' ')}`;

  function dailyCellHtml(key, a, b, country){

      case 'Spend': return metricCell(a.Spend, b.Spend, fmtUSD, true, false, null, null, false, true);
      case 'SpendShare': { const s = heroActual.Spend ? a.Spend/heroActual.Spend : null; return `<div class="metric-cell muted"><div class="mc-actual">${fmtPct(s)}</div></div>`; }
      case 'Leads': return metricCell(a.Leads, b.Leads, fmtNum, false, false);
      case 'Sales': return metricCell(a.Sales, b.Sales, fmtNum, false, false);
      case 'LeadsShare': { const s = heroActual.Leads ? a.Leads/heroActual.Leads : null; return `<div class="metric-cell muted"><div class="mc-actual">${fmtPct(s)}</div></div>`; }
      case 'SalesShare': { const s = heroActual.Sales ? a.Sales/heroActual.Sales : null; return `<div class="metric-cell muted"><div class="mc-actual">${fmtPct(s)}</div></div>`; }
      case 'CPL': return metricCell(cpl(a), cpl(b), fmtUSD, true, false);
      case 'Conversion': return metricCell(conversionRate(a), conversionRate(b), fmtPctConversion, false, true);
      case 'CMPS': return metricCell(cmps(a), cmps(b), fmtUSD, true, false);
      case 'AvgPrice': return metricCell(avgPrice(a), avgPrice(b), fmtUSD, false, false);
      case 'MarginPct': return metricCell(mncc(a), mncc(b), fmtPct, false, true);
      case 'NewCash': return metricCell(a.NewCash, b.NewCash, fmtUSD, false, false);
      // Costa Rica forced gray "no signal" in every deck/brand, not just OE Adult (widened
      // 2026-08-17, explicit ask — the original 2026-08-14 ask only said "OE Adult", so Junior kept
      // real color until now; the user has since confirmed the rule applies everywhere, so Junior's
      // real Costa Rica investment is intentionally being suppressed here too, not just OE's thin/
      // unreliable one).
      case 'NewCashSemaphore': return mnccTemperatureCell(mncc(a), mncc(b), country==='Costa Rica');
      case 'Impact': { const v = impact(a,b); return `<div class="metric-cell muted"><div class="mc-actual ${mcPctSignClass(v)}">${fmtUSD(v)}</div></div>`; }
      case 'LtvShort': return `<div class="metric-cell muted"><div class="mc-actual">${fmtUSD(ltvShort(a))}</div></div>`;
      case 'FullUnitCmShort': return `<div class="metric-cell muted"><div class="mc-actual">${fmtUSD(fullUnitCmShort(a))}</div></div>`;
      case 'FullCmPctShort': { const v = fullCmPct(a); return `<div class="metric-cell muted"><div class="mc-actual ${mcPctSignClass(v)}">${fmtPct(v)}</div></div>`; }
    }
  }
  function heroCellDaily(key){

      case 'CPL': return {icon:'gauge', label:'CPL', av:cpl(heroActual), bv:cpl(heroBudget), fmt:fmtUSD, invert:true, pp:false};
      case 'Conversion': return {icon:'trend', label:L('Conversión','Conversion'), av:conversionRate(heroActual), bv:conversionRate(heroBudget), fmt:fmtPctConversion, invert:false, pp:true};
      case 'CMPS': return {icon:'tag', label:'CMPS', av:cmps(heroActual), bv:cmps(heroBudget), fmt:fmtUSD, invert:true, pp:false};
      case 'AvgPrice': return {icon:'tag', label:L('Precio Prom.','Avg Price'), av:avgPrice(heroActual), bv:avgPrice(heroBudget), fmt:fmtUSD, invert:false, pp:false};
      case 'MarginPct': return {icon:'trend', label:'% MNCC', av:mncc(heroActual), bv:mncc(heroBudget), fmt:fmtPct, invert:false, pp:true};
      case 'NewCash': return {icon:'wallet', label:'New Cash Core', av:heroActual.NewCash, bv:heroBudget.NewCash, fmt:fmtUSD, invert:false, pp:false, highlight:true};
      case 'Impact': return {icon:'spark', label:'Net Impact', av:impact(heroActual,heroBudget), fmt:fmtUSD, muted:true, highlight:true};
      case 'LtvShort': return {icon:'tag', label:'LTV Short', av:ltvShort(heroActual), fmt:fmtUSD, muted:true};
      case 'FullUnitCmShort': return {icon:'tag', label:'Unit CM Short', av:fullUnitCmShort(heroActual), fmt:fmtUSD, muted:true, highlight:true};
      case 'FullCmPctShort': return {icon:'trend', label:'CM % Short', av:fullCmPct(heroActual), fmt:fmtPct, muted:true, highlight:true};
      case 'NewCashSemaphore': return {icon:'trend', label:L('% MNCC Temperature','% MNCC Temperature'), av:mncc(heroActual), bv:mncc(heroBudget), semaphore:true};
    }
  }
  const bhKpisDaily = heroColsDaily.map(c=>{
    const h = heroCellDaily(c.key);
    const cell = h.semaphore
      ? mnccTemperatureCell(h.av, h.bv)
      : h.muted ? `<div class="metric-cell muted"><div class="mc-actual${(c.key==='FullCmPctShort'||c.key==='Impact')?' '+mcPctSignClass(h.av):''}">${h.fmt(h.av)}</div></div>` : metricCell(h.av,h.bv,h.fmt,h.invert,h.pp,null,null,false,isSpendNeutralMetric(c.key));
    return `<div class="bh-kpi${h.highlight?' highlight':''}${h.muted||h.semaphore?' muted':''}" data-metric="${c.key}"><div><div class="label">${h.label}</div>${cell}</div></div>`;
  }).join('');
  function countryRow(c){
    const isSubtotal = c === REST_LATAM_SUBTOTAL_KEY;
    const a = isSubtotal ? sumDailyTrackerFields(REST_LATAM_SUBTOTAL_COUNTRIES.map(actualFor), DAILY_TRACKER_FIELDS) : actualFor(c);
    const b = isSubtotal ? sumDailyTrackerFields(REST_LATAM_SUBTOTAL_COUNTRIES.map(budgetFor), ['Spend','Leads','Sales','NewCash']) : budgetFor(c);
    const cells = dCols.map((col,i)=> `<div class="metric-col${col.highlight?' highlight':''}${colDividerCls(dCols,i)}" data-metric="${col.key}">${dailyCellHtml(col.key,a,b,c)}</div>`).join('');
    const label = isSubtotal ? L('LATAM (excl. México y Argentina)','LATAM (excl. Mexico & Argentina)') : (LANG==='es' ? COUNTRY_LABEL_ES[c] : COUNTRY_LABEL_EN[c]);
    const deemphasized = c === 'Costa Rica';
    /* Brazil, when merged in via "Agregar Brasil", is appended after every real LatAm country
       (incl. "Otros LatAm") — a plain top border (same visual language as .subtotal-row's
       divider, just on the opposite edge since Brazil comes AFTER the group it's set apart
       from, not before) makes clear it's a separate country joining the LatAm set, not just
       one more LatAm row. */
    const isMergedBrazil = c === 'Brazil' && showMergedBrazil;
    const nameHtml = isSubtotal
      ? `<div class="ch-name">${iconChip('globe','var(--brand-accent)')}<div class="ch-text"><h4>${label}</h4></div></div>`
      : `<div class="ch-name">${flagIcon(c)}<div class="ch-text"><h4>${label}</h4></div></div>`;
    return `<div class="ch-row no-click${deemphasized?' deemphasized':''}${isSubtotal?' subtotal-row':''}${isMergedBrazil?' merged-brazil-row':''}" style="grid-template-columns:${dGridTemplate}">
      ${nameHtml}
      ${cells}
    </div>`;
  }

  /* Brazil used to get its own card-flow layout here (brazilFlowHtml) — explicit ask this
     session to match LatAm's table format instead, single row. countryRow('Brazil') already
     works unmodified: actualFor('Brazil')/budgetFor('Brazil') already resolve correctly for a
     single-country deck (actualFor falls back to the flat branded total; DATA.dailyTrackerBudget
     already has a "Brazil" key from the same Daily Tracker.xlsx parse LatAm's rows use), and
     flagIcon/COUNTRY_LABEL_ES/EN already have a "Brazil" entry — no new plumbing needed, just
     routing Brazil through the exact same row renderer as every LatAm country. */
  const displayRows = showMergedBrazil ? [...DAILY_TRACKER_ROW_ORDER_DISPLAY, 'Brazil'] : DAILY_TRACKER_ROW_ORDER_DISPLAY;
  const rowsHtml = isBrazil ? countryRow('Brazil') : displayRows.map(countryRow).join('');
  const headerCells = dCols.map((c,i)=>`<div class="metric-col${colDividerCls(dCols,i)}">${colLabel(c.key)}</div>`).join('');
  const heroLabel = L('Brand TV Channels','Brand TV Channels');
  const heroSub = isBrazil

  const deckLabel = `${currentDeck().brand} · ${regionLabel()}`;

  /* Brazil is a single country — its own "country row" table used to just repeat the hero's

     breakdown), which the user flagged as pointless redundancy: "no tiene sentido poner la
     tabla si muestra exactamente la misma información que la tarjeta principal." Hero-only for
     Brazil now; LatAm keeps its table untouched (real per-country breakdown, not a duplicate). */
  const heroBlockHtml = `
      <div class="blended-hero daily-hero no-click">
        <div class="bh-head"><span class="bh-badge">${heroLabel}</span><span class="bh-sub">${heroSub}</span></div>
        <div class="bh-kpis" style="grid-template-columns:${heroColsDaily.map(c=>`minmax(0,${c.weight}fr)`).join(' ')}">${bhKpisDaily}</div>

      <div class="detail-label daily-detail-label">${L('Detalle por país','Detail by country')}</div>

        ${rowsHtml}

  return `<section class="slide slide-daily${isBrazil?' slide-daily-br':''}${dailyValueVis.hideActual?' hide-actual-value':''}${dailyValueVis.hideBudget?' hide-budget-value':''}" style="--slide-zoom:${getZoom('daily')}"><div class="slide-inner">
    ${(() => {
      const rawLink = (label) => `<a class="raw-source-link" href="https://drive.google.com/drive/folders/1OfX-a7mMdtkegYZAJs1T3KvRfy6LkP86" target="_blank" rel="noopener">${label}</a>`;
      // Custom selection active (explicit ask 2026-08-18, redesigned same day into a week
      // multi-select + weekday filter): the selection can be a scattered set of days now, not
      // just one contiguous range, so the subtitle states a day COUNT plus the overall span
      // (fmtYoyRange on the min/max dates actually in the set) rather than trying to spell out
      // every included day.
      let periodEs, periodEn;
      if(rangeActive){
        const sorted = [...activeDateSet].sort();
        const span = sorted.length ? fmtYoyRange({start:sorted[0], end:sorted[sorted.length-1]}) : {es:'—',en:'—'};
        periodEs = `${sorted.length} ${L('días seleccionados','days selected')} (${span.es})`;
        periodEn = `${sorted.length} days selected (${span.en})`;
      }else{
        periodEs = `acumulado al ${dday} de ${MONTHS_ES[dm-1]} de ${dy}`;

      }
      return headerBlock('s-daily', 'MTD Branded KPIs vs Forecast By Country', 'MTD Branded KPIs vs Forecast By Country',
        `${deckLabel} · Actual vs Daily Tracker ${periodEs} · ${rawLink('ver carpeta de origen')}`,
        `${deckLabel} · Actual vs Daily Tracker ${periodEn} · ${rawLink('view source folder')}`);
    })()}
    <div class="slide-body centered-stack${isBrazil?' single-hero':''}">${bodyHtml}
    </div>
  </div>${footerBar(false, {legend:dailyTrackerCols.NewCashSemaphore})}</section>`;
