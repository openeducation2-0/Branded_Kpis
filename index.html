/* ---------------- HOVER-REVEAL (deck only — hidden by default, shows on hovering
   the top edge, hides immediately on mouseleave; Home ignores this entirely
   since its controls are always visible via CSS, not this class). ---------------- */
function wireHoverReveal(zoneEl, ...targets){
  const show = ()=> targets.forEach(t=>t.classList.add('hover-visible'));
  const hide = ()=> targets.forEach(t=>t.classList.remove('hover-visible'));
  [zoneEl, ...targets].forEach(el=>{
    el.addEventListener('mouseenter', show);
    el.addEventListener('mouseleave', hide);
  });
}
wireHoverReveal(document.getElementById('hzLeft'), document.getElementById('tocTrigger'), document.getElementById('leftMenu'));
wireHoverReveal(document.getElementById('hzRight'), document.getElementById('topControls'));
wireHoverReveal(document.getElementById('hzCenter'), document.getElementById('groupMenu'), document.getElementById('groupMenuDaily'), document.getElementById('groupMenuYoy'));
document.getElementById('zoomOut').addEventListener('click', ()=>adjustZoom(-ZOOM_STEP));
document.getElementById('zoomIn').addEventListener('click', ()=>adjustZoom(ZOOM_STEP));

/* body.on-lamina-a gates the hzCenter zone + #groupMenu (see CSS) so the row/column menu only
   exists while Lámina A is actually the visible slide — the slides are all stacked in the DOM
   at once (scroll-snap), so without this the hover zone would show over every slide. */
/* Tracks the last slide auto-fit actually ran for, so scrolling within the SAME slide (scroll-
   snap fires this on every tick while it settles) doesn't re-trigger the binary search on every
   frame — only an actual slide CHANGE does. Reset to null on every enterDeck() (not just left as
   a bare slide id) since the same id ('a') means a different deck's Lámina A the next time a deck
   is entered, and that's genuinely different content needing its own fresh fit. */
let lastAutoFitId = null;
function updateOnLaminaA(){
  const scroller = document.getElementById('scroller');
  const idx = Math.round(scroller.scrollTop / window.innerHeight);
  document.body.classList.toggle('on-lamina-a', SLIDES[idx] && SLIDES[idx].id==='a');
  document.body.classList.toggle('on-lamina-daily', SLIDES[idx] && SLIDES[idx].id==='daily');
  document.body.classList.toggle('on-lamina-yoy', SLIDES[idx] && SLIDES[idx].id==='yoy');
  updateZoomUi();
  const id = SLIDES[idx] && SLIDES[idx].id;
  if(id !== lastAutoFitId){
    lastAutoFitId = id;
    if(ZOOMABLE_SLIDES[id]){
      /* Explicit, not left to applyAutoFit's own internal refresh() call to trigger this
         transitively — that indirect path turned out to not reliably fire fitHeroDeltas for
         every deck when switching decks in quick succession (found via a full-deck sweep, not
         the single-deck spot-checks that had looked clean). Direct call removes the ambiguity. */
      fitHeroDeltas(id);
      applyAutoFit(id);
    }
  }
}

/* ---------------- KEYBOARD NAV ---------------- */
document.addEventListener('keydown', (e)=>{
  const scroller = document.getElementById('scroller');
  if(!document.getElementById('deck').classList.contains('show')) return;
  const slides = [...document.querySelectorAll('.slide')];
  const idx = Math.round(scroller.scrollTop / window.innerHeight);
  if(e.key==='ArrowDown'||e.key==='PageDown'){ e.preventDefault(); slides[Math.min(idx+1,slides.length-1)]?.scrollIntoView({behavior:'smooth'}); }
  if(e.key==='ArrowUp'||e.key==='PageUp'){ e.preventDefault(); slides[Math.max(idx-1,0)]?.scrollIntoView({behavior:'smooth'}); }
  /* Escape only closes an open modal (native <dialog> behavior already does this
     and fires 'close', which openModal() cleans up) — it must never navigate home. */
});

/* ---------------- MODAL ---------------- */
function openModal(sizeClass, html, afterMount){
  const tpl = document.getElementById('modalTpl').content.cloneNode(true);
  const dlg = tpl.querySelector('dialog');
  if(sizeClass) dlg.classList.add(sizeClass);
  dlg.querySelector('.modal-body').innerHTML = html;
  dlg.querySelector('.modal-close').addEventListener('click', ()=>{ dlg.close(); dlg.remove(); });
  dlg.addEventListener('click', (e)=>{ if(e.target===dlg){ dlg.close(); dlg.remove(); } });
  dlg.addEventListener('close', ()=> dlg.remove()); // native Escape-close on <dialog> fires this — clean it up
  document.body.appendChild(dlg);
  dlg.showModal();
  if(afterMount) afterMount(dlg);
}
/* Shared channel-grouping metadata for Lámina A — one source of truth for the
   slide cards and their modals. MCP ChannelGrouping name -> Excel budget name:
   "Brand TV Channels"="Branded Channels", "Paid social ASC only"="ASC",
   "Paid social without ASC"="Paid Social", "Social Organic"/"Google Channels"/
   "Others" match verbatim. */
function budgetFor(key){
  return {
    branded: DATA.budget.branded.total, paidSocialASC: DATA.budget.asc,
    paidSocialNoASC: DATA.budget.paidSocial, paidSocialPlusOrganic: DATA.budget.paidSocialPlusOrganic,
    google: DATA.budget.google, others: DATA.budget.others, blended: DATA.budget.blended,
  }[key];
}
/* Tabbed channel modal: one tab per metric (Spend/Leads/Sales/NewCash/CPL/CMPS/MNCC),
   each showing one big Actual-vs-Budget trend chart Jan→current month. Tab switching is
   wired by wireModalTabs() after the dialog mounts (see openModal's afterMount param). */
function channelDetailModal(key, label, iconName, accent){
  const coreTabs = METRIC_TABS.map(t=>`<button class="mtab" data-tab="${t.key}"${t.group?` data-group="${t.group}"`:''}>${t.label}</button>`);
  /* Brand TV Channels ONLY: an extra tab (right after Spend) breaking that channel's spend into
     SEM-Brand vs. Media (Offline/TV) — the two always sum to 100%, and the point is to watch
     whether that mix shifts month to month (more bidding pressure on SEM-Brand, etc.). This
     only makes sense for Branded (that's the only channel with a real SEM-Brand/Offline split
     in the budget), so it's inserted conditionally, not part of the shared METRIC_TABS list. */
  if(key==='branded') coreTabs.splice(1, 0, `<button class="mtab" data-tab="SpendMix" data-group="money">${L('Distribución Spend','Spend Distribution')}</button>`);
  return `<div class="modal-head">${iconChip(iconName, accent)}<h3>${label}</h3></div>
    <div class="modal-tabs">${coreTabs.join('')}</div>
    <div class="modal-tab-body"></div>`;
}
/* Branded-only tab: what % of Brand TV Channels spend is SEM-Brand vs. Media (Offline/TV),
   month by month — reuses bigChart() by treating SEM-Brand% as the "actual" line and
   Offline% as the "budget" (dashed) line purely for the two-line visual, even though neither
   is really a budget here; legend/sidebar labels are relabeled accordingly. sidebarHtml-style
   split (spendMixSidebarHtml + renderSpendMixTab) so click-to-pin can refresh just the sidebar
   for a clicked month, same as every other tab — it didn't before (onSelect was never wired),
   which is why the cards always showed July regardless of which month you clicked. */
function spendMixSidebarHtml(idx){
  const series = DATA.spendMixBranded;
  const m = series[idx];
  const isCurrent = idx === series.length-1;
  const mediaWord = L('Media (Offline/TV)','Media (Offline/TV)');
  const semLabel = isCurrent ? 'SEM-Brand' : `SEM-Brand — ${m.label}`;
  const mediaLabel = isCurrent ? mediaWord : `${mediaWord} — ${m.label}`;
  const totalLabel = isCurrent ? L('Spend total del mes','Total spend that month') : `${L('Spend total','Total spend')} — ${m.label}`;
  return `<div class="mtc-stat">${iconChip('search','var(--brand-accent)', false, true)}<div><div class="label">${semLabel}</div><div class="value">${fmtPct(m.SemBrandPct)}</div></div></div>
    <div class="mtc-stat budget">${iconChip('broadcast','var(--text-secondary)', false, true)}<div><div class="label">${mediaLabel}</div><div class="value">${fmtPct(m.OfflinePct)}</div></div></div>
    <div class="mtc-stat">${iconChip('wallet','var(--text-secondary)', false, true)}<div><div class="label">${totalLabel}</div><div class="value" style="font-size:var(--text-lg)">${fmtUSD(m.SemBrand+m.Offline)}</div></div></div>`;
}
function renderSpendMixTab(label){
  const series = DATA.spendMixBranded;
  const semWithV = series.map(m=>({...m, __v:m.SemBrandPct}));
  const offWithV = series.map(m=>({...m, __v:m.OfflinePct}));
  return `<div class="mtc-chart-col">
      <div class="mtc-chart-title">
        <div class="ct-main">${label} — ${L('Distribución de Spend: SEM-Brand vs. Media','Spend Distribution: SEM-Brand vs. Media')}</div>
        <div class="ct-sub">${chartContextLine()}</div>
      </div>
      <div class="big-chart-wrap">${bigChart(semWithV, offWithV, fmtPct, 'var(--brand-accent)')}<div class="chart-tooltip"></div></div>
      <div class="chart-legend-lg">
        <span class="lg-actual"><i style="border-color:var(--brand-accent)"></i>SEM-Brand</span>
        <span class="lg-budget"><i style="border-color:var(--chart-budget-line)"></i>${L('Media (Offline/TV)','Media (Offline/TV)')}</span>
      </div>
    </div>
    <div class="mtc-sidebar">${spendMixSidebarHtml(series.length-1)}</div>`;
}

/* ---------------- SLIDE BUILDERS ---------------- */
function headerBlock(id,titleEs,titleEn,subEs,subEn){
  return `<div class="slide-header">
    <h2 class="title" id="${id}">${L(titleEs,titleEn)}</h2>

/* Semaphore legend, footer-center — small/subtle by explicit ask, reminds the reader what the
   colored dot on "% MNCC Temperature" means without repeating the threshold numbers on every
   row. Only passed by the 3 laminas that actually render the semaphore column (A/Daily/YoY,
   never Cover). Combined with centerExtra (YoY Junior's investment toggle) rather than
   replacing it — footer-center is `auto`-width, so it grows to fit both without stealing from
   the meta/logo 1fr columns on either side.
   SIMPLIFIED 2026-08 along with mnccTemperatureCell() itself: only 2 states now (no yellow
   tier) — green when actual %MNCC is at or above the comparison %MNCC, red when below. */
function semaphoreLegendHtml(isYoy){
  const label = isYoy ? L('% Diff Net Impact Temperature','% Diff Net Impact Temperature') : L('% MNCC Temperature','% MNCC Temperature');
  const unit = isYoy ? '%' : 'pp';
  return `<div class="footer-legend">
    <span class="fl-label">${label}</span>
    <span class="fl-item"><span class="nc-dot green"></span>&ge;0${unit}</span>
    <span class="fl-item"><span class="nc-dot red"></span>&lt;0${unit}</span>
  </div>`;
}
function footerBar(onBrand, opts){
  const o = opts || {};
  const d = currentDeck();
  const [y, m] = DATA.meta.month.split('-').map(Number);
  const centerHtml = `${o.legend?semaphoreLegendHtml(o.legendYoy):''}${o.centerExtra||''}`;
  return `<div class="slide-footer${onBrand?' on-brand':''}">
    <span class="meta">${d.brand} ${regionLabel()} · ${L(MONTHS_ES[m-1],MONTHS_EN[m-1])} ${y}</span>
    <div class="footer-center">${centerHtml}</div>
    <div class="footer-right">${o.rightExtra||''}<img src="img/openeducation.svg" alt="Open English"></div>
  </div>`;
}

/* Builds the <option> list for the cover's month selector, bounded by whatever history the
   loaded raw rows actually cover (getAvailableDateRange(), from viewBuilder.js) rather than a
   hardcoded "since Jan 2025" -- so this keeps working unmodified as the daily refresh (Phase 3)
   extends the real history further back or forward. Newest month first (matches a typical
   dropdown-of-recent-periods UX). */
function monthOptionsHtml(selectedMonth){
  const { min, max } = getAvailableDateRange();
  const [minY, minM] = min.split('-').map(Number);
  const [maxY, maxM] = max.split('-').map(Number);
  const opts = [];
  let y = maxY, m = maxM;
  while (y > minY || (y === minY && m >= minM)) {
    const val = `${y}-${String(m).padStart(2,'0')}`;
    opts.push(`<option value="${val}"${val===selectedMonth?' selected':''}>${L(MONTHS_ES[m-1],MONTHS_EN[m-1])} ${y}</option>`);
    m--; if (m === 0) { m = 12; y--; }
  }
  return opts.join('');
}

/* Fired when the cover's month selector changes: rebuilds DATA_BY_DECK for every deck at the new
   cutoff (reusing the already-fetched raw rows -- no re-fetch, see rebuildDataByDeck() in
   viewBuilder.js) and re-renders. Mirrors enterDeck()'s own filter-reset sequence so switching
   month doesn't leave a stale Marketing-Org/Brazil-merge filter applied from the PREVIOUS month's
   view. If the picked month is the currently-open (not yet finished) month, the cutoff is clamped
   to the latest date any data actually covers, instead of that month's calendar-end date. */
function onMonthChange(value){
  const [y, m] = value.split('-').map(Number);
  const { max } = getAvailableDateRange();
  const lastDay = new Date(y, m, 0).getDate();
  let cutoff = `${y}-${String(m).padStart(2,'0')}-${String(lastDay).padStart(2,'0')}`;
  if (cutoff > max) cutoff = max;
  DATA_BY_DECK = rebuildDataByDeck(cutoff);
  DATA = DATA_BY_DECK[DECK_ID];
  marketingOrgFilter = 'total'; applyMarketingOrgFilter();
  yoyMktOrgFilter = 'total';
  includeBrazil = true; applyBrazilMerge();
  buildDeck();
}

function wireMonthSelector(){
  document.getElementById('monthSelect')?.addEventListener('change', e => onMonthChange(e.target.value));
}

function slideCover(){
  const d = currentDeck();
  const [y, m] = DATA.meta.month.split('-').map(Number);
  const day = DATA.meta.asOfDay;
  return `<section class="slide cover"><div class="glow"></div><div class="glow2"></div>
    <div class="cover-content">
      <div class="tag">Open English</div>
      <h1 class="shimmer-text">${d.brand} ${regionLabel()}</h1>
      <div class="desc">${L(`Estrategia y desempeño de Marketing — ${MONTHS_ES[m-1]} ${y}`,`Marketing strategy and performance — ${MONTHS_EN[m-1]} ${y}`)}</div>
      <div class="datepill">📅 ${L(`Corte al ${day} de ${MONTHS_ES[m-1]} de ${y}`,`As of ${MONTHS_EN[m-1]} ${day}, ${y}`)}</div>
      <select id="monthSelect" class="month-select">${monthOptionsHtml(DATA.meta.month)}</select>
    </div>
    ${footerBar(true)}
  </section>`;
}

/* Column definitions for the channel-table (name column is always first, implicit) — EVERY
   column here is independently toggleable via the groupMenu "Columnas" list, driven by
   laminaAView.cols[key]. `group` drives the divider hairlines: a column gets a divider when
   its group differs from the previous VISIBLE column's group — computed fresh each render so
   hiding a column never leaves an orphaned divider or a missing one. */
const COL_DEFS = [
  {key:'Spend', group:'spend', weight:.8},
  {key:'SpendShare', group:'spend', weight:.7},
  {key:'Leads', group:'leads', weight:.6},
  {key:'LeadsShare', group:'leads', weight:.7},
  {key:'CPL', group:'leads', weight:.7},
  /* Conversion's weight was .7 (same as the other "leads" columns) but its hero tile stacks a
     3-line comparison (actual / prior-period / ±pp delta) that doesn't reliably fit at that
     share — found by tracing WHY YoY's auto-fit shrinks the whole slide more than Daily
     Tracker's some months: both slides' Conversion hero tile were already overflowing at
     zoom=1 (a pre-existing, universal tightness, not a YoY-only defect), just needing slightly
     more `fitHeroDeltas()` text-shrink to hide it in Daily Tracker's specific numbers that
     month. Verified across all 4 decks × Lámina A/Daily Tracker/YoY before landing on .8 (not
     .9, which measured better for 3 decks but regressed JR-LATAM's YoY auto-fit). */
  {key:'Conversion', group:'leads', weight:.8},
  {key:'Sales', group:'sales', weight:.6},
  {key:'SalesShare', group:'sales', weight:.7},
  {key:'CMPS', group:'sales', weight:.7},
  {key:'AvgPrice', group:'sales', weight:.75},
  {key:'MarginPct', group:'margin', weight:.8},
  {key:'NewCash', group:'cash', weight:.95, highlight:true},
  {key:'Impact', group:'cash', weight:.85, highlight:true},
  {key:'LtvShort', group:'cash', weight:.8},
  {key:'FullUnitCmShort', group:'cash', weight:.85, highlight:true},
  {key:'FullCmPctShort', group:'cash', weight:.85, highlight:true},
  /* Always the LAST column, everywhere it appears (Daily Tracker, YoY, and now Lámina A too) —
     explicit ask, never let a future column addition slot in after it. Own `group` (not 'cash')
     so it also always gets its own divider line, visually setting it apart as "the semaphore",
     not just one more cash-family metric. */
  {key:'NewCashSemaphore', group:'semaphore', weight:.9},
];
/* Hero only ever shows the subset of COL_DEFS that make sense at company-total level (no
   %Leads/%Sales — those are a per-channel SHARE of the blended total, meaningless for Blended
   itself) — still driven by the same laminaAView.cols flags, so hiding CMPS hides it in both
   places at once. */
const HERO_COL_DEFS = COL_DEFS.filter(c=> c.key!=='LeadsShare' && c.key!=='SalesShare' && c.key!=='SpendShare');
/* YoY-exclusive extra metrics (Media Spend, Media CPL, Paid Social+Organic spend) — explicit
   ask, 2026-08. Deliberately NOT added to the shared COL_DEFS: that array also feeds Lámina A's
   and Daily Tracker's own Vista menus (renderGroupMenu()/renderGroupMenuDaily() both do the same
   COL_DEFS.map() pattern renderGroupMenuYoy() does below) — those laminas have no YoY comparison
   basis to compute any of these three from, so they must never appear as togglable there.
   Table-only (never added to HERO_COL_DEFS/heroColsYoy) — the user asked for these as columns,
   never mentioned the hero tiles, and hero is a blended/company-total view where "per-country"
   metrics like these read oddly anyway. Built by splicing into a COPY of COL_DEFS at the exact
   requested positions (Media Spend right after Spend, Media CPL right after CPL/before
   Conversion, Paid+Organic spend at the very end) rather than hand-duplicating the whole array,
   so a future edit to COL_DEFS's own entries/order doesn't need a second copy kept in sync by
   hand. */
const YOY_COL_DEFS = (function(){
  const list = COL_DEFS.slice();
  const insertAfter = (key, entry) => list.splice(list.findIndex(c=>c.key===key)+1, 0, entry);
  insertAfter('Spend', {key:'MediaSpend', group:'spend', weight:.8});
  insertAfter('CPL', {key:'MediaCPL', group:'leads', weight:.7});
  list.push({key:'PaidOrganicSpend', group:'spend', weight:.8});
  return list;
})();
/* Row definitions for the channel-table — every row independently toggleable via the groupMenu
   "Filas" list, driven by laminaAView.rows[key]. "Grouped" (the default) is simply
   paidSocialASC/paidSocialNoASC both off, showing only the combined "Paid Social + Organic"
   row; unchecking either reveals that breakdown row on its own, same as any other row. */
const ROW_DEFS = [
  {key:'branded', icon:'broadcast', esLabel:'Brand TV Channels', enLabel:'Brand TV Channels', accent:'var(--brand-accent)', featured:true},
  {key:'paidSocialPlusOrganic', icon:'social', esLabel:'Paid Social + Organic', enLabel:'Paid Social + Organic', accent:'var(--color-oe-aqua)'},
  {key:'paidSocialASC', icon:'social', esLabel:'Paid Social — con ASC', enLabel:'Paid Social — with ASC', accent:'var(--color-oe-aqua)', indent:true},
  {key:'paidSocialNoASC', icon:'social', esLabel:'Paid Social — sin ASC', enLabel:'Paid Social — no-ASC', accent:'var(--color-oe-aqua)', indent:true},
  {key:'google', icon:'search', esLabel:'Google Channels', enLabel:'Google Channels', accent:'var(--color-sunny-orange)'},
  {key:'others', icon:'grid', esLabel:'Others', enLabel:'Others', accent:'var(--color-happy-pink)'},
];
function colLabel(key){
  return {
    Spend:'Spend', SpendShare:'% Spend', Leads:'Leads', LeadsShare:L('% Leads','Leads %'),
    Sales:L('Ventas','Sales'), SalesShare:L('% Ventas','Sales %'), CPL:'CPL', Conversion:L('Conversión','Conversion'), CMPS:'CMPS',
    AvgPrice:L('Precio Prom.','Avg Price'),
    MarginPct:'% MNCC', NewCash:'New Cash Core', NewCashSemaphore:'% MNCC Temperature', Impact:'Net Impact',
    LtvShort:'LTV Short', FullUnitCmShort:'Unit CM Short', FullCmPctShort:'CM % Short',
  }[key];
}
/* YoY-only label override — same "thin wrapper, not a colLabel() param" pattern as
   yoyMetricCell(): "Impact"/"Impacto" reads as "Net Impact" ONLY in the YoY table header,
   explicit ask, 2026-08 ("ajústale el nombre a Net Impact") — Lámina A/Daily Tracker keep the
   original label, colLabel() itself is untouched. */
function colLabelYoy(key){
  // 'Impact' special-case removed 2026-08 — colLabel() itself now says 'Net Impact' everywhere.
  const yoyOnly = {MediaSpend:'Media Spend', MediaCPL:'Media CPL', PaidOrganicSpend:L('Paid Social + Organic','Paid Social + Organic'),
    NewCashSemaphore:L('% Diff Net Impact Temperature','% Diff Net Impact Temperature')};
  return yoyOnly[key] || colLabel(key);
}
function visibleCols(defs){ return defs.filter(c=> laminaAView.cols[c.key]); }
function colDividerCls(list, i){ return (i>0 && list[i].group!==list[i-1].group) ? ' col-divider' : ''; }

function slideA(){
  const bl = DATA.actuals.blended.total, blB = DATA.budget.blended;
  const branded = DATA.actuals.branded.total, brandedB = DATA.budget.branded.total;
  const psPlusOrg = DATA.actuals.paidSocialPlusOrganic.total, psPlusOrgB = DATA.budget.paidSocialPlusOrganic;
  const asc = DATA.actuals.paidSocialASC.total, ascB = DATA.budget.asc;
  const noAsc = DATA.actuals.paidSocialNoASC.total, noAscB = DATA.budget.paidSocial;
  const google = DATA.actuals.google.total, googleB = DATA.budget.google;
  const others = DATA.actuals.others.total, othersB = DATA.budget.others;
  const totalSales = bl.Sales;

  const heroCols = visibleCols(HERO_COL_DEFS);
  const chCols = visibleCols(COL_DEFS);
  const chGridTemplate = `1.25fr ${chCols.map(c=>c.weight+'fr').join(' ')}`;

  function heroCell(key){
    switch(key){
      case 'Spend': return {icon:'wallet', label:'Spend', av:bl.Spend, bv:blB.Spend, fmt:fmtUSD, invert:true, pp:false};
      case 'Leads': return {icon:'gauge', label:'Leads', av:bl.Leads, bv:blB.Leads, fmt:fmtNum, invert:false, pp:false};
      case 'Sales': return {icon:'tag', label:L('Ventas','Sales'), av:bl.Sales, bv:blB.Sales, fmt:fmtNum, invert:false, pp:false};
      case 'CPL': return {icon:'gauge', label:'CPL', av:cpl(bl), bv:cpl(blB), fmt:fmtUSD, invert:true, pp:false};
      case 'Conversion': return {icon:'trend', label:L('Conversión','Conversion'), av:conversionRate(bl), bv:conversionRate(blB), fmt:fmtPctConversion, invert:false, pp:true};
      case 'CMPS': return {icon:'tag', label:'CMPS', av:cmps(bl), bv:cmps(blB), fmt:fmtUSD, invert:true, pp:false};
      case 'AvgPrice': return {icon:'tag', label:L('Precio Prom.','Avg Price'), av:avgPrice(bl), bv:avgPrice(blB), fmt:fmtUSD, invert:false, pp:false};
      case 'MarginPct': return {icon:'trend', label:'% MNCC', av:mncc(bl), bv:mncc(blB), fmt:fmtPct, invert:false, pp:true};
      case 'NewCash': return {icon:'wallet', label:'New Cash Core', av:bl.NewCash, bv:blB.NewCash, fmt:fmtUSD, invert:false, pp:false, highlight:true};
      case 'Impact': return {icon:'spark', label:'Net Impact', av:impact(bl,blB), fmt:fmtUSD, muted:true, highlight:true};
      case 'LtvShort': return {icon:'tag', label:'LTV Short', av:ltvShort(bl), fmt:fmtUSD, muted:true};
      case 'FullUnitCmShort': return {icon:'tag', label:'Unit CM Short', av:fullUnitCmShort(bl), fmt:fmtUSD, muted:true, highlight:true};
      case 'FullCmPctShort': return {icon:'trend', label:'CM % Short', av:fullCmPct(bl), fmt:fmtPct, muted:true, highlight:true};
      case 'NewCashSemaphore': return {icon:'trend', label:L('% MNCC Temperature','% MNCC Temperature'), av:mncc(bl), bv:mncc(blB), semaphore:true};
    }
  }
  const monthComplete = monthIsComplete();
  /* Centralizes the ONE number every pacing cell repeated ("vs XX% del mes") — day/days is the
     same fraction for every pacing metric, so it's shown once here instead of on every cell (see
     pacingCell()'s own comment for why it was dropped there). Only meaningful while the month is
     still open; once it closes there's no pacing anywhere so the chip just doesn't render. */
  const targetPacingChip = monthComplete ? '' : (function(){
    const day = DATA.meta.asOfDay, days = DATA.meta.daysInMonth;
    const pct = Math.round(day/days*100);
    return `<span class="target-pacing-chip"><span>${L('Pacing objetivo','Target pacing')}</span><b>${pct}%</b><span>${L(`día ${day} de ${days}`,`day ${day} of ${days}`)}</span></span>`;
  })();
  const bhKpis = heroCols.map(c=>{
    const h = heroCell(c.key);
    // 'Impact'/Net Impact joins FullCmPctShort in getting sign-based (pos/neg) coloring — its own
    // 0-pivot genuinely means something (see impact()'s new formula), unlike LtvShort/UnitCmShort.
    const cell = h.semaphore
      ? mnccTemperatureCell(h.av, h.bv)
      : h.muted
        ? `<div class="metric-cell muted"><div class="mc-actual${(c.key==='FullCmPctShort'||c.key==='Impact')?' '+mcPctSignClass(h.av):''}">${h.fmt(h.av)}</div></div>`
        : (!monthComplete && isPacingMetric(c.key))
          ? pacingCell(h.av, h.bv, h.fmt, c.key!=='Spend')
          : laminaAMetricCell(h.av,h.bv,h.fmt,h.invert,h.pp);
    return `<div class="bh-kpi${h.highlight?' highlight':''}${h.muted||h.semaphore?' muted':''}" data-metric="${c.key}"><div><div class="label">${h.label}</div>${cell}</div></div>`;
  }).join('');

  function chCellHtml(key, a, b){
    switch(key){
      case 'Spend': return monthComplete ? laminaAMetricCell(a.Spend, b.Spend, fmtUSD, true, false) : pacingCell(a.Spend, b.Spend, fmtUSD, false);
      case 'SpendShare': { const s = bl.Spend ? a.Spend/bl.Spend : null; return `<div class="metric-cell muted"><div class="mc-actual">${fmtPct(s)}</div></div>`; }
      case 'Leads': return monthComplete ? laminaAMetricCell(a.Leads, b.Leads, fmtNum, false, false) : pacingCell(a.Leads, b.Leads, fmtNum, true);
      case 'Sales': return monthComplete ? laminaAMetricCell(a.Sales, b.Sales, fmtNum, false, false) : pacingCell(a.Sales, b.Sales, fmtNum, true);
      case 'LeadsShare': { const s = bl.Leads ? a.Leads/bl.Leads : null; return `<div class="metric-cell muted"><div class="mc-actual">${fmtPct(s)}</div></div>`; }
      case 'SalesShare': { const s = totalSales ? a.Sales/totalSales : null; return `<div class="metric-cell muted"><div class="mc-actual">${fmtPct(s)}</div></div>`; }
      case 'CPL': return laminaAMetricCell(cpl(a), cpl(b), fmtUSD, true, false);
      case 'Conversion': return laminaAMetricCell(conversionRate(a), conversionRate(b), fmtPctConversion, false, true);
      case 'CMPS': return laminaAMetricCell(cmps(a), cmps(b), fmtUSD, true, false);
      case 'AvgPrice': return laminaAMetricCell(avgPrice(a), avgPrice(b), fmtUSD, false, false);
      case 'MarginPct': return laminaAMetricCell(mncc(a), mncc(b), fmtPct, false, true);
      case 'NewCash': return monthComplete ? laminaAMetricCell(a.NewCash, b.NewCash, fmtUSD, false, false) : pacingCell(a.NewCash, b.NewCash, fmtUSD, true);
      case 'NewCashSemaphore': return mnccTemperatureCell(mncc(a), mncc(b));
      case 'Impact': { const v = impact(a,b); return `<div class="metric-cell muted"><div class="mc-actual ${mcPctSignClass(v)}">${fmtUSD(v)}</div></div>`; }
      case 'LtvShort': return `<div class="metric-cell muted"><div class="mc-actual">${fmtUSD(ltvShort(a))}</div></div>`;
      case 'FullUnitCmShort': return `<div class="metric-cell muted"><div class="mc-actual">${fmtUSD(fullUnitCmShort(a))}</div></div>`;
      case 'FullCmPctShort': { const v = fullCmPct(a); return `<div class="metric-cell muted"><div class="mc-actual ${mcPctSignClass(v)}">${fmtPct(v)}</div></div>`; }
    }
  }
  /* One row shape for every channel grouping — Brand TV Channels only differs via
     the .featured modifier, never a different structure, so the visible columns stay
     aligned down the whole list. %Leads and %Ventas = this channel's share of blended
     company Leads/Sales (a sanity check: Branded + Paid Social+Organic + Google +
     Others must each sum to ~100%). Net Impact = diff of New Cash Core minus diff of Spend,
     actual vs budget (see impact()). Every metric cell carries data-metric so
     a click opens the modal on the matching tab, not always on Spend. Column set and
     order come from chCols (COL_DEFS filtered by the view-settings menu), never
     hardcoded here, so grouping/hiding a column can't drift out of sync with the header. */
  function chRow(key, iconName, label, a, b, accent, opts){
    opts = opts||{};
    const cells = chCols.map((c,i)=>
      `<div class="metric-col${c.highlight?' highlight':''}${colDividerCls(chCols,i)}" data-metric="${c.key}">${chCellHtml(c.key,a,b)}</div>`
    ).join('');
    return `<div class="ch-row${opts.featured?' featured':''}${opts.indent?' ch-indent':''}" style="--accent:${accent};grid-template-columns:${chGridTemplate}" data-modal="A" data-key="${key}">
      <div class="ch-name">${iconChip(iconName, accent, opts.featured, opts.indent)}<div class="ch-text"><h4>${label}</h4></div></div>
      ${cells}
    </div>`;
  }

  const ROW_DATA = {
    branded: [branded, brandedB], paidSocialPlusOrganic: [psPlusOrg, psPlusOrgB],
    paidSocialASC: [asc, ascB], paidSocialNoASC: [noAsc, noAscB],
    google: [google, googleB], others: [others, othersB],
  };
  const rows = ROW_DEFS.filter(r=> laminaAView.rows[r.key]).map(r=>{
    const [a,b] = ROW_DATA[r.key];
    return chRow(r.key, r.icon, L(r.esLabel,r.enLabel), a, b, r.accent, {featured:r.featured, indent:r.indent});
  }).join('');

  const headerCells = chCols.map((c,i)=>`<div class="metric-col${colDividerCls(chCols,i)}">${colLabel(c.key)}</div>`).join('');

  const deckLabel = `${currentDeck().brand} · ${regionLabel()}`;
  const dr = dateRangeLine();
  return `<section class="slide slide-a${laminaAValueVis.hideActual?' hide-actual-value':''}${laminaAValueVis.hideBudget?' hide-budget-value':''}" style="--slide-zoom:${getZoom('a')}"><div class="slide-inner">
    ${headerBlock('s-a', reportTitle(), reportTitle(),
      `${deckLabel} · Blended y Channel Groupings · ${dr.es}`,

/* Daily Tracker por País — OE Adult only (Brand TV Channels), OE-LATAM (8 country rows: TOP8,
   the same bucketing as actuals.branded.byCountry) and OE-BR (Brazil, hero-only — a single row
   would just repeat the hero's own numbers, so no detail table is rendered for Brazil at all).
   Every column is a DIRECT variance (metricCell, never pacingCell) because the budget side is
   already summed only through the same cutoff day as the actual (see add_daily_tracker_by_country
   in build_data_all.py) — unlike Lámina A's full-month budget, there's no unfairness to correct
   for here. Reuses Lámina A's exact COL_DEFS/HERO_COL_DEFS/colLabel/cpl/cmps/mncc/ltvShort/
   fullUnitCmShort/fullCmPct/impact/metricCell/iconChip/flagIcon — only the column VISIBILITY
   state (dailyTrackerCols) and the row dimension (country, not channel grouping) are new. Rows
   aren't clickable into a modal — there's no Jan-Jul per-country trend data to show one. */
// MediaSpend/PaidOrganicSpend included so the YoY lamina's "LATAM excl MX&AR" subtotal row (the
// only place that sums per-country objects via this list, besides the hero which never renders
// these 2 columns) adds them up correctly instead of silently dropping them to 0/undefined.
const DAILY_TRACKER_FIELDS = ['Spend','Leads','Sales','NewCash','FullCM','ProjRevShort','TotalEnrollments','MediaSpend','PaidOrganicSpend'];
function sumDailyTrackerFields(objs, fields){
  const out = {};
  for(const f of fields) out[f] = objs.reduce((s,o)=> s + (o[f]||0), 0);
  return out;
}
/* México/Argentina lead (the two largest LatAm markets), then the rest, with Costa Rica always
   last and visually de-emphasized (see .ch-row.deemphasized) — it has $0 Daily Tracker budget
   every day this month (a real, confirmed data characteristic, not a bug: see build_data_all.py's
   add_daily_tracker_by_country), so its "variance" isn't a meaningful comparison the way the
   other countries' is. A DIFFERENT order from TOP8 (which stays alphabetical-ish for Lámina B/
   byCountry bucketing) — deliberately scoped to just this lámina. */
const DAILY_TRACKER_ROW_ORDER = ["Mexico","Argentina","Colombia","Chile","Ecuador","Peru","Costa Rica","Other"];
/* México and Argentina are the 2 largest LatAm markets by a wide margin — the other 6 countries
   are each individually small, so a "LATAM excl. México y Argentina" subtotal row (summing
   exactly those 6) is inserted between Argentina and Colombia, letting the reader see "the rest
   of the region" as one number before drilling into its own 6-country breakdown below (visually
   separated by a thin rule, see .ch-row.subtotal-row). Only affects the ROW table's rendering
   order — hero/YoY-hero totals keep summing DAILY_TRACKER_ROW_ORDER's real 8 countries directly,
   never this pseudo-key, so nothing here risks double-counting the total. */
const REST_LATAM_SUBTOTAL_KEY = '__RestLatamExclMxAr__';
const REST_LATAM_SUBTOTAL_COUNTRIES = ["Colombia","Chile","Ecuador","Peru","Costa Rica","Other"];
const DAILY_TRACKER_ROW_ORDER_DISPLAY = ["Mexico","Argentina",REST_LATAM_SUBTOTAL_KEY,...REST_LATAM_SUBTOTAL_COUNTRIES];
function slideDaily(){
  const isBrazil = currentDeck().region === 'Brazil';
  /* "Agregar Brasil" (OE-LATAM only, see applyBrazilMerge()) — Brazil joins as one more country
     row, sourced straight from DATA_BY_DECK['OE-BR'] (its own branded total for actual, its own
     dailyTrackerBudget.Brazil for budget — same fields this lamina already reads for every real
     LatAm country, just from the other deck's copy of them, since 'Brazil' is never a real key
     in DATA.actuals.branded.byCountry/dailyTrackerBudget for the LatAm deck itself). */
  const showMergedBrazil = !isBrazil && DECK_ID==='OE-LATAM' && includeBrazil;
  const countries = isBrazil ? ['Brazil'] : (showMergedBrazil ? [...DAILY_TRACKER_ROW_ORDER, 'Brazil'] : DAILY_TRACKER_ROW_ORDER);
  const emptyActual = {Spend:0,Leads:0,Sales:0,NewCash:0,FullCM:0,ProjRevShort:0,TotalEnrollments:0};
  const emptyBudget = {Spend:0,Leads:0,Sales:0,NewCash:0};
  const actualFor = c => {
    if(isBrazil) return DATA.actuals.branded.total;
    if(c==='Brazil') return DATA_BY_DECK['OE-BR'].actuals.branded.total;
    return DATA.actuals.branded.byCountry[c] || emptyActual;
  };
  const budgetFor = c => {
    if(c==='Brazil' && !isBrazil) return DATA_BY_DECK['OE-BR'].dailyTrackerBudget.Brazil || emptyBudget;
    return DATA.dailyTrackerBudget[c] || emptyBudget;
  };

  const heroActual = isBrazil ? actualFor('Brazil') : sumDailyTrackerFields(countries.map(actualFor), DAILY_TRACKER_FIELDS);
  const heroBudget = isBrazil ? budgetFor('Brazil') : sumDailyTrackerFields(countries.map(budgetFor), ['Spend','Leads','Sales','NewCash']);

  const heroColsDaily = HERO_COL_DEFS.filter(c=> dailyTrackerCols[c.key]);
  const dCols = COL_DEFS.filter(c=> dailyTrackerCols[c.key]);
  const dGridTemplate = `1.25fr ${dCols.map(c=>c.weight+'fr').join(' ')}`;

  function dailyCellHtml(key, a, b){
    switch(key){
      case 'Spend': return metricCell(a.Spend, b.Spend, fmtUSD, true, false);
      case 'SpendShare': { const s = heroActual.Spend ? a.Spend/heroActual.Spend : null; return `<div class="metric-cell muted"><div class="mc-actual">${fmtPct(s)}</div></div>`; }
      case 'Leads': return metricCell(a.Leads, b.Leads, fmtNum, false, false);
      case 'Sales': return metricCell(a.Sales, b.Sales, fmtNum, false, false);
      case 'LeadsShare': { const s = heroActual.Leads ? a.Leads/heroActual.Leads : null; return `<div class="metric-cell muted"><div class="mc-actual">${fmtPct(s)}</div></div>`; }
      case 'SalesShare': { const s = heroActual.Sales ? a.Sales/heroActual.Sales : null; return `<div class="metric-cell muted"><div class="mc-actual">${fmtPct(s)}</div></div>`; }
      case 'CPL': return metricCell(cpl(a), cpl(b), fmtUSD, true, false);
      case 'Conversion': return metricCell(conversionRate(a), conversionRate(b), fmtPctConversion, false, true);
      case 'CMPS': return metricCell(cmps(a), cmps(b), fmtUSD, true, false);
      case 'AvgPrice': return metricCell(avgPrice(a), avgPrice(b), fmtUSD, false, false);
      case 'MarginPct': return metricCell(mncc(a), mncc(b), fmtPct, false, true);
      case 'NewCash': return metricCell(a.NewCash, b.NewCash, fmtUSD, false, false);
      case 'NewCashSemaphore': return mnccTemperatureCell(mncc(a), mncc(b));
      case 'Impact': { const v = impact(a,b); return `<div class="metric-cell muted"><div class="mc-actual ${mcPctSignClass(v)}">${fmtUSD(v)}</div></div>`; }
      case 'LtvShort': return `<div class="metric-cell muted"><div class="mc-actual">${fmtUSD(ltvShort(a))}</div></div>`;
      case 'FullUnitCmShort': return `<div class="metric-cell muted"><div class="mc-actual">${fmtUSD(fullUnitCmShort(a))}</div></div>`;
      case 'FullCmPctShort': { const v = fullCmPct(a); return `<div class="metric-cell muted"><div class="mc-actual ${mcPctSignClass(v)}">${fmtPct(v)}</div></div>`; }
    }
  }
  function heroCellDaily(key){
    switch(key){
      case 'Spend': return {icon:'wallet', label:'Spend', av:heroActual.Spend, bv:heroBudget.Spend, fmt:fmtUSD, invert:true, pp:false};
      case 'Leads': return {icon:'gauge', label:'Leads', av:heroActual.Leads, bv:heroBudget.Leads, fmt:fmtNum, invert:false, pp:false};
      case 'Sales': return {icon:'tag', label:L('Ventas','Sales'), av:heroActual.Sales, bv:heroBudget.Sales, fmt:fmtNum, invert:false, pp:false};
      case 'CPL': return {icon:'gauge', label:'CPL', av:cpl(heroActual), bv:cpl(heroBudget), fmt:fmtUSD, invert:true, pp:false};
      case 'Conversion': return {icon:'trend', label:L('Conversión','Conversion'), av:conversionRate(heroActual), bv:conversionRate(heroBudget), fmt:fmtPctConversion, invert:false, pp:true};
      case 'CMPS': return {icon:'tag', label:'CMPS', av:cmps(heroActual), bv:cmps(heroBudget), fmt:fmtUSD, invert:true, pp:false};
      case 'AvgPrice': return {icon:'tag', label:L('Precio Prom.','Avg Price'), av:avgPrice(heroActual), bv:avgPrice(heroBudget), fmt:fmtUSD, invert:false, pp:false};
      case 'MarginPct': return {icon:'trend', label:'% MNCC', av:mncc(heroActual), bv:mncc(heroBudget), fmt:fmtPct, invert:false, pp:true};
      case 'NewCash': return {icon:'wallet', label:'New Cash Core', av:heroActual.NewCash, bv:heroBudget.NewCash, fmt:fmtUSD, invert:false, pp:false, highlight:true};
      case 'Impact': return {icon:'spark', label:'Net Impact', av:impact(heroActual,heroBudget), fmt:fmtUSD, muted:true, highlight:true};
      case 'LtvShort': return {icon:'tag', label:'LTV Short', av:ltvShort(heroActual), fmt:fmtUSD, muted:true};
      case 'FullUnitCmShort': return {icon:'tag', label:'Unit CM Short', av:fullUnitCmShort(heroActual), fmt:fmtUSD, muted:true, highlight:true};
      case 'FullCmPctShort': return {icon:'trend', label:'CM % Short', av:fullCmPct(heroActual), fmt:fmtPct, muted:true, highlight:true};
      case 'NewCashSemaphore': return {icon:'trend', label:L('% MNCC Temperature','% MNCC Temperature'), av:mncc(heroActual), bv:mncc(heroBudget), semaphore:true};
    }
  }
  const bhKpisDaily = heroColsDaily.map(c=>{
    const h = heroCellDaily(c.key);
    const cell = h.semaphore
      ? mnccTemperatureCell(h.av, h.bv)
      : h.muted ? `<div class="metric-cell muted"><div class="mc-actual${(c.key==='FullCmPctShort'||c.key==='Impact')?' '+mcPctSignClass(h.av):''}">${h.fmt(h.av)}</div></div>` : metricCell(h.av,h.bv,h.fmt,h.invert,h.pp);
    return `<div class="bh-kpi${h.highlight?' highlight':''}${h.muted||h.semaphore?' muted':''}" data-metric="${c.key}"><div><div class="label">${h.label}</div>${cell}</div></div>`;
  }).join('');
  function countryRow(c){
    const isSubtotal = c === REST_LATAM_SUBTOTAL_KEY;
    const a = isSubtotal ? sumDailyTrackerFields(REST_LATAM_SUBTOTAL_COUNTRIES.map(actualFor), DAILY_TRACKER_FIELDS) : actualFor(c);
    const b = isSubtotal ? sumDailyTrackerFields(REST_LATAM_SUBTOTAL_COUNTRIES.map(budgetFor), ['Spend','Leads','Sales','NewCash']) : budgetFor(c);
    const cells = dCols.map((col,i)=> `<div class="metric-col${col.highlight?' highlight':''}${colDividerCls(dCols,i)}" data-metric="${col.key}">${dailyCellHtml(col.key,a,b)}</div>`).join('');
    const label = isSubtotal ? L('LATAM (excl. México y Argentina)','LATAM (excl. Mexico & Argentina)') : (LANG==='es' ? COUNTRY_LABEL_ES[c] : COUNTRY_LABEL_EN[c]);
    const deemphasized = c === 'Costa Rica';
    /* Brazil, when merged in via "Agregar Brasil", is appended after every real LatAm country
       (incl. "Otros LatAm") — a plain top border (same visual language as .subtotal-row's
       divider, just on the opposite edge since Brazil comes AFTER the group it's set apart
       from, not before) makes clear it's a separate country joining the LatAm set, not just
       one more LatAm row. */
    const isMergedBrazil = c === 'Brazil' && showMergedBrazil;
    const nameHtml = isSubtotal
      ? `<div class="ch-name">${iconChip('globe','var(--brand-accent)')}<div class="ch-text"><h4>${label}</h4></div></div>`
      : `<div class="ch-name">${flagIcon(c)}<div class="ch-text"><h4>${label}</h4></div></div>`;
    return `<div class="ch-row no-click${deemphasized?' deemphasized':''}${isSubtotal?' subtotal-row':''}${isMergedBrazil?' merged-brazil-row':''}" style="grid-template-columns:${dGridTemplate}">
      ${nameHtml}
      ${cells}
    </div>`;
  }

  /* Brazil used to get its own card-flow layout here (brazilFlowHtml) — explicit ask this
     session to match LatAm's table format instead, single row. countryRow('Brazil') already
     works unmodified: actualFor('Brazil')/budgetFor('Brazil') already resolve correctly for a
     single-country deck (actualFor falls back to the flat branded total; DATA.dailyTrackerBudget
     already has a "Brazil" key from the same Daily Tracker.xlsx parse LatAm's rows use), and
     flagIcon/COUNTRY_LABEL_ES/EN already have a "Brazil" entry — no new plumbing needed, just
     routing Brazil through the exact same row renderer as every LatAm country. */
  const displayRows = showMergedBrazil ? [...DAILY_TRACKER_ROW_ORDER_DISPLAY, 'Brazil'] : DAILY_TRACKER_ROW_ORDER_DISPLAY;
  const rowsHtml = isBrazil ? countryRow('Brazil') : displayRows.map(countryRow).join('');
  const headerCells = dCols.map((c,i)=>`<div class="metric-col${colDividerCls(dCols,i)}">${colLabel(c.key)}</div>`).join('');
  const heroLabel = L('Brand TV Channels','Brand TV Channels');
  const heroSub = isBrazil
    ? `${flagIcon('Brazil')} ${L('Brasil · Consolidado Daily Tracker','Brazil · Consolidated Daily Tracker')}`
    : L(`Consolidado ${regionLabel()} · Daily Tracker`,`Consolidated ${regionLabel()} · Daily Tracker`);
  const deckLabel = `${currentDeck().brand} · ${regionLabel()}`;
  const [dy, dm] = DATA.meta.month.split('-').map(Number);
  const dday = DATA.meta.asOfDay;
  /* Brazil is a single country — its own "country row" table used to just repeat the hero's
     exact same totals (there's nothing else to compare it against, unlike LatAm's 8-country
     breakdown), which the user flagged as pointless redundancy: "no tiene sentido poner la
     tabla si muestra exactamente la misma información que la tarjeta principal." Hero-only for
     Brazil now; LatAm keeps its table untouched (real per-country breakdown, not a duplicate). */
  const heroBlockHtml = `
      <div class="blended-hero daily-hero no-click">
        <div class="bh-head"><span class="bh-badge">${heroLabel}</span><span class="bh-sub">${heroSub}</span></div>
        <div class="bh-kpis" style="grid-template-columns:${heroColsDaily.map(c=>`minmax(0,${c.weight}fr)`).join(' ')}">${bhKpisDaily}</div>
      </div>`;
  const bodyHtml = isBrazil ? heroBlockHtml : `${heroBlockHtml}
      <div class="detail-label daily-detail-label">${L('Detalle por país','Detail by country')}</div>
      <div class="channel-table daily-table">
        <div class="ch-header-row" style="grid-template-columns:${dGridTemplate}"><div></div>${headerCells}</div>
        ${rowsHtml}
      </div>`;
  return `<section class="slide slide-daily${isBrazil?' slide-daily-br':''}${dailyValueVis.hideActual?' hide-actual-value':''}${dailyValueVis.hideBudget?' hide-budget-value':''}" style="--slide-zoom:${getZoom('daily')}"><div class="slide-inner">
    ${(() => {
      const rawLink = (label) => `<a class="raw-source-link" href="https://drive.google.com/drive/folders/1OfX-a7mMdtkegYZAJs1T3KvRfy6LkP86" target="_blank" rel="noopener">${label}</a>`;
      return headerBlock('s-daily', 'MTD Branded KPIs vs Forecast By Country', 'MTD Branded KPIs vs Forecast By Country',
        `${deckLabel} · Actual vs Daily Tracker acumulado al ${dday} de ${MONTHS_ES[dm-1]} de ${dy} · ${rawLink('ver carpeta de origen')}`,
        `${deckLabel} · Actual vs Daily Tracker accumulated through ${MONTHS_EN[dm-1]} ${dday}, ${dy} · ${rawLink('view source folder')}`);
    })()}
    <div class="slide-body centered-stack${isBrazil?' single-hero':''}">${bodyHtml}
    </div>
  </div>${footerBar(false, {legend:dailyTrackerCols.NewCashSemaphore})}</section>`;
}

/* Comparativo YoY por País — same shape as slideDaily() (hero + country rows for LatAm,
   infographic card grid for Brazil, same 14-metric column filter), but "b" is last year's
   actual for the same period (DATA.yoyByCountry[yoyView.dateMode]) instead of a budget file.
   Never pacing here either — both years have complete daily data through the same cutoff, so
   every column is always a fair direct variance, exactly like Daily Tracker. */
function yoyDailyDataRange(periodKey){
  const rows = yoyDailyRowsForDeck(periodKey);
  if(!rows.length) return null;
  let min = rows[0].date, max = rows[0].date;
  for(const r of rows){ if(r.date<min) min=r.date; if(r.date>max) max=r.date; }
  return {start:min, end:max};
}
function fmtDatePoint(iso){
  const [y,m,d] = iso.split('-').map(Number);
  return {es:`${d} ${MONTHS_ES[m-1]} ${y}`, en:`${MONTHS_EN[m-1]} ${d}, ${y}`};
}
function fmtYoyRange(range){
  const [ry,rm,rd1] = range.start.split('-').map(Number);
  const rd2 = Number(range.end.split('-')[2]);
  const mEs = MONTHS_ES[rm-1], mEn = MONTHS_EN[rm-1];
  return {es:`${rd1}-${rd2} ${mEs} ${ry}`, en:`${mEn} ${rd1}-${rd2}, ${ry}`};
}
function slideYoy(){
  const isBrazil = currentDeck().region === 'Brazil';
  /* "Agregar Brasil" (OE-LATAM only) — same idea as slideDaily(): Brazil joins as one more
     country row, sourced from DATA_BY_DECK['OE-BR'] directly (its own branded actual total, its
     own yoyByCountry.Brazil for the comparison side). Independent of yoyMktOrgFilter — that
     filter only ever applies to Junior decks (gated on DATA.actualsByCountryMktOrg, which Adult
     decks never have), so yoyActualsTotal()/yoyActualsByCountry() already just return the plain
     unfiltered data here regardless. */
  const showMergedBrazil = !isBrazil && DECK_ID==='OE-LATAM' && includeBrazil;
  const countries = isBrazil ? ['Brazil'] : (showMergedBrazil ? [...DAILY_TRACKER_ROW_ORDER, 'Brazil'] : DAILY_TRACKER_ROW_ORDER);
  const emptyActual = {Spend:0,Leads:0,Sales:0,NewCash:0,FullCM:0,ProjRevShort:0,TotalEnrollments:0};
  const emptyYoy = {Spend:0,Leads:0,Sales:0,NewCash:0,FullCM:0,ProjRevShort:0,TotalEnrollments:0};
  /* Custom date-range picker, when enabled, replaces BOTH sides' data source wholesale (see the
     long comment on yoyCustomRange above) — computed ONCE per render, not once per country, to
     avoid re-aggregating the whole 5-month dataset per row (this project already hit, and fixed,
     exactly this kind of per-item-redundant-recompute performance bug once this same session). */
  const customRangeActive = yoyCustomRange.enabled && yoyMktOrgFilter==='total';
  const customActuals = customRangeActive ? yoyCustomActualsByCountry() : null;
  const customCompare = customRangeActive ? yoyCustomComparisonByCountry() : null;
  const actualFor = c => {
    if(customActuals) return (isBrazil ? customActuals.Brazil : customActuals[c]) || emptyActual;
    if(isBrazil) return yoyActualsTotal();
    if(c==='Brazil') return DATA_BY_DECK['OE-BR'].actuals.branded.total;
    return yoyActualsByCountry()[c] || emptyActual;
  };
  const yoyByMode = yoyComparisonByMode(yoyView.dateMode);
  const yoyFor = c => {
    if(customCompare) return (isBrazil ? customCompare.Brazil : customCompare[c]) || emptyYoy;
    if(c==='Brazil' && !isBrazil) return (DATA_BY_DECK['OE-BR'].yoyByCountry[yoyView.dateMode]||{}).Brazil || emptyYoy;
    return yoyByMode[c] || emptyYoy;
  };

  const heroActual = isBrazil ? actualFor('Brazil') : sumDailyTrackerFields(countries.map(actualFor), DAILY_TRACKER_FIELDS);
  const heroYoy = isBrazil ? yoyFor('Brazil') : sumDailyTrackerFields(countries.map(yoyFor), DAILY_TRACKER_FIELDS);

  const heroColsYoy = HERO_COL_DEFS.filter(c=> yoyView.cols[c.key]);
  const yCols = YOY_COL_DEFS.filter(c=> yoyView.cols[c.key]);
  const yGridTemplate = `1.25fr ${yCols.map(c=>c.weight+'fr').join(' ')}`;

  function yoyCellHtml(key, a, b){
    switch(key){
      case 'Spend': return yoyMetricCell(a.Spend, b.Spend, fmtUSD, true, false);
      // Media Spend/CPL/Paid+Organic spend: YoY-exclusive, see YOY_COL_DEFS's own comment for why.
      case 'MediaSpend': return yoyMetricCell(a.MediaSpend, b.MediaSpend, fmtUSD, true, false);
      case 'SpendShare': { const s = heroActual.Spend ? a.Spend/heroActual.Spend : null; return `<div class="metric-cell muted"><div class="mc-actual">${fmtPct(s)}</div></div>`; }
      case 'Leads': return yoyMetricCell(a.Leads, b.Leads, fmtNum, false, false);
      case 'Sales': return yoyMetricCell(a.Sales, b.Sales, fmtNum, false, false);
      case 'LeadsShare': { const s = heroActual.Leads ? a.Leads/heroActual.Leads : null; return `<div class="metric-cell muted"><div class="mc-actual">${fmtPct(s)}</div></div>`; }
      case 'SalesShare': { const s = heroActual.Sales ? a.Sales/heroActual.Sales : null; return `<div class="metric-cell muted"><div class="mc-actual">${fmtPct(s)}</div></div>`; }
      case 'CPL': return yoyMetricCell(cpl(a), cpl(b), fmtUSD, true, false);
      case 'MediaCPL': return yoyMetricCell(mediaCpl(a), mediaCpl(b), fmtUSD, true, false);
      case 'Conversion': return yoyMetricCell(conversionRate(a), conversionRate(b), fmtPctConversion, false, true);
      case 'CMPS': return yoyMetricCell(cmps(a), cmps(b), fmtUSD, true, false);
      case 'AvgPrice': return yoyMetricCell(avgPrice(a), avgPrice(b), fmtUSD, false, false);
      case 'MarginPct': return yoyMetricCell(mncc(a), mncc(b), fmtPct, false, true);
      case 'NewCash': return yoyMetricCell(a.NewCash, b.NewCash, fmtUSD, false, false);
      case 'NewCashSemaphore': return netImpactTemperatureCell(netImpactTemperaturePct(a,b));
      // Net Impact reverted to the standard 2-value (actual/año anterior) + delta format here,
      // explicit ask 2026-08-11: "no veo ambos valores como se ve en Spend" — YoY-only revert (see
      // netImpactTemperaturePct's own comment for why this lámina, unlike Lámina A/Daily Tracker,
      // has no pacing-fairness question blocking it: the comparison side is always already
      // period-matched). The delta this produces is numerically IDENTICAL to the old single-value
      // impact(a,b) (algebraically (a.NewCash-a.Spend)-(b.NewCash-b.Spend) === (a.NewCash-b.NewCash)
      // -(a.Spend-b.Spend)) — only the PRESENTATION changed, not the underlying number.
      case 'Impact': return yoyMetricCell(a.NewCash-a.Spend, b.NewCash-b.Spend, fmtUSD, false, false);
      case 'LtvShort': return yoyMetricCell(ltvShort(a), ltvShort(b), fmtUSD, false, false);
      case 'FullUnitCmShort': return yoyMetricCell(fullUnitCmShort(a), fullUnitCmShort(b), fmtUSD, false, false);
      case 'FullCmPctShort': return yoyMetricCell(fullCmPct(a), fullCmPct(b), fmtPct, false, true, mcPctSignClass(fullCmPct(a)));
      case 'PaidOrganicSpend': return yoyMetricCell(a.PaidOrganicSpend, b.PaidOrganicSpend, fmtUSD, false, false);
    }
  }
  function heroCellYoy(key){
    switch(key){
      case 'Spend': return {icon:'wallet', label:'Spend', av:heroActual.Spend, bv:heroYoy.Spend, fmt:fmtUSD, invert:true, pp:false};
      case 'Leads': return {icon:'gauge', label:'Leads', av:heroActual.Leads, bv:heroYoy.Leads, fmt:fmtNum, invert:false, pp:false};
      case 'Sales': return {icon:'tag', label:L('Ventas','Sales'), av:heroActual.Sales, bv:heroYoy.Sales, fmt:fmtNum, invert:false, pp:false};
      case 'CPL': return {icon:'gauge', label:'CPL', av:cpl(heroActual), bv:cpl(heroYoy), fmt:fmtUSD, invert:true, pp:false};
      case 'Conversion': return {icon:'trend', label:L('Conversión','Conversion'), av:conversionRate(heroActual), bv:conversionRate(heroYoy), fmt:fmtPctConversion, invert:false, pp:true};
      case 'CMPS': return {icon:'tag', label:'CMPS', av:cmps(heroActual), bv:cmps(heroYoy), fmt:fmtUSD, invert:true, pp:false};
      case 'AvgPrice': return {icon:'tag', label:L('Precio Prom.','Avg Price'), av:avgPrice(heroActual), bv:avgPrice(heroYoy), fmt:fmtUSD, invert:false, pp:false};
      case 'MarginPct': return {icon:'trend', label:'% MNCC', av:mncc(heroActual), bv:mncc(heroYoy), fmt:fmtPct, invert:false, pp:true};
      case 'NewCash': return {icon:'wallet', label:'New Cash Core', av:heroActual.NewCash, bv:heroYoy.NewCash, fmt:fmtUSD, invert:false, pp:false, highlight:true};
      // See yoyCellHtml's 'Impact' case comment — same revert, same reasoning, same delta value.
      case 'Impact': return {icon:'spark', label:'Net Impact', av:heroActual.NewCash-heroActual.Spend, bv:heroYoy.NewCash-heroYoy.Spend, fmt:fmtUSD, invert:false, pp:false, highlight:true};
      case 'LtvShort': return {icon:'tag', label:'LTV Short', av:ltvShort(heroActual), bv:ltvShort(heroYoy), fmt:fmtUSD, invert:false, pp:false};
      case 'FullUnitCmShort': return {icon:'tag', label:'Unit CM Short', av:fullUnitCmShort(heroActual), bv:fullUnitCmShort(heroYoy), fmt:fmtUSD, invert:false, pp:false, highlight:true};
      case 'FullCmPctShort': return {icon:'trend', label:'CM % Short', av:fullCmPct(heroActual), bv:fullCmPct(heroYoy), fmt:fmtPct, invert:false, pp:true, highlight:true};
      case 'NewCashSemaphore': return {icon:'trend', label:L('% Diff Net Impact Temperature','% Diff Net Impact Temperature'), av:netImpactTemperaturePct(heroActual,heroYoy), semaphore:true};
    }
  }
  const bhKpisYoy = heroColsYoy.map(c=>{
    const h = heroCellYoy(c.key);
    // 'Impact'/Net Impact is the only YOY hero metric with NO real second side to compare against
    // (it's already a diff-of-diffs, see impact()'s comment) — muted single-value, same as
    // Lámina A's/Daily Tracker's own heroCell*() 'Impact' case, unlike LtvShort/FullUnitCmShort
    // which DO get a real prior-year comparison here since YOY actually has that data.
    const signCls = c.key==='FullCmPctShort' ? mcPctSignClass(h.av) : '';
    const cell = h.semaphore
      ? netImpactTemperatureCell(h.av)
      : h.muted
        ? `<div class="metric-cell muted"><div class="mc-actual ${mcPctSignClass(h.av)}">${h.fmt(h.av)}</div></div>`
        : yoyMetricCell(h.av,h.bv,h.fmt,h.invert,h.pp,signCls);
    return `<div class="bh-kpi${h.highlight?' highlight':''}${h.semaphore||h.muted?' muted':''}" data-metric="${c.key}"><div><div class="label">${h.label}</div>${cell}</div></div>`;
  }).join('');
  function countryRowYoy(c){
    const isSubtotal = c === REST_LATAM_SUBTOTAL_KEY;
    const a = isSubtotal ? sumDailyTrackerFields(REST_LATAM_SUBTOTAL_COUNTRIES.map(actualFor), DAILY_TRACKER_FIELDS) : actualFor(c);
    const b = isSubtotal ? sumDailyTrackerFields(REST_LATAM_SUBTOTAL_COUNTRIES.map(yoyFor), DAILY_TRACKER_FIELDS) : yoyFor(c);
    const cells = yCols.map((col,i)=> `<div class="metric-col${col.highlight?' highlight':''}${colDividerCls(yCols,i)}" data-metric="${col.key}">${yoyCellHtml(col.key,a,b)}</div>`).join('');
    // Abbreviated ONLY in this lamina (explicit ask, 2026-08) — Daily Tracker's own countryRow()
    // keeps the full "LATAM (excl. México y Argentina)" label, deliberately not touched.
    const label = isSubtotal ? 'LT Excl. MX & AR' : (LANG==='es' ? COUNTRY_LABEL_ES[c] : COUNTRY_LABEL_EN[c]);
    const deemphasized = c === 'Costa Rica';
    const isMergedBrazil = c === 'Brazil' && showMergedBrazil;
    const nameHtml = isSubtotal
      ? `<div class="ch-name">${iconChip('globe','var(--brand-accent)')}<div class="ch-text"><h4>${label}</h4></div></div>`
      : `<div class="ch-name">${flagIcon(c)}<div class="ch-text"><h4>${label}</h4></div></div>`;
    return `<div class="ch-row no-click${deemphasized?' deemphasized':''}${isSubtotal?' subtotal-row':''}${isMergedBrazil?' merged-brazil-row':''}" style="grid-template-columns:${yGridTemplate}">
      ${nameHtml}
      ${cells}
    </div>`;
  }

  /* Brazil used to get its own card-flow layout here (brazilFlowHtml) — explicit ask to match
     LatAm's table format instead (same fix Daily Tracker already got), single row.
     countryRowYoy('Brazil') already works unmodified: actualFor('Brazil')/yoyFor('Brazil') both
     already resolve correctly for a single-country deck. */
  const displayRowsYoy = showMergedBrazil ? [...DAILY_TRACKER_ROW_ORDER_DISPLAY, 'Brazil'] : DAILY_TRACKER_ROW_ORDER_DISPLAY;
  const rowsHtmlYoy = isBrazil ? countryRowYoy('Brazil') : displayRowsYoy.map(countryRowYoy).join('');
  const headerCellsYoy = yCols.map((c,i)=>`<div class="metric-col${colDividerCls(yCols,i)}">${colLabelYoy(c.key)}</div>`).join('');
  const rangeLabel = fmtYoyRange(customRangeActive ? yoyActiveCompareRange() : DATA.yoyByCountry[yoyView.dateMode+'Range']);
  const heroLabelYoy = L('Brand TV Channels','Brand TV Channels');
  const heroSubYoy = isBrazil
    ? `${flagIcon('Brazil')} ${L(`Brasil · vs ${rangeLabel.es}`,`Brazil · vs ${rangeLabel.en}`)}`
    : L(`Consolidado ${regionLabel()} · vs ${rangeLabel.es}`,`Consolidated ${regionLabel()} · vs ${rangeLabel.en}`);
  const deckLabelYoy = `${currentDeck().brand} · ${regionLabel()}`;
  const [yy, ym] = DATA.meta.month.split('-').map(Number);
  const yday = DATA.meta.asOfDay;
  /* dateModeToggle footer buttons ("Mismas fechas"/"Mismos días de semana") removed 2026-08-14,
     explicit ask: redundant with the equivalent "Comparar contra" buttons already inside the
     custom date range panel (yoyCustomRangePanelHtml's compareMode buttons), now that custom
     range is enabled by default. yoyView.dateMode itself is untouched — still the fallback path
     read by yoyComparisonByMode()/fmtYoyRange() whenever yoyCustomRange.enabled is false — this
     only removes the now-redundant footer UI, not the underlying state. */
  /* Junior-only 3-way investment filter, footer-center. "Total Junior" = every result Junior's
     funnel gets credit for, any funder; "Solo Inversión Junior" = MarketingOrganization===
     "Open English Junior" only; "Solo Inversión Adulto" = MarketingOrganization==="OE" only (see
     yoyActualsByCountry()/yoyComparisonByMode() — this is its own data slice, not the "overflow"
     bucket used elsewhere, since the user's definition here is exactly those 2 orgs, nothing
     folded in). Gated on DATA.actualsByCountryMktOrg existing — Adult decks never have it. */
  const mktOrgToggleYoy = DATA.actualsByCountryMktOrg ? `
    <div class="footer-toggle yoymktorg-toggle">
      <button class="${yoyMktOrgFilter==='total'?'on':''}" data-yoymktorg="total">${L('Total Junior','Total Junior')}</button>
      <button class="${yoyMktOrgFilter==='juniorOwn'?'on':''}" data-yoymktorg="juniorOwn">${L('Solo Inversión Junior','Junior-only investment')}</button>
      <button class="${yoyMktOrgFilter==='adultOnly'?'on':''}" data-yoymktorg="adultOnly">${L('Solo Inversión Adulto','Adult-only investment')}</button>
    </div>` : '';
  /* Same redundancy fix as slideDaily(): Brazil's own "country row" is a single row that just
     repeats the hero's own totals — no comparison value once there's only 1 country — so the
     table is dropped entirely for Brazil here too, hero-only. LatAm keeps its real per-country
     table untouched. */
  const heroBlockHtmlYoy = `
      <div class="blended-hero daily-hero no-click">
        <div class="bh-head"><span class="bh-badge">${heroLabelYoy}</span><span class="bh-sub">${heroSubYoy}</span></div>
        <div class="bh-kpis" style="grid-template-columns:${heroColsYoy.map(c=>`minmax(0,${c.weight}fr)`).join(' ')}">${bhKpisYoy}</div>
      </div>`;
  const bodyHtmlYoy = isBrazil ? heroBlockHtmlYoy : `${heroBlockHtmlYoy}
      <div class="detail-label daily-detail-label">${L('Detalle por país','Detail by country')}</div>
      <div class="channel-table daily-table">
        <div class="ch-header-row" style="grid-template-columns:${yGridTemplate}"><div></div>${headerCellsYoy}</div>
        ${rowsHtmlYoy}
      </div>`;
  return `<section class="slide slide-daily slide-yoy${isBrazil?' slide-daily-br':''}${yoyValueVis.hideActual?' hide-actual-value':''}${yoyValueVis.hideBudget?' hide-budget-value':''}" style="--slide-zoom:${getZoom('yoy')}"><div class="slide-inner">
    ${headerBlock('s-yoy', 'YOY Branded Channels KPIs', 'YOY Branded Channels KPIs',
      `${deckLabelYoy} · Actual al ${yday} de ${MONTHS_ES[ym-1]} de ${yy} vs mismo período año anterior`,
      `${deckLabelYoy} · Actual through ${MONTHS_EN[ym-1]} ${yday}, ${yy} vs same period last year`)}
    <div class="slide-body centered-stack${isBrazil?' single-hero':''}">${bodyHtmlYoy}
    </div>
  </div>${footerBar(false, {legend:yoyView.cols.NewCashSemaphore, legendYoy:true, centerExtra: mktOrgToggleYoy})}</section>`;
}

/* ---------------- BUILD / RENDER ---------------- */
/* Every slide this project knows how to build, keyed by id. Which of these actually appear in
   a given deck is decided by DECKS[deckId].slides (see enterDeck()) — SLIDES itself is `let`,
   recomputed per deck, since OE-BR/JR-LATAM/JR-BR only have Lamina-A-level data and must never
   render slideB/C/D (they'd crash reading byCountry/dailyTracker/yoy fields that don't exist
   for those decks). */
const SLIDE_DEFS = {
  cover: {id:'cover', fn:slideCover, es:'Portada', en:'Cover'},
  a:     {id:'a', fn:slideA, es:'Pacing vs Reforecast', en:'Pacing vs Reforecast'},
  daily: {id:'daily', fn:slideDaily, es:'MTD Branded KPIs vs Forecast By Country', en:'MTD Branded KPIs vs Forecast By Country'},
  yoy:   {id:'yoy', fn:slideYoy, es:'Comparativo YoY por País', en:'YoY Comparison by Country'},
};
let SLIDES = DECKS['OE-LATAM'].slides.map(k=>SLIDE_DEFS[k]);

function buildDeck(){ SLIDES = currentDeck().slides.map(k=>SLIDE_DEFS[k]); renderDeck(); }

function renderDeck(){
  const scroller = document.getElementById('scroller');
  scroller.innerHTML = SLIDES.map(s=>s.fn()).join('');
  buildTOC();
  buildDeckSwitcher();
  wireCardClicks();
  wireYoyMktOrgToggle();
  wireMonthSelector();
  renderGroupMenu();
  renderGroupMenuDaily();
  renderGroupMenuYoy();
  updateOnLaminaA();
}

/* Lámina A's row/column agrupar-desagrupar menu — lives in the top-center hover panel
   (#groupMenu), not inside the slide itself, so it never fights with the hzRight/#topControls
   hover-reveal for the same corner. Rebuilt on every renderDeck() call (deck build + language
   toggle) so labels stay translated; a checkbox change only needs to re-render slide A itself
   (outerHTML swap, same pattern as wireYoyToggle for slide D) — the menu's own DOM/listeners
   don't need to be touched for that, since the checked state didn't change from outside. */
function renderGroupMenu(){
  const menu = document.getElementById('groupMenu');
  const rowLabel = r => L(r.esLabel, r.enLabel);
  const rowsHtml = ROW_DEFS.map(r=>
    `<label><input type="checkbox" data-row="${r.key}" ${laminaAView.rows[r.key]?'checked':''}> ${rowLabel(r)}</label>`
  ).join('');
  const colsHtml = COL_DEFS.map(c=>
    `<label><input type="checkbox" data-col="${c.key}" ${laminaAView.cols[c.key]?'checked':''}> ${colLabel(c.key)}</label>`
  ).join('');
  menu.innerHTML = `
    <div class="group-menu-col">
      <div class="side-menu-header">${L('Filas — Channel Grouping','Rows — Channel Grouping')}</div>
      ${rowsHtml}
    </div>
    <div class="group-menu-col">
      <div class="side-menu-header">${L('Vista','View')}</div>
      <label><input type="checkbox" data-a-hide="hideActual" ${laminaAValueVis.hideActual?'checked':''}> ${L('Ocultar Valor Actual','Hide Actual value')}</label>
      <label><input type="checkbox" data-a-hide="hideBudget" ${laminaAValueVis.hideBudget?'checked':''}> ${L('Ocultar Valor del Budget','Hide Budget value')}</label>
      ${otherViewsHtml('includeBrazilToggle')}
    </div>
    <div class="group-menu-col">
      <div class="side-menu-header">${L('Columnas','Columns')}</div>
      ${colsHtml}
    </div>`;
  menu.querySelectorAll('input[data-row]').forEach(inp=>{
    inp.addEventListener('change', e=>{
      laminaAView.rows[e.target.dataset.row] = e.target.checked;
      saveLaminaAView();
      refreshSlideA();
    });
  });
  menu.querySelectorAll('input[data-col]').forEach(inp=>{
    inp.addEventListener('change', e=>{
      laminaAView.cols[e.target.dataset.col] = e.target.checked;
      saveLaminaAView();
      refreshSlideA();
    });
  });
  menu.querySelectorAll('input[data-a-hide]').forEach(inp=>{
    inp.addEventListener('change', e=>{
      laminaAValueVis[e.target.dataset.aHide] = e.target.checked;
      saveLaminaAValueVis();
      refreshSlideA();
    });
  });
  document.getElementById('includeBrazilToggle')?.addEventListener('change', e=>{
    includeBrazil = e.target.checked;
    refreshAllForBrazilMerge();
  });
}
function refreshSlideA(){
  const idx = SLIDES.findIndex(s=>s.id==='a');
  document.querySelectorAll('.slide')[idx].outerHTML = slideA();
  wireCardClicks();
  fitHeroDeltas('a');
  if(!autoFitBusy) applyAutoFit('a');
}
/* Daily Tracker por País — column-only menu (no "Filas" section: the country list is fixed,

   the current deck actually has the slide (DECKS[...].slides includes 'daily') — Junior decks

      <label><input type="checkbox" data-daily-hide="hideBudget" ${dailyValueVis.hideBudget?'checked':''}> ${L('Ocultar Valor del Budget','Hide Budget value')}</label>

function refreshSlideYoy(){
  const idx = SLIDES.findIndex(s=>s.id==='yoy');
  if(idx<0) return;
  document.querySelectorAll('.slide')[idx].outerHTML = slideYoy();
  wireYoyMktOrgToggle();
  fitHeroDeltas('yoy');
  if(!autoFitBusy) applyAutoFit('yoy');
}
function wireYoyMktOrgToggle(){
  document.querySelectorAll('[data-yoymktorg]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(btn.dataset.yoymktorg === yoyMktOrgFilter) return;
      yoyMktOrgFilter = btn.dataset.yoymktorg;
      refreshSlideYoy();
      // Real bug found verifying this feature: refreshSlideYoy() only re-renders the SLIDE
      // (table/hero) — the custom-range panel lives in the separate #groupMenuYoy element, which
      // only renderGroupMenuYoy() touches. Without this, yoyCustomRangePanelHtml()'s own
      // yoyMktOrgFilter!=='total' guard (it's not wired for the MarketingOrg split — see that
      // function's comment) would go stale: the panel would keep showing/accepting input after
      // switching to a non-"total" org filter, even though slideYoy() already correctly ignores
      // it in that state (customRangeActive there re-checks yoyMktOrgFilter fresh every render) —
      // so the NUMBERS were never wrong, only the panel's own visibility was misleadingly stale.
      renderGroupMenuYoy();
    });
  });
}

function buildTOC(){
  document.getElementById('tocTitle').textContent = L('Índice','Index');
  const list = document.getElementById('tocList');
  list.innerHTML = SLIDES.map((s,i)=>`<button data-idx="${i}">${i+1}. ${L(s.es,s.en)}</button>`).join('');
  list.querySelectorAll('button[data-idx]').forEach(b=>{
    b.addEventListener('click', ()=>{
      document.querySelectorAll('.slide')[+b.dataset.idx].scrollIntoView({behavior:'smooth'});
    });
  });
}
/* Quick brand/region switch, top-left hover menu — jumps to the SAME lámina (by slide id, e.g.
   'yoy') in whichever of the other 3 deck the user picks. The target index is looked up fresh
   at CLICK time (via currentSlideId(), not baked into the button at render time) since which
   slide is "current" changes on every scroll without a re-render — no need to rebuild this list
   on scroll, only on deck-enter, because the lookup itself is what's dynamic, not the 3 buttons'
   labels. Falls back to that deck's cover (index 0) when the current lámina doesn't exist there
   (e.g. leaving Daily Tracker for a Junior deck, which has no 'daily' slide at all). */
function buildDeckSwitcher(){
  document.getElementById('switcherTitle').textContent = L('Cambiar a','Switch to');
  const list = document.getElementById('deckSwitcherList');
  const others = Object.keys(DECKS).filter(id=>id!==DECK_ID);
  list.innerHTML = others.map(id=>{
    const d = DECKS[id];
    return `<button data-deck="${id}">${d.brand} · ${d.region}</button>`;
  }).join('');
  list.querySelectorAll('button[data-deck]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const targetId = b.dataset.deck;
      const idx = DECKS[targetId].slides.indexOf(currentSlideId());
      enterDeck(targetId, idx<0?0:idx);
    });
  });
}

function wireCardClicks(){
  const CHANNEL_MODAL_META = {
    blended: {label:'Blended', icon:'spark', accent:'var(--brand-accent)'},
    branded: {label:'Brand TV Channels', icon:'broadcast', accent:'var(--brand-accent)'},
    paidSocialPlusOrganic: {label:'Paid Social + Organic', icon:'social', accent:'var(--color-oe-aqua)'},
    paidSocialASC: {label:L('Paid Social — ASC','Paid Social — ASC'), icon:'social', accent:'var(--color-oe-aqua)'},
    paidSocialNoASC: {label:L('Paid Social — sin ASC','Paid Social — no-ASC'), icon:'social', accent:'var(--color-oe-aqua)'},
    google: {label:'Google Channels', icon:'search', accent:'var(--color-sunny-orange)'},
    others: {label:'Others', icon:'grid', accent:'var(--color-happy-pink)'},
  };
  document.querySelectorAll('[data-modal="A"]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      const key = el.dataset.key;
      const m = CHANNEL_MODAL_META[key];
      const metricEl = e.target.closest('[data-metric]');
      const initialTab = metricEl ? metricEl.dataset.metric : 'Spend';
      openModal('xl', channelDetailModal(key, m.label, m.icon, m.accent), dlg=>wireModalTabs(dlg, key, m.label, m.icon, m.accent, initialTab));
    });
  });
}

/* ---------------- INIT: restore theme/lang/position on load ---------------- */
/* Theme/language restore needs no data at all -- runs immediately, works identically whether
   the visitor is looking at the login screen or (once authenticated) the Home/deck. */
(function initThemeLang(){
  const savedTheme = localStorage.getItem(LS_THEME);
  if(savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
  applyThemeIcon();

  const savedLang = localStorage.getItem(LS_LANG);
  if(savedLang){ LANG = savedLang; document.documentElement.lang = LANG; }
})();

/* Everything that DOES need DATA_BY_DECK populated -- was a top-level IIFE that ran the instant
   the script parsed, back when DATA_BY_DECK was loaded synchronously. Now called explicitly from
   onLoginSuccess() below, once Drive fetch + buildDeckData() have actually finished. */
function finishBootstrap(){
  loadLaminaAView();
  // Home title: append Month+Year to "Branformance" — month/year is shared across all 4 decks,
  // so any one deck's meta is a valid source. Written into data-es/data-en (not textContent
  // directly) so a later language toggle (which re-reads dataset via syncStaticLang()) still
  // shows the right computed string instead of reverting to the old static "Branformance".
  const anyMeta = Object.values(DATA_BY_DECK)[0].meta;
  const [homeY, homeM] = anyMeta.month.split('-').map(Number);
  const homeH1 = document.querySelector('#home h1');
  homeH1.dataset.es = `Branformance ${MONTHS_ES[homeM-1]} ${homeY}`;
  homeH1.dataset.en = `Branformance ${MONTHS_EN[homeM-1]} ${homeY}`;

  // Last-updated note, from the real build-time timestamp.
  const pad = n => String(n).padStart(2,'0');
  const g = GENERATED_AT;
  const timeStr = `${pad(g.hh)}:${pad(g.mm)}`;
  const noteEl = document.getElementById('updateNote');
  noteEl.dataset.es = `Última actualización: ${DAYS_ES[g.dow]}, ${g.d} de ${MONTHS_ES[g.m-1]} de ${g.y}, ${timeStr}`;
  noteEl.dataset.en = `Last updated: ${DAYS_EN[g.dow]}, ${MONTHS_EN[g.m-1]} ${g.d}, ${g.y}, ${timeStr}`;

  syncStaticLang();

  document.body.classList.remove('login-mode');
  document.body.classList.add('home-mode');

  const hash = location.hash.replace('#','');
  const [hashDeckId, hashIdx] = hash.split('/');
  if(DECKS[hashDeckId]){
    enterDeck(hashDeckId, parseInt(hashIdx, 10) || 0);
  }
}

/* ================= LOGIN (Google Identity Services) ================= */
/* Client ID is NOT a secret -- it's designed to live in page source (see Docs\
   Guia_Bot_Slack_GitHub_Google.md §C.4/C.5). Real access control is enforced by Google Drive's
   own per-file sharing (the export\ folder is shared only to the openenglish.com domain) -- the
   email-domain check below is just a friendlier error message for the wrong-account case; someone
   bypassing it client-side would still get a real 403 from Drive itself on the file fetch. */
const GOOGLE_CLIENT_ID = '832432252141-dcs35ujfvbqg42lotiln2ndmouq53r9n.apps.googleusercontent.com';
const DRIVE_EXPORT_FOLDER_ID = '1tF4sj9XWMJWDphx1nyodiDlqmnVYOMxr';
const ALLOWED_EMAIL_DOMAIN = 'openenglish.com';
// null = auto-detect cutoff as the latest date any deck's data actually covers (see
// loadDataByDeckAsync() in viewBuilder.js) -- the daily refresh script only ever needs to update
// the Drive JSON files; this page always reflects whatever day that data was last refreshed to,
// with no code redeploy required.
const CURRENT_CUTOFF = null;

let driveAccessToken = null;

function showLoginError(msg){
  const el = document.getElementById('loginError');
  el.textContent = msg;
  el.style.display = 'block';
}
function setLoginBusy(busy){
  document.getElementById('googleLoginBtn').disabled = busy;
  document.getElementById('loginLoading').style.display = busy ? 'block' : 'none';
}

/** Finds a file by exact name inside DRIVE_EXPORT_FOLDER_ID and returns its parsed JSON content,
 * authenticated with the logged-in user's own OAuth token (drive.readonly scope).
 * supportsAllDrives/includeItemsFromAllDrives/corpora=allDrives are REQUIRED here -- this
 * project's export\ folder lives inside a Shared Drive ("Unidad compartida"), and Drive API v3
 * silently excludes Shared Drive content from files.list/files.get without these flags (returns
 * an empty result, not an error) -- confirmed live: the very first end-to-end login test failed
 * with "not found" for a file that demonstrably exists and is shared correctly, tracing straight
 * to this Shared-Drive-vs-My-Drive default. */
async function fetchDriveJsonFile(fileName){
  const q = encodeURIComponent(`'${DRIVE_EXPORT_FOLDER_ID}' in parents and name='${fileName}' and trashed=false`);
  const listResp = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)&supportsAllDrives=true&includeItemsFromAllDrives=true&corpora=allDrives`,
    { headers: { Authorization: `Bearer ${driveAccessToken}` } });
  if(!listResp.ok) throw new Error(`Drive file search failed for ${fileName}: HTTP ${listResp.status}`);
  const listJson = await listResp.json();
  if(!listJson.files || !listJson.files.length) throw new Error(`${fileName} not found in the shared Drive folder`);
  const fileId = listJson.files[0].id;
  const contentResp = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media&supportsAllDrives=true`,
    { headers: { Authorization: `Bearer ${driveAccessToken}` } });
  if(!contentResp.ok) throw new Error(`Drive file download failed for ${fileName}: HTTP ${contentResp.status}`);
  return contentResp.json();
}

async function onLoginSuccess(){
  try{
    setLoginBusy(true);
    const userInfoResp = await fetch('https://www.googleapis.com/oauth2/v3/userinfo',
      { headers: { Authorization: `Bearer ${driveAccessToken}` } });
    const userInfo = await userInfoResp.json();
    const email = userInfo.email || '';
    if(!email.toLowerCase().endsWith('@' + ALLOWED_EMAIL_DOMAIN)){
      showLoginError(`Esta página es solo para cuentas @${ALLOWED_EMAIL_DOMAIN}. Iniciaste sesión como ${email || 'una cuenta desconocida'}.`);
      driveAccessToken = null;
      setLoginBusy(false);
      return;
    }
    DATA_BY_DECK = await loadDataByDeckAsync(deckId => fetchDriveJsonFile(`${deckId}.json`), CURRENT_CUTOFF);
    DATA = DATA_BY_DECK['OE-LATAM'];
    finishBootstrap();
  }catch(err){
    console.error('Login/data-load failed:', err);
    showLoginError('No se pudieron cargar los datos. Si el problema persiste, confirma que tu cuenta tiene acceso a la carpeta compartida en Drive.');
    setLoginBusy(false);
  }
}

function initGoogleLogin(){
  const tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: 'https://www.googleapis.com/auth/drive.readonly email',
    callback: (response) => {
      if(response.error){
        showLoginError('No se pudo iniciar sesión con Google. Intenta de nuevo.');
        return;
      }
      driveAccessToken = response.access_token;
      onLoginSuccess();
    },
  });
  document.getElementById('googleLoginBtn').addEventListener('click', () => {
    document.getElementById('loginError').style.display = 'none';
    tokenClient.requestAccessToken();
  });
}

/* google.accounts loads async (see the <script defer> in <head>) -- poll briefly rather than
   assume it's ready by the time this script runs; defer scripts don't guarantee a fixed order
   relative to non-deferred inline scripts like this one. */
(function waitForGoogleThenInit(){
  if(window.google && google.accounts && google.accounts.oauth2){
    initGoogleLogin();
  }else{
    setTimeout(waitForGoogleThenInit, 50);
  }
})();
</script>
