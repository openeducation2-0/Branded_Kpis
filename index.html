.zoom-group button{
  width:24px;height:24px;border-radius:50%;border:none;background:transparent;cursor:pointer;
  font-size:15px;font-weight:700;line-height:1;color:var(--text-primary);opacity:.75;transition:.15s;
  display:flex;align-items:center;justify-content:center;
}
.zoom-group button:hover:not(:disabled){opacity:1;background:var(--color-soft-blue);}
.zoom-group button:disabled{opacity:.28;cursor:default;}
.zoom-pct{font-size:11px;font-weight:700;color:var(--text-secondary);min-width:32px;text-align:center;cursor:text;}
.zoom-pct-input{font:inherit;font-size:11px;font-weight:700;color:var(--text-primary);width:34px;text-align:center;border:1px solid var(--brand-accent);border-radius:3px;background:var(--bg-card);padding:0;-moz-appearance:textfield;}
.zoom-pct-input::-webkit-outer-spin-button,.zoom-pct-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
body.home-mode .zoom-group{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.35);}
body.home-mode .zoom-group button{color:#fff;}
body.home-mode .zoom-pct{color:rgba(255,255,255,.85);}
@keyframes zoomCappedShake{0%,100%{transform:translateX(0);}20%,60%{transform:translateX(-3px);}40%,80%{transform:translateX(3px);}}
.zoom-group.zoom-capped{animation:zoomCappedShake .28s ease;}

#leftMenu{
  position:fixed;top:60px;left:16px;z-index:49;
  background:var(--bg-card);border:1px solid var(--border-soft);border-radius:var(--radius-lg);
  box-shadow:var(--shadow-lg);padding:var(--space-3);min-width:250px;
}
.side-menu-header{font-size:var(--text-sm);font-weight:700;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.06em;padding:4px 10px 8px;border-bottom:1px solid var(--border-soft);margin-bottom:6px;}
/* "Restablecer filtros" (explicit ask, 2026-08-14) — top-right corner of the whole menu popup,
   anchored to #groupMenu/#groupMenuDaily/#groupMenuYoy's own position:fixed (see that rule). */
.menu-reset-btn{position:absolute;top:8px;right:10px;background:none;border:1px solid var(--border-soft);border-radius:var(--radius-full);padding:3px 10px;font-size:10.5px;font-weight:600;color:var(--text-secondary);cursor:pointer;transition:.15s;}
.menu-reset-btn:hover{background:var(--bg-section);color:var(--text-primary);border-color:var(--text-secondary);}
/* Custom date-range panel (YOY only) — wider than the other 2 groupMenu columns since it packs
   date inputs + a mode toggle + a weekday grid, none of which fit the plain checkbox-list width
   the other 2 columns were sized for. */
.yoy-custom-range-col{flex:1.7;min-width:270px;}
.daily-custom-range-col{flex:1.7;min-width:270px;}
.dtr-week-row{display:flex;flex-wrap:wrap;gap:5px;padding:2px 10px 8px;}
.dtr-week-btn{border:1px solid var(--border-soft);background:var(--bg-section);color:var(--text-secondary);
  border-radius:var(--radius-full);padding:5px 10px;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;transition:.15s;}
.dtr-week-btn.on{background:var(--brand-accent);color:#fff;border-color:var(--brand-accent);}
.dtr-yesterday-btn{background:var(--bg-card);}
.ycr-row{padding:4px 10px 0;font-size:12.5px;font-weight:600;color:var(--text-secondary);}
.ycr-dates{display:flex;align-items:center;gap:6px;padding:2px 10px 8px;}
.ycr-dates input[type=date]{font-size:12px;color:var(--text-primary);background:var(--bg-section);border:1px solid var(--border-soft);border-radius:var(--radius-md);padding:3px 5px;font-family:inherit;min-width:0;flex:1;}
.ycr-dates span{color:var(--text-secondary);font-size:12px;}
.ycr-compare-modes{display:flex;gap:2px;background:var(--bg-section);border-radius:var(--radius-full);padding:2px;margin:2px 10px 8px;}
.ycr-compare-modes button{flex:1;border:none;background:none;padding:4px 6px;border-radius:var(--radius-full);font-size:10.5px;font-weight:600;color:var(--text-secondary);cursor:pointer;white-space:nowrap;transition:.15s;}
.ycr-compare-modes button.on{background:var(--brand-accent);color:#fff;}
.ycr-exact-dates{padding:2px 10px 6px;font-size:11.5px;color:var(--text-secondary);line-height:1.6;}
.ycr-exact-dates b{color:var(--text-primary);font-weight:700;}
.ycr-availability{padding:6px 10px;margin:0 10px 8px;font-size:11px;color:var(--text-secondary);line-height:1.6;background:var(--bg-section);border-radius:var(--radius-md);}
.ycr-availability b{color:var(--text-primary);font-weight:700;}
.ycr-warning{margin:2px 10px 8px;padding:6px 8px;border-radius:var(--radius-md);background:color-mix(in srgb, var(--warn) 16%, transparent);color:color-mix(in srgb, var(--warn) 65%, var(--text-primary));font-size:11.5px;line-height:1.4;}
.weekday-selector{display:flex;gap:3px;padding:2px 10px 8px;user-select:none;}
.wd-btn{flex:1;border:1px solid var(--border-soft);background:var(--bg-section);color:var(--text-secondary);font-size:10.5px;font-weight:700;padding:5px 0;border-radius:var(--radius-md);cursor:pointer;transition:.1s;}
.wd-btn.on{background:var(--brand-accent);border-color:var(--brand-accent);color:#fff;}
/* A day the active period can't even contain (explicit ask, 2026-08-17) — visually muted and
   inert, taking precedence over `.on` (a stale/default "selected" state on a day that's now
   disabled must still read as off-limits, not highlighted). */
.wd-btn:disabled{cursor:not-allowed;opacity:.35;}
.wd-btn:disabled.on{background:var(--bg-section);border-color:var(--border-soft);color:var(--text-secondary);}
#tocList button, #deckSwitcherList button{display:block;width:100%;text-align:left;background:none;border:none;padding:8px 10px;border-radius:var(--radius-sm);font-size:var(--text-sm);color:var(--text-primary);}
#tocList button:hover, #deckSwitcherList button:hover{background:var(--color-soft-blue);}
#switcherTitle{margin-top:6px;}
.home-link{display:block;width:100%;text-align:left;background:none;border:none;border-top:1px solid var(--border-soft);margin-top:6px;padding:10px 10px 2px;font-size:var(--text-sm);color:var(--color-sunny-orange);font-weight:700;}

/* ================= MODAL ================= */
dialog.modal{
  border:none;border-radius:var(--radius-xl);padding:0;box-shadow:var(--shadow-lg);
  width:min(920px,88vw);aspect-ratio:16/9;background:var(--bg-card);color:var(--text-primary);
}
dialog.modal.wide{width:min(1100px,92vw);aspect-ratio:auto;height:min(560px,80vh);}
dialog.modal.tall{width:min(560px,80vw);aspect-ratio:auto;height:min(720px,86vh);}
dialog.modal.xl{width:min(1360px,96vw);aspect-ratio:auto;height:min(880px,94vh);}
dialog.modal::backdrop{background:rgba(10,15,25,.55);backdrop-filter:blur(2px);}
.modal-inner{height:100%;display:flex;flex-direction:column;padding:var(--space-8);overflow:hidden;}
.modal-body{flex:1;min-height:0;display:flex;flex-direction:column;}
.modal-inner h3{font-size:var(--text-2xl);color:var(--brand-accent);}
.modal-close{position:absolute;top:18px;right:18px;background:var(--bg-section);border:none;border-radius:50%;width:34px;height:34px;font-size:20px;}
/* ---- channel-detail modal (Lamina A): tabbed, one big trend chart per metric,
   chart on the left + a stat sidebar on the right (never stacked/cramped above it).
   Redesigned to feel premium: icon chip in the header, a persistent chart title
   (brand/region/channel/metric — so a screenshot of just the chart is self-
   explanatory), legend anchored bottom-right of the chart (not floating on top),
   and an accent-colored top rule under the tab bar for a touch of polish. ---- */
.modal-head{display:flex;align-items:center;gap:14px;}
.modal-head .icon-chip{width:44px;height:44px;}
.modal-head .icon-chip svg{width:22px;height:22px;}
.modal-head h3{font-size:var(--text-2xl);}
.modal-tabs{display:flex;gap:4px;margin-top:var(--space-5);border-bottom:1px solid var(--border-soft);flex-wrap:wrap;position:relative;}
.modal-tabs button{
  background:none;border:none;padding:10px 18px;font-size:var(--text-sm);font-weight:600;color:var(--text-secondary);
  border-bottom:2.5px solid transparent;margin-bottom:-1px;border-radius:var(--radius-sm) var(--radius-sm) 0 0;transition:.15s;
}
.modal-tabs button:hover{color:var(--text-primary);background:var(--bg-section);}
.modal-tabs button.on{color:var(--accent,var(--brand-accent));border-bottom-color:var(--accent,var(--brand-accent));background:var(--bg-section);}
/* Tab groups (money / leads / sales — see METRIC_TABS' `group` field) get a small always-visible
   color dot so the grouping reads at a glance even before you click anything, and the active
   state's color/underline switches to the group color instead of the generic channel accent —
   this takes precedence via the [data-group] attribute selector's higher specificity. */
.modal-tabs button[data-group]{display:inline-flex;align-items:center;gap:6px;}
.modal-tabs button[data-group]::before{content:"";width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.modal-tabs button[data-group="money"]::before{background:var(--tab-money);}
.modal-tabs button[data-group="leads"]::before{background:var(--tab-leads);}
.modal-tabs button[data-group="sales"]::before{background:var(--tab-sales);}
.modal-tabs button[data-group="money"].on{color:var(--tab-money);border-bottom-color:var(--tab-money);}
.modal-tabs button[data-group="leads"].on{color:var(--tab-leads);border-bottom-color:var(--tab-leads);}
.modal-tabs button[data-group="sales"].on{color:var(--tab-sales);border-bottom-color:var(--tab-sales);}
.modal-tab-body{flex:1;min-height:0;display:flex;flex-direction:column;padding-top:var(--space-6);}
.mtc-row{flex:1;min-height:0;display:flex;align-items:stretch;gap:var(--space-8);}
.mtc-chart-col{flex:1;min-width:0;display:flex;flex-direction:column;}
.mtc-chart-title{margin-bottom:var(--space-4);}
.mtc-chart-title .ct-main{font-family:var(--font-titles);font-weight:700;font-size:var(--text-lg);color:var(--text-primary);}
.mtc-chart-title .ct-sub{font-size:15px;color:var(--text-secondary);margin-top:2px;}
.big-chart-wrap{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;}
.big-chart-wrap svg{width:100%;flex:1;min-height:0;overflow:visible;}
.chart-legend-lg{display:flex;gap:var(--space-5);font-size:12.5px;justify-content:flex-end;margin-top:var(--space-2);}
.chart-legend-lg span{display:inline-flex;align-items:center;gap:7px;color:var(--text-secondary);font-weight:600;}
.chart-legend-lg i{width:16px;height:0;border-top:3px solid; border-radius:3px;display:inline-block;}
.chart-legend-lg .lg-budget i{border-top-style:dashed;}
.chart-hover-line{stroke:var(--text-secondary);stroke-width:1;stroke-dasharray:3,3;opacity:0;pointer-events:none;}
.chart-hover-dot{opacity:0;pointer-events:none;}
.chart-tooltip{
  position:absolute;pointer-events:none;background:var(--bg-card);border:1px solid var(--border-soft);
  border-radius:var(--radius-md);box-shadow:var(--shadow-lg);padding:11px 15px;font-size:15px;
  opacity:0;transition:opacity .1s;white-space:nowrap;z-index:5;
}
.chart-tooltip .tt-month{font-weight:700;color:var(--text-primary);margin-bottom:5px;font-size:12.5px;}
.chart-tooltip .tt-row{display:flex;align-items:center;justify-content:space-between;gap:14px;color:var(--text-secondary);margin-top:2px;}
.chart-tooltip .tt-row b{color:var(--text-primary);font-weight:700;}
.chart-tooltip .tt-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;}
.chart-tooltip .tt-diff{border-top:1px solid var(--border-soft);margin-top:5px;padding-top:5px;}
.chart-tooltip .tt-diff b{font-weight:700;}
.chart-tooltip .tt-diff.pos b{color:var(--pos);}
.chart-tooltip .tt-diff.neg b{color:var(--neg);}

.mtc-sidebar{width:240px;flex-shrink:0;display:flex;flex-direction:column;gap:var(--space-3);justify-content:center;}
.mtc-stat{background:var(--bg-section);border-radius:var(--radius-lg);padding:var(--space-4) var(--space-5);display:flex;align-items:center;gap:12px;}
.mtc-stat .icon-chip{width:34px;height:34px;flex-shrink:0;}
.mtc-stat .icon-chip svg{width:17px;height:17px;}
.mtc-stat .label{font-size:14px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.05em;}
/* Same inversion as .mc-actual/.mc-delta (see that comment above): Variance is now the
   headline figure of these 3 stacked sidebar cards, Actual/Budget shrink and lose their bold. */
.mtc-stat .value{font-family:var(--font-display);font-weight:400;font-size:var(--text-base);margin-top:3px;color:var(--text-primary);}
.mtc-stat.budget .value{font-size:var(--text-base);color:var(--text-secondary);}
.mtc-stat.variance{border:1px solid var(--border-soft);}
.mtc-stat.variance.pos{background:color-mix(in srgb, var(--pos) 12%, transparent);border-color:color-mix(in srgb, var(--pos) 30%, transparent);}
.mtc-stat.variance.neg{background:color-mix(in srgb, var(--neg) 12%, transparent);border-color:color-mix(in srgb, var(--neg) 30%, transparent);}
/* Spend's variance card here, same neutral treatment as the table/hero .mc-delta.neutral. */
.mtc-stat.variance.neutral{background:color-mix(in srgb, var(--text-secondary) 12%, transparent);border-color:color-mix(in srgb, var(--text-secondary) 30%, transparent);}
/* Item 7's grid modal (redesigned 2026-08-14, 2nd pass): metrics down as rows, OE Adult/OE
   Junior/Total across as columns, matching the layout the user described directly. */
/* Fixed px tracks (not fr) so the label/OE-Adult/OE-Junior columns land at the EXACT same x
   position in both grids below -- real bug fixed 2026-08-18: .mktorg-grid has 4 columns (label +
   OE Adult + OE Junior + Total) and .mktorg-cmp-grid has 3 (no Total), so identical "1.3fr 1fr..."
   ratios in each divided a DIFFERENT total number of fr-units, making every column a different
   width between the two sections -- scanning down the modal, "OE Adult" visibly jumped left/right
   at the section boundary ("no esta la data sobre las mismas columnas"). Fixed widths make the two
   grids agree regardless of how many columns either one happens to have. */
.mktorg-grid{display:grid;grid-template-columns:220px 200px 200px 200px;gap:6px 10px;align-items:center;padding:4px 0;}
.mktorg-row-label{font-size:var(--text-sm);font-weight:600;color:var(--text-primary);}
.mktorg-grid-header{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-secondary);text-align:center;padding-bottom:6px;border-bottom:1px solid var(--border-soft);}
.mktorg-cell{text-align:center;border-radius:var(--radius-md);overflow:hidden;background:var(--bg-section);}
.mktorg-cell-val{font-family:var(--font-display);font-weight:700;font-size:var(--text-base);padding:6px 4px 3px;color:var(--text-primary);}
/* "abajito el porcentaje de share... en un grid más claro" (explicit ask) — the %-share sub-row
   is visually LIGHTER than the absolute value above it, not just smaller text. */
.mktorg-cell-pct{font-size:11px;color:var(--text-secondary);background:var(--bg-card);padding:2px 4px 4px;}
.mktorg-cell-delta{display:flex;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:700;padding:2px 4px 5px;background:var(--bg-card);}
.mktorg-cell-delta.pos{color:var(--pos);} .mktorg-cell-delta.neg{color:var(--neg);}
.mktorg-cell-delta svg{width:8px;height:8px;}
.mktorg-cell-delta-label{font-weight:500;color:var(--text-secondary);}
.mktorg-cell.mktorg-total{background:color-mix(in srgb, var(--brand-accent) 10%, transparent);}
.mktorg-cell.mktorg-total .mktorg-cell-val{color:var(--brand-accent);}
.mktorg-empty{padding:20px;text-align:center;color:var(--text-secondary);font-size:var(--text-sm);}
/* Redesigned 2026-08-14 (3rd pass): a scrollable wrapper (fallback only — the 'xl' modal size is
   sized to fit most filter combinations without it) holding two independent sections — the
   share+total grid above stays as-is for Leads/Sales/NewCash, and a 2nd comparison-only mini-grid
   (OE Adult/OE Junior, no Total column) reuses the SAME .metric-cell markup the main table already
   renders for every other visible metric, just centered instead of table-aligned. */
.mktorg-modal-scroll{flex:1;min-height:0;overflow-y:auto;margin-top:var(--space-4);padding-right:4px;}
.mktorg-section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-secondary);margin:10px 0 4px;}
.mktorg-section-title:first-child{margin-top:0;}
.mktorg-cmp-grid{display:grid;grid-template-columns:220px 200px 200px;gap:0 10px;align-items:center;}
.mktorg-cmp-label{font-size:var(--text-sm);font-weight:600;color:var(--text-primary);padding:3px 0;border-top:1px solid var(--border-soft);}
.mktorg-cmp-cell{text-align:center;padding:3px 0;border-top:1px solid var(--border-soft);}
.mktorg-cmp-cell .metric-cell{display:inline-flex;flex-direction:column;align-items:center;}
/* Tighter than the default .mc-budget/.mc-delta spacing (meant for roomier table/hero contexts) —
   this modal can show up to 13 comparison rows at once, so every row needs to stay as compact as
   legibility allows to minimize how often the scroll fallback above actually triggers. */
.mktorg-cmp-cell .mc-budget{margin-top:0;}
.mktorg-cmp-cell .mc-delta{margin-top:0;}
/* Item 7's click affordance — explicit ask: no icon, just the country name (or the hero's own
   label) itself is clickable. A background highlight on the row's name doubles as feedback for
   the whole .ch-row (which has hover disabled at the row level, see .ch-row.no-click above);
   the hero's label underlines instead, since a background fill there would clash with the
   hero card's own background. */
.ch-name.mktorg-clickable, .bh-head.mktorg-clickable{cursor:pointer;}
.ch-name.mktorg-clickable:hover{background:var(--bg-section);border-radius:var(--radius-md);}
.bh-head.mktorg-clickable:hover .bh-badge{text-decoration:underline;text-decoration-color:var(--brand-accent);text-underline-offset:3px;}
.mtc-stat.variance .value{display:flex;align-items:center;gap:6px;font-size:var(--text-2xl);font-weight:700;}
.mtc-stat.variance.pos .value{color:var(--pos);}
.mtc-stat.variance.neg .value{color:var(--neg);}
.mtc-stat.variance.neutral .value{color:var(--text-secondary);}
.mtc-stat.variance.pos .icon-chip{background:color-mix(in srgb, var(--pos) 20%, transparent);color:var(--pos);}
.mtc-stat.variance.neg .icon-chip{background:color-mix(in srgb, var(--neg) 20%, transparent);color:var(--neg);}
.mtc-stat.variance.neutral .icon-chip{background:color-mix(in srgb, var(--text-secondary) 20%, transparent);color:var(--text-secondary);}
.mtc-stat.variance .value small{font-size:16px;font-weight:600;opacity:.85;}

.footnote{font-size:14px;color:var(--text-secondary);margin-top:var(--space-2);}
</style>

/* YoY's comparison value is last year's actual, never a budget — metricCell's default "Bgt"

/* Lámina A ("...Pacing vs reforecast...") is the ONLY lámina whose delta splits the pp/%

function monthIsComplete(){ return DATA.meta.asOfDay === DATA.meta.daysInMonth; }
/* Spend/New Cash Core/Impacto are absolute $ figures compared against a FULL-MONTH budget —
   while the month is still open, actual-vs-budget is an unfair comparison (23 days of actual vs
   31 days of budget), so metricCell()'s direct delta is wrong here. Instead: pacing. Day-pacing
   = day-of-month elapsed ÷ days in month. Value-pacing = actual ÷ full-month budget. If the two
   match, you're tracking exactly the budget's pace. For Spend, running BELOW day-pacing is good
   (spending slower than planned); for New Cash Core/Impacto, running ABOVE is good (earning
   faster than planned). Used by heroCell()/chCellHtml() only when !monthIsComplete() — once the
   month closes, these metrics go back to the normal metricCell() delta everywhere. */
function pacingCell(av, bv, fmtFn, higherIsBetter, forceGray){
  if(av==null) return `<div class="metric-cell"><div class="mc-actual">—</div></div>`;
  const day = DATA.meta.asOfDay, days = DATA.meta.daysInMonth;
  const dayPacing = day/days;
  let pacingHtml = '';
  if(bv!=null && bv!==0){
    const valuePacing = av/bv;
    const diffPP = (valuePacing-dayPacing)*100;
    // Same rounding-before-color rule as computeDelta() — decide from the rounded pp actually
    // shown in "(±Y.Ypp)", not the raw ratio comparison, so a "-0.0pp" never renders red.
    const diffPPRounded = Math.round(diffPP*10)/10;
    const good = higherIsBetter ? diffPPRounded>=0 : diffPPRounded<=0;
    const colorCls = forceGray ? 'neutral' : (good?'pos':'neg');
    // Arrow direction is the RAW sign of diffPP (pacing ahead vs behind), independent of
    // higherIsBetter -- same fix/reasoning as computeDelta()'s `up` vs `good` split, 2026-08-18.
    const up = diffPPRounded>=0;
    // Same main/sub split as computeDelta() — "Pacing XX%" and "(±Y.Ypp)" each get their own
    // line instead of competing for width on one, so both can render at a legible size.
    pacingHtml = `<div class="mc-delta mc-delta-split ${colorCls}"><div class="mc-delta-main">${arrowIcon(up)}${L('Pacing','Pacing')} ${(valuePacing*100).toFixed(0)}%</div><div class="mc-delta-sub">(${diffPP>=0?'+':''}${diffPP.toFixed(1)}pp)</div></div>`;
  }
  // "(mes completo)"/"(full month)" dropped 2026-08-14: redundant with the slide subtitle, which
  // already spells out "Budget: full month (...)" — repeating it in every single cell was real,
  // measured extra width that pushed Spend/Leads/NewCash into visible overflow now that those
  // columns are visible by default (see task tracking this fix). Matches metricCell()'s own
  // plain "Bgt $X" label used everywhere else (Daily Tracker, YoY).
  return `<div class="metric-cell"><div class="mc-actual">${fmtFn(av)}</div><div class="mc-budget">${L('Bgt','Bgt')} ${fmtFn(bv)}</div>${pacingHtml}</div>`;
}

function getTrend(key){

function deriveTrend(rawSeries){

    CPL: m.Leads? m.Spend/m.Leads:null, CMPS: m.Sales? m.Spend/m.Sales:null,
    MarginPct: m.NewCash? (m.NewCash-m.Spend)/m.NewCash:null,

function getBudgetTrend(key){ return deriveTrend(DATA.budgetTrends[key]); }
/* Net Impact = (diff of New Cash Core) - (diff of Spend), where "diff" = a's side minus b's side
   (a=actual, b=budget here; a=this-year, b=prior-year in the YoY lámina — impact() itself doesn't
   know or care which). REWRITTEN 2026-08 (explicit ask — was previously a's own absolute NewCash
   adjusted by the spend variance; the correction is to use DIFFERENCES on BOTH sides, never an
   absolute level): diffNewCash - diffSpend. Sign check against the user's own worked example
   (NewCash +100k YoY, Spend +100k YoY => Net Impact 0): (a.NewCash-b.NewCash) is +100k,
   (a.Spend-b.Spend) is +100k, +100k-(+100k)=0. Spending MORE (diffSpend positive) SUBTRACTS from
   Net Impact; spending LESS (diffSpend negative) ADDS to it — both are exactly what a single
   subtraction already does, no separate sign-flip branch needed. Because Net Impact is now
   ALREADY a comparison of two comparisons, it has no further "budget" of its own — every row/hero
   cell renders it as a single muted value (see chCellHtml/dailyCellHtml/yoyCellHtml/heroCell*'s
   'Impact' cases), same treatment as LtvShort/FullUnitCmShort/FullCmPctShort. */
function impact(a,b){ return (a.NewCash-b.NewCash) - (a.Spend-b.Spend); }
function getSeriesPair(key){
  const actual = getTrend(key), budget = getBudgetTrend(key);
  /* LeadsShare/SalesShare = this channel's monthly Leads/Sales as a % of blended's — the same
     "share of company total" metric shown on the row (%Leads/%Sales columns), just as a Jan-Jul
     trend instead of a single MTD number, so it gets its own modal tab like every other row
     metric. Needs the blended trend as the denominator; for key==='blended' itself this is
     trivially ~100% every month, which is fine (harmless edge case, matches how Impact/other
     metrics don't special-case Blended either). */
  const blActual = getTrend('blended'), blBudget = getBudgetTrend('blended');
  /* Net Impact's own "budget" series is a flat 0 (a month landing exactly on budget nets to 0 by
     definition — see impact()'s new formula) — the modal chart/sidebar still work unmodified:
     computeDelta()'s existing bv===0 guard already renders "—" for the variance card instead of a
     meaningless %-of-zero, and the chart draws a flat reference line at 0, both correct as-is. */
  const actualWithImpact = actual.map((m,i)=>({...m, Impact: impact(m, budget[i]),
    Conversion: m.Leads? m.Sales/m.Leads : null,
    LeadsShare: blActual[i].Leads ? m.Leads/blActual[i].Leads : null,
    SalesShare: blActual[i].Sales ? m.Sales/blActual[i].Sales : null}));
  const budgetWithImpact = budget.map((m,i)=>({...m, Impact: 0, Conversion: m.Leads? m.Sales/m.Leads : null,
    LeadsShare: blBudget[i].Leads ? m.Leads/blBudget[i].Leads : null,
    SalesShare: blBudget[i].Sales ? m.Sales/blBudget[i].Sales : null}));
  return {actual: actualWithImpact, budget: budgetWithImpact};
}

let includeBrazil = true;

function mergeBudgetEntry(a, b){

/* Big trend chart: actual (solid) vs budget (dashed), shared axis, gridlines,
   and a callout on the last point showing both the absolute and % (or pp) delta. */
/* Big trend chart — actual (solid) vs budget (dashed). padL is sized to the widest
   y-axis label so currency values never clip past the left edge (that clipping was
   the "numbers spilling out of the chart" bug). Every month gets an invisible hover
   zone + a hidden dot on each line; wireChartTooltip() reveals them on mousemove
   using the same padding/scale numbers, stashed on the <svg> as data-* attributes. */
function bigChart(actualSeries, budgetSeries, fmtFn, color){
  const W=900, H=340;
  const n = actualSeries.length;
  const aVals = actualSeries.map(m=>m.__v), bVals = budgetSeries.map(m=>m.__v);
  const vals = [...aVals, ...bVals].filter(v=>v!=null);
  /* Scale is derived ONLY from the values actually being charted, never a hardcoded ceiling —
     a fixed floor of "1" here used to force every percentage metric (e.g. Conversión, often
     under 8%) onto a 0–100% axis, making the line look like a flat sliver near the bottom. Add
     a little headroom above the peak so the line doesn't touch the top gridline. */
  const min = Math.min(0, ...vals);
  let max = Math.max(...vals);
  if(!isFinite(max) || max<=min) max = min+1;
  max += (max-min)*0.12;
  const range = (max-min)||1;
  const labelLen = Math.max(fmtFn(max).length, fmtFn(min).length, 4);
  const padL = Math.max(58, 16 + labelLen*7.4), padR = 30, padT = 22, padB = 42;
  const step = (W-padL-padR)/(n-1||1);
  const x = i => padL + i*step;
  const y = v => padT + (H-padT-padB)*(1-((v-min)/range));
  const line = vals2 => vals2.map((v,i)=> v==null? null : `${x(i).toFixed(1)},${y(v).toFixed(1)}`).filter(Boolean).join(' ');
  const gridN = 4;
  const gridLines = Array.from({length:gridN+1}, (_,i)=>{
    const v = min + (range*i/gridN);
    const yy = y(v);
    return `<line x1="${padL}" y1="${yy.toFixed(1)}" x2="${W-padR}" y2="${yy.toFixed(1)}" stroke="var(--border-soft)" stroke-width="1"/>
      <text x="${padL-12}" y="${(yy+4).toFixed(1)}" font-size="12" fill="var(--text-secondary)" text-anchor="end">${fmtFn(v)}</text>`;
  }).join('');
  const monthLabels = actualSeries.map((m,i)=>`<text x="${x(i).toFixed(1)}" y="${H-16}" font-size="12" fill="var(--text-secondary)" text-anchor="middle">${m.label}</text>`).join('');
  const lastI = n-1, lastA = aVals[lastI];
  const currentDot = lastA!=null ? `<circle cx="${x(lastI).toFixed(1)}" cy="${y(lastA).toFixed(1)}" r="4" fill="${color}" stroke="var(--bg-card)" stroke-width="1.75"/>` : '';
  const hoverDots = aVals.map((v,i)=> v==null?'':`<circle class="chart-hover-dot dot-a" data-i="${i}" cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="4" fill="${color}"/>`).join('')
    + bVals.map((v,i)=> v==null?'':`<circle class="chart-hover-dot dot-b" data-i="${i}" cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="4" fill="var(--chart-budget-line)"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" data-w="${W}" data-h="${H}" data-padl="${padL}" data-padr="${padR}" data-n="${n}">
    ${gridLines}
    <polyline points="${line(bVals)}" fill="none" stroke="var(--chart-budget-line)" stroke-width="1.75" stroke-dasharray="6,5" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="${line(aVals)}" fill="none" stroke="${color}" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/>
    ${currentDot}
    <line class="chart-hover-line" x1="0" y1="${padT}" x2="0" y2="${H-padB}"/>
    ${hoverDots}
    ${monthLabels}
  </svg>`;
}
/* Reveals the hover line + point dots + tooltip as the mouse moves across the chart,
   snapping to the nearest month. Reads geometry from the <svg data-*> attrs written
   by bigChart() so the coordinate math always matches what was actually drawn.
   Also supports CLICK-TO-PIN: clicking a month draws a persistent ring on that point
   (reusing the already-positioned dot's cx/cy, so no y-scale duplication is needed)
   and calls onSelect(i) so the caller (wireModalTabs) can refresh the sidebar cards
   to show that month's Actual/Budget/Variance instead of always the current month. */
function wireChartTooltip(wrap, months, aVals, bVals, fmtFn, accent, invert, isPP, onSelect, aLabel, bLabel){
  aLabel = aLabel || 'Actual'; bLabel = bLabel || 'Budget';
  const svg = wrap.querySelector('svg');
  const tooltip = wrap.querySelector('.chart-tooltip');
  const hoverLine = svg.querySelector('.chart-hover-line');
  const dotsA = [...svg.querySelectorAll('.dot-a')], dotsB = [...svg.querySelectorAll('.dot-b')];
  const W = +svg.dataset.w, padL = +svg.dataset.padl, padR = +svg.dataset.padr, n = +svg.dataset.n;
  const step = (W-padL-padR)/(n-1||1);
  let pinEl = null;
  function setPin(i){
    const dot = dotsA.find(d=>+d.dataset.i===i) || dotsB.find(d=>+d.dataset.i===i);
    if(pinEl){ pinEl.remove(); pinEl=null; }
    if(!dot) return;
    pinEl = document.createElementNS('http://www.w3.org/2000/svg','circle');
    pinEl.setAttribute('cx', dot.getAttribute('cx'));
    pinEl.setAttribute('cy', dot.getAttribute('cy'));
    pinEl.setAttribute('r', 8);
    pinEl.setAttribute('fill','none');
    pinEl.setAttribute('stroke', accent);
    pinEl.setAttribute('stroke-width','2');
    pinEl.classList.add('chart-pin');
    svg.appendChild(pinEl);
  }
  function show(i){
    const xPix = padL + i*step;
    hoverLine.setAttribute('x1', xPix); hoverLine.setAttribute('x2', xPix); hoverLine.style.opacity = 1;
    dotsA.forEach(d=> d.style.opacity = (+d.dataset.i===i)?1:0);
    dotsB.forEach(d=> d.style.opacity = (+d.dataset.i===i)?1:0);
    const rect = wrap.getBoundingClientRect();
    const scaleX = rect.width/W;
    const px = xPix*scaleX;
    tooltip.style.left = Math.min(Math.max(px-75,4), rect.width-160)+'px';
    tooltip.style.top = '6px';
    const d = computeDelta(aVals[i], bVals[i], fmtFn, invert, isPP);
    const diffRow = d ? `<div class="tt-row tt-diff ${d.good?'pos':'neg'}"><span>${L('Diferencia','Difference')}</span><b>${d.text}</b></div>` : '';
    tooltip.innerHTML = `<div class="tt-month">${months[i]}</div>
      <div class="tt-row"><span><span class="tt-dot" style="background:${accent}"></span>${aLabel}</span><b>${fmtFn(aVals[i])}</b></div>
      <div class="tt-row"><span><span class="tt-dot" style="background:var(--chart-budget-line)"></span>${bLabel}</span><b>${fmtFn(bVals[i])}</b></div>${diffRow}`;
    tooltip.style.opacity = 1;
  }
  function hide(){ hoverLine.style.opacity=0; dotsA.forEach(d=>d.style.opacity=0); dotsB.forEach(d=>d.style.opacity=0); tooltip.style.opacity=0; }
  function nearestIndex(e){
    const rect = wrap.getBoundingClientRect();
    const scaleX = rect.width/W;
    const localX = (e.clientX-rect.left)/scaleX;
    const i = Math.round((localX-padL)/step);
    return Math.max(0, Math.min(n-1, i));
  }
  wrap.addEventListener('mousemove', (e)=> show(nearestIndex(e)));
  wrap.addEventListener('mouseleave', hide);
  wrap.addEventListener('click', (e)=>{
    const i = nearestIndex(e);
    setPin(i);
    if(onSelect) onSelect(i);
  });
  setPin(n-1); // defaults to the current month, matching the sidebar's initial state
}
/* Every metric shown on the Lámina A row/hero MUST have a matching tab here (the user's exact
   complaint: "no hay un tab para ver el porcentaje de leads/sales" — the row shows %Leads/
   %Sales but the modal had no tab matching that number). LeadsShare/SalesShare are placed right
   next to their raw-count siblings (Leads/Sales) so both views are reachable, in the same
   relative order as the row columns (Spend, share metrics, CPL, CMPS, MNCC, New Cash Core,
   Impacto). Conversion is a bonus tab (Sales/Leads), not tied to a row column. */
/* Tabs are clustered into 3 color-coded groups (money / leads / sales) so the tab bar itself
   reads as organized, not just a flat list — see `.mtab[data-group]` CSS. Money group first
   (Spend, New Cash Core, Impacto — the SpendMix/"Distribución Spend" tab, Branded-only, is
   spliced in right after Spend by channelDetailModal(), same group/color), then Leads group
   (Leads, CPL, %Leads), then Sales group (Ventas, CMPS, %Ventas, Conversión). MNCC stands
   alone (it's a blended efficiency read, not specifically money/leads/sales). */
const METRIC_TABS = [
  {key:'Spend', label:'Spend', fmt:fmtUSD, invert:true, pp:false, group:'money'},
  {key:'MarginPct', label:'% MNCC', fmt:fmtPct, invert:false, pp:true, group:'money'},
  {key:'NewCash', label:'New Cash Core', fmt:fmtUSD, invert:false, pp:false, group:'money'},
  {key:'Impact', label:'Net Impact', fmt:fmtUSD, invert:false, pp:false, group:'money'},
  {key:'Leads', label:'Leads', fmt:fmtNum, invert:false, pp:false, group:'leads'},
  {key:'CPL', label:'CPL', fmt:fmtUSD, invert:true, pp:false, group:'leads'},
  {key:'Conversion', label:L('Conversión','Conversion'), fmt:fmtPctConversion, invert:false, pp:true, group:'leads'},
  {key:'LeadsShare', label:L('% Leads','% Leads'), fmt:fmtPct, invert:false, pp:true, group:'leads'},
  {key:'Sales', label:L('Ventas','Sales'), fmt:fmtNum, invert:false, pp:false, group:'sales'},
  {key:'CMPS', label:'CMPS', fmt:fmtUSD, invert:true, pp:false, group:'sales'},
  {key:'SalesShare', label:L('% Ventas','% Sales'), fmt:fmtPct, invert:false, pp:true, group:'sales'},
];
function chartContextLine(){
  const [, m] = DATA.meta.month.split('-').map(Number);
  const d = currentDeck();
  return `${d.brand} · ${regionLabel()} · ${MONTHS_EN[m-1]} ${DATA.meta.month.slice(0,4)} · MTD`;
}
/* Builds the three sidebar stat cards (Actual/Budget/Variance) for a given month index.
   Shared by the tab's initial render (idx = last month, "current month") and by clicking a
   point on the chart (idx = the clicked month) — see wireChartTooltip's onSelect callback in
   wireModalTabs. Labels switch from "current month" wording to the actual month name once a
   non-current month is selected, so it's always clear which month the cards describe. */
function sidebarHtml(idx, actualSeries, budgetSeries, tm, iconName, accent){
  const av = actualSeries[idx][tm.key], bv = budgetSeries[idx][tm.key];
  const monthLabel = actualSeries[idx].label;
  const isCurrent = idx === actualSeries.length-1;
  const actualLabel = isCurrent ? L('Actual (mes en curso)','Actual (current month)') : `${L('Actual','Actual')} — ${monthLabel}`;
  const budgetLabel = isCurrent ? 'Budget' : `Budget — ${monthLabel}`;
  const varLabel = isCurrent ? L('Variación','Variance') : `${L('Variación','Variance')} — ${monthLabel}`;
  const d = computeDelta(av, bv, tm.fmt, tm.invert, tm.pp);
  // Same up-vs-good split as computeDelta()'s own callers (metricCell/pacingCell) — the arrow's
  // direction is the raw sign of change, never the invert-aware good/bad color (real bug, found
  // 2026-08-18: this modal sidebar had been missed when that fix landed elsewhere). Spend/Media
  // Spend/Paid Social+Organic also go gray here, same as every other Spend readout in the app.
  const neutral = isSpendNeutralMetric(tm.key);
  const good = d ? d.good : true;
  const up = d ? d.up : true;
  const colorCls = !d ? '' : neutral ? 'neutral' : (good?'pos':'neg');
  const iconColor = !d ? 'var(--text-secondary)' : neutral ? 'var(--text-secondary)' : (good?'var(--pos)':'var(--neg)');
  return `<div class="mtc-stat">${iconChip(iconName, accent, false, true)}<div><div class="label">${actualLabel}</div><div class="value">${tm.fmt(av)}</div></div></div>
    <div class="mtc-stat budget">${iconChip('wallet','var(--text-secondary)', false, true)}<div><div class="label">${budgetLabel}</div><div class="value">${tm.fmt(bv)}</div></div></div>
    <div class="mtc-stat variance ${colorCls}">${iconChip('trend', iconColor, false, true)}<div><div class="label">${varLabel}</div>
      <div class="value">${d? `${arrowIcon(up)}${d.text}` : '—'}</div>
    </div></div>`;
}
/* Cumulative/volume metrics (Spend/New Cash Core/Impacto/Leads/Ventas) get the pacing sidebar
   INSTEAD of the normal actual/budget/variance cards, but ONLY for the current (still-open)
   month — a past month is a fully-elapsed period, so its actual-vs-budget comparison is
   completely fair and uses the normal sidebarHtml(). Once the month closes (monthIsComplete()),
   this metric goes back to the normal sidebar everywhere, current month included. Ratio metrics
   (CPL, CMPS, %Leads, %Ventas, Conversión, MNCC) are NEVER pacing — a rate is comparable at any
   point in the month regardless of how many days have elapsed, unlike a running total. 'Impact'
   REMOVED 2026-08 (was pacing) — now that Net Impact is itself already a diff-of-diffs (see
   impact()'s new formula), there's no separate "full-period target" to prorate against; its own
   "budget" is definitionally 0 at any point in the month, prorated or not. */
function isPacingMetric(key){ return key==='Spend' || key==='NewCash' || key==='Leads' || key==='Sales'; }
/* Spend/Media Spend/Paid Social+Organic spend arrows render gray, never red/green -- explicit ask,
   2026-08-18: an increase in spend isn't inherently good or bad (could be deliberate scaling), so
   only efficiency/output metrics (CPL, CMPS, Leads, Sales, etc.) keep sign-based color. Used by
   metricCell()/pacingCell()'s forceGray param wherever a render line is shared across metrics. */
function isSpendNeutralMetric(key){ return key==='Spend' || key==='MediaSpend' || key==='PaidOrganicSpend'; }
function sidebarOrPacingHtml(idx, actualSeries, budgetSeries, tm, iconName, accent){
  const isCurrent = idx === actualSeries.length-1;
  if(isCurrent && !monthIsComplete() && isPacingMetric(tm.key)){
    return pacingSidebarHtml(actualSeries, budgetSeries, tm, iconName, accent);
  }
  return sidebarHtml(idx, actualSeries, budgetSeries, tm, iconName, accent);
}
/* Same pacing logic as pacingCell() (row/hero cards), applied to the modal sidebar: day-pacing
   vs value-pacing, plus a "headroom/still-needed" card answering the user's actual question —
   "cuántos días tengo y cuánto necesito lograr" — showing the $ gap to the full-month budget
   and what that means per remaining day. Always for the CURRENT month only (see
   sidebarOrPacingHtml). */
function pacingSidebarHtml(actualSeries, budgetSeries, tm, iconName, accent){
  const idx = actualSeries.length-1;
  const av = actualSeries[idx][tm.key], bv = budgetSeries[idx][tm.key];
  const day = DATA.meta.asOfDay, days = DATA.meta.daysInMonth, remaining = days-day;
  const dayPacing = day/days;
  const higherIsBetter = tm.key!=='Spend';
  const valuePacing = (bv!=null && bv!==0 && av!=null) ? av/bv : null;
  const good = valuePacing==null ? true : (higherIsBetter ? valuePacing>=dayPacing : valuePacing<=dayPacing);
  // Arrow direction is the raw sign of pacing-ahead-vs-behind, independent of higherIsBetter --
  // same up-vs-good split as pacingCell()/computeDelta() (real bug, found 2026-08-18: this modal
  // sidebar had been missed when that fix landed elsewhere). Spend also goes gray here, same as
  // every other Spend readout in the app.
  const up = valuePacing==null ? true : valuePacing>=dayPacing;
  const neutral = isSpendNeutralMetric(tm.key);
  const pacingColorCls = valuePacing==null ? '' : neutral ? 'neutral' : (good?'pos':'neg');
  const pacingIconColor = valuePacing==null ? 'var(--text-secondary)' : neutral ? 'var(--text-secondary)' : (good?'var(--pos)':'var(--neg)');
  const diffPP = valuePacing==null ? null : (valuePacing-dayPacing)*100;
  const gap = (bv!=null && av!=null) ? bv-av : null;
  const perDay = (gap!=null && remaining>0) ? gap/remaining : null;
  const gapLabel = tm.key==='Spend' ? L('Presupuesto disponible','Budget headroom left') : L('Falta por generar','Still needed to hit budget');
  return `<div class="mtc-stat">${iconChip(iconName, accent, false, true)}<div><div class="label">${L('Actual (mes en curso)','Actual (current month)')}</div><div class="value">${tm.fmt(av)}</div></div></div>
    <div class="mtc-stat ${pacingColorCls}">${iconChip('gauge', pacingIconColor, false, true)}<div><div class="label">${L(`Pacing (día ${day} de ${days})`,`Pacing (day ${day} of ${days})`)}</div>
      <div class="value" style="font-size:var(--text-2xl);font-weight:700">${valuePacing==null?'—':`${arrowIcon(up)}${(valuePacing*100).toFixed(0)}%`}</div>
      ${valuePacing==null?'':`<div style="font-size:14px;color:var(--text-secondary);margin-top:2px">vs ${(dayPacing*100).toFixed(0)}% ${L('del mes','of month')} (${diffPP>=0?'+':''}${diffPP.toFixed(1)}pp)</div>`}
    </div></div>
    <div class="mtc-stat">${iconChip('wallet','var(--text-secondary)', false, true)}<div><div class="label">${gapLabel}</div>
      <div class="value" style="font-size:var(--text-lg)">${gap==null?'—':tm.fmt(Math.abs(gap))}</div>
      ${perDay!=null?`<div style="font-size:14px;color:var(--text-secondary);margin-top:2px">${L(`${tm.fmt(Math.abs(perDay))}/día × ${remaining} días restantes`,`${tm.fmt(Math.abs(perDay))}/day × ${remaining} days left`)}</div>`:''}
    </div></div>
    <button class="ai-methodology-link" data-pacing-meth="1">${L('¿Cómo se calculó el pacing?','How is pacing calculated?')}</button>`;
}
function openPacingMethodologyModal(){
  const day = DATA.meta.asOfDay, days = DATA.meta.daysInMonth;
  const dayPacingPct = Math.round(day/days*100);
  const text = L(
    `El mes aún no ha cerrado (día ${day} de ${days} = ${dayPacingPct}% transcurrido), así que comparar el acumulado real contra un budget de mes completo no sería justo. En vez de eso: % del budget ya consumido/generado (actual ÷ budget) se compara contra % del mes ya transcurrido (${day} ÷ ${days}). Si ambos porcentajes coinciden, vas exactamente al ritmo del budget. Para Spend, ir POR DEBAJO del % de días transcurridos es bueno (gastando más lento de lo presupuestado); para New Cash Core, ir POR ENCIMA es bueno (generando más rápido de lo presupuestado). El "presupuesto disponible"/"falta por generar" es simplemente budget − actual, dividido entre los días que quedan del mes.`,
    `The month hasn't closed yet (day ${day} of ${days} = ${dayPacingPct}% elapsed), so comparing the real total against a full-month budget wouldn't be fair. Instead: % of budget already consumed/generated (actual ÷ budget) is compared against % of the month already elapsed (${day} ÷ ${days}). If both percentages match, you're tracking exactly the budget's pace. For Spend, running BELOW the % of days elapsed is good (spending slower than budgeted); for New Cash Core, running ABOVE is good (generating faster than budgeted). "Budget headroom left"/"still needed" is simply budget − actual, divided by the days left in the month.`
  );
  openModal(null, `<h3>${L('¿Cómo se calculó el pacing?','How is pacing calculated?')}</h3><div class="methodology-modal"><p>${text}</p></div>`);
}
function renderModalTab(key, label, iconName, accent, tabKey){
  const tm = METRIC_TABS.find(t=>t.key===tabKey);
  const {actual: actualSeries, budget: budgetSeries} = getSeriesPair(key);
  const aVals = actualSeries.map(m=>m[tm.key]), bVals = budgetSeries.map(m=>m[tm.key]);
  const aWithV = actualSeries.map((m,i)=>({...m, __v:aVals[i]}));
  const bWithV = budgetSeries.map((m,i)=>({...m, __v:bVals[i]}));
  return `<div class="mtc-row">
    <div class="mtc-chart-col">
      <div class="mtc-chart-title">
        <div class="ct-main">${label} — ${tm.label}</div>
        <div class="ct-sub">${chartContextLine()}</div>
      </div>
      <div class="big-chart-wrap">${bigChart(aWithV, bWithV, tm.fmt, accent)}<div class="chart-tooltip"></div></div>
      <div class="chart-legend-lg">
        <span class="lg-actual"><i style="border-color:${accent}"></i>${L('Actual','Actual')}</span>
        <span class="lg-budget"><i style="border-color:var(--chart-budget-line)"></i>Budget</span>
      </div>
    </div>
    <div class="mtc-sidebar">${sidebarOrPacingHtml(actualSeries.length-1, actualSeries, budgetSeries, tm, iconName, accent)}</div>
  </div>`;
}
function wireModalTabs(dlg, key, label, iconName, accent, initialTab){
  const body = dlg.querySelector('.modal-tab-body');
  const setTab = (tabKey)=>{
    dlg.querySelectorAll('.modal-tabs button').forEach(b=> b.classList.toggle('on', b.dataset.tab===tabKey));
    if(tabKey==='SpendMix'){
      body.innerHTML = renderSpendMixTab(label);
      const series = DATA.spendMixBranded;
      wireChartTooltip(
        body.querySelector('.big-chart-wrap'),
        series.map(m=>m.label),
        series.map(m=>m.SemBrandPct),
        series.map(m=>m.OfflinePct),
        fmtPct, 'var(--brand-accent)', false, true,
        (i)=>{ body.querySelector('.mtc-sidebar').innerHTML = spendMixSidebarHtml(i); },
        'SEM-Brand', L('Media (Offline/TV)','Media (Offline/TV)')
      );
      return;
    }
    body.innerHTML = renderModalTab(key, label, iconName, accent, tabKey);
    const tm = METRIC_TABS.find(t=>t.key===tabKey);
    const {actual: actualSeries, budget: budgetSeries} = getSeriesPair(key);
    wireChartTooltip(
      body.querySelector('.big-chart-wrap'),
      actualSeries.map(m=>m.label),
      actualSeries.map(m=>m[tm.key]),
      budgetSeries.map(m=>m[tm.key]),
      tm.fmt,
      accent,
      tm.invert,
      tm.pp,
      (i)=>{ body.querySelector('.mtc-sidebar').innerHTML = sidebarOrPacingHtml(i, actualSeries, budgetSeries, tm, iconName, accent); }
    );
  };
  dlg.querySelectorAll('.modal-tabs button').forEach(b=>{
    b.addEventListener('click', ()=> setTab(b.dataset.tab));
  });
  /* Delegated (not re-attached per render) since the pacing methodology button gets rebuilt
     every time the sidebar re-renders (tab switch, chart click) — a direct listener would need
     re-wiring each time and is easy to forget. */
  body.addEventListener('click', (e)=>{ if(e.target.closest('[data-pacing-meth]')) openPacingMethodologyModal(); });
  setTab(initialTab || 'Spend');
}

/* Daily Tracker por País — column-only filter (no row filter: the country list is fixed, it's

   total... no hay un share". Every ratio/Short-KPI metric derived that way (CPL, CMPS, MNCC, LTV
   Short, etc.) follows the same rule, and per the explicit ask, ALL of them now appear here,
   matching exactly which columns are visible in the table ("las mismas columnas que estén
   visibles"), not a fixed hand-picked subset. */
const MKTORG_SHARE_METRICS = new Set(['Leads','Sales','NewCash']);
// Country-share columns (% of LatAm total — a different axis than OE-vs-Junior) and the
// semaphore (a colored dot, not a value) never belong in this modal.
const MKTORG_EXCLUDED_METRICS = new Set(['SpendShare','LeadsShare','SalesShare','NewCashSemaphore']);
/* Sums one weekday-filtered date range (either the active period or its paired compare period)
   into {oeV, jrV, total} for a single share metric. Factored out of mktOrgShareRowValues() 2026-08-18
   so the share grid can show a period-over-period delta too (real ask: "no veo diferencia segun el
   periodo que se seleccionó... debe verse tambien la diferencia") -- previously this only ever
   summed the ACTIVE range, so the %-of-total shown was correct for whatever period was selected,
   but there was no way to tell whether that period moved up or down from the one before it. */
function mktOrgShareRangeValues(key, countries, range){
  const weekdaySet = yoyWeekdaySet();
  const byOrg = aggregateMktOrgDaily(DATA.yoyDailyByMktOrg, range.start, range.end, weekdaySet, countries);
  const sumField = org => (byOrg[org] && byOrg[org][key]) || 0;
  const oeV = sumField('OE'), jrV = sumField('Open English Junior');
  // Real data fact found building this feature: marketing_organization isn't ALWAYS exactly
  // "OE"/"Open English Junior" — a small "NextU" residual exists too (confirmed on JR-LATAM: ~0.06%
  // of Sales, $0 Spend/Leads). Folded straight into `total` (never silently dropped from the
  // denominator) rather than shown as its own column — the user's own grid spec is exactly 3
  // columns (OE/Junior/Total) — so on the rare row where it's nonzero, OE%+Junior% legitimately
  // add up to a little under 100%, which is more honest than pretending that slice doesn't exist.
  let otherV = 0;
  Object.keys(byOrg).forEach(k=>{ if(k!=='OE' && k!=='Open English Junior') otherV += (byOrg[k][key]||0); });
  return {oeV, jrV, total: oeV+jrV+otherV};
}
function mktOrgShareRowValues(key, countries){
  return {
    actual: mktOrgShareRangeValues(key, countries, yoyActiveActualRange()),
    compare: mktOrgShareRangeValues(key, countries, yoyActiveCompareRange()),
  };
}
/* One deck's yoyDailyByCountry, summed over a country scope, for BOTH the active actual range AND
   its paired compare range — exactly the 2 numbers every comparison cell needs. current/prior are
   aliases of the SAME full-history array (see aggregateYoyDaily's own comment) — "actual" vs.
   "compare" here differ only by which date range gets summed. */
function crossDeckBundle(deckId, countries){
  const weekdaySet = yoyWeekdaySet();
  const actualRange = yoyActiveActualRange(), compareRange = yoyActiveCompareRange();
  const deck = DATA_BY_DECK[deckId];
  const actualByCountry = aggregateYoyDaily(deck.yoyDailyByCountry.current, actualRange.start, actualRange.end, weekdaySet);
  const compareByCountry = aggregateYoyDaily(deck.yoyDailyByCountry.prior, compareRange.start, compareRange.end, weekdaySet);
  const fields = ['Spend','MediaSpend','PaidOrganicSpend','Leads','Sales','NewCash','FullCM','ProjRevShort','TotalEnrollments'];
  return {actual: sumYoyByCountry(actualByCountry, countries, fields), compare: sumYoyByCountry(compareByCountry, countries, fields)};
}
/* Module-scope mirror of slideYoy()'s own yoyCellHtml() switch (same formulas, same yoyMetricCell
   rendering) minus the 3 cases MKTORG_EXCLUDED_METRICS already drops. Duplicated rather than
   reused directly because yoyCellHtml is closure-scoped inside slideYoy() and reads heroActual for
   the Share cases this modal never shows anyway — copying the formula list is simpler than
   threading heroActual through just to satisfy branches that can't be reached here. */
function mktOrgMetricCell(key, a, b){
  switch(key){
    case 'Spend': return yoyMetricCell(a.Spend, b.Spend, fmtUSD, true, false, null, true);
    case 'MediaSpend': return yoyMetricCell(a.MediaSpend, b.MediaSpend, fmtUSD, true, false, null, true);
    case 'PaidOrganicSpend': return yoyMetricCell(a.PaidOrganicSpend, b.PaidOrganicSpend, fmtUSD, false, false, null, true);
    case 'CPL': return yoyMetricCell(cpl(a), cpl(b), fmtUSD, true, false);
    case 'MediaCPL': return yoyMetricCell(mediaCpl(a), mediaCpl(b), fmtUSD, true, false);
    case 'Conversion': return yoyMetricCell(conversionRate(a), conversionRate(b), fmtPctConversion, false, true);
    case 'CMPS': return yoyMetricCell(cmps(a), cmps(b), fmtUSD, true, false);
    case 'AvgPrice': return yoyMetricCell(avgPrice(a), avgPrice(b), fmtUSD, false, false);
    case 'MarginPct': return yoyMetricCell(mncc(a), mncc(b), fmtPct, false, true);
    // Net Impact is ALREADY a difference ((a.NewCash-b.NewCash)-(a.Spend-b.Spend)) -- routing it
    // through yoyMetricCell() used to also show it as if IT had its own actual/prior/%change, which
    // is mathematically broken for a value that can cross zero (real bug reported 2026-08-18: Peru
    // showed "+12,433" next to "-215%" -- a % change of an arbitrary, possibly near-zero or
    // negative "prior" difference). Fixed to the same single-value, sign-colored format Lámina A
    // and Daily Tracker already use for their own Impact cell (see their chCellHtml/dailyCellHtml).
    case 'Impact': { const v = (a.NewCash-b.NewCash)-(a.Spend-b.Spend); return `<div class="metric-cell muted"><div class="mc-actual ${mcPctSignClass(v)}">${fmtUSD(v)}</div></div>`; }
    case 'LtvShort': return yoyMetricCell(ltvShort(a), ltvShort(b), fmtUSD, false, false);
    case 'FullUnitCmShort': return yoyMetricCell(fullUnitCmShort(a), fullUnitCmShort(b), fmtUSD, false, false);
    case 'FullCmPctShort': return yoyMetricCell(fullCmPct(a), fullCmPct(b), fmtPct, false, true, mcPctSignClass(fullCmPct(a)));
  }
  return '';
}
function mktOrgGridModalHtml(countries, scopeLabel){
  const visible = YOY_COL_DEFS.filter(c => yoyView.cols[c.key] && !MKTORG_EXCLUDED_METRICS.has(c.key));
  const shareMetrics = visible.filter(c => MKTORG_SHARE_METRICS.has(c.key));
  const cmpMetrics = visible.filter(c => !MKTORG_SHARE_METRICS.has(c.key));
  // `delta` is pre-rendered HTML (or '' to omit the line entirely) so cell() itself never needs
  // to know the comparison math -- see shareDeltaHtml() below, same separation shareRowsHtml uses.
  const cell = (v, fmt, pct, delta, extraCls) => `<div class="mktorg-cell${extraCls?' '+extraCls:''}"><div class="mktorg-cell-val">${fmt(v)}</div><div class="mktorg-cell-pct">${pct}</div>${delta||''}</div>`;
  /* Period-over-period delta for one share cell — added 2026-08-18 (explicit ask: the share grid
     showed a live %-of-total for whatever period was selected, but no sense of whether THIS
     period's Leads/Sales/NewCash moved up or down from the period before it). Never inverted
     (an increase in Leads/Sales/NewCash is always "up" and always good, unlike Spend-side
     metrics) -- arrow direction and color agree here by construction, no separate `up`/`good`
     split needed the way computeDelta() requires for invertible metrics. */
  const shareDeltaHtml = (cur, prev) => {
    if(!prev) return ''; // no stable baseline to compare against (0 or absent last period)
    const pctRounded = Math.round((cur-prev)/prev*100);
    return `<div class="mktorg-cell-delta ${pctRounded>=0?'pos':'neg'}">${arrowIcon(pctRounded>=0)}${pctRounded>=0?'+':''}${pctRounded}% <span class="mktorg-cell-delta-label">${yoyPriorLabel()}</span></div>`;
  };
  const shareRowsHtml = shareMetrics.map(m=>{
    const {actual, compare} = mktOrgShareRowValues(m.key, countries);
    const fmt = m.key==='NewCash' ? fmtUSD : fmtNum;
    const pctOf = v => fmtPct(actual.total ? v/actual.total : 0);
    return `<div class="mktorg-row-label">${colLabelYoy(m.key)}</div>
      ${cell(actual.oeV, fmt, pctOf(actual.oeV), shareDeltaHtml(actual.oeV, compare.oeV))}
      ${cell(actual.jrV, fmt, pctOf(actual.jrV), shareDeltaHtml(actual.jrV, compare.jrV))}
      ${cell(actual.total, fmt, fmtPct(actual.total?1:0), shareDeltaHtml(actual.total, compare.total), 'mktorg-total')}`;
  }).join('');
  const oeBundle = crossDeckBundle(siblingOEDeckId(), countries);
  const jrBundle = crossDeckBundle(DECK_ID, countries);
  const cmpRowsHtml = cmpMetrics.map(m=> `<div class="mktorg-cmp-label">${colLabelYoy(m.key)}</div>
      <div class="mktorg-cmp-cell">${mktOrgMetricCell(m.key, oeBundle.actual, oeBundle.compare)}</div>
      <div class="mktorg-cmp-cell">${mktOrgMetricCell(m.key, jrBundle.actual, jrBundle.compare)}</div>`).join('');
  const emptyNote = visible.length ? '' : `<div class="mktorg-empty">${L('Ninguna métrica compatible está visible — actívala en Columnas.','No compatible metric is currently visible — enable one under Columns.')}</div>`;
  const shareSection = !shareMetrics.length ? '' : `<div class="mktorg-section-title">${L('Distribución por Marketing Organization','Split by Marketing Organization')}</div>
    <div class="mktorg-grid">
      <div class="mktorg-row-label"></div>
      <div class="mktorg-grid-header">OE Adult</div>
      <div class="mktorg-grid-header">OE Junior</div>
      <div class="mktorg-grid-header">${L('Total','Total')}</div>
      ${shareRowsHtml}
    </div>`;
  const cmpSection = !cmpMetrics.length ? '' : `<div class="mktorg-section-title">${L('Comparación vs. período anterior','Comparison vs. prior period')}</div>
    <div class="mktorg-cmp-grid">
      <div class="mktorg-cmp-label"></div>
      <div class="mktorg-grid-header">OE Adult</div>
      <div class="mktorg-grid-header">OE Junior</div>
      ${cmpRowsHtml}
    </div>`;
  return `<div class="modal-head">${iconChip('grid','var(--brand-accent)')}<h3>${scopeLabel} — ${L('por Marketing Organization','by Marketing Organization')}</h3></div>
    <div class="mktorg-modal-scroll">${shareSection}${cmpSection}${emptyNote}</div>`;
}
/* Weekday multi-select — supports both interaction styles asked for: Ctrl/Cmd+click TOGGLES one
   day in/out of the current selection (like a file manager's ctrl-click), plain click-and-drag
   SETS a contiguous range (replacing the selection with everything between drag-start and
   drag-end, like dragging over cells in a spreadsheet). `weekdayDragState` is module-level (not
   per-render) specifically so the single `mouseup` listener that ends a drag only needs
   registering ONCE, ever — registering it inside the per-render wiring function would stack a new
   listener on every renderGroupMenuYoy() call (deck switch, language toggle), same class of bug
   already fixed once this session for a different reason (see applyAutoFit's PERF FIX comment). */
let weekdayDragState = null;
document.addEventListener('mouseup', ()=>{ weekdayDragState = null; });
/* Visual order Monday->Sunday (explicit ask, 2026-08-14: "los días de la semana son de lunes a
   domingo, no de domingo a sábado") -- values are still JS Date.getDay() day numbers (0=Sun..6=Sat,
   what yoyCustomRange.weekdays/aggregateYoyDaily/etc. already store and compare against), only the
   RENDER ORDER changes. Drag-to-select-a-range (wireWeekdaySelector below) has to key off the
   VISUAL position, not the raw day number, since Sun(0) is no longer adjacent to Sat(6) on screen. */
const WD_VISUAL_ORDER = [1,2,3,4,5,6,0];
/* null = every weekday is selectable (the active period spans more than 7 days, so all 7
   necessarily occur somewhere in it) — otherwise the Set of weekdays the SHORT period can even
   contain, per periodWeekdaysIfShort(). Explicit ask, 2026-08-17: "debería habilitar solo los días
   que se pueden tocar en el periodo de tiempo seleccionado" — a day that never occurs in the actual
   period can't narrow anything by being picked, so it's disabled rather than offered as a no-op
   choice. Keyed off the ACTUAL period specifically (not the compare side) — same "el periodo de
   tiempo seleccionado" framing the user used, and the one line "Periodo actual" labels in this
   same panel. */
function weekdayEnabledSet(){
  const {start,end} = yoyActiveActualRange();
  return periodWeekdaysIfShort(start,end);
}
function weekdaySelectorHtml(){
  const labels = {0:L('Dom','Sun'),1:L('Lun','Mon'),2:L('Mar','Tue'),3:L('Mié','Wed'),4:L('Jue','Thu'),5:L('Vie','Fri'),6:L('Sáb','Sat')};
  const selected = new Set(yoyCustomRange.weekdays || [0,1,2,3,4,5,6]);
  const enabledSet = weekdayEnabledSet();
  return `<div class="weekday-selector" id="yoyWeekdaySelector">
    ${WD_VISUAL_ORDER.map((d,i)=>{
      const isEnabled = !enabledSet || enabledSet.has(d);
      return `<button type="button" class="wd-btn${selected.has(d)?' on':''}" data-wd="${d}" data-vidx="${i}"${isEnabled?'':' disabled'}>${labels[d]}</button>`;
    }).join('')}
  </div>`;
}
/* Targeted update (same "never destroy the input mid-interaction" discipline as
   syncYcrDateInputs()/updateYcrSummary() above) — re-applies disabled/on state on the EXISTING
   weekday buttons whenever the actual period might have changed (date edits, category switch),
   instead of re-rendering the whole panel. Also reconciles a stale explicit selection that no
   longer overlaps the new period AT ALL back to "no filter" (null) — the always-valid fallback —
   rather than silently leaving every count at zero with no visible explanation. */
function updateWeekdaySelectorEnabled(){
  const container = document.getElementById('yoyWeekdaySelector');
  if(!container) return;
  const enabledSet = weekdayEnabledSet();
  if(yoyCustomRange.weekdays && yoyCustomRange.weekdays.length && enabledSet && !yoyCustomRange.weekdays.some(d=>enabledSet.has(d))){
    yoyCustomRange.weekdays = null;
  }
  const selected = new Set(yoyCustomRange.weekdays || [0,1,2,3,4,5,6]);
  container.querySelectorAll('.wd-btn').forEach(btn=>{
    const d = Number(btn.dataset.wd);
    btn.disabled = !(!enabledSet || enabledSet.has(d));
    btn.classList.toggle('on', selected.has(d));
  });
}
function wireWeekdaySelector(container, onChange){
  const buttons = () => Array.from(container.querySelectorAll('.wd-btn'));
  const enabledSet = weekdayEnabledSet(); // null = every day selectable (period > 7 days)
  const currentSet = () => new Set(yoyCustomRange.weekdays || [0,1,2,3,4,5,6]);
  const applySelection = (set) => {
    // Never let a selection include a day the period can't even contain — matters for a drag that
    // spans OVER a disabled button sitting BETWEEN two enabled ones (e.g. a period crossing the
    // Sun/Mon boundary leaves a disabled run in the MIDDLE of the Monday-first visual strip, not
    // at an edge a drag would naturally stop at).
    if(enabledSet) set = new Set([...set].filter(d=>enabledSet.has(d)));
    const fullyOpen = enabledSet ? set.size===enabledSet.size : set.size===7;
    yoyCustomRange.weekdays = (fullyOpen || set.size===0) ? null : Array.from(set).sort();
    buttons().forEach(b => b.classList.toggle('on', set.has(Number(b.dataset.wd))));
    onChange();
  };
  buttons().forEach(btn=>{
    if(btn.disabled) return; // a day the current period can't contain is never interactive
    const day = Number(btn.dataset.wd);
    const vidx = Number(btn.dataset.vidx);
    btn.addEventListener('mousedown', e=>{
      e.preventDefault();
      if(e.ctrlKey || e.metaKey){
        const set = currentSet();
        if(set.has(day)) set.delete(day); else set.add(day);
        weekdayDragState = {mode:'toggle', touched:new Set([day])};
        applySelection(set);
      } else {
        weekdayDragState = {mode:'range', startVidx:vidx};
        applySelection(new Set([day]));
      }
    });
    btn.addEventListener('mouseenter', ()=>{
      if(!weekdayDragState) return;
      if(weekdayDragState.mode==='range'){
        const lo = Math.min(weekdayDragState.startVidx, vidx), hi = Math.max(weekdayDragState.startVidx, vidx);
        const set = new Set(); for(let i=lo; i<=hi; i++) set.add(WD_VISUAL_ORDER[i]);
        applySelection(set);
      } else if(!weekdayDragState.touched.has(day)){
        weekdayDragState.touched.add(day);
        const set = currentSet();
        if(set.has(day)) set.delete(day); else set.add(day);
        applySelection(set);
      }
    });
  });
}
// Which categories expose the "mismos días de semana / mismas fechas" toggle (2026-08-14: widened
// from YOY-only to also cover QOQ/MOM, explicit ask — WOW's 7-day shift has no such ambiguity,
// CUSTOM is fully manual, so neither needs it). Drives both the panel section's visibility and the
// subtitle's optional trailing alignment segment (see slideYoy()'s yoySubAlignment).
const CATS_WITH_ALIGNMENT = new Set(['YOY','QOQ','MOM']);
/* Summary block ONLY — the exact-dates readout + the "peras con peras" warning, re-rendered on
   every date/category/mode change. Deliberately its OWN function, separate from the static
   inputs/buttons around it: see wireYoyCustomRangePanel's own comment for why splitting this out
   was the actual fix for item 2 ("la interfaz para cambiar una fecha... se traba, se sale"). */
function ycrSummaryHtml(){
  const {start:aStart, end:aEnd} = yoyActiveActualRange();
  const {start:cStart, end:cEnd} = yoyActiveCompareRange();
  const cmp = rangesComparable(aStart,aEnd,cStart,cEnd);
  const warningHtml = (!cmp.ok) ? `<div class="ycr-warning">⚠️ ${
    !cmp.daysMatch
      ? L(`Los periodos no tienen la misma cantidad de días (${cmp.daysA} vs ${cmp.daysB}).`,`The periods don't have the same number of days (${cmp.daysA} vs ${cmp.daysB}).`)
      : L('Los periodos tienen la misma cantidad de días, pero distinta distribución de días de la semana.','The periods have the same day count, but a different weekday distribution.')
  }</div>` : '';
  return `<div id="ycrSummary"><div class="ycr-exact-dates">
      <div>${L('Actual','Current')}: <b>${fmtYoyRange({start:aStart,end:aEnd})[LANG]}</b></div>
      <div>${L('Comparación','Comparison')}: <b>${fmtYoyRange({start:cStart,end:cEnd})[LANG]}</b></div>
    </div>${warningHtml}</div>`;
}
function updateYcrSummary(){
  const el = document.getElementById('ycrSummary');
  if(el) el.outerHTML = ycrSummaryHtml();
}
/* Keeps the 4 date <input> VALUES in sync with computed state without ever touching the elements
   themselves (see wireYoyCustomRangePanel's own comment on why that matters). Needed specifically
   because switching category changes the ACTUAL side's default (yoyDefaultActualRange is now
   category-aware) — without this, the inputs would keep showing the PREVIOUS category's dates
   while the summary text below already shows the new ones. Safe to call unconditionally: when a
   manual override already exists, yoyActiveActualRange()/yoyActiveCompareRange() return that
   override regardless of category, so this just re-writes the same value in that case. */
/* `skipId` (added 2026-08-17): NEVER re-write the value of the date <input> the visitor is
   actively editing, even to the exact same value it already holds. Real bug reported: typing a
   new day into a compare-date field right after typing its month would occasionally snap the
   MONTH back to a stale value ("cuando el día a 06, de una me cambia el mes a 08") — a native
   <input type=date> resets its internal per-segment edit/focus state on ANY `.value` assignment,
   even a byte-identical no-op one, so reassigning the very field whose own 'change' handler just
   fired (which is ALWAYS a no-op re-write of what the browser already just committed) was fighting
   the widget's own segment-advance behavior. The other 3 fields still need the write — e.g.
   changing the actual-period start can shift the compare field's computed default. */
function syncYcrDateInputs(skipId){
  const {start:aStart, end:aEnd} = yoyActiveActualRange();
  const startEl = document.getElementById('yoyActualStart'), endEl = document.getElementById('yoyActualEnd');
  if(startEl && startEl.id!==skipId) startEl.value = aStart;
  if(endEl && endEl.id!==skipId) endEl.value = aEnd;
  const {start:cStart, end:cEnd} = yoyActiveCompareRange();
  const cStartEl = document.getElementById('yoyCompareStart'), cEndEl = document.getElementById('yoyCompareEnd');
  if(cStartEl && cStartEl.id!==skipId) cStartEl.value = cStart;
  if(cEndEl && cEndEl.id!==skipId) cEndEl.value = cEnd;
}
/* Full panel HTML — lives inside renderGroupMenuYoy()'s own menu, right below "Otras vistas"
   (explicit ask for placement). Hidden entirely while the Junior investment-filter isn't showing
   BOTH marketing orgs (see yoyCustomRange's own comment for why) rather than shown-but-silently-
   wrong. */
function yoyCustomRangePanelHtml(){

  const {start:aStart, end:aEnd} = yoyActiveActualRange();
  // "current"/"prior" used to be 2 genuinely different windows (a legacy 5-month-architecture

  // array since buildYoyDailyByCountry's 2026-08-14 rewrite (see its own comment), so showing two

    </div>` : '';

  ).join('');
  return `<div class="side-menu-header">${L('Rango de fechas personalizado','Custom date range')}</div>
    <label><input type="checkbox" id="yoyCustomRangeToggle" ${yoyCustomRange.enabled?'checked':''}> ${L('Activar rango personalizado','Enable custom range')}</label>
    <div class="ycr-body" id="ycrBody" style="${yoyCustomRange.enabled?'':'display:none'}">
      ${availabilityHtml}
      <div class="ycr-row"><span>${L('Periodo actual','Current period')}</span></div>
      <div class="ycr-dates"><input type="date" id="yoyActualStart" value="${aStart}" ${availCurrent?`min="${availCurrent.start}" max="${availCurrent.end}"`:''}><span>→</span><input type="date" id="yoyActualEnd" value="${aEnd}" ${availCurrent?`min="${availCurrent.start}" max="${availCurrent.end}"`:''}></div>
      <div class="ycr-row"><span>${L('Comparar contra','Compare against')}</span></div>
      <div class="ycr-compare-modes" id="yoyCategoryModes">${categoryBtns}</div>
      <div class="ycr-compare-modes" id="yoyAlignmentModes" style="${CATS_WITH_ALIGNMENT.has(cat)?'':'display:none'}">
        <button type="button" class="${yoyCustomRange.compareMode==='shifted'?'on':''}" data-cmpmode="shifted">${L('Mismos días de semana','Same weekdays')}</button>
        <button type="button" class="${yoyCustomRange.compareMode==='exact'?'on':''}" data-cmpmode="exact">${L('Mismas fechas','Same dates')}</button>
      </div>
      <div class="ycr-dates" id="yoyCompareCustomRow" style="${cat==='CUSTOM'?'':'display:none'}">
        <input type="date" id="yoyCompareStart" value="${yoyCustomRange.compareStart||yoyActiveCompareRange().start}"><span>→</span><input type="date" id="yoyCompareEnd" value="${yoyCustomRange.compareEnd||yoyActiveCompareRange().end}">
      </div>
      ${ycrSummaryHtml()}
      <div class="side-menu-header" style="margin-top:10px">${L('Filtrar por día de semana','Filter by weekday')}</div>
      ${weekdaySelectorHtml()}
    </div>`;
}
/* Every interaction here does a TARGETED DOM update (class/style toggles + updateYcrSummary())
   instead of ever re-rendering the whole panel. Real bug found by the user (item 2 — "se traba,
   se sale, no se puede escribir bien"): the old version called a rerenderPanel() that replaced
   the WHOLE .yoy-custom-range-col innerHTML, including the <input type="date"> the visitor was
   actively typing into, on every single 'change' event — destroying and recreating the input
   mid-edit, which loses focus/cursor state and reads as the field "kicking you out". None of
   these 4 date inputs (or the category/alignment buttons) are ever destroyed now; only the small
   read-only summary text below them re-renders. */
function wireYoyCustomRangePanel(menu){
  const col = menu.querySelector('.yoy-custom-range-col');
  if(!col) return;
  const afterChange = (skipId) => { updateWeekdaySelectorEnabled(); saveYoyCustomRange(); syncYcrDateInputs(skipId); updateYcrSummary(); refreshSlideYoy(); };
  document.getElementById('yoyCustomRangeToggle')?.addEventListener('change', e=>{
    yoyCustomRange.enabled = e.target.checked;
    const body = document.getElementById('ycrBody');
    if(body) body.style.display = e.target.checked ? '' : 'none';
    saveYoyCustomRange();
