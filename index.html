<script src="viewBuilder.js?v=3"></script>
<script>
/* DATA_BY_DECK holds all 4 Brand×Region combinations; DATA is a `let` pointing at whichever
   one is currently active (see enterDeck()) — every slide builder/helper reads the module-level
   `DATA`, not DATA_BY_DECK directly, so switching decks is just reassigning this one variable. */
/* Populated asynchronously by initApp() below, AFTER Google login + Drive fetch succeed --
   nothing at top level of this script may read these two before then. Every render
   function/helper closes over the module-level `DATA` and is only ever INVOKED (never merely
   defined) after login, so defining them early is safe -- see initApp()/finishBootstrap(). */
let DATA_BY_DECK = null;
let DATA = null;
/* Deck registry: brand/region display labels (used in the cover, footer, report title, and
   chart context line) and which slides each deck includes. OE-LATAM is the only deck with the
   full country-pacing/Daily-Tracker/YoY data (Laminas B/C/D) — the other three only have
   Lamina-A-level data (MTD actuals + Jan-Jul trends per channel grouping), so they render
   Cover + Lamina A only. US_PR and Venezuela are intentionally not decks — dropped per request. */
/* brandKey drives document.documentElement.dataset.brand, which is what the CSS
   [data-brand="junior"] rules key off — 'oe' means "use the default (blue) palette", so it's
   never actually written to the DOM (only 'junior' is), see setBrand(). */
const DECKS = {
  'OE-LATAM': {brand:'OE Adult', region:'LatAm',  brandKey:'oe',     slides:['cover','daily','a','yoy']},
  'OE-BR':    {brand:'OE Adult', region:'Brazil', brandKey:'oe',     slides:['cover','daily','a','yoy']},
  'JR-LATAM': {brand:'OE Junior', region:'LatAm',  brandKey:'junior', slides:['cover','a','yoy']},
  'JR-BR':    {brand:'OE Junior', region:'Brazil', brandKey:'junior', slides:['cover','a','yoy']},
};
function currentDeck(){ return DECKS[DECK_ID]; }
const TOP8 = ["Colombia","Argentina","Chile","Costa Rica","Ecuador","Mexico","Peru","Other"];
const COUNTRY_LABEL_ES = {Colombia:"Colombia",Argentina:"Argentina",Chile:"Chile","Costa Rica":"Costa Rica",Ecuador:"Ecuador",Mexico:"México",Peru:"Perú",Other:"Otros LatAm",Brazil:"Brasil"};
const COUNTRY_LABEL_EN = {Colombia:"Colombia",Argentina:"Argentina",Chile:"Chile","Costa Rica":"Costa Rica",Ecuador:"Ecuador",Mexico:"Mexico",Peru:"Peru",Other:"Other LatAm",Brazil:"Brazil"};
/* Inline SVG flags — Windows shows flag-emoji sequences as plain "CO"/"AR" text
   (no flag glyphs in its emoji font), so emoji flags are unusable; these render
   identically on every OS since they're just shapes, no font dependency. */
const FLAG_SVG = {
  Colombia: '<svg width="22" height="16" viewBox="0 0 22 16"><rect width="22" height="16" fill="#FCD116"/><rect y="8" width="22" height="4" fill="#003893"/><rect y="12" width="22" height="4" fill="#CE1126"/></svg>',
  Argentina: '<svg width="22" height="16" viewBox="0 0 22 16"><rect width="22" height="16" fill="#75AADB"/><rect y="5.3" width="22" height="5.3" fill="#fff"/><circle cx="11" cy="8" r="1.8" fill="#F6B40E"/></svg>',
  Chile: '<svg width="22" height="16" viewBox="0 0 22 16"><rect width="22" height="8" fill="#fff"/><rect y="8" width="22" height="8" fill="#D52B1E"/><rect width="8" height="8" fill="#0033A0"/><circle cx="4" cy="4" r="1.6" fill="#fff"/></svg>',
  "Costa Rica": '<svg width="22" height="16" viewBox="0 0 22 16"><rect width="22" height="16" fill="#002B7F"/><rect y="2.7" width="22" height="10.6" fill="#fff"/><rect y="5.3" width="22" height="5.3" fill="#CE1126"/></svg>',
  Ecuador: '<svg width="22" height="16" viewBox="0 0 22 16"><rect width="22" height="8" fill="#FFD100"/><rect y="8" width="22" height="4" fill="#0072CE"/><rect y="12" width="22" height="4" fill="#EF3340"/></svg>',
  Mexico: '<svg width="22" height="16" viewBox="0 0 22 16"><rect width="7.3" height="16" fill="#006847"/><rect x="7.3" width="7.4" height="16" fill="#fff"/><rect x="14.7" width="7.3" height="16" fill="#CE1126"/></svg>',
  Peru: '<svg width="22" height="16" viewBox="0 0 22 16"><rect width="7.3" height="16" fill="#D91023"/><rect x="7.3" width="7.4" height="16" fill="#fff"/><rect x="14.7" width="7.3" height="16" fill="#D91023"/></svg>',
  Other: '<svg width="22" height="16" viewBox="0 0 22 16"><rect width="22" height="16" rx="3" fill="#0066FF"/><circle cx="11" cy="8" r="5.5" fill="none" stroke="#fff" stroke-width="1"/><line x1="5.5" y1="8" x2="16.5" y2="8" stroke="#fff" stroke-width="1"/><ellipse cx="11" cy="8" rx="2.6" ry="5.5" fill="none" stroke="#fff" stroke-width="1"/></svg>',
  Brazil: '<svg width="22" height="16" viewBox="0 0 22 16"><rect width="22" height="16" fill="#009B3A"/><polygon points="11,2 20,8 11,14 2,8" fill="#FEDD00"/><circle cx="11" cy="8" r="4" fill="#002776"/></svg>',
};
function flagIcon(country){ return `<span class="flag-ico">${FLAG_SVG[country]}</span>`; }

let LANG = 'es';
/* Report title is a fixed naming convention (not translated — it was always in
   English regardless of the ES/EN toggle in the legacy static decks), only the
   month AND the brand/region change: "<Month> <Brand> <Region> YTD Monthly Brandformance KPIs". */
const MONTHS_EN = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MONTHS_ES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DAYS_EN = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const DAYS_ES = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
/* Substituted at build time (see the rebuild command in reference-branformance-files memory) with
   the real wall-clock moment the HTML was generated — never computed client-side (new Date()
   would show the VIEWER's current time, which is not "when this report was last updated" and
   could be days/timezones removed from generation). Plain numbers, not an ISO string re-parsed by
   `new Date()`, specifically to avoid that re-parse silently reinterpreting the time in the
   VIEWER's browser timezone instead of the generator's — dow follows JS's Date.getDay()
   convention (Sunday=0), already converted from Python's Monday=0 at build time. */
const GENERATED_AT = {"y": 2026, "m": 8, "d": 13, "dow": 4, "hh": 6, "mm": 7};
/* Every slide subtitle that compares Budget vs Actual must spell out the exact date ranges —
   "Budget mes completo, Actual MTD" alone doesn't say WHICH dates, which read as vague/
   inaccurate ("en ningún lado veo que esto sea hasta el 22 de julio"). Computed from
   DATA.meta so it's automatically correct for any month/deck, never hand-typed per slide. */
function dateRangeLine(){
  const [y, m] = DATA.meta.month.split('-').map(Number);
  const day = DATA.meta.asOfDay, days = DATA.meta.daysInMonth;
  return {
    es: `Budget: mes completo (1–${days} ${MONTHS_ES[m-1]}) · Actual: MTD (1–${day} ${MONTHS_ES[m-1]} ${y})`,
    en: `Budget: full month (${MONTHS_EN[m-1]} 1–${days}) · Actual: MTD (${MONTHS_EN[m-1]} 1–${day}, ${y})`,
  };
}
/* Simplified 2026-08, explicit ask: "no hace falta que en el título se especifique OEA Latam,
   porque ya lo tienes en el subtítulo" — brand/region/month dropped from the title entirely
   (the subtitle's deckLabel + dateRangeLine() already carry all of that). Kept as a function,
   not inlined at the call site, only so a future request to make it deck/date-aware again
   doesn't need to hunt down where the title string lives. */
function reportTitle(){
  return 'MTD KPIs By Channel Grouping Pacing vs Reforecast';
}

/* Real bug found 2026-08 verifying Net Impact's new diff-based formula (see impact()): every
   EARLIER caller of fmtUSD() only ever fed it non-negative $ amounts (Spend/NewCash/etc. don't go
   negative in this business) or routed negatives through the separate signed-delta path
   (fmtSigned()/computeDelta(), which places the sign correctly on its own) — so string-
   concatenating "$" + Math.round(n).toLocaleString() in front of a genuinely negative n (e.g.
   -6263 -> "-6,263") had never been exercised and silently produced "$-6,263" instead of the
   correct "-$6,263". Net Impact is the first metric ever rendered as a bare fmtUSD(v) on a value
   that's routinely negative in real data, which is what exposed it. */
function fmtUSD(n){ if(n==null||isNaN(n)) return "—"; const neg = n<0; return (neg?'-':'')+"$"+Math.round(Math.abs(n)).toLocaleString('en-US'); }
function fmtNum(n){ if(n==null||isNaN(n)) return "—"; return Math.round(n).toLocaleString('en-US'); }
/* 0 decimals is the deck-wide default for every percentage — the ONE exception is Conversión,
   which needs fmtPctConversion (1 decimal) instead, since its typical values are small enough
   (single digits) that rounding to a whole number would hide real month-to-month movement. */
function fmtPct(n){ if(n==null||isNaN(n)) return "—"; return Math.round(n*100)+"%"; }
function fmtPctConversion(n){ if(n==null||isNaN(n)) return "—"; return (n*100).toFixed(1)+"%"; }
function cpl(o){ return o.Leads ? o.Spend/o.Leads : null; }
/* Media CPL — YoY-exclusive (see YOY_COL_DEFS): o.MediaSpend (Brand TV Channels AdCost minus
   SEM-Brand's own AdCost, i.e. TV/CTV media only, no paid-search) divided by the SAME Leads
   Elegibles this table already shows — explicit ask, reuse the existing Leads figure, not a
   separate "media-only leads" count that doesn't exist in this data. */
// o.MediaSpend is undefined until the Python pipeline attaches it (see YOY_COL_DEFS comment) —
// undefined/Leads is NaN, not null, and computeDelta()'s null-guard doesn't catch NaN, so an
// unguarded division here rendered "— (-NaN%)" instead of a clean "—". Guard at the source
// instead of touching the shared computeDelta() (used by every other metric in the deck).
function mediaCpl(o){ return (o.Leads && o.MediaSpend!=null) ? o.MediaSpend/o.Leads : null; }
function cmps(o){ return o.Sales ? o.Spend/o.Sales : null; }
function conversionRate(o){ return o.Leads ? o.Sales/o.Leads : null; }
function avgPrice(o){ return o.Sales ? o.NewCash/o.Sales : null; }
function mncc(o){ return o.NewCash ? (o.NewCash-o.Spend)/o.NewCash : null; }
/* Full CM % Short = FullContributionMarginShortUSD / ProjectedRevenueShortTotal — a stricter
   profitability lens than MNCC (nets out more real cost than just Spend). No budget figure
   exists for this anywhere in the pipeline, so it always renders actual-only (see isPacingMetric
   and the muted-cell branches in heroCell/chCellHtml), never through metricCell/pacingCell.
   LTV Short and Full Unit CM Short are its two building-block $-per-enrollment components (same
   GetSystemContext KPI family) — also actual-only, same reasoning. */
function fullCmPct(o){ return o.ProjRevShort ? o.FullCM/o.ProjRevShort : null; }
/* CM % Short auto-colors by sign (green/red) everywhere it renders — it's the only muted
   (budget-less) metric with this treatment; LTV Short/Unit CM Short stay neutral-colored. */
function mcPctSignClass(v){ return v==null ? '' : (v>=0 ? 'pos' : 'neg'); }
/* New Cash semaphore — a pure color indicator (a circle, never a number/text — that's an
   explicit ask, the reader gets the % from New Cash Core's own column right next to it).
   FINAL formula, 5th revision (2026-08-04): thresholds the variance % itself
   (pct=(actual-target)/target, the same number shown in every delta) — green if pct>=0.10,
   RENAMED 2026-08 from "Semáforo New Cash"/"New Cash Semaphore" — explicit ask: "debe ir atado
   al % de MNCC, no al New Cash" (bind it to %MNCC, not New Cash $) and simplified to only 2
   states: green if actual %MNCC >= comparison %MNCC (a percentage-POINT difference, never a
   "percent of a percent" — MNCC is already a ratio, see the pp-delta convention used everywhere
   else a ratio metric is compared), red if below. No yellow tier anymore — the prior 3-tier rule
   (green>=10%, yellow 0-9%, red negative) was a New-Cash-specific threshold set that doesn't
   carry over now that the bound metric changed. Callers pass the two ALREADY-COMPUTED %MNCC
   ratios (mncc(a)/mncc(b), same helper the MarginPct column already uses) — this function never
   touches .NewCash/.Spend itself, so no pacing adjustment is needed either: a ratio is fairly
   comparable at any point in the month, unlike the $ volume New Cash Core used to require
   (paceAdjustedTarget() is gone — it had no other caller). Gray remains "no comparison value
   available," not a severity tier. */
function mnccTemperatureCell(actualPct, comparisonPct){
  if(comparisonPct==null || actualPct==null){
    return `<div class="metric-cell muted"><span class="nc-semaphore gray"></span></div>`;
  }
  const diffPP = (actualPct-comparisonPct)*100;
  /* Round before classifying, same reason as everywhere else in this deck: the reader only ever
     sees the rounded tooltip value, so the color must agree with that, never with sub-displayed
     float noise. */
  const diffPPRounded = Math.round(diffPP*10)/10;
  const cls = diffPPRounded>=0 ? 'green' : 'red';
  const title = `${diffPPRounded>=0?'+':''}${diffPPRounded.toFixed(1)}pp`;
  return `<div class="metric-cell muted"><span class="nc-semaphore ${cls}" title="${title}"></span></div>`;
}
/* YoY-ONLY semaphore driver, added 2026-08-11 — explicit ask: this lámina's temperature must be
   bound to Net Impact's own YoY move, not %MNCC (mnccTemperatureCell above is untouched and still
   drives Lámina A/Daily Tracker). Formula given by the user directly: Net(year) = NewCash(year) -
   Spend(year) for each side of the YoY comparison, then pct = Net(a)/Net(b) - 1 (a genuine % growth
   rate of Net, not a pp-difference of two ratios like %MNCC's own mechanism — a different enough
   shape that reusing mnccTemperatureCell's 2-arg signature would have forced an awkward "pp" label
   on what is actually a "%" figure, hence a dedicated function instead of a thin wrapper). Same
   2-state green/red rule (>=0 green, <0 red), same gray-when-no-comparison fallback. */
function netImpactTemperaturePct(a,b){
  const netA = a.NewCash-a.Spend, netB = b.NewCash-b.Spend;
  return netB ? (netA/netB - 1) : null;
}
function netImpactTemperatureCell(pct){
  if(pct==null || isNaN(pct)){
    return `<div class="metric-cell muted"><span class="nc-semaphore gray"></span></div>`;
  }
  const pctRounded = Math.round(pct*1000)/10;
  const cls = pctRounded>=0 ? 'green' : 'red';
  const title = `${pctRounded>=0?'+':''}${pctRounded.toFixed(1)}%`;
  return `<div class="metric-cell muted"><span class="nc-semaphore ${cls}" title="${title}"></span></div>`;
}
function ltvShort(o){ return o.TotalEnrollments ? o.ProjRevShort/o.TotalEnrollments : null; }

function fmtSigned(n, fmtFn){
  if(n==null||isNaN(n)) return "—";

  return sign + fmtFn(Math.abs(n));

function arrowIcon(up){

    : '<svg width="13" height="13" viewBox="0 0 10 10" fill="currentColor"><path d="M5 9L1 2h8z"/></svg>';

/* Shared everywhere a number needs an actual/budget/variance readout — the hero,
   every channel row, and the modal tab summary all call this so the format is
   identical: actual (bold) / budget (muted) / delta as BOTH amount and % — or,
   for values that are already a percentage (isPP=true), delta in points (pp),
   never a relative "percentage of a percentage". */
/* Shared by metricCell (row/hero cards) AND the chart tooltip (wireChartTooltip) so the
   exact same abs+%/pp convention shows up whether you're reading a card or hovering a
   point on a trend line — never two different delta formats for the same kind of number. */
function computeDelta(av, bv, fmtFn, invert, isPP){
  if(av==null||bv==null) return null;
  /* Both branches decide the pos/neg (green/red) color from the value AFTER rounding to the
     SAME precision actually printed on screen, never from the raw float — a raw delta like
     -0.0004pp or -0.3% displays as "-0.0pp"/"0%" (reads as "no real difference") but a raw
     sign check would still flag it red, contradicting what the reader sees. Round first, then
     decide sign/color from that rounded value, so the color always agrees with the number next
     to it. (Explicit ask, 2026-08: "si ves -0.0pp, eso es verde... -0.1pp sí es rojo".) */
  /* Returns BOTH a combined `text` (kept for the chart tooltip and modal sidebar, spacious
     contexts where one line is fine) AND a split `main`/`sub` (used by metricCell()'s table/hero
     rendering — the parenthetical now gets its OWN line there, explicit ask, 2026-08: "la
     diferencia en pp pásala a otra línea... no se ve el número actual, la comparación, la
     diferencia". Splitting into 2 shorter lines lets each one fit a narrow column at a BIGGER
     font before the shrink loop needs to kick in, versus one long nowrap string that forces an
     early, aggressive shrink just to avoid a horizontal spill.) */
  if(isPP){
    const pp = (av-bv)*100;
    const ppRounded = Math.round(pp*10)/10;
    const good = invert ? ppRounded<=0 : ppRounded>=0;
    const main = `${pp>=0?'+':''}${pp.toFixed(1)}pp`;
    return {good, text: main, main, sub: null};
  }
  if(bv===0) return null;
  const abs = av-bv, pct=(av-bv)/bv;
  const pctRounded = Math.round(pct*100);
  const good = invert ? pctRounded<=0 : pctRounded>=0;
  const pctStr = Math.abs(pctRounded) + '%';
  const main = fmtSigned(abs,fmtFn);
  const sub = `(${pctRounded>=0?'+':'-'}${pctStr})`;
  return {good, text: `${main} ${sub}`, main, sub};
}
function metricCell(av, bv, fmtFn, invert, isPP, extraActualClass, budgetLabel, splitDelta){
  if(av==null) return `<div class="metric-cell"><div class="mc-actual">—</div></div>`;
  const d = computeDelta(av, bv, fmtFn, invert, isPP);
  const deltaHtml = !d ? '' : splitDelta
    ? `<div class="mc-delta mc-delta-split ${d.good?'pos':'neg'}"><div class="mc-delta-main">${arrowIcon(d.good)}${d.main}</div>${d.sub?`<div class="mc-delta-sub">${d.sub}</div>`:''}</div>`
    : `<div class="mc-delta ${d.good?'pos':'neg'}">${arrowIcon(d.good)}${d.text}</div>`;
  const actualCls = extraActualClass ? ` ${extraActualClass}` : '';
  return `<div class="metric-cell"><div class="mc-actual${actualCls}">${fmtFn(av)}</div><div class="mc-budget">${budgetLabel||'Bgt'} ${fmtFn(bv)}</div>${deltaHtml}</div>`;
}

function monthIsComplete(){ return DATA.meta.asOfDay === DATA.meta.daysInMonth; }
/* Spend/New Cash Core/Impacto are absolute $ figures compared against a FULL-MONTH budget —
   while the month is still open, actual-vs-budget is an unfair comparison (23 days of actual vs
   31 days of budget), so metricCell()'s direct delta is wrong here. Instead: pacing. Day-pacing
   = day-of-month elapsed ÷ days in month. Value-pacing = actual ÷ full-month budget. If the two
   match, you're tracking exactly the budget's pace. For Spend, running BELOW day-pacing is good
   (spending slower than planned); for New Cash Core/Impacto, running ABOVE is good (earning
   faster than planned). Used by heroCell()/chCellHtml() only when !monthIsComplete() — once the
   month closes, these metrics go back to the normal metricCell() delta everywhere. */
function pacingCell(av, bv, fmtFn, higherIsBetter){
  if(av==null) return `<div class="metric-cell"><div class="mc-actual">—</div></div>`;
  const day = DATA.meta.asOfDay, days = DATA.meta.daysInMonth;
  const dayPacing = day/days;
  let pacingHtml = '';
  if(bv!=null && bv!==0){
    const valuePacing = av/bv;
    const diffPP = (valuePacing-dayPacing)*100;
    // Same rounding-before-color rule as computeDelta() — decide from the rounded pp actually
    // shown in "(±Y.Ypp)", not the raw ratio comparison, so a "-0.0pp" never renders red.
    const diffPPRounded = Math.round(diffPP*10)/10;
    const good = higherIsBetter ? diffPPRounded>=0 : diffPPRounded<=0;
    // Same main/sub split as computeDelta() — "Pacing XX%" and "(±Y.Ypp)" each get their own
    // line instead of competing for width on one, so both can render at a legible size.
    pacingHtml = `<div class="mc-delta mc-delta-split ${good?'pos':'neg'}"><div class="mc-delta-main">${arrowIcon(good)}${L('Pacing','Pacing')} ${(valuePacing*100).toFixed(0)}%</div><div class="mc-delta-sub">(${diffPP>=0?'+':''}${diffPP.toFixed(1)}pp)</div></div>`;
  }
  return `<div class="metric-cell"><div class="mc-actual">${fmtFn(av)}</div><div class="mc-budget">${L('Bgt (mes completo)','Bgt (full month)')} ${fmtFn(bv)}</div>${pacingHtml}</div>`;
}

  if(DECK_ID!=='OE-LATAM') return '';
  return `<div class="side-menu-header" style="margin-top:14px">${L('Otras vistas','Other views')}</div>
    <label><input type="checkbox" id="${toggleId}" ${includeBrazil?'checked':''}> ${L('Agregar Brasil','Add Brazil')}</label>`;
}

/* Big trend chart: actual (solid) vs budget (dashed), shared axis, gridlines,
   and a callout on the last point showing both the absolute and % (or pp) delta. */
/* Big trend chart — actual (solid) vs budget (dashed). padL is sized to the widest
   y-axis label so currency values never clip past the left edge (that clipping was
   the "numbers spilling out of the chart" bug). Every month gets an invisible hover
   zone + a hidden dot on each line; wireChartTooltip() reveals them on mousemove
   using the same padding/scale numbers, stashed on the <svg> as data-* attributes. */
function bigChart(actualSeries, budgetSeries, fmtFn, color){
  const W=900, H=340;
  const n = actualSeries.length;
  const aVals = actualSeries.map(m=>m.__v), bVals = budgetSeries.map(m=>m.__v);
  const vals = [...aVals, ...bVals].filter(v=>v!=null);
  /* Scale is derived ONLY from the values actually being charted, never a hardcoded ceiling —
     a fixed floor of "1" here used to force every percentage metric (e.g. Conversión, often
     under 8%) onto a 0–100% axis, making the line look like a flat sliver near the bottom. Add
     a little headroom above the peak so the line doesn't touch the top gridline. */
  const min = Math.min(0, ...vals);
  let max = Math.max(...vals);
  if(!isFinite(max) || max<=min) max = min+1;
  max += (max-min)*0.12;
  const range = (max-min)||1;
  const labelLen = Math.max(fmtFn(max).length, fmtFn(min).length, 4);
  const padL = Math.max(58, 16 + labelLen*7.4), padR = 30, padT = 22, padB = 42;
  const step = (W-padL-padR)/(n-1||1);
  const x = i => padL + i*step;
  const y = v => padT + (H-padT-padB)*(1-((v-min)/range));
  const line = vals2 => vals2.map((v,i)=> v==null? null : `${x(i).toFixed(1)},${y(v).toFixed(1)}`).filter(Boolean).join(' ');
  const gridN = 4;
  const gridLines = Array.from({length:gridN+1}, (_,i)=>{
    const v = min + (range*i/gridN);
    const yy = y(v);
    return `<line x1="${padL}" y1="${yy.toFixed(1)}" x2="${W-padR}" y2="${yy.toFixed(1)}" stroke="var(--border-soft)" stroke-width="1"/>
      <text x="${padL-12}" y="${(yy+4).toFixed(1)}" font-size="12" fill="var(--text-secondary)" text-anchor="end">${fmtFn(v)}</text>`;
  }).join('');
  const monthLabels = actualSeries.map((m,i)=>`<text x="${x(i).toFixed(1)}" y="${H-16}" font-size="12" fill="var(--text-secondary)" text-anchor="middle">${m.label}</text>`).join('');
  const lastI = n-1, lastA = aVals[lastI];
  const currentDot = lastA!=null ? `<circle cx="${x(lastI).toFixed(1)}" cy="${y(lastA).toFixed(1)}" r="4" fill="${color}" stroke="var(--bg-card)" stroke-width="1.75"/>` : '';
  const hoverDots = aVals.map((v,i)=> v==null?'':`<circle class="chart-hover-dot dot-a" data-i="${i}" cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="4" fill="${color}"/>`).join('')
    + bVals.map((v,i)=> v==null?'':`<circle class="chart-hover-dot dot-b" data-i="${i}" cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="4" fill="var(--chart-budget-line)"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" data-w="${W}" data-h="${H}" data-padl="${padL}" data-padr="${padR}" data-n="${n}">
    ${gridLines}
    <polyline points="${line(bVals)}" fill="none" stroke="var(--chart-budget-line)" stroke-width="1.75" stroke-dasharray="6,5" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="${line(aVals)}" fill="none" stroke="${color}" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/>
    ${currentDot}
    <line class="chart-hover-line" x1="0" y1="${padT}" x2="0" y2="${H-padB}"/>
    ${hoverDots}
    ${monthLabels}
  </svg>`;
}
/* Reveals the hover line + point dots + tooltip as the mouse moves across the chart,
   snapping to the nearest month. Reads geometry from the <svg data-*> attrs written
   by bigChart() so the coordinate math always matches what was actually drawn.
   Also supports CLICK-TO-PIN: clicking a month draws a persistent ring on that point
   (reusing the already-positioned dot's cx/cy, so no y-scale duplication is needed)
   and calls onSelect(i) so the caller (wireModalTabs) can refresh the sidebar cards
   to show that month's Actual/Budget/Variance instead of always the current month. */
function wireChartTooltip(wrap, months, aVals, bVals, fmtFn, accent, invert, isPP, onSelect, aLabel, bLabel){
  aLabel = aLabel || 'Actual'; bLabel = bLabel || 'Budget';
  const svg = wrap.querySelector('svg');
  const tooltip = wrap.querySelector('.chart-tooltip');
  const hoverLine = svg.querySelector('.chart-hover-line');
  const dotsA = [...svg.querySelectorAll('.dot-a')], dotsB = [...svg.querySelectorAll('.dot-b')];
  const W = +svg.dataset.w, padL = +svg.dataset.padl, padR = +svg.dataset.padr, n = +svg.dataset.n;
  const step = (W-padL-padR)/(n-1||1);
  let pinEl = null;
  function setPin(i){
    const dot = dotsA.find(d=>+d.dataset.i===i) || dotsB.find(d=>+d.dataset.i===i);
    if(pinEl){ pinEl.remove(); pinEl=null; }
    if(!dot) return;
    pinEl = document.createElementNS('http://www.w3.org/2000/svg','circle');
    pinEl.setAttribute('cx', dot.getAttribute('cx'));
    pinEl.setAttribute('cy', dot.getAttribute('cy'));
    pinEl.setAttribute('r', 8);
    pinEl.setAttribute('fill','none');
    pinEl.setAttribute('stroke', accent);
    pinEl.setAttribute('stroke-width','2');
    pinEl.classList.add('chart-pin');
    svg.appendChild(pinEl);
  }
  function show(i){
    const xPix = padL + i*step;
    hoverLine.setAttribute('x1', xPix); hoverLine.setAttribute('x2', xPix); hoverLine.style.opacity = 1;
    dotsA.forEach(d=> d.style.opacity = (+d.dataset.i===i)?1:0);
    dotsB.forEach(d=> d.style.opacity = (+d.dataset.i===i)?1:0);
    const rect = wrap.getBoundingClientRect();
    const scaleX = rect.width/W;
    const px = xPix*scaleX;
    tooltip.style.left = Math.min(Math.max(px-75,4), rect.width-160)+'px';
    tooltip.style.top = '6px';
    const d = computeDelta(aVals[i], bVals[i], fmtFn, invert, isPP);
    const diffRow = d ? `<div class="tt-row tt-diff ${d.good?'pos':'neg'}"><span>${L('Diferencia','Difference')}</span><b>${d.text}</b></div>` : '';
    tooltip.innerHTML = `<div class="tt-month">${months[i]}</div>
      <div class="tt-row"><span><span class="tt-dot" style="background:${accent}"></span>${aLabel}</span><b>${fmtFn(aVals[i])}</b></div>
      <div class="tt-row"><span><span class="tt-dot" style="background:var(--chart-budget-line)"></span>${bLabel}</span><b>${fmtFn(bVals[i])}</b></div>${diffRow}`;
    tooltip.style.opacity = 1;
  }
  function hide(){ hoverLine.style.opacity=0; dotsA.forEach(d=>d.style.opacity=0); dotsB.forEach(d=>d.style.opacity=0); tooltip.style.opacity=0; }
  function nearestIndex(e){
    const rect = wrap.getBoundingClientRect();
    const scaleX = rect.width/W;
    const localX = (e.clientX-rect.left)/scaleX;
    const i = Math.round((localX-padL)/step);
    return Math.max(0, Math.min(n-1, i));
  }
  wrap.addEventListener('mousemove', (e)=> show(nearestIndex(e)));
  wrap.addEventListener('mouseleave', hide);
  wrap.addEventListener('click', (e)=>{
    const i = nearestIndex(e);
    setPin(i);
    if(onSelect) onSelect(i);
  });
  setPin(n-1); // defaults to the current month, matching the sidebar's initial state
}
/* Every metric shown on the Lámina A row/hero MUST have a matching tab here (the user's exact
   complaint: "no hay un tab para ver el porcentaje de leads/sales" — the row shows %Leads/
   %Sales but the modal had no tab matching that number). LeadsShare/SalesShare are placed right
   next to their raw-count siblings (Leads/Sales) so both views are reachable, in the same
   relative order as the row columns (Spend, share metrics, CPL, CMPS, MNCC, New Cash Core,
   Impacto). Conversion is a bonus tab (Sales/Leads), not tied to a row column. */
/* Tabs are clustered into 3 color-coded groups (money / leads / sales) so the tab bar itself
   reads as organized, not just a flat list — see `.mtab[data-group]` CSS. Money group first
   (Spend, New Cash Core, Impacto — the SpendMix/"Distribución Spend" tab, Branded-only, is
   spliced in right after Spend by channelDetailModal(), same group/color), then Leads group
   (Leads, CPL, %Leads), then Sales group (Ventas, CMPS, %Ventas, Conversión). MNCC stands
   alone (it's a blended efficiency read, not specifically money/leads/sales). */
const METRIC_TABS = [
  {key:'Spend', label:'Spend', fmt:fmtUSD, invert:true, pp:false, group:'money'},
  {key:'MarginPct', label:'% MNCC', fmt:fmtPct, invert:false, pp:true, group:'money'},
  {key:'NewCash', label:'New Cash Core', fmt:fmtUSD, invert:false, pp:false, group:'money'},
  {key:'Impact', label:'Net Impact', fmt:fmtUSD, invert:false, pp:false, group:'money'},
  {key:'Leads', label:'Leads', fmt:fmtNum, invert:false, pp:false, group:'leads'},
  {key:'CPL', label:'CPL', fmt:fmtUSD, invert:true, pp:false, group:'leads'},
  {key:'Conversion', label:L('Conversión','Conversion'), fmt:fmtPctConversion, invert:false, pp:true, group:'leads'},
  {key:'LeadsShare', label:L('% Leads','% Leads'), fmt:fmtPct, invert:false, pp:true, group:'leads'},
  {key:'Sales', label:L('Ventas','Sales'), fmt:fmtNum, invert:false, pp:false, group:'sales'},
  {key:'CMPS', label:'CMPS', fmt:fmtUSD, invert:true, pp:false, group:'sales'},
  {key:'SalesShare', label:L('% Ventas','% Sales'), fmt:fmtPct, invert:false, pp:true, group:'sales'},
];
function chartContextLine(){
  const [, m] = DATA.meta.month.split('-').map(Number);
  const d = currentDeck();
  return `${d.brand} · ${regionLabel()} · ${MONTHS_EN[m-1]} ${DATA.meta.month.slice(0,4)} · MTD`;
}
/* Builds the three sidebar stat cards (Actual/Budget/Variance) for a given month index.
   Shared by the tab's initial render (idx = last month, "current month") and by clicking a
   point on the chart (idx = the clicked month) — see wireChartTooltip's onSelect callback in
   wireModalTabs. Labels switch from "current month" wording to the actual month name once a
   non-current month is selected, so it's always clear which month the cards describe. */
function sidebarHtml(idx, actualSeries, budgetSeries, tm, iconName, accent){
  const av = actualSeries[idx][tm.key], bv = budgetSeries[idx][tm.key];
  const monthLabel = actualSeries[idx].label;
  const isCurrent = idx === actualSeries.length-1;
  const actualLabel = isCurrent ? L('Actual (mes en curso)','Actual (current month)') : `${L('Actual','Actual')} — ${monthLabel}`;
  const budgetLabel = isCurrent ? 'Budget' : `Budget — ${monthLabel}`;
  const varLabel = isCurrent ? L('Variación','Variance') : `${L('Variación','Variance')} — ${monthLabel}`;
  const d = computeDelta(av, bv, tm.fmt, tm.invert, tm.pp);
  const good = d ? d.good : true;
  return `<div class="mtc-stat">${iconChip(iconName, accent, false, true)}<div><div class="label">${actualLabel}</div><div class="value">${tm.fmt(av)}</div></div></div>
    <div class="mtc-stat budget">${iconChip('wallet','var(--text-secondary)', false, true)}<div><div class="label">${budgetLabel}</div><div class="value">${tm.fmt(bv)}</div></div></div>
    <div class="mtc-stat variance ${d?(good?'pos':'neg'):''}">${iconChip('trend', d?(good?'var(--pos)':'var(--neg)'):'var(--text-secondary)', false, true)}<div><div class="label">${varLabel}</div>
      <div class="value">${d? `${arrowIcon(good)}${d.text}` : '—'}</div>
    </div></div>`;
}
/* Cumulative/volume metrics (Spend/New Cash Core/Impacto/Leads/Ventas) get the pacing sidebar
   INSTEAD of the normal actual/budget/variance cards, but ONLY for the current (still-open)
   month — a past month is a fully-elapsed period, so its actual-vs-budget comparison is
   completely fair and uses the normal sidebarHtml(). Once the month closes (monthIsComplete()),
   this metric goes back to the normal sidebar everywhere, current month included. Ratio metrics
   (CPL, CMPS, %Leads, %Ventas, Conversión, MNCC) are NEVER pacing — a rate is comparable at any
   point in the month regardless of how many days have elapsed, unlike a running total. 'Impact'
   REMOVED 2026-08 (was pacing) — now that Net Impact is itself already a diff-of-diffs (see
   impact()'s new formula), there's no separate "full-period target" to prorate against; its own
   "budget" is definitionally 0 at any point in the month, prorated or not. */
function isPacingMetric(key){ return key==='Spend' || key==='NewCash' || key==='Leads' || key==='Sales'; }
function sidebarOrPacingHtml(idx, actualSeries, budgetSeries, tm, iconName, accent){
  const isCurrent = idx === actualSeries.length-1;
  if(isCurrent && !monthIsComplete() && isPacingMetric(tm.key)){
    return pacingSidebarHtml(actualSeries, budgetSeries, tm, iconName, accent);
  }
  return sidebarHtml(idx, actualSeries, budgetSeries, tm, iconName, accent);
}
/* Same pacing logic as pacingCell() (row/hero cards), applied to the modal sidebar: day-pacing
   vs value-pacing, plus a "headroom/still-needed" card answering the user's actual question —
   "cuántos días tengo y cuánto necesito lograr" — showing the $ gap to the full-month budget
   and what that means per remaining day. Always for the CURRENT month only (see
   sidebarOrPacingHtml). */
function pacingSidebarHtml(actualSeries, budgetSeries, tm, iconName, accent){
  const idx = actualSeries.length-1;
  const av = actualSeries[idx][tm.key], bv = budgetSeries[idx][tm.key];
  const day = DATA.meta.asOfDay, days = DATA.meta.daysInMonth, remaining = days-day;
  const dayPacing = day/days;
  const higherIsBetter = tm.key!=='Spend';
  const valuePacing = (bv!=null && bv!==0 && av!=null) ? av/bv : null;
  const good = valuePacing==null ? true : (higherIsBetter ? valuePacing>=dayPacing : valuePacing<=dayPacing);
  const diffPP = valuePacing==null ? null : (valuePacing-dayPacing)*100;
  const gap = (bv!=null && av!=null) ? bv-av : null;
  const perDay = (gap!=null && remaining>0) ? gap/remaining : null;
  const gapLabel = tm.key==='Spend' ? L('Presupuesto disponible','Budget headroom left') : L('Falta por generar','Still needed to hit budget');
  return `<div class="mtc-stat">${iconChip(iconName, accent, false, true)}<div><div class="label">${L('Actual (mes en curso)','Actual (current month)')}</div><div class="value">${tm.fmt(av)}</div></div></div>
    <div class="mtc-stat ${valuePacing==null?'':(good?'pos':'neg')}">${iconChip('gauge', valuePacing==null?'var(--text-secondary)':(good?'var(--pos)':'var(--neg)'), false, true)}<div><div class="label">${L(`Pacing (día ${day} de ${days})`,`Pacing (day ${day} of ${days})`)}</div>
      <div class="value" style="font-size:var(--text-2xl);font-weight:700">${valuePacing==null?'—':`${arrowIcon(good)}${(valuePacing*100).toFixed(0)}%`}</div>
      ${valuePacing==null?'':`<div style="font-size:14px;color:var(--text-secondary);margin-top:2px">vs ${(dayPacing*100).toFixed(0)}% ${L('del mes','of month')} (${diffPP>=0?'+':''}${diffPP.toFixed(1)}pp)</div>`}
    </div></div>
    <div class="mtc-stat">${iconChip('wallet','var(--text-secondary)', false, true)}<div><div class="label">${gapLabel}</div>
      <div class="value" style="font-size:var(--text-lg)">${gap==null?'—':tm.fmt(Math.abs(gap))}</div>
      ${perDay!=null?`<div style="font-size:14px;color:var(--text-secondary);margin-top:2px">${L(`${tm.fmt(Math.abs(perDay))}/día × ${remaining} días restantes`,`${tm.fmt(Math.abs(perDay))}/day × ${remaining} days left`)}</div>`:''}
    </div></div>
    <button class="ai-methodology-link" data-pacing-meth="1">${L('¿Cómo se calculó el pacing?','How is pacing calculated?')}</button>`;
}
function openPacingMethodologyModal(){
  const day = DATA.meta.asOfDay, days = DATA.meta.daysInMonth;
  const dayPacingPct = Math.round(day/days*100);
  const text = L(
    `El mes aún no ha cerrado (día ${day} de ${days} = ${dayPacingPct}% transcurrido), así que comparar el acumulado real contra un budget de mes completo no sería justo. En vez de eso: % del budget ya consumido/generado (actual ÷ budget) se compara contra % del mes ya transcurrido (${day} ÷ ${days}). Si ambos porcentajes coinciden, vas exactamente al ritmo del budget. Para Spend, ir POR DEBAJO del % de días transcurridos es bueno (gastando más lento de lo presupuestado); para New Cash Core, ir POR ENCIMA es bueno (generando más rápido de lo presupuestado). El "presupuesto disponible"/"falta por generar" es simplemente budget − actual, dividido entre los días que quedan del mes.`,
    `The month hasn't closed yet (day ${day} of ${days} = ${dayPacingPct}% elapsed), so comparing the real total against a full-month budget wouldn't be fair. Instead: % of budget already consumed/generated (actual ÷ budget) is compared against % of the month already elapsed (${day} ÷ ${days}). If both percentages match, you're tracking exactly the budget's pace. For Spend, running BELOW the % of days elapsed is good (spending slower than budgeted); for New Cash Core, running ABOVE is good (generating faster than budgeted). "Budget headroom left"/"still needed" is simply budget − actual, divided by the days left in the month.`
  );
  openModal(null, `<h3>${L('¿Cómo se calculó el pacing?','How is pacing calculated?')}</h3><div class="methodology-modal"><p>${text}</p></div>`);
}
function renderModalTab(key, label, iconName, accent, tabKey){
  const tm = METRIC_TABS.find(t=>t.key===tabKey);
  const {actual: actualSeries, budget: budgetSeries} = getSeriesPair(key);
  const aVals = actualSeries.map(m=>m[tm.key]), bVals = budgetSeries.map(m=>m[tm.key]);
  const aWithV = actualSeries.map((m,i)=>({...m, __v:aVals[i]}));
  const bWithV = budgetSeries.map((m,i)=>({...m, __v:bVals[i]}));
  return `<div class="mtc-row">
    <div class="mtc-chart-col">
      <div class="mtc-chart-title">
        <div class="ct-main">${label} — ${tm.label}</div>
        <div class="ct-sub">${chartContextLine()}</div>
      </div>
      <div class="big-chart-wrap">${bigChart(aWithV, bWithV, tm.fmt, accent)}<div class="chart-tooltip"></div></div>
      <div class="chart-legend-lg">
        <span class="lg-actual"><i style="border-color:${accent}"></i>${L('Actual','Actual')}</span>
        <span class="lg-budget"><i style="border-color:var(--chart-budget-line)"></i>Budget</span>
      </div>
    </div>
    <div class="mtc-sidebar">${sidebarOrPacingHtml(actualSeries.length-1, actualSeries, budgetSeries, tm, iconName, accent)}</div>
  </div>`;
}
function wireModalTabs(dlg, key, label, iconName, accent, initialTab){
  const body = dlg.querySelector('.modal-tab-body');
  const setTab = (tabKey)=>{
    dlg.querySelectorAll('.modal-tabs button').forEach(b=> b.classList.toggle('on', b.dataset.tab===tabKey));
    if(tabKey==='SpendMix'){
      body.innerHTML = renderSpendMixTab(label);
      const series = DATA.spendMixBranded;
      wireChartTooltip(
        body.querySelector('.big-chart-wrap'),
        series.map(m=>m.label),
        series.map(m=>m.SemBrandPct),
        series.map(m=>m.OfflinePct),
        fmtPct, 'var(--brand-accent)', false, true,
        (i)=>{ body.querySelector('.mtc-sidebar').innerHTML = spendMixSidebarHtml(i); },
        'SEM-Brand', L('Media (Offline/TV)','Media (Offline/TV)')
      );
      return;
    }
    body.innerHTML = renderModalTab(key, label, iconName, accent, tabKey);
    const tm = METRIC_TABS.find(t=>t.key===tabKey);
    const {actual: actualSeries, budget: budgetSeries} = getSeriesPair(key);
    wireChartTooltip(
      body.querySelector('.big-chart-wrap'),
      actualSeries.map(m=>m.label),
      actualSeries.map(m=>m[tm.key]),
      budgetSeries.map(m=>m[tm.key]),
      tm.fmt,
      accent,
      tm.invert,
      tm.pp,
      (i)=>{ body.querySelector('.mtc-sidebar').innerHTML = sidebarOrPacingHtml(i, actualSeries, budgetSeries, tm, iconName, accent); }
    );
  };
  dlg.querySelectorAll('.modal-tabs button').forEach(b=>{
    b.addEventListener('click', ()=> setTab(b.dataset.tab));
  });
  /* Delegated (not re-attached per render) since the pacing methodology button gets rebuilt
     every time the sidebar re-renders (tab switch, chart click) — a direct listener would need
     re-wiring each time and is easy to forget. */
  body.addEventListener('click', (e)=>{ if(e.target.closest('[data-pacing-meth]')) openPacingMethodologyModal(); });
  setTab(initialTab || 'Spend');
}

/* ---------------- PERSISTENCE (theme + language survive a refresh) ---------------- */
const LS_THEME = 'branformance_theme', LS_LANG = 'branformance_lang';
let DECK_ID = 'OE-LATAM'; // brand+region key for the CURRENTLY OPEN deck — set by enterDeck()

/* ---------------- LÁMINA A VIEW SETTINGS (row + column visibility) ----------------
   Per-lámina, not global: which of the 6 channel-grouping ROWS show at all (so Paid Social
   ASC/no-ASC can be shown or hidden independently of each other — "grouped" is just the
   default state where those two are off and the combined "Paid Social + Organic" row is on),
   and which of the 8 metric COLUMNS show, independently, in both the table and the hero.
   Persisted so a reviewer's chosen view survives a refresh, same pattern as theme/lang. */
const LS_LAMINA_A_VIEW = 'branformance_laminaA_view';
/* Spend/New Cash Core/Impact are absolute $ amounts that compare a still-incomplete MTD
   actual against a FULL-MONTH budget — an apples-to-oranges comparison while the month is
   still running, so they default to HIDDEN until the data itself shows the month is fully
   closed (asOfDay === daysInMonth for the current deck's data). This is NOT today's system
   clock — the underlying data file could be stale — it's purely "does DATA.meta say we have
   data through the last day of the month". The 5 rate/ratio metrics (%Leads, %Sales, CPL,
   CMPS, MNCC) are always meaningful mid-month, so they always default to visible. */
function defaultLaminaAView(){
  const monthComplete = DATA.meta.asOfDay === DATA.meta.daysInMonth;
  return {
    rows: {branded:true, paidSocialPlusOrganic:true, paidSocialASC:false, paidSocialNoASC:false, google:true, others:true},
    cols: {Spend:monthComplete, SpendShare:false, Leads:false, LeadsShare:true, Sales:false, SalesShare:true, CPL:true, Conversion:true, CMPS:true, AvgPrice:false, MarginPct:true, NewCash:monthComplete, Impact:monthComplete, LtvShort:true, FullUnitCmShort:true, FullCmPctShort:true, NewCashSemaphore:true},
  };
}
/* Was initialized at top level (`let laminaAView = defaultLaminaAView()`) back when DATA was
   populated synchronously -- defaultLaminaAView() reads DATA.meta, so it now has to wait until
   after login. Declared here as a plain forward reference; actually assigned inside
   finishBootstrap() (see the login section near the end of this script), before anything that
   reads it can possibly run (the user can't reach Lámina A before logging in). */
let laminaAView = null;
function loadLaminaAView(){
  laminaAView = defaultLaminaAView();
  try{
    const saved = JSON.parse(localStorage.getItem(LS_LAMINA_A_VIEW)||'null');
    if(saved){ Object.assign(laminaAView.rows, saved.rows); Object.assign(laminaAView.cols, saved.cols); }
  }catch(e){}
}
function saveLaminaAView(){ localStorage.setItem(LS_LAMINA_A_VIEW, JSON.stringify(laminaAView)); }

const LS_YOY_CUSTOM_RANGE = 'branformance_yoy_customrange_v2';
let yoyCustomRange = {
  enabled: true, // default-on 2026-08-14, explicit ask

function parseISODate(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function toISODate(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function addDaysISO(iso, n){ const d = parseISODate(iso); d.setDate(d.getDate()+n); return toISODate(d); }
function addYearsISO(iso, n){ const [y,m,d] = iso.split('-').map(Number); return `${y+n}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }
function daysInclusive(startISO, endISO){ return Math.round((parseISODate(endISO)-parseISODate(startISO))/86400000)+1; }
function weekdayCounts(startISO, endISO){
  const counts = [0,0,0,0,0,0,0];
  const end = parseISODate(endISO);
  for(let d = parseISODate(startISO); d<=end; d.setDate(d.getDate()+1)) counts[d.getDay()]++;
  return counts;
}
/* "Peras con peras" validation (explicit ask): same TOTAL day count AND same count of each
   individual weekday (not just total days) — two ranges can have equal length but a different
   weekday mix (e.g. 7 days starting Monday vs. 7 days starting Wednesday still both "7 days" but
   don't line up Mon-vs-Mon). Both checks reported separately so the warning can name which one
   actually failed. */
function rangesComparable(aStart,aEnd,bStart,bEnd){
  const daysA = daysInclusive(aStart,aEnd), daysB = daysInclusive(bStart,bEnd);
  const wA = weekdayCounts(aStart,aEnd), wB = weekdayCounts(bStart,bEnd);
  const weekdaysMatch = wA.every((v,i)=>v===wB[i]);
  return {ok: daysA===daysB && weekdaysMatch, daysMatch: daysA===daysB, weekdaysMatch, daysA, daysB};
}
/* Same technique as compute_yoy_windows() server-side (build_data_all.py): same calendar dates
   last year, then shifted by 0-6 days so the shifted start's weekday matches startISO's weekday —
   the shift is computed fresh every time (never hardcoded), since it depends on where day-1 of
   the range falls in each year. */
function shiftedRangeForWeekday(startISO, endISO){
  const priorStart = addYearsISO(startISO, -1);
  const shift = ((parseISODate(startISO).getDay() - parseISODate(priorStart).getDay()) + 7) % 7;
  const shiftedStart = addDaysISO(priorStart, shift);
  return {start: shiftedStart, end: addDaysISO(shiftedStart, daysInclusive(startISO,endISO)-1)};
}
function yoyDefaultActualRange(){
  return {start: DATA.meta.month+'-01', end: `${DATA.meta.month}-${String(DATA.meta.asOfDay).padStart(2,'0')}`};
}
function yoyActiveActualRange(){
  const def = yoyDefaultActualRange();
  return {start: yoyCustomRange.actualStart||def.start, end: yoyCustomRange.actualEnd||def.end};
}
function yoyActiveCompareRange(){
  const {start,end} = yoyActiveActualRange();
  if(yoyCustomRange.compareMode==='custom'){
    return {start: yoyCustomRange.compareStart||addYearsISO(start,-1), end: yoyCustomRange.compareEnd||addYearsISO(end,-1)};
  }
  if(yoyCustomRange.compareMode==='exact'){
    const priorStart = addYearsISO(start,-1);
    return {start: priorStart, end: addDaysISO(priorStart, daysInclusive(start,end)-1)};
  }
  return shiftedRangeForWeekday(start,end); // 'shifted', the default
}
function yoyWeekdaySet(){ return (yoyCustomRange.weekdays && yoyCustomRange.weekdays.length) ? new Set(yoyCustomRange.weekdays) : null; }
/* Sums DATA.yoyDailyByCountry rows into the exact same {Spend,Leads,Sales,NewCash,FullCM,
   ProjRevShort,TotalEnrollments} shape yoyByCountry.exact/.shifted already use per country — this
   is what lets every existing consumer (countryRowYoy, yoyCellHtml, heroCellYoy, ltvShort() and
   friends) read a custom-range result with ZERO changes of their own; only actualFor()/yoyFor()
   below need to know which data source is active. */
function aggregateYoyDaily(rows, startISO, endISO, weekdaySet){
  const out = {};
  for(const r of rows){
    if(r.date<startISO || r.date>endISO) continue;
    if(weekdaySet && !weekdaySet.has(parseISODate(r.date).getDay())) continue;
    const b = out[r.country] || (out[r.country] = {Spend:0,Leads:0,Sales:0,NewCash:0,FullCM:0,ProjRevShort:0,TotalEnrollments:0,MediaSpend:0,PaidOrganicSpend:0});
    b.Spend+=r.Spend; b.Leads+=r.Leads; b.Sales+=r.Sales; b.NewCash+=r.NewCash;
    b.FullCM+=r.FullCM; b.ProjRevShort+=r.ProjRevShort; b.TotalEnrollments+=r.TotalEnrollments;
    // MediaSpend/PaidOrganicSpend (bug reported 2026-08-11 — see build_data_all.py's
    // add_yoy_daily_media_spend()): `||0` defends against a not-yet-rebuilt dataset whose rows
    // predate this fix, not against a real data gap (every row past this fix always has both).
    b.MediaSpend+=(r.MediaSpend||0); b.PaidOrganicSpend+=(r.PaidOrganicSpend||0);
  }
  return out;
}
/* "Agregar Brasil" support (item 6): concatenate OE-BR's own daily rows in before aggregating,

   rows already carry country:"Brazil" (see build_data_all.py's yoy5mo_rows_to_daily(latam=False)),

/* Weekday multi-select — supports both interaction styles asked for: Ctrl/Cmd+click TOGGLES one
   day in/out of the current selection (like a file manager's ctrl-click), plain click-and-drag
   SETS a contiguous range (replacing the selection with everything between drag-start and
   drag-end, like dragging over cells in a spreadsheet). `weekdayDragState` is module-level (not
   per-render) specifically so the single `mouseup` listener that ends a drag only needs
   registering ONCE, ever — registering it inside the per-render wiring function would stack a new
   listener on every renderGroupMenuYoy() call (deck switch, language toggle), same class of bug
   already fixed once this session for a different reason (see applyAutoFit's PERF FIX comment). */
let weekdayDragState = null;
document.addEventListener('mouseup', ()=>{ weekdayDragState = null; });
function weekdaySelectorHtml(){
  const labels = [L('Dom','Sun'),L('Lun','Mon'),L('Mar','Tue'),L('Mié','Wed'),L('Jue','Thu'),L('Vie','Fri'),L('Sáb','Sat')];
  const selected = new Set(yoyCustomRange.weekdays || [0,1,2,3,4,5,6]);
  return `<div class="weekday-selector" id="yoyWeekdaySelector">
    ${labels.map((lb,i)=>`<button type="button" class="wd-btn${selected.has(i)?' on':''}" data-wd="${i}">${lb}</button>`).join('')}
  </div>`;
}
function wireWeekdaySelector(container, onChange){
  const buttons = () => Array.from(container.querySelectorAll('.wd-btn'));
  const currentSet = () => new Set(yoyCustomRange.weekdays || [0,1,2,3,4,5,6]);
  const applySelection = (set) => {
    yoyCustomRange.weekdays = (set.size===7) ? null : Array.from(set).sort();
    buttons().forEach(b => b.classList.toggle('on', set.has(Number(b.dataset.wd))));
    onChange();
  };
  buttons().forEach(btn=>{
    const day = Number(btn.dataset.wd);
    btn.addEventListener('mousedown', e=>{
      e.preventDefault();
      if(e.ctrlKey || e.metaKey){
        const set = currentSet();
        if(set.has(day)) set.delete(day); else set.add(day);
        weekdayDragState = {mode:'toggle', touched:new Set([day])};
        applySelection(set);
      } else {
        weekdayDragState = {mode:'range', startDay:day};
        applySelection(new Set([day]));
      }
    });
    btn.addEventListener('mouseenter', ()=>{
      if(!weekdayDragState) return;
      if(weekdayDragState.mode==='range'){
        const lo = Math.min(weekdayDragState.startDay, day), hi = Math.max(weekdayDragState.startDay, day);
        const set = new Set(); for(let d=lo; d<=hi; d++) set.add(d);
        applySelection(set);
      } else if(!weekdayDragState.touched.has(day)){
        weekdayDragState.touched.add(day);
        const set = currentSet();
        if(set.has(day)) set.delete(day); else set.add(day);
        applySelection(set);
      }
    });
  });
}

/* Per-slide content zoom — explicitly NOT the browser's own zoom (rejected by the user: it must
   work the same regardless of the viewer's browser zoom setting, and must never rely on it).
   Keyed by deck+slide (not just slide type) since e.g. OE-LATAM's Daily Tracker and Brazil's
   Daily Tracker are structurally very different content densities and shouldn't share a level.
   Cover is intentionally excluded — it's a brand splash, never data-dense enough to need this. */
const LS_SLIDE_ZOOM = 'branformance_slide_zoom';
const ZOOM_MIN = 0.8, ZOOM_MAX = 1.5, ZOOM_STEP = 0.1;
let slideZoom = {};
(function loadSlideZoom(){

function zoomStorageKey(slideId){ return DECK_ID+':'+slideId; }
/* autoFitScale is the OTHER half of the effective zoom — never persisted (it must always reflect
   the CURRENT window, not a past one), recomputed by applyAutoFit() below. Multiplying it into
   getZoom() means every existing caller (the slide's own inline style, updateZoomUi's %, the
   manual zoom-in/out math) automatically accounts for it with zero other changes — the manual
   zoom becomes "how much bigger than the auto-fit baseline," not an absolute size. */
let autoFitScale = {};
function getZoom(slideId){ return (slideZoom[zoomStorageKey(slideId)] || 1) * (autoFitScale[slideId] || 1); }
const ZOOMABLE_SLIDES = {a: refreshSlideA, daily: refreshSlideDaily, yoy: refreshSlideYoy};
function currentSlideId(){
  const scroller = document.getElementById('scroller');
  const idx = Math.round(scroller.scrollTop / window.innerHeight);
  return SLIDES[idx] ? SLIDES[idx].id : null;
}
/* `.slide-body{flex:1}`'s OWN box is sized by the flex algorithm — it stays the exact same size
   whether its content zoomed content is 100% or 150%, so comparing .slide-body's/any single
   descendant's own getBoundingClientRect() against the footer is unreliable in general (it would
   need to know which specific descendant is the "last" one for every current and future slide
   layout — a table row here, a card grid in Brazil's flow layout, etc.). Instead, use .slide
   itself: it has a fixed height AND overflow:hidden, so if the (now-zoomed) content inside
   genuinely needs more room than that fixed height allows, `scrollHeight` (the content's true,
   unclipped extent) exceeds `clientHeight` (the visible, clipped extent) by exactly the clipped
   amount — a simple, correct, structure-agnostic overflow signal confirmed empirically while
   building this (0px diff at levels that visibly fit, 100+px diff at levels that visibly don't). */
/* Lámina A's .channel-table has its OWN overflow-y:auto safety net (see its CSS comment) — it
   contains its own overflow so the SLIDE never breaks, but that containment means slide.scrollHeight
   stops seeing it entirely (a scrollable descendant's internal overflow never inflates its
   ancestor's own scrollHeight). Auto-fit must still shrink for this case — leaving the reader with
   an internal scrollbar on the default view is exactly the "tengo que escrolear" complaint this
   feature exists to prevent — so this checks BOTH: the slide itself (the general case) AND
   .channel-table specifically wherever it's present, since that's currently the only
   internally-scrollable descendant in this deck. */
function slideOverflows(slideId){
  const idx = SLIDES.findIndex(s=>s.id===slideId);
  if(idx<0) return false;
  const slide = document.querySelectorAll('.slide')[idx];
  if(!slide) return false;
  if(slide.scrollHeight > slide.clientHeight) return true;
  const table = slide.querySelector('.channel-table');
  if(table && table.scrollHeight > table.clientHeight) return true;
  /* Horizontal check, hero tiles only: .bh-kpis' tracks are minmax(0,1fr) (see that rule's
     comment) so a wide tile can no longer force the whole grid wider than its container — but a
     nowrap .mc-delta can still be wider than ITS OWN now-constrained tile, spilling visually into
     the next one. scrollWidth on the tile itself (not the delta) catches this regardless of which
     child is the wide one. */
  const heroTiles = slide.querySelectorAll('.bh-kpi');
  for(const t of heroTiles){ if(t.scrollWidth > t.clientWidth + 0.5) return true; }
  return false;
}
/* Zoom-in can request a level that doesn't fit (content has less slack than the step size) — this
   self-corrects by rendering the requested level, measuring, and stepping back down until it fits,
   all inside one requestAnimationFrame so the browser never actually paints the overflowing
   intermediate state. Zoom-out never needs this: shrinking never overflows more than the current
   (already-fitting) level. */
function adjustZoom(delta){
  const id = currentSlideId();
  const refresh = ZOOMABLE_SLIDES[id];
  if(!refresh) return;
  const key = zoomStorageKey(id);
  const current = slideZoom[key] || 1;
  if(delta < 0){
    /* Shrinking never overflows more than the current (already-fitting) level — no fit-search
       needed, just clamp to the floor. */
    const next = Math.round(Math.max(ZOOM_MIN, current + delta) * 100) / 100;
    if(next === current){ updateZoomUi(); return; }
    slideZoom[key] = next;
    refresh();
    saveSlideZoom();
    updateZoomUi();
    return;
  }
  /* Zoom-IN can't just try +ZOOM_STEP and reject it wholesale on overflow — this deck's slides
     are already tightly optimized (see feedback-branformance-technical-gotchas memory), so their
     available slack is usually tens of px against several-hundred-px content, i.e. much less than
     one full 10% step. A binary search finds the LARGEST value up to current+ZOOM_STEP that still
     fits, so a click always makes whatever progress the available whitespace actually allows,
     rather than an all-or-nothing jump that silently does nothing almost everywhere.
     Deliberately synchronous, no requestAnimationFrame: a plain synchronous function never yields
     back to the browser's render step until it returns, so every trySet()/refresh() in this
     search is invisible mid-search on its own — rAF isn't needed to avoid a flash, and depending
     on it here would be actively wrong, since rAF callbacks are fully suspended in a
     hidden/non-composited document (confirmed while building this), which would leave a zoom
     click permanently "stuck" pending until the tab regains visibility. */
  const ceiling = Math.min(ZOOM_MAX, current + ZOOM_STEP);
  if(ceiling <= current + 1e-9){ updateZoomUi(); flashZoomCapped(); return; }
  const trySet = (z) => { slideZoom[key] = z; refresh(); };
  trySet(ceiling);
  if(!slideOverflows(id)){
    slideZoom[key] = Math.round(ceiling * 100) / 100;
    refresh();
  } else {
    let lo = current, hi = ceiling;
    for(let i = 0; i < 7; i++){
      const mid = (lo + hi) / 2;
      trySet(mid);
      if(slideOverflows(id)) hi = mid; else lo = mid;
    }
    slideZoom[key] = Math.max(current, Math.floor(lo * 100) / 100); // round DOWN — never land one px over
    refresh();
  }
  finishZoomIn(current, key, id);
}
function finishZoomIn(previousLevel, key, id){
  // The search can land fractionally above where it started if content fits exactly at current —
  // re-verify once more after rounding, since Math.floor()'s rounding is a final sanity check, not
  // a guarantee, against the actual rendered box. Floored at previousLevel, never lower: if a
  // slide is ALREADY overflowing before this click even ran (a pre-existing layout bug, not
  // something this click caused), the correction below must never make a "+" click into a
  // de-facto zoom-OUT below where the user started — it should just refuse to zoom in further.
  if(slideOverflows(id) && slideZoom[key] > previousLevel + 1e-9){
    slideZoom[key] = Math.max(previousLevel, Math.round((slideZoom[key] - 0.01) * 100) / 100);
    ZOOMABLE_SLIDES[id]();
  }
  saveSlideZoom();
  updateZoomUi();
  if(slideZoom[key] <= previousLevel + 1e-9) flashZoomCapped();
}
function flashZoomCapped(){
  const group = document.getElementById('zoomGroup');
  group.classList.remove('zoom-capped');
  void group.offsetWidth; // restart the animation if it's already mid-flash from a rapid click
  group.classList.add('zoom-capped');
}
function updateZoomUi(){
  const id = currentSlideId();
  const group = document.getElementById('zoomGroup');
  if(!ZOOMABLE_SLIDES[id]){ group.style.display = 'none'; return; }
  group.style.display = 'flex';
  const z = getZoom(id);
  document.getElementById('zoomPct').textContent = Math.round(z * 100) + '%';
  document.getElementById('zoomOut').disabled = z <= ZOOM_MIN + 1e-9;
  document.getElementById('zoomIn').disabled = z >= ZOOM_MAX - 1e-9;
}

/* Shrinks delta font-size (never anything else — actual/budget/labels stay put) only when some
   nowrap cell's content still doesn't fit its own box at full size — a DIFFERENT problem from
   viewport fit (see the long comment on .bh-kpi's rule for why zoom can't touch this one). Must
   run BEFORE applyAutoFit in each refreshSlideX: fix cells' own internal proportions first, then
   fit the (now-correct) whole slide to the viewport. TWO independent scales, computed and applied
   separately, because the two contexts are different enough that sharing one would either starve
   the table (barely-overflowing, needs a light touch) or under-shrink the hero (badly-overflowing
   at 10 tiles, needs a heavy one) — see each CSS rule using these vars for exactly which contexts
   read which var:
   - --hero-delta-scale: summary cards (.bh-kpi grid hero OR .daily-br-card/.daily-br-spend
     Brazil's card flow — whichever a given deck/region renders; set on the SLIDE root, not
     .bh-kpis, so one mechanism covers both without duplicating this function).
   - --table-delta-scale: row-table cells (.metric-col, Lámina A/Daily Tracker/YoY's per-channel
     or per-country rows) — found missing via a full 4-deck×4-slide sweep (a few px of overflow
     on specific rows, invisible in the single-deck spot-checks that had looked clean; scoped
     separately from the hero's because the table's overflow here is consistently much smaller).
   Both step down in small increments rather than binary-searching — this only ever needs a few %
   in practice (long $ amounts, not wildly oversized), and re-rendering the whole slide per step
   is not free. */
/* Card scrollWidth is NOT a reliable overflow signal here — a flex-column card with
   align-items:center (e.g. .daily-br-spend) reports a phantom scrollWidth > clientWidth
   (constant regardless of content/scale, confirmed empirically) purely from the centering,
   with zero descendants actually outside its box. Checking every descendant's own rendered
   rect against the card's OWN BORDER-BOX edges avoids that false positive while still catching
   the real case (e.g. a long .dbc-label that won't wrap pushing past the card on its own).
   **Deliberately border-box, not padding-box**: an earlier version subtracted
   getComputedStyle(card).paddingLeft/Right from rect.left/right to get the padding edge — but
   getComputedStyle padding is the UNZOOMED logical CSS value (same quirk as fontSize), while
   `rect` is the real zoomed render, so at this deck's routine fractional `zoom` levels
   (0.44-0.9x) that subtraction was systematically wrong by `padding*(1-zoom)` — confirmed by a
   card where EVERY descendant, regardless of content, reported the exact same ~2.5px "overflow"
   (14px padding * (1-0.82 zoom) ≈ 2.5) with nothing visually wrong. Comparing straight against
   the card's own rect sidesteps the mismatch entirely (both sides of the comparison come from
   getBoundingClientRect, so they share the same zoom scaling) and is also the more honest check
   anyway: a few px eaten out of reserved padding isn't a visible defect, content actually
   crossing the card's outer edge is. Real bugs this exists to catch have all measured 6px+. */
function cardContentOverflows(card){
  const rect = card.getBoundingClientRect();
  const TOL = 1.5;
  return [...card.querySelectorAll('*')].some(el=>{
    const r = el.getBoundingClientRect();
    return r.width>0 && (r.right > rect.right+TOL || r.left < rect.left-TOL);
  });
}
function fitHeroDeltas(slideId){
  const idx = SLIDES.findIndex(s=>s.id===slideId);
  const slide = document.querySelectorAll('.slide')[idx];
  if(!slide) return;
  const cardSelector = '.bh-kpi, .daily-br-card, .daily-br-spend';
  if(slide.querySelector(cardSelector)){
    slide.style.removeProperty('--hero-delta-scale');
    let scale = 1;
    for(let i=0;i<14;i++){
      const cards = [...slide.querySelectorAll(cardSelector)];
      if(!cards.some(cardContentOverflows)) break;
      scale = Math.round((scale-0.04)*100)/100;
      slide.style.setProperty('--hero-delta-scale', scale);
    }
  }
  if(slide.querySelector('.metric-col')){
    slide.style.removeProperty('--table-delta-scale');
    let tScale = 1;
    for(let i=0;i<14;i++){
      const cells = [...slide.querySelectorAll('.metric-col')];
      /* `.metric-col .metric-cell{text-align:right}` — overflowing content spills LEFTWARD,
         into the previous column, and `scrollWidth > clientWidth` does not reliably detect
         leftward overflow (confirmed empirically: a real, visible column-invasion case measured
         scrollWidth===clientWidth on every affected cell). cardContentOverflows() catches this
         because it compares actual rendered rects, direction-agnostic. */
      if(!cells.some(cardContentOverflows)) break;
      tScale = Math.round((tScale-0.04)*100)/100;
      slide.style.setProperty('--table-delta-scale', tScale);
    }
  }
}
/* Auto-fit — every lamina must fit whatever window the viewer ACTUALLY has open, never assume
   the ~1400×900 size this project tests at. Reuses slideOverflows()'s exact
   scrollHeight-vs-clientHeight check and the same binary-search-for-largest-that-fits shape as
   manual zoom-in above, but searching for a SHRINK factor (never above 1 — this is a safety net
   against overflow, not a way to blow content up on a huge monitor) and re-run on every render,
   not just once, since `.slide{height:100vh}` means "fits" is a live property of the current
   window, not a fixed fact computed once at load. `autoFitBusy` guards against the obvious
   recursion (this calls the slide's own refresh() to re-measure at each candidate scale, and
   refresh() calls this again at its own end — see where it's invoked from each refreshSlideX).
   PERF FIX (2026-08, real bug reported by the user — "trabado", ~2.3s per checkbox click measured
   with every row/column visible): the search used to call `refresh()` — a FULL slideX() outerHTML
   rebuild PLUS a nested fitHeroDeltas() pass (up to 28 measure-iterations of its own) — on every
   one of its ~11 probe attempts (1 initial + up to 9 binary-search steps + 1 final). Only
   `--slide-zoom`'s VALUE differs between probes; the row/column content never changes mid-search,
   so rebuilding the entire DOM from an HTML string 11 times to test 11 numbers was pure waste.
   Probes now mutate `--slide-zoom` directly on the already-rendered slide element (cheap: one
   style write, forces a layout recalc only on the next read, same technique `fitHeroDeltas`
   itself already uses for its own scale vars) — `fitHeroDeltas()` runs exactly ONCE at the end,
   at the final chosen zoom, instead of once per probe. CSS `zoom` scales content and its
   container proportionally, so a delta/cell's overflow-vs-its-box relationship (what
   fitHeroDeltas' own search resolves) doesn't change across different `--slide-zoom` values —
   re-running it mid-search was measuring the same answer repeatedly. Confirmed same final visual
   result, ~2.3s -> ~0.1-0.2s on the same all-columns-visible worst case. */
let autoFitBusy = false;
function applyAutoFit(slideId){
  // no refresh()/outerHTML rebuild anywhere below — see PERF FIX comment above.
  if(!ZOOMABLE_SLIDES[slideId] || autoFitBusy) return;
  autoFitBusy = true;
  const idx = SLIDES.findIndex(s=>s.id===slideId);
  const slide = document.querySelectorAll('.slide')[idx];
  const probe = (scale) => {
    autoFitScale[slideId] = scale;
    if(slide) slide.style.setProperty('--slide-zoom', getZoom(slideId));
  };
  probe(1);
  if(slide && slideOverflows(slideId)){
    let lo = 0.55, hi = 1;
    for(let i=0;i<9;i++){
      const mid = (lo+hi)/2;
      probe(mid);
      if(slideOverflows(slideId)) hi = mid; else lo = mid;
    }
    probe(Math.floor(lo*1000)/1000); // round DOWN — never land one px over
  }
  fitHeroDeltas(slideId); // settle delta-scale once, at the final zoom, not once per probe above
  autoFitBusy = false;
}
/* Debounced, not on every resize event (which can fire dozens of times per drag) — 120ms is
   short enough to feel immediate once the user stops dragging, long enough to not thrash the
   binary search (18 renders worst-case) on every intermediate frame of a live window-resize. */
let resizeFitTimer = null;
window.addEventListener('resize', ()=>{
  clearTimeout(resizeFitTimer);
  resizeFitTimer = setTimeout(()=>{
    const id = currentSlideId();
    if(ZOOMABLE_SLIDES[id]) applyAutoFit(id);
  }, 120);
});

/* ---------------- HOME ---------------- */
/* Sets the live brand palette — document.documentElement.dataset.brand drives every
   [data-brand="junior"] CSS rule (cover, Home background, titles, accents, CTA color). Called
   both on Home (the instant a Brand tile is clicked — "ahí mismo ya se debe ver el cambio",
   before ever entering a deck) and from enterDeck() (so a direct hash-restore or refresh also
   themes correctly, not just a tile click). */
function setBrand(brandKey){
  if(brandKey==='junior') document.documentElement.dataset.brand = 'junior';
  else delete document.documentElement.dataset.brand;
}
document.querySelectorAll('.tile').forEach(t=>{
  t.addEventListener('click', ()=>{
    if(t.disabled) return;
    document.querySelectorAll(`.tile[data-group="${t.dataset.group}"]`).forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    if(t.dataset.group==='brand') setBrand(t.dataset.value==='JR' ? 'junior' : 'oe');
  });
});
/* Maps the Home picker's active Brand/Region tiles to a DECKS key. Brand tile values are
   OE/JR, region tile values are LATAM/BR — matches the key halves in DECKS (OE-LATAM, OE-BR,
   JR-LATAM, JR-BR), so this is just a string join, not a lookup table. */
function pickDeckId(){
  const brand = document.querySelector('.tile[data-group="brand"].active')?.dataset.value || 'OE';
  const region = document.querySelector('.tile[data-group="region"].active')?.dataset.value || 'LATAM';
  return `${brand}-${region}`;
}
function enterDeck(deckId, slideIdx){
  lastAutoFitId = null; // same slide id can mean a different deck's content now — force a fresh fit
  DECK_ID = deckId;
  DATA = DATA_BY_DECK[DECK_ID];
  marketingOrgFilter = 'total';
  applyMarketingOrgFilter();
  yoyMktOrgFilter = 'total';
  includeBrazil = true;
  applyBrazilMerge(); // (re)applies the merge on the freshly-entered deck's own DATA object — DATA.actuals=... mutates DATA_BY_DECK[DECK_ID] IN PLACE, so this must run explicitly here, not just reset via the includeBrazil flag alone.
  setBrand(currentDeck().brandKey);
  document.title = `${currentDeck().brand} ${currentDeck().region} — Strategy & Performance`;
  document.getElementById('home').style.display='none';
  document.body.classList.remove('home-mode'); document.body.classList.add('deck-mode');
  document.getElementById('deck').classList.add('show');
  buildDeck();
  /* #scroller has CSS scroll-behavior:smooth, which ALSO applies to a direct .scrollTop
     assignment (not just .scrollTo()/.scrollIntoView()) — so immediately after this line,
     .scrollTop still reads its OLD value for a few frames while the animation catches up.
     updateOnLaminaA() (called below, and also transitively by buildDeck()->renderDeck())
     derives the "current slide" purely from .scrollTop, so without forcing an instant jump
     here it computes the WRONG slide right after entering a deck — bypass smooth-scroll for
     this specific programmatic jump only; real user scrolling is untouched. */
  const scroller = document.getElementById('scroller');
  const prevScrollBehavior = scroller.style.scrollBehavior;
  scroller.style.scrollBehavior = 'auto';
  scroller.scrollTop = (slideIdx||0) * window.innerHeight;
  scroller.style.scrollBehavior = prevScrollBehavior;
  history.replaceState(null,'', '#'+DECK_ID+'/'+(slideIdx||0));
  updateOnLaminaA();
}
function goHome(){
  document.getElementById('deck').classList.remove('show');
  document.body.classList.add('home-mode'); document.body.classList.remove('deck-mode');
  document.getElementById('home').style.display='flex';
  history.replaceState(null,'', location.pathname+location.search);
  /* The row/column agrupar-desagrupar panel is Lámina-A-only — without this reset it stayed
     stuck "on" (and un-closeable, since its hide/show CSS only applies in .deck-mode) after
     going Home from Lámina A. See updateOnLaminaA()/CSS body:not(.on-lamina-a) rules. */
  document.body.classList.remove('on-lamina-a');
  document.body.classList.remove('on-lamina-daily');
  document.body.classList.remove('on-lamina-yoy');
  document.getElementById('groupMenu')?.classList.remove('hover-visible');
  document.getElementById('groupMenuDaily')?.classList.remove('hover-visible');
  document.getElementById('groupMenuYoy')?.classList.remove('hover-visible');
}
document.getElementById('enterBtn').addEventListener('click', ()=> enterDeck(pickDeckId(), 0));
document.getElementById('homeToggle').addEventListener('click', goHome);
document.getElementById('tocHome').addEventListener('click', goHome);

/* keep the URL hash in sync with the visible slide, so a refresh returns to the same lámina */
document.getElementById('scroller').addEventListener('scroll', ()=>{
  if(!document.body.classList.contains('deck-mode')) return;
  updateOnLaminaA(); // immediate, not debounced — a cheap class toggle, unlike the hash write below
  clearTimeout(window._hashTimer);
  window._hashTimer = setTimeout(()=>{
    const idx = Math.round(document.getElementById('scroller').scrollTop / window.innerHeight);
    history.replaceState(null,'', '#'+DECK_ID+'/'+idx);
  }, 200);
});
