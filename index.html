<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OE Adult LatAm — Strategy &amp; Performance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.bunny.net/css?family=wix-madefor-display:300,400,600,700|wix-madefor-text:300,400,600,700" rel="stylesheet">
<style>
:root{
  --color-oe-blue:#0066FF; --color-sunny-orange:#FF6600;
  --color-fun-yellow:#FFFF00; --color-oe-aqua:#00DDDD; --color-soft-blue:#E5F5FF;
  --color-happy-pink:#FF0044; --color-pacific-blue:#000066; --color-achievable-green:#66FF00;
  --color-grey-line:#D6D6D6; --color-grey-bg-dark:#F4F4F4; --color-grey-bg-light:#FAFAFA; --color-white:#FFFFFF;
  --gradient-oe-blue:linear-gradient(135deg,#0052D6,#0066FF 45%,#0099FF);
  --gradient-sunny-orange:linear-gradient(135deg,#FF6600,#FF9900);
  --gradient-soft-blue:linear-gradient(135deg,#E5F5FF,#FFFFFF);
  --font-display:'Poppins',sans-serif; --font-titles:'Wix Madefor Display',sans-serif; --font-body:'Wix Madefor Text',sans-serif;
  --text-xs:.75rem; --text-sm:.875rem; --text-base:1rem; --text-lg:1.125rem; --text-xl:1.25rem;
  --text-2xl:1.5rem; --text-3xl:1.875rem; --text-4xl:2.25rem; --text-5xl:3rem;
  --weight-light:300; --weight-regular:400; --weight-semibold:600; --weight-bold:700;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;--space-8:32px;--space-10:40px;--space-12:48px;--space-16:64px;--space-20:80px;--space-24:96px;
  --radius-sm:4px;--radius-md:8px;--radius-lg:16px;--radius-xl:24px;--radius-full:9999px;
  --shadow-sm:0 1px 3px rgba(0,0,0,.08); --shadow-md:0 4px 14px rgba(0,0,0,.10); --shadow-lg:0 12px 32px rgba(0,0,0,.16);

  --bg-page:var(--color-grey-bg-light);
  --bg-card:var(--color-white);
  --bg-section:var(--color-grey-bg-dark);
  --text-primary:#101820;
  --text-secondary:#5b6472;
  --border-soft:var(--color-grey-line);
  --pos:#0a8f4a; --neg:#d6304a; --warn:#ca8a04;
  --chart-line:var(--color-oe-blue);
  --chart-budget-line:#8b5cf6;
  /* Modal tab group colors (money/leads/sales) — reuse existing palette colors already used
     elsewhere in the deck (--pos for financial/growth, aqua for Paid Social's row accent, pink
     for Others' row accent) rather than inventing new hex values. --pos already resolves
     correctly per theme; aqua/pink don't need a dark-mode variant, same as their existing uses. */
  --tab-money:var(--pos);
  --tab-leads:var(--color-oe-aqua);
  --tab-sales:var(--color-happy-pink);

  /* ---- BRAND-REACTIVE accent (default = OE Adult, blue) ----
     Every "this IS the brand color" usage (titles, Blended badge, featured-row accent, hero
     icon chips, cover/Home gradient, CTA) reads --brand-accent/--brand-gradient/--brand-cta-*
     instead of hardcoding --color-oe-blue, so switching to OE Junior (see [data-brand="junior"]
     below) re-themes the whole deck from ONE attribute — never hardcode --color-oe-blue again
     for something meant to represent "the current brand", only for things that are always
     literally OE-blue regardless of brand (there are none left after this pass). Channel-
     specific accents (Google=Sunny Orange, Paid Social=Aqua, Others=Happy Pink) are NOT brand
     identity — they distinguish channel types and stay fixed regardless of brand. */
  --brand-accent:var(--color-oe-blue);
  --brand-gradient:linear-gradient(135deg,#0052D6,#0066FF 45%,#0099FF);
  --brand-cover-dark:linear-gradient(135deg,#00040d,#00102b 45%,#001c3d);
  --brand-cta-gradient:var(--gradient-sunny-orange);
  --brand-cta-shadow:rgba(255,102,0,.35);
  --brand-soft-gradient:linear-gradient(135deg,#E5F5FF,#FFFFFF);
  --brand-soft-border:rgba(0,102,255,.12);
  --brand-soft-dark:linear-gradient(135deg,#122548,#0f1522);
  --brand-soft-border-dark:rgba(91,157,255,.18);
  --brand-soft-glow:rgba(0,102,255,.10);
}
/* Dark mode = a soft deep indigo, never pure black. Content-slide tokens only —
   the cover has its own separate dark treatment, see ".cover" rules below. */
:root[data-theme="dark"]{
  --bg-page:#11172a;
  --bg-card:#1b2338;
  --bg-section:#161c2e;
  --text-primary:#eef1f8;
  --text-secondary:#98a3be;
  --border-soft:#2b3552;
  --color-soft-blue:#152a4d;
  --pos:#3ddc84; --neg:#ff5c72; --warn:#facc15;
  --chart-line:#5b9dff;
  --chart-budget-line:#a78bfa;
  --brand-accent:#5b9dff;
}
/* ---- OE Junior brand palette: warm dark amber/orange, NEVER the Adult blue ----
   Set via `document.documentElement.dataset.brand` — both on Home (live preview the instant a
   Brand tile is clicked) and on entering a Junior deck (enterDeck() sets it from DECKS[id].brandKey).
   Deliberately NOT the same hue as Sunny Orange/CTA-orange (#FF6600, already used for Google
   Channels' accent and the Adult CTA) so a Junior deck's flagship/title color never collides
   visually with the Google Channels row in the same table — and deliberately muted (not pure
   saturated orange) per explicit feedback: "que no se vea chillón, saturado". */
:root[data-brand="junior"]{
  --brand-accent:#D9720A;
  --brand-gradient:linear-gradient(135deg,#B45900,#D97706 45%,#F2994A);
  --brand-cover-dark:linear-gradient(135deg,#0d0600,#2b1400 45%,#3d2200);
  /* CTA flips to blue for Junior — a button the same orange as its own background would have
     no contrast; blue is still 100% brand-palette (OE Blue), just repurposed as the contrasting
     accent here instead of the dominant color. */
  --brand-cta-gradient:var(--gradient-oe-blue);
  --brand-cta-shadow:rgba(0,102,255,.35);
  --brand-soft-gradient:linear-gradient(135deg,#FDECD8,#FFFFFF);
  --brand-soft-border:rgba(217,114,10,.16);
  --brand-soft-dark:linear-gradient(135deg,#3a2308,#241505);
  --brand-soft-border-dark:rgba(240,169,78,.18);
  --brand-soft-glow:rgba(217,114,10,.12);
}
/* Dark mode's base surface tokens (page/card/section/border/selection) are themselves
   blue-tinted dark grays (#11172a etc — a deliberate "deep indigo" per the comment above), NOT
   just the accent text color — so a Junior deck in dark mode still looked navy-blue everywhere
   except the cover until this was added ("el modo nocturno en junior continúa mostrando esa
   tonalidad azul oscuro... en la lámina de resultados"). These re-tint every dark-mode surface
   to a warm dark brown/amber at the same relative lightness, so cards/borders/page background
   read as "Junior's dark mode", not "Adult's dark mode with an orange accent painted on top". */
:root[data-brand="junior"][data-theme="dark"]{
  --brand-accent:#f0a94e;
  --bg-page:#1c130a;
  --bg-card:#241a0d;
  --bg-section:#1f160b;
  --border-soft:#3d2d16;
  --color-soft-blue:#2e2008;
}
*{box-sizing:border-box;}
/* Base font-size raised from the browser default (16px) to 20px — baked into the deck instead
   of relying on the reader zooming their browser to ~125%, which was the size that felt right
   but broke scroll-snap smoothness/fluidity at that zoom level. Every --text-* token below is
   rem-based, so this one line scales the entire type scale (headings, stat values, labels)
   together — never hardcode a px font-size for new text, or it won't scale with this. */
html{font-size:20px;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:var(--font-body);
  background:var(--bg-page);
  color:var(--text-primary);
  -webkit-font-smoothing:antialiased;
  letter-spacing:.01em;
  overflow:hidden;
}
h1,h2,h3,h4{margin:0;font-family:var(--font-titles);font-weight:var(--weight-semibold);line-height:1.2;}
p{margin:0;}
button{font-family:var(--font-titles);cursor:pointer;}
::selection{background:var(--color-soft-blue);}

/* ================= HOME ================= */
#home{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:
    radial-gradient(900px 600px at 12% 8%, rgba(255,255,255,.16), transparent 60%),
    radial-gradient(1000px 900px at 108% 105%, rgba(0,221,221,.30), transparent 55%),
    var(--brand-gradient);
  z-index:5; overflow:hidden;
}
/* Home's dark-mode treatment mirrors the cover's — same --brand-cover-dark gradient, dimmer
   overlay glows — since Home is the very first thing a user with dark mode already on (or who
   toggles it while on Home) sees. Without this it stayed on the light brand gradient regardless
   of theme, which read as "theme toggle does nothing here". */
:root[data-theme="dark"] #home, :root[data-theme="dark"] #loginScreen{
  background:
    radial-gradient(900px 600px at 12% 8%, rgba(255,255,255,.07), transparent 60%),
    radial-gradient(1000px 900px at 108% 105%, rgba(0,221,221,.14), transparent 55%),
    var(--brand-cover-dark);
}
#home::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,.10) 1.5px, transparent 1.5px);
  background-size:28px 28px; opacity:.6;
}
#home > *{position:relative;z-index:1;}
#home .brandmark{display:flex;align-items:center;opacity:.95;}
.logo-white{filter:brightness(0) invert(1);}
#home .brandmark img{height:22px;}
#home h1{color:#fff;font-family:var(--font-display);font-weight:800;font-size:clamp(2.4rem,5.5vw,3.6rem);letter-spacing:-.01em;}
#home .sub{color:#dbe9ff;font-size:var(--text-lg);}
/* Deck picker — one tile per deck (explicit ask, 2026-08-14: "no hay necesidad de seleccionar la
   marca y la región por aparte... que sea un solo botón"), replacing the old 2-group/4-tile
   picker + separate "Entrar al reporte" confirm button. A click goes straight into that deck (see
   the .deck-tile click handler) — no intermediate active/inactive state to manage, so there's
   nothing left for a confirm step to confirm. --tile-accent is set inline per tile (OE blue vs
   Junior amber, the same 2 brand colors used everywhere else) since all 4 are visible at once here
   — the single shared --brand-accent variable (which reflects ONE "current" brand) doesn't apply
   to a grid showing both brands simultaneously. */
.deck-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--space-5);max-width:420px;}
.deck-tile{
  position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:var(--space-2);
  width:180px;padding:var(--space-6) var(--space-4);border-radius:var(--radius-lg);
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);color:#fff;
  font-family:var(--font-titles);transition:transform .18s, border-color .18s, box-shadow .18s;
  backdrop-filter:blur(4px);
}
.deck-tile::before{
  content:"";position:absolute;inset:0;opacity:0;transition:opacity .18s;pointer-events:none;
  background:radial-gradient(120px 100px at 50% -10%, var(--tile-accent), transparent 70%);
}
.deck-tile:hover, .deck-tile:focus-visible{
  transform:translateY(-4px);border-color:var(--tile-accent);
  box-shadow:0 14px 30px rgba(0,0,0,.25);
}
.deck-tile:hover::before{opacity:.4;}
.deck-tile-icon{
  position:relative;z-index:1;width:38px;height:38px;border-radius:50%;flex:none;
  display:flex;align-items:center;justify-content:center;background:var(--tile-accent);
  box-shadow:0 4px 12px rgba(0,0,0,.25);
}
.deck-tile-brand{position:relative;z-index:1;font-weight:700;font-size:var(--text-base);}
.deck-tile-region{position:relative;z-index:1;display:flex;align-items:center;gap:6px;font-size:var(--text-sm);color:#dbe9ff;opacity:.9;}
#updateNote{margin-top:var(--space-2);color:#dbe9ff;opacity:.75;font-size:var(--text-sm);letter-spacing:.02em;}
#dataRangeNote{color:#dbe9ff;opacity:.6;font-size:var(--text-xs);letter-spacing:.02em;}

/* ================= LOGIN ================= */
/* Same fixed full-screen brand-gradient treatment as #home (see above) -- login is the very
   first screen a visitor ever sees, before any deck/brand data exists, so it can't rely on any
   deck-specific styling being ready yet. */
#loginScreen{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:
    radial-gradient(900px 600px at 12% 8%, rgba(255,255,255,.16), transparent 60%),
    radial-gradient(1000px 900px at 108% 105%, rgba(0,221,221,.30), transparent 55%),
    var(--brand-gradient);
  z-index:10; overflow:hidden;
}
#loginScreen .brandmark{display:flex;align-items:center;opacity:.95;}
#loginScreen .brandmark img{height:22px;}
#loginScreen h1{color:#fff;font-family:var(--font-display);font-weight:800;font-size:clamp(2.4rem,5.5vw,3.6rem);letter-spacing:-.01em;}
#loginScreen .sub{color:#dbe9ff;font-size:var(--text-lg);max-width:480px;}
.google-btn{
  display:flex;align-items:center;gap:12px;background:#fff;color:#3c4043;border:none;
  padding:12px 28px;border-radius:var(--radius-full);font-size:var(--text-base);font-weight:600;
  box-shadow:0 10px 26px rgba(0,0,0,.25);transition:transform .15s, box-shadow .15s;
}
.google-btn:hover{transform:translateY(-2px);}
.google-btn:disabled{opacity:.6;cursor:not-allowed;transform:none;}
.login-error{color:#ffd1d1;background:rgba(220,38,38,.25);border:1px solid rgba(255,255,255,.25);padding:10px 18px;border-radius:var(--radius-md);font-size:var(--text-sm);max-width:480px;}
/* Only one of loginScreen/home/deck is ever meaningful at a time -- gate on body class so a
   half-finished login can't show stale/empty Home content underneath it. */
body:not(.login-mode) #loginScreen{display:none;}
body.login-mode #home, body.login-mode #deck{display:none;}
/* The index/deck-switcher/"volver al Home" chrome and the "Home" shortcut only mean anything once
   a deck's data exists — on the login screen they were previously reachable-looking (hover-zones
   don't check login state) but led nowhere useful. Zoom/language/theme/fullscreen stay available
   (explicit ask, 2026-08-14) since those are pure UI prefs with no data dependency. */
body.login-mode .hover-zone.left, body.login-mode #tocTrigger, body.login-mode #leftMenu{display:none;}
body.login-mode #homeToggle{display:none;}
/* Zoom is meaningless pre-login too (no lámina/table exists yet to scale) -- unlike
   theme/language, which genuinely apply to the login screen itself and are now fixed to actually
   work there (see :root[data-theme="dark"] #loginScreen and the data-es/data-en attributes added
   to its text, both 2026-08-14) rather than just hidden. A button that visibly does nothing is
   worse than no button -- explicit ask. */
body.login-mode #zoomGroup{display:none;}

/* ---- Premium login/Home polish (explicit ask, 2026-08-14: "más bonita, más chévere, más
   moderna" / "más elegante, más premium") — layered on top of the existing brand-gradient
   background rather than replacing it: a frosted glass card grounds the content instead of
   letting it float directly on the gradient, a slow ambient blob adds quiet motion, and a
   staggered entrance makes the page feel alive on load instead of a static screenshot. */
@keyframes blobDrift{
  0%,100%{transform:translate(0,0) scale(1);}
  50%{transform:translate(-3%,2%) scale(1.06);}
}
@keyframes fadeInUp{
  from{opacity:0;transform:translateY(14px);}
  to{opacity:1;transform:translateY(0);}
}
#home::after, #loginScreen::after{
  content:"";position:absolute;inset:-10%;pointer-events:none;z-index:0;
  background:radial-gradient(480px 480px at 85% 15%, rgba(255,255,255,.14), transparent 60%);
  animation:blobDrift 14s ease-in-out infinite;
}
.glass-card{
  position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;
  gap:var(--space-6);padding:var(--space-12) var(--space-16);text-align:center;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);
  border-radius:var(--radius-xl);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  box-shadow:0 24px 64px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.15);
  max-width:calc(100vw - var(--space-8));
}
#home .glass-card{gap:var(--space-8);}
.glass-card > *{animation:fadeInUp .6s cubic-bezier(.16,1,.3,1) both;}
.glass-card > *:nth-child(1){animation-delay:.02s;}
.glass-card > *:nth-child(2){animation-delay:.10s;}
.glass-card > *:nth-child(3){animation-delay:.18s;}
.glass-card > *:nth-child(4){animation-delay:.26s;}
.glass-card > *:nth-child(5){animation-delay:.34s;}
.glass-card > *:nth-child(6){animation-delay:.42s;}
@media (prefers-reduced-motion: reduce){
  #home::after, #loginScreen::after{animation:none;}
  .glass-card > *{animation:none;}
}
/* Loading indicator — explicit ask 2026-08-14: "no decir exactamente qué está cargando, sino que
   algo está cargando" (a spinner + live per-deck text read as ugly/literal) and "una animación...
   tipo motion graphic... que va de inicio a fin y vuelve inicio a fin" -- a purely decorative,
   indeterminate bar whose fill sweeps back and forth continuously (animation-direction:alternate
   is the literal "va y vuelve"), brand-colored, with only a generic "Cargando…" label, no per-deck
   detail. Deliberately NOT wired to real fetch progress -- the ask was explicitly for continuous
   motion, not a determinate 0-100% fill that would stop partway through and look broken while the
   4th (largest) deck is still loading. */
.login-loading{display:flex;flex-direction:column;align-items:center;gap:var(--space-3);}
.login-loading span{color:#dbe9ff;font-size:var(--text-sm);opacity:.85;letter-spacing:.02em;}
.load-bar{width:180px;height:5px;border-radius:var(--radius-full);background:rgba(255,255,255,.16);overflow:hidden;position:relative;}
.load-bar-fill{
  position:absolute;top:0;bottom:0;width:42%;border-radius:var(--radius-full);
  background:linear-gradient(90deg, rgba(255,255,255,0), #fff 55%, var(--color-oe-aqua));
  box-shadow:0 0 10px rgba(255,255,255,.6);
  animation:loadSweep 1.35s cubic-bezier(.65,0,.35,1) infinite alternate;
}
@keyframes loadSweep{
  0%{left:-42%;}
  100%{left:100%;}
}
@media (prefers-reduced-motion: reduce){
  .load-bar-fill{animation-duration:2.5s;}
}


/* ================= DECK ================= */
#deck{position:fixed;inset:0;display:none;background:var(--bg-page);}
#deck.show{display:block;}
#scroller{height:100%; overflow-y:auto; scroll-snap-type:y mandatory; scroll-behavior:smooth;}
.slide{
  height:100vh; scroll-snap-align:start; display:flex; flex-direction:column;
  /* bottom padding reserves a fixed footer band (see .slide-footer) — content must
     never render past this line, in either theme, on any slide. */
  padding:30px 88px var(--footer-reserve,74px) 88px; position:relative; overflow:hidden;
}
/* Daily Tracker has up to 8 country rows to fit (vs Lamina A's usual 2-4), so it gets a
   slimmer footer reserve than the 74px default — still clears the absolutely-positioned
   footer (bottom:20px, height:26px) with margin to spare. */
.slide-daily{--footer-reserve:50px;}
.slide-yoy{--footer-reserve:46px;}
/* "Leave only the difference visible" view (all 3 laminas — dailyValueVis/yoyValueVis/
   laminaAValueVis, own independent state per lamina, toggled from each lamina's own hover-reveal
   column panel). Bare class selector (no lamina prefix) so the SAME rule works regardless of
   which slide root the class ends up on. `:not(.muted)` is load-bearing, not decorative: a muted
   metric (LTV Short/Unit CM Short/CM % Short/%Leads/%Sales/%Spend) has NO budget/delta at all —
   its `.mc-actual` IS the entire cell — so hiding it on "ocultar actual" left nothing rendered at
   all for exactly the metrics that have no comparison to hide in the first place. */
.hide-actual-value .metric-cell:not(.muted) .mc-actual{display:none;}
.hide-budget-value .metric-cell:not(.muted) .mc-budget{display:none;}
/* Lámina A's row count is user-togglable (Paid Social can expand from 1 combined row to 2 —
   ASC + no-ASC), and the 5-row expanded state overflowed the default 74px reserve by a real,
   reproducible 7px (verified fresh-state, un-contaminated by any prior manual column/row
   toggling in this same browser profile — see feedback-branformance-technical-gotchas memory
   on why that verification needs a genuinely fresh tab + cleared localStorage, not just a
   reload). A smaller reserve here comfortably covers the expanded case with room to spare,
   and costs nothing in the default 4-row case (which already fit with pixels to spare). */
.slide-a{--footer-reserve:46px;}
.slide:not(.cover)::before{
  content:"";position:absolute;top:-140px;right:-140px;width:400px;height:400px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%, rgba(0,102,255,.08), transparent 70%);
  pointer-events:none;
}
:root[data-theme="dark"] .slide:not(.cover)::before{background:radial-gradient(circle at 35% 35%, rgba(91,157,255,.14), transparent 70%);}
.slide-inner{flex:1;display:flex;flex-direction:column;min-height:0;position:relative;z-index:1;}

/* ---- cover: the ONLY slide with a bespoke brand background. It IS theme-aware —
   light = vivid OE blue, dark = the same blue family pushed near-black for a
   premium low-light look — but it never reads the generic content-slide tokens
   (--bg-page/--text-primary/...), it has its own two explicit gradients below. */
.cover{
  background:
    radial-gradient(900px 600px at 15% -8%, rgba(255,255,255,.20), transparent 60%),
    radial-gradient(1000px 900px at 108% 108%, rgba(0,221,221,.30), transparent 55%),
    var(--brand-gradient);
  color:#fff;
}
:root[data-theme="dark"] .cover{
  background:
    radial-gradient(900px 600px at 15% -8%, rgba(255,255,255,.08), transparent 60%),
    radial-gradient(1000px 900px at 108% 108%, rgba(0,221,221,.14), transparent 55%),
    var(--brand-cover-dark);
}
.cover::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,.10) 1.5px, transparent 1.5px);
  background-size:28px 28px;opacity:.55;
}
.cover .glow{position:absolute;width:560px;height:560px;border-radius:50%;
  background:radial-gradient(circle, rgba(255,153,0,.30), transparent 62%);
  filter:blur(6px); z-index:0; animation:drift1 14s ease-in-out infinite;}
.cover .glow2{position:absolute;width:460px;height:460px;border-radius:50%;
  background:radial-gradient(circle, rgba(0,221,221,.26), transparent 62%);
  filter:blur(6px); z-index:0; animation:drift2 18s ease-in-out infinite;}
:root[data-theme="dark"] .cover .glow{background:radial-gradient(circle, rgba(255,153,0,.16), transparent 62%);}
:root[data-theme="dark"] .cover .glow2{background:radial-gradient(circle, rgba(0,221,221,.13), transparent 62%);}
@keyframes drift1{
  0%,100%{transform:translate(-46%,-58%) scale(1);opacity:.75;}
  50%{transform:translate(-54%,-46%) scale(1.14);opacity:1;}
}
@keyframes drift2{
  0%,100%{transform:translate(40%,40%) scale(1);opacity:.6;}
  50%{transform:translate(30%,30%) scale(1.2);opacity:.9;}
}
.shimmer-text{
  background:linear-gradient(100deg,#fff 38%,#eaf4ff 48%,#fff 58%,#fff 100%);
  background-size:250% 100%; -webkit-background-clip:text; background-clip:text; color:transparent !important;
  animation:shimmer 7s ease-in-out infinite;
}
@keyframes shimmer{0%{background-position:220% 0;}55%,100%{background-position:-40% 0;}}

.cover .cover-content{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;max-width:820px;margin:auto;text-align:center;}
.cover{justify-content:center;align-items:center;}
/* Section-divider ("tapa") slides — Plantilla PPT Laminas.xlsx, Fase 1, 2026-08-24. Deliberately
   its OWN class, not a reuse of `.cover` (which the comment above documents as "the ONLY slide
   with a bespoke brand background" — an invariant this doesn't need to break) and its own title
   styling, not `.shimmer-text` (that gradient is white-on-white by design, tuned for `.cover`'s
   dark brand background — invisible on this slide's normal light/dark page background). Same
   simple structural shape as slideCover() otherwise: no `.slide-inner`, no headerBlock(), just a
   centered content column + the standard footer. */
.section-divider{justify-content:center;align-items:center;}
.section-divider .divider-content{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;max-width:820px;margin:auto;text-align:center;}
.section-divider .divider-tag{font-size:var(--text-sm);letter-spacing:.22em;text-transform:uppercase;opacity:.7;font-weight:600;color:var(--brand-accent);}
.section-divider .divider-title{font-family:var(--font-display);font-weight:800;font-size:clamp(2.6rem,6vw,4.4rem);letter-spacing:-.01em;margin-top:var(--space-3);color:var(--brand-accent);}
.section-divider .divider-desc{margin-top:var(--space-4);font-size:var(--text-xl);color:var(--text-secondary);max-width:640px;font-weight:300;}
.cover .tag{font-size:var(--text-sm);letter-spacing:.22em;text-transform:uppercase;opacity:.85;font-weight:600;}
.cover h1{font-family:var(--font-display);font-weight:800;font-size:clamp(3rem,7vw,5rem);letter-spacing:-.01em;margin-top:var(--space-3);}
.cover .desc{margin-top:var(--space-4);font-size:var(--text-xl);opacity:.92;max-width:640px;font-weight:300;}
.cover .datepill{margin-top:var(--space-10);display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);padding:9px 22px;border-radius:var(--radius-full);font-size:var(--text-sm);font-weight:600;backdrop-filter:blur(6px);}
.cover .month-select{margin-top:var(--space-4);appearance:none;-webkit-appearance:none;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);color:#fff;padding:7px 34px 7px 16px;border-radius:var(--radius-full);font-size:var(--text-sm);font-weight:600;font-family:inherit;cursor:pointer;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' fill='none' stroke='white' stroke-width='1.6'/></svg>");background-repeat:no-repeat;background-position:right 14px center;background-size:11px;}
.cover .month-select:hover{background-color:rgba(255,255,255,.18);}
.cover .month-select option{color:#111;background:#fff;}

/* ---- footer band: identical geometry on every slide, brand or content ----
   3 explicit grid columns (not flex+space-between) so a slide that needs a CENTERED extra
   control (YoY's investment-org toggle, Junior only) gets true centering regardless of how wide
   the left/right groups are — always renders all 3 children (even empty) so grid auto-placement
   never has to guess which column an omitted middle child would have left a gap in.
   meta stays column 1 (left) and the logo stays column 3 (right) — the EXACT original positions
   for every slide that passes no extras — a toggle only ever joins the logo's own group
   (.footer-right, immediately to the logo's left) or sits in the new centered column; neither
   ever relocates meta or the logo itself. */
.slide-footer{position:absolute;left:44px;right:44px;bottom:20px;height:26px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;column-gap:14px;z-index:2;}
.slide-footer .meta{font-size:14px;letter-spacing:.02em;color:var(--text-secondary);opacity:.75;justify-self:start;white-space:nowrap;}
.slide-footer .footer-center{display:flex;align-items:center;gap:14px;justify-self:center;min-width:0;}
.slide-footer .footer-right{display:flex;align-items:center;gap:10px;justify-self:end;min-width:0;}
.slide-footer img{height:15px;opacity:.4;flex-shrink:0;}
:root[data-theme="dark"] .slide-footer:not(.on-brand) img{filter:brightness(0) invert(1);opacity:.4;}
.slide-footer.on-brand .meta{color:rgba(255,255,255,.78);}
.slide-footer.on-brand img{filter:brightness(0) invert(1);opacity:.85;}
/* Subtle footer toggles — deliberately much quieter than the deck's other pill toggles
   (.yoy-toggle/.mktorg-toggle: bold border, bigger padding) since these live in the thin footer
   band, not a slide's main content area. */
.footer-toggle{display:flex;gap:2px;background:var(--bg-section);border-radius:var(--radius-full);padding:2px;}
.footer-toggle button{border:none;background:none;padding:3px 9px;border-radius:var(--radius-full);font-size:10.5px;font-weight:600;color:var(--text-secondary);cursor:pointer;white-space:nowrap;transition:.15s;}
.footer-toggle button.on{background:var(--bg-card);color:var(--brand-accent);box-shadow:var(--shadow-sm);}
.slide-footer.on-brand .footer-toggle{background:rgba(255,255,255,.14);}
.slide-footer.on-brand .footer-toggle button{color:rgba(255,255,255,.65);}
.slide-footer.on-brand .footer-toggle button.on{background:rgba(255,255,255,.9);color:var(--brand-accent);}
.yoymktorg-toggle-wrap{display:flex;align-items:center;gap:8px;}
.yoymktorg-label{font-size:10px;font-weight:600;color:var(--text-secondary);white-space:nowrap;}
.slide-footer.on-brand .yoymktorg-label{color:rgba(255,255,255,.65);}
/* Semaphore legend — small/subtle by explicit ask, same visual weight class as .footer-toggle
   (never larger). Dots reuse .nc-semaphore's exact colors at a much smaller flat size (no
   gradient — imperceptible at 7px, a flat fill stays crisp instead of muddy at this size). */
.footer-legend{display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--text-secondary);white-space:nowrap;}
.footer-legend .fl-label{font-weight:700;opacity:.85;}
.footer-legend .fl-item{display:flex;align-items:center;gap:3px;}
.nc-dot{display:inline-block;width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.nc-dot.green{background:var(--pos);}
.nc-dot.yellow{background:var(--warn);}
.nc-dot.red{background:var(--neg);}
.slide-footer.on-brand .footer-legend{color:rgba(255,255,255,.65);}

/* ---- header band: reserved, fixed-height, same on every content slide ----
   Mirrors the footer band — title+subtitle always live in this exact box, so
   the content grid below always starts at the same y regardless of how long
   a given subtitle is. Never put data/cards inside .slide-header. */
.slide-header{flex:0 0 auto;min-height:76px;display:flex;flex-direction:column;justify-content:center;margin-bottom:var(--space-4);position:relative;}
/* `zoom` (not `transform:scale`) so content actually reflows bigger/smaller into whatever
   whitespace is available — `--slide-zoom` is set inline per-slide (see getZoom() in JS,
   read at slideA()/slideDaily()/slideYoy() render time) on the .slide root and inherits down;
   .slide-header/.slide-footer are its SIBLINGS inside .slide-inner, never descendants of
   .slide-body, so header/footer position and the slide's own side/top margins never move. */
.slide-body{flex:1;display:flex;flex-direction:column;min-height:0;zoom:var(--slide-zoom,1);}
.slide h2.title{font-size:var(--text-3xl);color:var(--brand-accent);font-weight:700;letter-spacing:-.01em;}
/* Lámina A's title is uniquely long ("...YTD Monthly Branded KPIs Pacing vs reforecast -
   Branded vs other channels") and reliably wraps to 2 lines at the shared --text-3xl size,
   eating into the same vertical budget the channel-table needs — scoped down a notch here only,
   every other slide's shorter title stays at the shared size. */
.slide-a h2.title{font-size:var(--text-2xl);}
.slide .subtitle{color:var(--text-secondary);font-size:var(--text-base);margin-top:4px;}
/* Daily Tracker only, points at the local folder Daily Tracker.xlsx (the forecast source file)
   was loaded from — explicit ask, so a viewer can jump straight to the source without asking
   someone where it lives. CORRECTED (2026-08, explicit ask): the full path used to be the
   visible link text on its own block-level line — too loud, and the raw local G:\ path means
   nothing to a viewer without that drive mapped anyway. Now a short, muted, inline link folded
   directly into the subtitle sentence itself (see slideDaily()'s subEs/subEn) — the href still
   goes to the Drive folder (a local G:\ path isn't clickable from a browser regardless). */
.raw-source-link{color:var(--text-secondary);font-size:var(--text-xs);text-decoration:underline;white-space:nowrap;}
.raw-source-link:hover{color:var(--brand-accent);}


/* ---- Lamina A: Branded KPIs vs Budget ---- */
.icon-mono{display:inline-flex;flex-shrink:0;align-items:center;justify-content:center;}
.icon-mono svg{display:block;width:20px;height:20px;}

/* Icon chip: every icon in this lámina sits inside a fixed circular tinted box,
   never floating loose next to text — that's what was causing icons/titles to
   collide or clip. Always size the chip, never the raw svg, in layout contexts. */
.icon-chip{
  width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;background:color-mix(in srgb, var(--accent,var(--brand-accent)) 14%, transparent);
  color:var(--accent,var(--brand-accent));
}
.icon-chip.solid{background:var(--accent,var(--brand-accent));color:#fff;}
.icon-chip.sm{width:26px;height:26px;}
.icon-chip svg{width:16px;height:16px;}

/* Compact by design — this whole hero + table must fit between the header and
   footer bands with room to spare, never push past the footer line. */
.blended-hero{
  background:var(--brand-soft-gradient);border-radius:var(--radius-lg);padding:var(--space-3) var(--space-6);
  border:1px solid var(--brand-soft-border); position:relative; overflow:hidden; margin-bottom:var(--space-2); flex-shrink:0;
}
:root[data-theme="dark"] .blended-hero{background:var(--brand-soft-dark);border-color:var(--brand-soft-border-dark);}
.blended-hero::after{content:"";position:absolute;right:-50px;bottom:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,var(--brand-soft-glow),transparent 70%);}
.bh-head{display:flex;align-items:baseline;gap:10px;position:relative;z-index:1;}
.bh-badge{font-family:var(--font-titles);font-weight:800;font-size:var(--text-lg);color:var(--brand-accent);letter-spacing:-.01em;}
.bh-sub{font-size:var(--text-xs);color:var(--text-secondary);text-transform:uppercase;letter-spacing:.06em;}
/* align-items:start (not the grid default stretch) — a highlighted+muted tile (1 line of
   content, e.g. CM % Short) must NOT be forced to the row's full stretched height, or its tinted
   background box ends up mostly empty below the number (the exact "looks unfinished" complaint
   a previous session's align-items:center on .bh-kpi.highlight was papering over — see
   [[project-branformance-deck]]). Letting every tile hug its own content instead fixes that AND
   keeps every tile's number starting at the same height, which .bh-kpi.highlight's own
   align-items:center was undermining (see that rule's comment). */
.bh-kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:var(--space-4);margin-top:var(--space-2);position:relative;z-index:1;align-items:start;}
.bh-kpi{display:flex;gap:10px;align-items:flex-start;}
.bh-kpi.muted{min-width:104px;}
/* Fixed min-height (2 lines' worth at this font/line-height) so every tile's metric-cell starts
   at the same depth regardless of whether ITS OWN label happens to wrap ("New Cash Core" vs
   "CPL") — a 1-line label no longer leaves the cell below it sitting higher than a neighboring
   tile's 2-line label would. Root-caused via getBoundingClientRect() diffing across hero tiles,
   not eyeballed — see feedback-branformance-design-iteration memory on why. */
/* Bumped from 10.5px per explicit repeated ask ("Spend, CPL y todos esos títulos... muy
   pequeños") — this had been left too small since the original spec asked for it and it was
   never actually done this session. */
.bh-kpi .label{font-size:var(--text-sm);font-weight:700;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.04em;min-height:56px;line-height:1.05;display:flex;align-items:flex-start;}
/* .highlight's tinted-box treatment (New Cash Core/Impacto/the 3 Short metrics) was removed by
   explicit ask ("ese color azul... quítalo, se ve feo") — the `highlight:true` flag stays
   threaded through COL_DEFS/heroCell()/JS (harmless, no visual effect now) rather than ripping
   out flag-plumbing across ~15 call sites for zero behavior change; only the CSS that painted it
   is gone. Visual separation between tiles now comes from a thin divider line between every
   tile instead of a background difference on a chosen few. */
.bh-kpi:not(:first-child){border-left:1px solid var(--border-soft);padding-left:14px;}
/* Week lámina's per-marketing-type hero (typeModeBodyHtml) reserves an empty leading grid cell
   so its tiles line up with the table's data columns below (the table's own name column takes
   that same slot) -- that empty cell is `.bh-kpis`' actual first child now, which pushed the
   divider rule above onto the first VISIBLE tile too (a border/padding no other hero in this deck
   shows on its first tile). Strip it back off specifically for the tile right after that spacer. */
.bh-kpis > div:empty + .bh-kpi{border-left:none;padding-left:0;}
/* Real bug fixed 2026-08-24 (3rd pass): an identical grid-template-columns string is NOT enough
   for this hero to align pixel-for-pixel with the table below it -- `.daily-hero`'s own 24px
   horizontal padding and `.bh-kpis`' own 16px column gap don't match the table's 20px row padding
   / 12px column-gap (`.ch-row`/`.ch-header-row`), so both grids resolved the SAME "1.25fr + Nx1fr"
   ratios inside DIFFERENTLY SIZED available widths -- columns drifted further apart the more of
   them there were. Scoped override (not a change to the shared .daily-hero/.bh-kpis every other
   lámina's hero relies on) forces this specific hero's padding/gap to match the table exactly. */
/* .daily-hero qualifier (not just .week-aligned-hero alone) is load-bearing, not decorative: both
   this rule and .daily-hero's own padding rule (defined LATER in this stylesheet) are single-!
   important, so without the extra class raising specificity, source order alone would let
   .daily-hero win the tie regardless of which rule "looks" more specific to a reader -- confirmed
   this the hard way (getComputedStyle showed 24px, not 20px, until this was added). */
.daily-hero.week-aligned-hero{padding:var(--space-2) var(--space-5)!important;}
.week-aligned-hero .bh-kpis{gap:var(--space-3);}
/* Real root cause, found from a live screenshot after the padding/gap fix above STILL didn't fix
   it: `grid-template-columns:1fr 1fr ...` does NOT force every track to the exact same width --
   a track whose content needs more than its "fair share" (default min-width:auto on grid items)
   is allowed to grow past it, pushing every track after it out of alignment with anything else
   using the identical template string. The table's own `.metric-col` already has `min-width:0`
   (line ~904) so ITS tracks always respect the 1fr split exactly; `.bh-kpi` never needed that
   anywhere else in this deck (no other hero shares columns with a table below it) -- scoped here,
   not added to the shared `.bh-kpi` rule, so no other hero's layout can be affected. */
.week-aligned-hero .bh-kpi{min-width:0;}

/* ---- shared metric-cell: used in the blended hero AND every channel row, so every
   number in the slide (hero or detail) is built the same way and lines up visually.
   Delta text WRAPS AND the flex row wraps too (flex-wrap) — some variances are large
   (e.g. +946%) and a flex row without wrap will overflow past the column no matter
   what white-space/word-break say on the container; that was the actual cause of
   numbers visually "spilling out of the card". Default alignment is LEFT (matches
   how it reads in the hero, where there's no separate right-aligned column) — the
   row context (`.metric-col`) is what flips it to right-aligned, never the other
   way around, so hero and row numbers don't drift out of sync with each other. ---- */
.metric-cell{min-width:0;}
/* INVERTED HIERARCHY (explicit user request, reverses this deck's original design): the
   DIFFERENCE (delta) is now the headline figure — biggest, boldest, in every context — while
   actual/budget are secondary: small and NOT bold. Every context-specific size bump that used
   to target .mc-actual (hero tiles, Brazil's Spend anchor/cards, the LATAM-subtotal row's extra
   weight) now targets .mc-delta instead — see each one below, still grouped near its original
   selector for context. Metrics with NO delta at all (LTV Short/Unit CM Short/CM % Short — no
   budget exists for them, see .muted rules further below) are UNAFFECTED by this: there's
   nothing to promote over the actual, so they keep their own already-established styling. */
.metric-cell .mc-actual{font-family:var(--font-display);font-weight:400;font-size:12px;white-space:nowrap;}
.metric-cell .mc-budget{font-size:12px;font-weight:400;color:var(--text-secondary);margin-top:1px;white-space:nowrap;}
/* weekMetricCell()'s fallback when both actual+compare are hidden AND there's no computable delta
   (compare value is 0) -- previously left the cell fully blank, reported as looking unfinished. */
.metric-cell .mc-empty-note{font-size:11px;font-style:italic;color:var(--text-secondary);opacity:.7;}
/* "Comentario Excel" modal (weekSeparationNoteModalHtml) -- the note itself is a verbatim Excel
   quote (kept un-translated on purpose), the provisional disclaimer is deliberately quiet/small
   ("gris clarito", explicit ask) so it reads as a caveat, not as part of the quoted content. */
.week-note-body{margin-top:var(--space-3);line-height:1.5;}
.week-note-body p{margin:0 0 10px 0;}
.week-note-provisional{margin-top:var(--space-4);padding-top:10px;border-top:1px solid var(--border-soft);font-size:10px;color:var(--text-secondary);opacity:.55;}
/* "el botón se bloquea y ya" -- explicit ask 2026-08-24: when a lámina's column K is empty, the
   button stays visible (so all 7 láminas look consistent) but disabled, instead of fabricating
   content from a different column. */
.week-lamina-detail-btn:disabled{opacity:.4;cursor:not-allowed;}
/* fitHeroDeltas() shrinks these too, not just .mc-delta — a long budget label ("Año ant.
   $234,018" in YoY, wider than Daily Tracker's "Bgt $X") can be the actual overflow culprit
   in a narrow column even after the delta text is already shrunk to its floor; confirmed via
   direct DOM measurement (delta at 6.6px, cell still 6-8px wider than its column). Same two
   scale variables as .mc-delta, so one pass of the existing shrink loop covers both. */
.bh-kpi .metric-cell .mc-actual, .daily-br-card .metric-cell .mc-actual{font-size:calc(var(--text-lg) * var(--hero-delta-scale, 1));}
.bh-kpi .metric-cell .mc-budget, .daily-br-card .metric-cell .mc-budget{font-size:calc(var(--text-sm) * var(--hero-delta-scale, 1));}
/* Raised from a flat 12px (explicit ask, 2026-08: "no se ve el número actual, la comparación" —
   actual/budget were the SMALLEST text in the whole cell, smaller even than the table's own
   padding would suggest was intended). Actual now matches the delta's own table size
   (--text-sm) so it stops reading as an afterthought, while staying regular-weight (400,
   unchanged) against the delta's bold 700 — the "delta is the boldest headline" hierarchy from
   the original inversion survives via weight contrast even though the two are now the same
   font-size. Budget stays one tier down (--text-xs) since it's genuinely the least-important
   figure of the three, but that's still a 25% jump off the old flat 12px. */
.channel-table .metric-cell .mc-actual{font-size:calc(var(--text-sm) * var(--table-delta-scale, 1));}
.channel-table .metric-cell .mc-budget{font-size:calc(var(--text-xs) * var(--table-delta-scale, 1));}
/* Default: ONE nowrap line (icon + combined text), unchanged since Sesión 29's "deltas never
   wrap" rule. Daily Tracker and YoY always render this way (dailyCellHtml's bare metricCell()
   calls, yoyMetricCell() — neither ever passes splitDelta:true). */
.metric-cell .mc-delta{
  font-size:var(--text-base);font-weight:700;display:flex;align-items:center;gap:3px;white-space:nowrap;margin-top:2px;
}
/* Lámina A ("...Pacing vs reforecast...") ONLY — explicit ask, 2026-08: "la diferencia en pp
   pásala a otra línea... no se ve el número actual, la comparación, la diferencia", later
   scoped down in a follow-up correction: "este formato lo pedí exclusivamente para la lámina de
   Pacing vs. Reforecast... revierte el cambio en el resto [Daily Tracker/YoY]". Added only when
   laminaAMetricCell()/pacingCell() build the cell (see template.html JS) via the .mc-delta-split
   modifier class — the parenthetical (%/pp) gets its OWN line (.mc-delta-sub) below the main
   figure (.mc-delta-main) instead of both fighting for width on one line, which is what forced
   an aggressive font shrink the moment several columns were visible at once (a long "Pacing 34%
   (+4.8pp)" string has a much wider min-content floor than either half alone). NEITHER half
   wraps internally — a deliberate 2-line layout, not uncontrolled text-wrap, so "uneven heights
   across a row" still can't happen: every delta in Lámina A always has exactly 1 or 2 lines by
   the same rule (1 for isPP metrics with no parenthetical to split, 2 for everything else). */
.mc-delta.mc-delta-split{flex-direction:column;align-items:flex-start;gap:1px;line-height:1.25;}
.mc-delta-main{display:flex;align-items:center;gap:3px;white-space:nowrap;}
.mc-delta-sub{white-space:nowrap;font-weight:600;opacity:.85;}
/* fitHeroDeltas() (see call sites in each refreshSlideX) shrinks --hero-delta-scale below 1 only
   when some tile's content still doesn't fit its own (weighted, minmax-capped — see .bh-kpis)
   grid cell at full size — independent of, and resolved BEFORE, the viewport auto-fit zoom,
   since zoom cannot fix this particular relationship (see comment above). */
.bh-kpi .metric-cell .mc-delta{font-size:calc(var(--text-xl) * var(--hero-delta-scale, 1));}
/* Lámina A's row table can show up to 15 columns at once (14 metrics + the new %Spend) in
   only 5 channel-grouping rows worth of vertical budget — real per-column width there (~50-75px)
   is narrower than Daily Tracker/YoY's equivalent, so this stays scoped to .channel-table
   specifically, not the shared base rule. Raised from --text-xs (explicit ask, 2026-08: Pacing's
   text read as too small, and there was real headroom to grow it) — the row's own padding grew
   to match (below) so a bigger delta gets more vertical room instead of feeling cramped, and
   fitHeroDeltas()'s existing shrink loop (--table-delta-scale) still protects against horizontal
   overflow the moment a narrow high-column-count view actually needs it — nowrap stays
   non-negotiable (see the "never wraps to a 2nd line" rule above), so growth only ever shows up
   as taller rows or a shrunk-back-down scale, never a horizontal spill into the next column. */
.channel-table .metric-cell .mc-delta{font-size:calc(var(--text-sm) * var(--table-delta-scale, 1));}
.channel-table .ch-row{padding:8px var(--space-5);}
.metric-col .metric-cell{text-align:right;}
.metric-col .metric-cell .mc-delta{justify-content:flex-end;}
.metric-col .metric-cell .mc-delta.mc-delta-split{justify-content:flex-start;align-items:flex-end;}
.metric-col .metric-cell .mc-delta-main{justify-content:flex-end;}
/* Only the arrow icon is colored green/red — the delta's number+% text stays neutral
   (--text-primary) everywhere, an explicit ask distinguishing this from CM % Short's own
   pos/neg text coloring below (a different, deliberately-kept feature — don't conflate the
   two when touching either). The icon is also bigger than before (13px, was 9px) since it's now
   carrying the color signal alone. No margin-top here — the OLD rule had a fixed `margin-top:3px`
   nudging the icon down to fake a centered look under this row's old `align-items:flex-start`,
   which only worked by coincidence at ONE specific icon/text size ratio; at any other combination
   (hero vs table each run their own independent scale, plus the viewport auto-fit zoom on top of
   that) the icon visibly floated above the text's real center instead — confirmed measuring
   center-to-center offset up to ~4.7px in the hero. `align-items:center` on `.mc-delta` (below)
   now does this correctly and scale-independently; re-adding a fixed margin here would just
   reintroduce the same bug. */
.metric-cell .mc-delta svg{flex-shrink:0;width:13px;height:13px;}
/* The icon has a fixed px size and never responded to --hero-delta-scale/--table-delta-scale —
   invisible while the loop still had text to shrink, but once TEXT hits the floor and a column
   is still a few px too narrow, this fixed-size icon becomes the actual remaining overflow
   source by itself (confirmed: the only offending elements left over were the svg/path, not
   any text node). Scales down proportionally alongside its own context's delta text, same as
   every other piece of that text already does — no change at scale 1. */
.bh-kpi .metric-cell .mc-delta svg, .daily-br-card .metric-cell .mc-delta svg, .daily-br-spend .metric-cell .mc-delta svg{width:calc(13px * var(--hero-delta-scale, 1));height:calc(13px * var(--hero-delta-scale, 1));}
.channel-table .metric-cell .mc-delta svg{width:calc(13px * var(--table-delta-scale, 1));height:calc(13px * var(--table-delta-scale, 1));}
.metric-cell .mc-delta{color:var(--text-primary);}
.metric-cell .mc-delta.pos svg{color:var(--pos);}
.metric-cell .mc-delta.neg svg{color:var(--neg);}
/* Spend/Media Spend/Paid Social+Organic spend arrows -- neutral gray, never red/green (see
   isSpendNeutralMetric()'s comment for why: an increase in spend isn't inherently good or bad). */
.metric-cell .mc-delta.neutral svg{color:var(--text-secondary);}
/* New Cash semaphore — a real traffic-light dot, no text/percentage inside it (the reader reads
   the % from New Cash Core's own column right next to it; this is a pure at-a-glance color cue,
   per explicit ask — never a literal emoji traffic light either). A soft radial highlight +
   colored glow give it some dimensionality instead of a flat CSS circle. Hover shows the exact
   variance via the `title` attribute for anyone who wants it, without ever painting it visibly. */
.nc-semaphore{display:inline-block;width:16px;height:16px;border-radius:50%;box-shadow:inset 0 1px 2px rgba(255,255,255,.35), 0 0 0 1px rgba(0,0,0,.06);}
.nc-semaphore.green{background:radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--pos) 70%, white), var(--pos));box-shadow:inset 0 1px 2px rgba(255,255,255,.35), 0 0 6px color-mix(in srgb, var(--pos) 55%, transparent);}
.nc-semaphore.yellow{background:radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--warn) 70%, white), var(--warn));box-shadow:inset 0 1px 2px rgba(255,255,255,.35), 0 0 6px color-mix(in srgb, var(--warn) 55%, transparent);}
.nc-semaphore.red{background:radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--neg) 70%, white), var(--neg));box-shadow:inset 0 1px 2px rgba(255,255,255,.35), 0 0 6px color-mix(in srgb, var(--neg) 55%, transparent);}
.nc-semaphore.gray{background:radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--text-secondary) 40%, white), var(--border-soft));}
/* %Leads / %Sales are supporting context, not headline numbers — deliberately smaller
   and not bold so they don't compete visually with CPL/CMPS/NewCash/MNCC. */
.metric-cell.muted .mc-actual{font-weight:600;font-size:var(--text-base);color:var(--text-secondary);}
/* ...unless that same metric is ALSO flagged highlight:true (a headline number that just
   happens to have no budget baseline, e.g. Full Unit CM Short / Full CM % Short) — then it
   must look exactly as prominent as New Cash Core's actual value, not washed out. */
.bh-kpi.highlight .metric-cell.muted .mc-actual{font-weight:700;font-size:var(--text-xl);color:var(--text-primary);}
.metric-col.highlight .metric-cell.muted .mc-actual{font-weight:700;color:var(--text-primary);}
/* CM % Short auto-colors by sign, everywhere — it's always highlight:true (see
   mcPctSignClass() in JS), so this needs to out-specify the .highlight color overrides right
   above (and their Brazil-card equivalent below), not just the plain .muted base rule, or the
   highlight rule's text-primary color would silently win regardless of source order — the same
   specificity-collision class of bug already hit once this project (see
   feedback-branformance-technical-gotchas memory). */
.metric-cell.muted .mc-actual.pos, .bh-kpi.highlight .metric-cell.muted .mc-actual.pos,
.metric-col.highlight .metric-cell.muted .mc-actual.pos, .daily-br-card.highlight .metric-cell.muted .mc-actual.pos{color:var(--pos);}
.metric-cell.muted .mc-actual.neg, .bh-kpi.highlight .metric-cell.muted .mc-actual.neg,
.metric-col.highlight .metric-cell.muted .mc-actual.neg, .daily-br-card.highlight .metric-cell.muted .mc-actual.neg{color:var(--neg);}
/* YoY's CM % Short isn't muted (2025 data lets it show a real actual-vs-last-year comparison,
   see countryRowYoy/heroCellYoy) — the base .mc-actual rule (line ~346) never sets `color` at
   all, so this needs no extra specificity to win. */
.metric-cell .mc-actual.pos{color:var(--pos);}
.metric-cell .mc-actual.neg{color:var(--neg);}

.detail-label{font-size:var(--text-xs);color:var(--text-secondary);text-transform:uppercase;letter-spacing:.08em;font-weight:700;margin:var(--space-1) 0 var(--space-1);display:flex;align-items:center;gap:8px;}
.detail-label-line{flex:1;height:1px;background:var(--border-soft);}
.target-pacing-chip{
  display:flex;align-items:center;gap:6px;background:var(--bg-card);border:1px solid var(--border-soft);
  border-radius:var(--radius-md);padding:4px 12px;text-transform:none;letter-spacing:normal;
  font-weight:600;color:var(--text-secondary);white-space:nowrap;
}
.target-pacing-chip b{font-size:var(--text-base);color:var(--brand-accent);font-weight:800;}

/* ---- channel rows: one consistent grid for every channel grouping, Brand TV
   Channels included — only its "featured" modifier differs, never its shape.
   Full column set (see COL_DEFS): name | Spend | Leads | %Share Leads | CPL | Ventas |
   %Share Ventas | CMPS | Precio Prom. | MNCC | New Cash Core | Impacto | LTV Short |
   Unit CM Short | CM % Short, grouped via divider lines by COL_DEFS' `group` field
   (spend/leads/sales/margin/cash) — CPL sits with Leads (cost PER lead), CMPS sits
   with Ventas (cost PER sale), never clustered together at the end. This whole table
   + the hero above it MUST fit inside `.slide-body` without pushing into the footer
   band — kept deliberately compact (small gaps, small padding) rather than spacious,
   unlike a typical card grid. */
.channel-table{display:flex;flex-direction:column;gap:1px;flex:1;min-height:0;}
/* Grid template is set INLINE per render (style="grid-template-columns:...") because the
   column set is user-configurable (view-settings menu can hide %Leads/CMPS) — see
   COL_DEFS/visibleCols in slideA(). Never hardcode a fixed column count here. */
.ch-header-row, .ch-row{display:grid;column-gap:var(--space-3);align-items:center;}
/* --text-xs, not --text-sm — explicit ask: Lámina A's table must look the EXACT same size as
   Daily Tracker/YoY's (previously only THEY got --text-xs, via .daily-table below, while this
   base rule alone gave Lámina A a bigger --text-sm — moving the smaller size to the shared base
   rule instead of a .daily-table-scoped override unifies all 3 automatically, everywhere,
   without needing to add .daily-table to Lámina A's own table (which carries other, .daily-
   specific spacing rules Lámina A never asked for). */
.ch-header-row{padding:0 var(--space-5);font-size:var(--text-xs);color:var(--text-secondary);text-transform:uppercase;letter-spacing:.03em;font-weight:700;line-height:1.05;}
.ch-header-row .metric-col{text-align:right;}
/* group divider: hairline before the first column of a new metric cluster (spend / share /
   efficiency / margin / cash-impact) — applied via a `.col-divider` class written in JS
   (chColClasses()) rather than :nth-child, since the column count/order can change when a
   column is hidden. */
.col-divider{border-left:1px solid var(--border-soft); padding-left:var(--space-3);}
/* Centered-stack: used only by Lámina A so a shorter content block (e.g. Paid Social grouped,
   fewer rows) is vertically centered between header/footer instead of leaving dead space
   below it — see DESIGN_SYSTEM.md §7. Other slides keep the default top-aligned .slide-body. */
.slide-body.centered-stack{justify-content:center;}
/* channel-table shrinks (never the hero/label above it) and scrolls internally rather than
   spilling past the slide's fixed frame — see DESIGN_SYSTEM.md §7: expanding Paid Social's
   ASC/no-ASC rows on top of the grouped row (6 rows total) doesn't fit the same space that
   was sized for the default 4, so this is a real, reachable case, not just a theoretical one. */
.slide-body.centered-stack .blended-hero, .slide-body.centered-stack .detail-label{flex-shrink:0;}
.slide-body.centered-stack .channel-table{flex:0 1 auto;min-height:0;overflow-y:auto;}
.slide-body.centered-stack .ch-row{flex:0 0 auto;}
.ch-row{
  background:var(--bg-card);border:1px solid var(--border-soft);border-radius:var(--radius-md);
  padding:var(--space-2) var(--space-5);cursor:pointer;transition:.15s;flex:1;
}
.ch-row:hover{box-shadow:var(--shadow-md);border-color:var(--accent,var(--border-soft));transform:translateY(-1px);}
/* Daily Tracker por País rows/hero aren't clickable (no Jan-Jul per-country trend to show in a
   modal) — .no-click strips the pointer cursor/hover-lift affordance so they don't look
   interactive when they aren't. */
.ch-row.no-click, .blended-hero.no-click{cursor:default;}
.ch-row.no-click:hover{box-shadow:none;border-color:var(--border-soft);transform:none;}
/* Costa Rica in Daily Tracker por País has $0 budget every day this month (confirmed real, not
   a bug) — its "variance" isn't a fair comparison like the other countries', so it's pushed last
   and visually muted (gray fill, lower-contrast text) rather than looking like a normal, equally
   weighted row. */
.ch-row.deemphasized{background:var(--bg-section);opacity:.62;}
:root[data-theme="dark"] .ch-row.deemphasized{background:color-mix(in srgb, var(--bg-section) 60%, transparent);}
/* "LATAM excl. Mexico y Argentina" subtotal row (Daily Tracker/YoY por Pais) — sits between
   the 2 largest markets and the 6-country detail breakdown it summarizes. font-weight (not a
   fill/border) marks it as an aggregate; the border-bottom is the "subtle separator line" the
   user asked for between the subtotal and the detail rows that make it up. */
.ch-row.subtotal-row{border-bottom:2px solid color-mix(in srgb, var(--brand-accent) 45%, transparent);margin-bottom:4px;}
.ch-row.subtotal-row .ch-name h4{font-weight:800;}
.ch-row.subtotal-row .metric-cell .mc-delta{font-weight:800;}
/* Merged-in Brazil row ("Agregar Brasil") — a plain top rule, no icon/bold treatment (this is
   still an ordinary country row with its own flag, just visually set apart from the LatAm group
   above it since it's a different region joining the table, not another LatAm country). */
.ch-row.merged-brazil-row{border-top:2px solid color-mix(in srgb, var(--brand-accent) 45%, transparent);margin-top:4px;}
/* "Semana WOW" láminas — the promo-row's own country highlighted (Plantilla PPT Laminas.xlsx
   column I, e.g. "México es el país de la promo, debe estar resaltado"). A filled left bar +
   soft background tint, both brand-accent-based so they stay correct in both themes automatically
   (color-mix reads the CSS variable at whatever value the current theme has it). */
.ch-row.week-lamina-highlight{background:color-mix(in srgb, var(--brand-accent) 8%, transparent);border-left:3px solid var(--brand-accent);padding-left:calc(var(--space-5) - 2px);}
.ch-row.week-lamina-highlight .ch-name h4{font-weight:800;color:var(--brand-accent);}
/* Footer button, "Semana WOW" láminas — toggles the marketing-type-by-country detail view
   (footerBar's `rightExtra` slot, right next to the OE logo — the one place the user asked for
   it: "un botón abajo al lado del logo de Open English"). */
.week-lamina-detail-btn{border:1px solid var(--border-soft);background:var(--bg-card);color:var(--text-secondary);border-radius:var(--radius-full);padding:5px 14px;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;transition:.15s;}
.week-lamina-detail-btn:hover{border-color:var(--brand-accent);color:var(--text-primary);}
.week-lamina-detail-btn.on{background:var(--brand-accent);color:#fff;border-color:var(--brand-accent);}
/* Daily Tracker por País has up to 8 rows (vs Lámina A's usual 4-6) in the same reserved
   vertical budget — tighter row padding/gap than Lámina A, same font sizes (never shrink text,
   per explicit ask: "que la letra sea grande... más compacto" applies to spacing, not type).
   Verified against real overflow via scrollHeight vs clientHeight (~180px over at the first,
   lighter compaction pass), not eyeballed — see feedback-branformance-technical-gotchas for why
   cross-element getBoundingClientRect comparisons weren't trustworthy this session and this
   single-element self-comparison was used instead. */
.channel-table.daily-table{gap:1px;}
.daily-table .ch-row{padding:4px var(--space-5);border-width:1px;}
.daily-table .ch-name{gap:8px;}
/* With 12 columns' worth of header labels (incl. "% Share Leads"/"Unit CM Short"-style
   multi-word ones) over Daily Tracker's narrower per-column width, the header row was
   wrapping to 3 lines and inflating its own height — shrink the label text itself (not
   the data it labels) so it fits in 1-2 lines without touching any column's width. */
.daily-table .ch-header-row{letter-spacing:.02em;}
/* YoY only, explicit ask, 2026-08: "los títulos de las columnas... pueden ser un poco más
   grandes" — scoped to .slide-yoy specifically (not the shared .ch-header-row/.daily-table
   rules) because Daily Tracker's own header row is already fighting a documented 3-line-wrap
   overflow risk at its tighter column widths (see the comment on .daily-table .ch-header-row
   above) — bumping the shared rule would reopen that. */
.slide-yoy .ch-header-row{font-size:var(--text-sm);}
.daily-hero{padding:var(--space-2) var(--space-6)!important;}
.slide-body.centered-stack .daily-hero{margin-bottom:var(--space-1);}
.daily-detail-label{margin:2px 0 4px;}
/* This line-height override predates the main/sub 2-line split (see .mc-delta-main/.mc-delta-sub
   near line 434) but still applies correctly: .mc-delta sets line-height on the flex column
   container, which both stacked children inherit, so it tightens BOTH lines here, not just one. */
.daily-table .metric-cell .mc-actual{line-height:1.05;}
.daily-table .metric-cell .mc-budget{margin-top:0;line-height:1.1;}
.daily-table .metric-cell .mc-delta{margin-top:0;line-height:1.1;}
.daily-table .ch-name h4{line-height:1;}
.daily-hero .bh-kpis{margin-top:12px;}
.daily-hero .metric-cell .mc-actual{line-height:1.05;}
.daily-hero .metric-cell .mc-budget{margin-top:0;line-height:1.1;}
.daily-hero .metric-cell .mc-delta{margin-top:0;line-height:1.1;}
/* Brazil-only (slideDaily()/slideYoy()'s isBrazil branch): once the redundant single-row table
   is dropped (explicit ask, 2026-08: "no tiene sentido poner la tabla si muestra exactamente la
   misma información que la tarjeta principal"), the hero is the only content left on the slide.
   MUST stay exactly ONE row, left to right, like a table header — a first attempt wrapped it
   into a 2-row card grid, which the user explicitly rejected: "no puede cambiar de línea hacia
   abajo... todo tiene que caber de izquierda a derecha... si agrego más variables se va
   ajustando hacia el lado [nunca hacia abajo], y la letra se va achicando; si agrego menos, se
   va agrandando." That exact behavior — more visible columns shrink the font, fewer columns grow
   it, always one row — is precisely what `fitHeroDeltas()`'s existing `--hero-delta-scale`
   mechanism already does for every hero in this deck (`.bh-kpis` stays plain CSS Grid, one row,
   per-tile width from HERO_COL_DEFS' weighted `fr` columns, completely unchanged). So this block
   does NOT touch layout/display/wrapping at all — only the base font-size tokens grow, giving
   the shrink mechanism a bigger ceiling to work down from now that the hero has the whole slide
   to itself instead of sharing it with a table. */
.single-hero .daily-hero{padding:var(--space-6) var(--space-8)!important;}
.single-hero .bh-kpis{margin-top:var(--space-4)!important;}
.single-hero .bh-kpi .label{font-size:var(--text-base);}
.single-hero .bh-kpi .metric-cell .mc-actual{font-size:calc(var(--text-xl) * var(--hero-delta-scale, 1));}
.single-hero .bh-kpi .metric-cell .mc-budget{font-size:calc(var(--text-base) * var(--hero-delta-scale, 1));}
.single-hero .bh-kpi .metric-cell .mc-delta{font-size:calc(var(--text-2xl) * var(--hero-delta-scale, 1));}
/* The YoY date-mode toggle has moved twice: hero's bh-head row (margin-left:auto) -> its own
   standalone row above the hero -> now the footer, beside the logo, as a subtle .footer-toggle
   (see slideYoy() for the current markup/position — this comment stays only as the "why here,
   not still in the hero" pointer, not a position description, since that keeps changing). */
/* Brazil (OE-BR) now renders Daily Tracker AND YoY through the exact same hero+table markup
   LatAm uses (countryRow('Brazil')/countryRowYoy('Brazil')) — the old horizontal card-flow
   layout that used to live here (.daily-br-flow/.daily-br-card, built by brazilFlowHtml()) was
   removed; a few of its cell-level rules are still shared with .bh-kpi via a comma-selector
   below (kept, since .bh-kpi is very much alive) even though the .daily-br-card half of those
   selectors no longer matches anything. */
/* Featured (Brand TV Channels) reads as a distinct, elevated card — deliberately
   NOT the same gradient as .blended-hero, so the two never look like the same
   component at different sizes: solid card + thick accent bar + solid icon chip.
   The padding compensation here must offset the DELTA between this 5px border and the base
   row's 1px border (5-1=4px), not add a flat 5px on top of the base padding — the original
   `space-5 + 5px` double-counted, making this row's own content-box (border+padding) 9px
   narrower than every other row's despite both rows being the same OUTER width. Because the
   grid inside is `fr`-based (proportional to the width it actually gets), a narrower content-box
   didn't just look "different-sized" — it silently pushed every one of this row's OWN divider
   lines out of alignment with the identical dividers in the header/other rows (measured: up to
   ~6px drift on the first divider, tapering toward the shared right edge) — a totally different
   symptom from the same one root cause, so fixing the size fixes the divider alignment too.
   `space-5 - 4px` keeps border+padding summing to the exact same total as the base row. */
.ch-row.featured{
  border:none; border-left:5px solid var(--accent,var(--brand-accent));
  box-shadow:var(--shadow-md); padding-left:calc(var(--space-5) - 4px);
}
.ch-name{display:flex;align-items:center;gap:10px;min-width:0;}
.ch-name .ch-text{min-width:0;flex:1;}
/* Bumped from a flat 13.5px, explicit ask, 2026-08: "los nombres de los canales... más grandes
   así necesiten dos líneas en su celda" — wrapping to 2 lines was ALREADY structurally allowed
   here (white-space:normal), just never needed at the old size. A PAST attempt at growing this
   (see the "Featured" comment below) went straight to --text-base (20px) and caused real
   collateral damage: the wider text pushed the Name column's own min-content floor wider,
   squeezing every OTHER column slightly and drifting the divider lines out of alignment —
   that regression was for ONE row growing while its siblings stayed small, though, not
   necessarily "any growth at all is unsafe." Chose the smaller --text-sm step (17.5px) instead
   of repeating that same --text-base jump, and it applies UNIFORMLY to every row (nothing to
   mismatch against) — verify divider alignment/overflow numerically before growing further. */
.ch-name h4{font-size:var(--text-sm);font-weight:700;color:var(--text-primary);line-height:1.2;white-space:normal;overflow-wrap:break-word;}
/* Featured (Brand TV Channels) used to get a bigger name (--text-base, ~50% larger) alongside
   the "Canal principal" badge — the badge is gone, but this survived and kept making the row
   look oversized/differently-wrapped from the others, and (found while fixing that) the wider
   text pushed this row's own Name column's min-content floor wider than every other row's,
   which in turn squeezed ITS OTHER columns slightly narrower — this is exactly why the featured
   row's own divider lines drifted a px or two out of alignment with the header/other rows above
   and below it. Removed so this row's Name column resolves to the exact same width as
   everyone else's — fixes the size mismatch AND the divider drift with one change, since both
   were downstream of the same oversized text. Only the accent border-left + solid icon remain
   as this row's distinguishing mark now. */
.ch-name .ch-note{font-size:10.5px;color:var(--text-secondary);margin-top:1px;}
.metric-col{text-align:right;min-width:0;}
/* Sub-rows (Paid Social con/sin ASC) need to unmistakably read as children of the
   "Paid Social + Organic" row above them — a small indent alone looked like the
   same hierarchy level, so this also drops the border/shadow and adds a visible
   connector notch on the left. */
.ch-indent{
  padding-left:calc(var(--space-5) + 26px); background:var(--bg-section); border-style:dashed;
  box-shadow:none; position:relative; padding-top:var(--space-1); padding-bottom:var(--space-1);
}
.ch-indent::before{
  content:""; position:absolute; left:var(--space-5); top:50%; width:14px; height:1px;
  background:var(--border-soft); transform:translateY(-50%);
}
.ch-indent .ch-name h4{font-weight:600;font-size:var(--text-sm);}

/* Flags are drawn as inline SVG (not emoji) — Windows renders flag-emoji sequences
   as plain two-letter country codes instead of a flag icon, so emoji is unusable here. */
.flag-ico{display:inline-flex;border-radius:3px;overflow:hidden;box-shadow:0 0 0 1px var(--border-soft);flex-shrink:0;}
.flag-ico svg{display:block;}

.pos{color:var(--pos);} .neg{color:var(--neg);}

/* ================= CONTROLS ================= */
/* Home screen: controls are always visible (no hover needed — nothing else on
   screen to reveal them against). Deck: controls are HIDDEN by default and only
   reveal on hovering the top edge of the window, hiding again immediately on
   mouseleave — this is intentional so the slide content isn't covered by chrome
   while presenting/reading. Toggled via .hover-visible, driven by JS below (not
   a CSS :hover selector, so it can also stay open while the mouse is over the
   revealed panel itself, not just the trigger strip). */
.top-controls{position:fixed;top:16px;right:16px;display:flex;gap:8px;z-index:50;}
.toc-trigger{position:fixed;top:16px;left:16px;z-index:50;}
body.home-mode .toc-trigger, body.home-mode #leftMenu, body.home-mode .hover-zone{display:none;} /* index/hover-zones only make sense inside a deck */

body.deck-mode .top-controls,
body.deck-mode .toc-trigger,
body.deck-mode #leftMenu{
  opacity:0;pointer-events:none;transform:translateY(-8px);
  transition:opacity .12s linear, transform .12s linear;
}
body.deck-mode .top-controls.hover-visible,
body.deck-mode .toc-trigger.hover-visible,
body.deck-mode #leftMenu.hover-visible{
  opacity:1;pointer-events:auto;transform:translateY(0);
}
/* #groupMenu also needs a horizontal translateX(-50%) to stay centered (see below), so its
   show/hide animation uses `top` instead of `transform` — combining both in one `transform`
   value would mean the hover-visible rule clobbers the centering every time it toggles. */
body.deck-mode #groupMenu, body.deck-mode #groupMenuDaily, body.deck-mode #groupMenuYoy, body.deck-mode #groupMenuWeekWow{opacity:0;pointer-events:none;top:50px;transition:opacity .12s linear, top .12s linear;}
body.deck-mode #groupMenu.hover-visible, body.deck-mode #groupMenuDaily.hover-visible, body.deck-mode #groupMenuYoy.hover-visible, body.deck-mode #groupMenuWeekWow.hover-visible{opacity:1;pointer-events:auto;top:62px;}

.hover-zone{position:fixed;top:0;height:70px;z-index:38;}
.hover-zone.left{left:0;width:280px;}
.hover-zone.right{right:0;width:220px;}
.hover-zone.center{left:50%;width:360px;margin-left:-180px;}
body.home-mode .hover-zone{display:none;}
/* Lámina A's row/column agrupar-desagrupar menu (and the Daily Tracker lámina's column-only
   menu) only make sense while their OWN slide is visible — body.on-lamina-a/on-lamina-daily are
   toggled from the scroll listener (see updateOnLaminaA()). Both share this SAME top-center
   hover-zone (they're never visible at once, since only one slide is active at a time) rather
   than each getting its own zone. Deliberately a SEPARATE hover-zone/panel from hzRight/
   #topControls (top-right) — putting the old per-slide gear button there made it fight with the
   EN/ES/theme hover-reveal for the same screen real estate and mouse path, so this lives
   top-CENTER instead. */
body:not(.on-lamina-a):not(.on-lamina-daily):not(.on-lamina-yoy):not(.on-lamina-weekwow) .hover-zone.center,
body:not(.on-lamina-a) #groupMenu, body:not(.on-lamina-daily) #groupMenuDaily, body:not(.on-lamina-yoy) #groupMenuYoy, body:not(.on-lamina-weekwow) #groupMenuWeekWow,
body.home-mode .hover-zone.center, body.home-mode #groupMenu, body.home-mode #groupMenuDaily, body.home-mode #groupMenuYoy, body.home-mode #groupMenuWeekWow{display:none!important;}
#groupMenu, #groupMenuDaily, #groupMenuYoy, #groupMenuWeekWow{
  position:fixed;top:50px;left:50%;transform:translateX(-50%);z-index:49;
  background:var(--bg-card);border:1px solid var(--border-soft);border-radius:var(--radius-lg);
  box-shadow:var(--shadow-lg);padding:var(--space-4);display:flex;gap:var(--space-6);min-width:460px;
}
.group-menu-col{flex:1;min-width:0;}
.group-menu-col label{
  display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-primary);padding:5px 4px;cursor:pointer;white-space:nowrap;
}
.group-menu-col label input{cursor:pointer;}
/* "Semana WOW" láminas — Columnas bloqueada mientras el detalle de marketing type está activo. */
.menu-locked-note{font-size:10.5px;font-weight:600;text-transform:none;letter-spacing:0;color:var(--text-secondary);opacity:.8;}

/* ============ ONBOARDING TUTORIAL ============ */
/* Spotlight coachmark: a full-page transparent blocker (catches/kills clicks on the real page
   while the tour is active — this is a guided walkthrough, not hands-on practice) + a "hole"
   element whose oversized box-shadow dims everything BUT its own rect (classic spotlight-cutout
   trick, no clip-path/mask math needed) + a floating card with the copy and Back/Next/Skip. */
.tutorial-blocker{position:fixed;inset:0;z-index:9990;background:transparent;}
.tutorial-spotlight{
  position:fixed;z-index:9991;pointer-events:none;
  box-shadow:0 0 0 9999px rgba(8,12,22,.72);
  transition:top .3s cubic-bezier(.4,0,.2,1),left .3s cubic-bezier(.4,0,.2,1),
             width .3s cubic-bezier(.4,0,.2,1),height .3s cubic-bezier(.4,0,.2,1);
}
.tutorial-card{
  position:fixed;z-index:9992;width:340px;max-width:calc(100vw - 32px);
  background:var(--bg-card);color:var(--text-primary);border:1px solid var(--border-soft);
  border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);padding:var(--space-5);
  transition:top .3s cubic-bezier(.4,0,.2,1),left .3s cubic-bezier(.4,0,.2,1);
}
.tutorial-card.centered{left:50%!important;top:50%!important;transform:translate(-50%,-50%);width:380px;text-align:center;}
.tutorial-card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.tutorial-step-count{font-size:11.5px;font-weight:700;color:var(--text-secondary);letter-spacing:.03em;}
.tutorial-close{background:none;border:none;font-size:15px;color:var(--text-secondary);cursor:pointer;line-height:1;padding:2px 4px;}
.tutorial-close:hover{color:var(--text-primary);}
.tutorial-title{font-size:var(--text-lg);font-weight:800;color:var(--brand-accent);margin:0 0 8px;}
.tutorial-body{font-size:13.5px;line-height:1.55;color:var(--text-primary);}
.tutorial-actions{display:flex;align-items:center;justify-content:space-between;margin-top:18px;gap:10px;}
.tutorial-skip{background:none;border:none;font-size:12px;color:var(--text-secondary);text-decoration:underline;cursor:pointer;padding:4px 0;white-space:nowrap;}
.tutorial-skip:hover{color:var(--text-primary);}
.tutorial-nav{display:flex;gap:8px;flex:none;}
.tutorial-nav button{
  border:1px solid var(--border-soft);background:var(--bg-card);color:var(--text-primary);
  border-radius:var(--radius-full);padding:7px 16px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap;
}
.tutorial-next{background:var(--brand-accent)!important;color:#fff!important;border-color:var(--brand-accent)!important;}
.tutorial-back:disabled{opacity:.35;cursor:not-allowed;}

/* The clickable "¿Cómo se calculó?" link — deliberately colored + underlined so it visually
   reads as "click this for the math", not just decorative text. Never assert a projection or
   calculated figure without one of these next to it (per explicit feedback: "no puedes dar por
   hecho absolutamente nada"). */
.ai-methodology-link{
  background:none;border:none;padding:0;font:inherit;font-weight:700;font-size:12.5px;
  color:var(--brand-accent);text-decoration:underline;cursor:pointer;white-space:nowrap;
}
.ai-methodology-link:hover{opacity:.8;}
.methodology-modal p{font-size:18px;line-height:1.7;color:var(--text-primary);}

.icon-btn{
  min-width:31px;height:31px;padding:0 10px;border-radius:var(--radius-full);
  display:flex;align-items:center;justify-content:center;gap:6px;
  background:var(--bg-card);border:1px solid var(--border-soft);box-shadow:var(--shadow-md);
  font-size:15px;font-weight:600;color:var(--text-primary);opacity:.8;transition:.15s;white-space:nowrap;
}
.icon-btn:hover{opacity:1;transform:translateY(-1px);background:var(--color-soft-blue);}
body.home-mode .icon-btn{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.35);color:#fff;}
body.home-mode .icon-btn:hover{background:rgba(255,255,255,.28);}
body.home-mode #homeToggle{display:none;} /* meaningless while already on Home */

/* Per-slide content zoom (NOT browser zoom) — +/- pill next to the AI Guide button. Only
   relevant for a slide with real .slide-body content (a/daily/yoy) — hidden on Cover and on
   Home via JS (updateZoomUi()), never via a CSS rule that could fight the hover-reveal show/hide
   already applied to its parent #topControls. */
.zoom-group{
  height:31px;padding:0 4px;display:flex;align-items:center;gap:2px;
  background:var(--bg-card);border:1px solid var(--border-soft);border-radius:var(--radius-full);
  box-shadow:var(--shadow-md);
}
